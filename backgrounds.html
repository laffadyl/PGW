const DATA=[{"n": "Acolyte", "src": "phb", "gold": 15, "feat": "Shelter Of Faithful", "skills": "Insight, Religion", "desc": "Shelter Of Faithful:\nYou command the respect of those who share your faith, and you can perform the religious ceremonies of your deity. You and your adventuring companions can expect to receive free healing and care at a temple, shrine, or other established presence of your faith, though you must provide any material components needed for spells. Those who share your religion will support you (but only you) at a modest lifestyle.\n\nYou might also have ties to a specific temple dedicated to your chosen deity or pantheon, and you have a residence there. This could be the temple where you used to serve, if you remain on good terms with it, or a temple where you have found a new home. While near your temple, you can call upon the priests for assistance, provided the assistance you ask for is not hazardous and you remain in good standing with your temple"}, {"n": "Anthropologist", "src": "toa", "gold": 0, "feat": "Adept Linguist", "skills": "Insight, Religion", "desc": "Adept Linguist:\nYou can communicate with humanoids who don't speak any language you know so long as you observe them interacting with each other for at least one day."}, {"n": "Archaeologist", "src": "toa", "gold": 25, "feat": "Historical Knowledge", "skills": "History, Survival", "desc": "Historical Knowledge:\nWhen you enter a ruin or dungeon, you can correctly ascertain its original purpose and determine its builders. In addition, you can determine the monetary value of art objects more than a century old."}, {"n": "Athlete", "src": "mot", "gold": 10, "feat": "Echoes of Victory", "skills": "Acrobatics, Athletics, Acrobatics, Athletics", "desc": "Echoes of Victory:\nYou have attracted admiration among spectators, fellow athletes, and trainers in the region that hosted your past athletic victories. When visiting any settlement within 100 miles of where you grew up, there is a 50 percent chance you can find someone there who admires you and is willing to provide information or temporary shelter.\n\nBetween adventures, you might compete in athletic events sufficient enough to maintain a comfortable lifestyle"}, {"n": "Augen Trust (Spy)", "src": "mot", "gold": 15, "feat": "Spy Contact", "skills": "Deception, Stealth, Deception, Stealth", "desc": "Spy Contact:\nYou have a reliable and trustworthy contact who acts as your liaison to a network of other spies. You know how to get messages to and from your contact, even over great distances; specifically, you know the local messengers, corrupt caravan masters, and seedy sailors who can deliver messages for you"}, {"n": "Azorius Functionary", "src": "ggr", "gold": 10, "feat": "Legal Authority", "skills": "Insight, Intimidation, Insight, Intimidation", "desc": "Legal Authority:\nYou have the authority to enforce the laws, and that status inspires a certain amount of respect and even fear in the populace. People mind their manners in your presence and avoid drawing your attention; they assume you have the right to be wherever you are. Showing your Azorius insignia gets you an audience with anyone you want to talk to (though it might cause more problems than it solves when you're dealing with incorrigible lawbreakers). If you abuse this privilege, though, you can get in serious trouble with your superiors and even be stripped of your position"}, {"n": "Black Fist Double Agent", "src": "cos", "gold": 15, "feat": "Double Agent", "skills": "Deception, Insight", "desc": "Double Agent:\nYou have a reliable and trusty contact within the Tears of Virulence garrison in Phlan to whom you pass information and secrets. In exchange, you can get away with minor criminal offenses within the town of Phlan. In addition, your Black Fists contacts can help you secure an audience with the Lord Regent, the Lord Sage, members of the Black Fists, or deposed nobles and authority figures who are sympathetic to the Phlan refugees and insurgents. "}, {"n": "Boros Legionnaire", "src": "ggr", "gold": 2, "feat": "Legion Station", "skills": "Athletics, Intimidation, Athletics, Intimidation", "desc": "Legion Station:\nYou have an established place in the hierarchy of the Boros Legion. You can requisition simple equipment for temporary use, and you can gain access to any Boros garrison, where you can rest in safety and receive the attention of medics. You are also paid a salary of 1 gp (a Boros-minted 1-zino coin) per week, which (combined with free lodging in your garrison) enables you to maintain a poor lifestyle between adventures"}, {"n": "Caravan Specialist", "src": "homebrew", "gold": 0, "feat": "Wagonmaster", "skills": "Animal Handling, Survival", "desc": "Wagonmaster:\nYou are used to being in charge of the operation and your reputation for reliability has you on a short list when the job is critical. Experience has taught you to rely on your gut. Others recognize this and look to you for direction when a situation gets serious. You are able to identify the most defensible locations for camping. If you are part of a caravan outfit, you are able to attract two additional workers that are loyal to you based on your reputation. You have an excellent memory for maps and geography and can always determine your cardinal directions while traveling. "}, {"n": "Charlatan", "src": "phb", "gold": 15, "feat": "False Identity", "skills": "Deception, Sleight Of Hand", "desc": "False Identity:\nYou have created a second identity that includes documentation, established acquaintances, and disguises they allow you to assume that perosna.\n\nAditionally, you can forge documents including official papers and personal letters, as long as you have seen an example of the kind of document or the handwriting you're trying to copy. "}, {"n": "City Watch", "src": "scag", "gold": 0, "feat": "Watcher's Eye", "skills": "Athletics, Insight", "desc": "Watcher's Eye:\nYour experience in enforcing the law, and dealing with lawbreakers, gives you a feel for local laws and criminals. You can easily find the local outpost of the watch or a similar organization, and just as easily pick out the dens of criminal activity in a community, although you're more likely to be welcome in the former locations rather than the latter."}, {"n": "Clan Crafter", "src": "scag", "gold": 0, "feat": "Respect Of The Stout Folk", "skills": "History, Insight", "desc": "Respect Of The Stout Folk:\nAs well respected as clan crafters are among outsiders, no one esteems them quite so highly as dwarves do. You always have free room and board in any place where shield dwarves or gold dwarves dwell, and the individuals in such a settlement might vie among themselves to determine who can offer you (and possibly your compatriots) the finest accommodations and assistance."}, {"n": "Cloistered Scholar", "src": "scag", "gold": 0, "feat": "Library Access", "skills": "History, Arcana, Nature, Religion", "desc": "Library Access:\nThough others must often endure extensive interviews and significant fees to gain access to even the most common archives in your library, you have free and easy access to the majority of the library, though it might also have repositories of lore that are too valuable, magical, or secret to permit anyone immediate access.You have a working knowledge of your cloister's personnel and bureaucracy, and you know how to navigate those connections with some ease. Additionally, you are likely to gain preferential treatment at other libraries across the Realms, as professional courtesy shown to a fellow scholar."}, {"n": "Cormanthor Refugee", "src": "homebrew", "gold": 5, "feat": "Shelter Of The Elven Clergy", "skills": "Nature, Survival", "desc": "Shelter Of The Elven Clergy:\nThe clerics of Elventree have vowed to care for the Cormanthor refugees. They will help you when they can, including providing you and your companions with free healing and care at temples, shrines, and other established presences in Elventree. They will also provide you (but only you) with a poor lifestyle."}, {"n": "Courtier", "src": "scag", "gold": 5, "feat": "Court Functionary", "skills": "Insight, Persuasion", "desc": "Court Functionary:\nYour knowledge of how bureaucracies function lets you gain access to the records and inner workings of any noble court or government you encounter. You know who the movers and shakers are, whom to go to for the favors you seek, and what the current intrigues of interest in the group are."}, {"n": "Criminal", "src": "phb", "gold": 15, "feat": "Criminal Contact", "skills": "Deception, Stealth", "desc": "Criminal Contact:\nYou have a reliable and trustworthy contact who acts as your liaison to a network of other criminals. You know how to get messages to and from your contact, even over great distances; specifically, you know the local messengers, corrupt caravan masters, and seedy sailors who can deliver messages for you."}, {"n": "Dimir Operative", "src": "ggr", "gold": 0, "feat": "False Identity", "skills": "Deception, Stealth, Deception, Stealth", "desc": "False Identity:\nYou have more than one identity. The one you wear most of the time makes you appear to be a member of a guild other than House Dimir. You have documentation, established acquaintances, and disguises that allow you to assume that persona and fit into the secondary guild.\n\nWhenever you choose, you can drop this identity and blend into the guildless masses of the city\n\nDimir Guild Spells:\nPrerequisite: Spellcasting or Pact Magic class feature\n\nFor you, the spells on the Dimir Guild Spells table are added to the spell list of your spellcasting class. (If you are a multiclass character with multiple spell lists, these spells are added to all of them.)\n\n| Spell Level | Spells |\n| --- | --- |\n| Cantrip | encode thoughts, mage hand |\n| 1st | disguise self, sleep |\n| 2nd | detect thoughts, pass without trace |\n| 3rd | gaseous form, meld into stone, nondetection |\n| 4th | arcane eye, freedom of movement |\n| 5th | modify memory |\n\nYour magic is meant to be subtle and undetectable, but it might pull shadows or clouds of mist around you as you cast your spells. Using the encode thoughts cantrip, you can turn a creature's thoughts (including your own) into a thought strand that others can potentially read, share, or steal. These thought strands are treated as valuable currency among the Dimir"}, {"n": "Dissenter", "src": "psa", "gold": 0, "feat": "Shelter Of Dissenters", "skills": "—", "desc": "Shelter Of Dissenters:\nIf they wish to have any hope of survival, whether hiding within the city or cast out into the desert, dissenters must help each other. You can find a place to hide, rest, or recuperate among other dissenters. They will help shield you from those who hunt you, possibly even risking their lives for you."}, {"n": "Dragon Casualty", "src": "cos", "gold": 5, "feat": "Dragonscarred", "skills": "Intimidation, Survival", "desc": "Dragonscarred:\nOver a period of several months you were subject to magical and mundane torture at the claws of Vorgansharax and his minions. These experiments have left you horribly disfigured but mark you as a survivor of the Maimed Virulence. This affords you a measure of fame and notoriety, for those who know of your harrowing ordeal are keen to hear the tale personally but makes it difficult to disguise your appearance and hide from prying eyes.\n\nYou can parlay this attention into access to people and places you might not otherwise have, for you and your companions. Nobles, scholars, mages, and those who seek to ferret out the secrets of the Maimed Virulence would all be keen to hear your tale of survival, and learn what secrets (if any) you might possess, and/or study your affliction with great interest. However, you fear that your afflictions are not completely mundane and that the Maimed Virulence may as yet have some nefarious reason for allowing your escape, as your scars burn with acidic fury and seem to writhe beneath your skin at times"}, {"n": "Earthspur Miner", "src": "homebrew", "gold": 5, "feat": "Deep Miner", "skills": "Athletics, Survival", "desc": "Deep Miner:\nYou are used to navigating the deep places of the earth. You never get lost in caves or mines if you have either seen an accurate map of them or have been through them before. Furthermore, you are able to scrounge fresh water and food for yourself and as many as five other people each day if you are in a mine or natural caves."}, {"n": "Entertainer", "src": "phb", "gold": 15, "feat": "By Popular Demand", "skills": "Acrobatics, Performance", "desc": "By Popular Demand:\nYou can always find a place to perform, usually in an inn or tavern but possibly with a circus, at a theater, or even in a noble’s court. At such a place, you receive free lodging and food of a modest or comfortable standard (depending on the quality of the establishment), as long as you perform each night. In addition, your performance makes you something of a local figure. When strangers recognize you in a town where you have performed, they typically take a liking to you."}, {"n": "Faceless", "src": "bgdia", "gold": 0, "feat": "Dual Personalities", "skills": "Deception, Intimidation, Deception, Intimidation", "desc": "Dual Personalities:\nMost of your fellow adventurers and the world know you as your persona. Those who seek to learn more about you—your weaknesses, your origins, your purpose—find themselves stymied by your disguise. Upon donning a disguise and behaving as your persona, you are unidentifiable as your true self. By removing your disguise and revealing your true face, you are no longer identifiable as your persona. This allows you to change appearances between your two personalities as often as you wish, using one to hide the other or serve as convenient camouflage. However, should someone realize the connection between your persona and your true self, your deception might lose its effectiveness"}, {"n": "Faction Agent", "src": "scag", "gold": 15, "feat": "Safe Haven", "skills": "Insight, Investigation, Intimidation, History, Deception, Perception, Persuasion, Arcana", "desc": "Safe Haven:\nAs a faction agent, you have access to a secret network of supporters and operatives who can provide assistance on your adventures. You know a set of secret signs and passwords you can use to identify such operatives, who can provide you with access to a hidden safe house, free room and board, or assistance in finding information. These agents never risk their lives for you or risk revealing their true identities."}, {"n": "Far Traveler", "src": "scag", "gold": 15, "feat": "All Eyes On You", "skills": "Insight, Perception", "desc": "All Eyes On You:\nYour accent, mannerisms, figures of speech, and perhaps even your appearance all mark you as foreign. Curious glances are directed your way wherever you go, which can be a nuisance, but you also gain the friendly interest of scholars and others intrigued by far-off lands, to say nothing of everyday folk who are eager to hear stories of your homeland. You can parley this attention into access to people and places you might not otherwise have, for you and your traveling companions. Noble lords, scholars, and merchant princes, to name a few, might be interested in hearing about your distant homeland and people."}, {"n": "Feylost", "src": "wbtw", "gold": 8, "feat": "Feywild Connection", "skills": "Deception, Survival, Deception, Survival", "desc": "Feywild Connection:\nYour mannerisms and knowledge of fey customs are recognized by natives of the Feywild, who see you as one of their own. Because of this, friendly Fey creatures are inclined to come to your aid if you are lost or need help in the Feywild"}, {"n": "Fisher", "src": "gos", "gold": 0, "feat": "Harvest the Water", "skills": "History, Survival, History, Survival", "desc": "Harvest the Water:\nYou gain advantage on ability checks made using fishing tackle. If you have access to a body of water that sustains marine life, you can maintain a moderate lifestyle while working as a fisher, and you can catch enough food to feed yourself and up to ten other people each day"}, {"n": "Folk Hero", "src": "phb", "gold": 0, "feat": "Rustic Hospitality", "skills": "Animal Handling, Survival", "desc": "Rustic Hospitality:\nSince you come from the ranks of the common folk, you fit in among them with ease. You can find a place to hide, rest, or recuperate among other commoners, unless you have shown yourself to be a danger to them. They will shield you from the law or anyone else searching for you, though they will not risk their lives for you."}, {"n": "Gate Urchin", "src": "homebrew", "gold": 0, "feat": "Red Plume and Mage Guild Contacts", "skills": "Deception, Sleight Of Hand", "desc": "Red Plume and Mage Guild Contacts:\nYou made a number of friends among the Red Plumes and the Mage's Guild when you lived at the Hillsfar Gate. They remember you fondly and help you in little ways when they can. You can invoke their assistance in and around Hillsfar to obtain food, as well as simple equipment for temporary use. You can also invoke it to gain access to the low-security areas of their garrisons, halls, and encampments."}, {"n": "Gate Warden", "src": "sato", "gold": 10, "feat": "Planar Infusion", "skills": "Persuasion, Survival, Persuasion, Survival", "desc": "Planar Infusion:\nLiving in a gate-town or a similar location steeped you in planar energy. You gain the Scion of the Outer Planes feat. In addition, you know where to find free, modest lodging and food in the community you grew up in"}, {"n": "Giant Foundling", "src": "bgg", "gold": 10, "feat": "Strike of the Giants", "skills": "Intimidation, Survival, Intimidation, Survival", "desc": "Strike of the Giants:\nYou gain the Strike of the Giants feat"}, {"n": "Gladiator", "src": "phb", "gold": 15, "feat": "Contacts", "skills": "Athletics, Intimidation", "desc": "Contacts:\nWhen in a town, you can find a venue in which to fight for money and reputation"}, {"n": "Golgari Agent", "src": "ggr", "gold": 10, "feat": "Undercity Paths", "skills": "Nature, Survival, Nature, Survival", "desc": "Undercity Paths:\nYou know hidden, underground pathways that you can use to bypass crowds, obstacles, and observation as you move through the city. When you aren't in combat, you and companions you lead can travel between any two locations in the city twice as fast as your speed would normally allow. The paths of the undercity are haunted by dangers that rarely brave the light of the surface world, so your journey isn't guaranteed to be safe"}, {"n": "Grinner", "src": "egw", "gold": 15, "feat": "Ballad of the Grinning Fool", "skills": "Deception, Performance, Deception, Performance", "desc": "Ballad of the Grinning Fool:\nLike every Grinner, you know how to find a hideout. In any city of 10,000 people or more on the Menagerie Coast or in the lands of the Dwendalian Empire, you can play the \"Ballad of the Grinning Fool\" in a major tavern or inn. A member of the Golden Grin will find you and give shelter to you and any companions you vouch for. This shelter might be discontinued if it becomes too dangerous to hide you, at the DM's discretion.\n\nThis feature must be used with caution, for not all who know the ballad are your friends. Some are traitors, counterspies, or agents of tyranny"}, {"n": "Gruul Anarch", "src": "ggr", "gold": 10, "feat": "Rubblebelt Refuge", "skills": "Animal Handling, Athletics, Animal Handling, Athletics", "desc": "Rubblebelt Refuge:\nYou are intimately familiar with areas of the city that most people shun: ruined neighborhoods where wurms rampaged, overgrown parks that no hand has tended in decades, and the vast, sprawling rubblebelts of broken terrain that civilized folk have long abandoned. You can find a suitable place for you and your allies to hide or rest in these areas. In addition, you can find food and fresh water in these areas for yourself and up to five other people each day"}, {"n": "Guild Artisan", "src": "phb", "gold": 15, "feat": "Guild Membership", "skills": "Insight, Persuasion", "desc": "Guild Membership:\nAs an established and respected member of a guild, you can rely on certain benefits that membership provides.\nYour fellow guild members will provide you with lodging and food if necessary, and pay for your funeral if needed. In some cities and towns, a guildhall offers a central place to meet other members of your profession, which can be a good place to meet potential patrons, allies, or hirelings. Guilds often wield tremendous political power. If you are accused of a crime, your guild will support you if a good case can be made for your innocence or the crime is justifiable. You can also gain access to powerful political figures through the guild, if you are a member in good standing. Such connections might require the donation of money or magic items to the guild’s coffers. You must pay dues of 5 gp per month to the guild. If you miss payments, you must make up back dues to remain in the guild’s good graces."}, {"n": "Harborfolk", "src": "homebrew", "gold": 5, "feat": "Harborfolk", "skills": "Athletics, Sleight Of Hand", "desc": "Harborfolk:\nYou grew up on the docks and waters of Mulmaster Harbor. The harborfolk remember you and still treat you as one of them. They welcome you and your companions. While they might charge you for it, they'll always offer what food and shelter they have; they'll even hide you if the City Watch is after you (but not if the Hawks are)"}, {"n": "Haunted One", "src": "cos", "gold": 0, "feat": "Heart Of Darkness", "skills": "Arcana, Investigation, Religion, Survival, Arcana, Investigation, Religion, Survival", "desc": "Heart Of Darkness:\nThose who look into your eyes can see that you have faced unimaginable horror and that you are no stranger to darkness. Though they might fear you, commoners will extend you every courtesy and do their utmost to help you. Unless you have shown yourself to be a danger to them, they will even take up arms to fight alongside you, should you find yourself facing an enemy alone"}, {"n": "Hermit", "src": "phb", "gold": 5, "feat": "Discovery", "skills": "Medicine, Religion", "desc": "Discovery:\nThe quiet seclusion of your extended hermitage gave you access to a unique and powerful discovery. The exact nature of this revelation depends on the nature of your seclusion. It might be a great truth about the cosmos, the deities, the powerful beings of the outer planes, or the forces of nature. It could be a site that no one else has ever seen. You might have uncovered a fact that has long been forgotten, or unearthed some relic of the past that could rewrite history. It might be information that would be damaging to the people who consigned you to exile, and hence the reason for your return to society. Work with your DM to determine the details of your discovery and its impact on the campaign."}, {"n": "Hillsfar Merchant", "src": "homebrew", "gold": 25, "feat": "Choose 1 From The List Below", "skills": "Insight, Perception", "desc": "Choose 1 From The List Below:\nFactor:\n\nAlthough you’ve left the day-to-day life of a merchant behind, your family has assigned you the services of a loyal retainer from the business, a factor, husbanding agent, seafarer, caravan guard, or clerk. This individual is a commoner who can perform mundane tasks for you such as making purchases, delivering messages, and running errands. He or she will not fight for you and will not follow you into obviously dangerous areas (such as dungeons), and will leave if frequently endangered or abused. If he or she is killed, the family assigns you another within a few days."}, {"n": "Hillsfar Smuggler", "src": "homebrew", "gold": 5, "feat": "Secret Passage", "skills": "Perception, Stealth", "desc": "Secret Passage:\nYou can call on your contacts within the smuggling community to secure secret passage into or out of Hillsfar for yourself and your adventuring companions, no questions asked, and no Red Plume entanglements. Because you’re calling in a favor, you can’t be certain they will be able to help on your timetable or at all. Your Dungeon Master will determine whether you can be smuggled into or out of the city. In return for your passage, you and your companions may owe the Rogue's Guild a favor and/or may have to pay bribes."}, {"n": "House Agent", "src": "erlw", "gold": 20, "feat": "House Connections", "skills": "Investigation, Persuasion", "desc": "House Connections:\nAs an agent of your house, you can always get food and lodging for your friends at a house enclave. When the house assigns you a mission, it will usually provide you with necessary supplies and transportation. Beyond this, you have many old friends, mentors, and rivals in your house and you may encounter one of them when you interact with a house business. As a Lyrandar agent you may know the captain of an airship; as a Ghallanda agent you know a lot of innkeepers and bartenders. The degree to which such acquaintances will be willing to help you out will depend on your current standing in your house."}, {"n": "Inheritor", "src": "scag", "gold": 15, "feat": "Inheritance", "skills": "Survival, Arcana, History, Religion", "desc": "Inheritance:\nChoose or randomly determine your inheritance. Work with your Dungeon Master to come up with details: Why is your inheritance so important, and what is its full story? You might prefer for the DM to invent these details as part of the game, allowing you to learn more about your inheritance as your character does.\n\nThe Dungeon Master is free to use your inheritance as a story hook, sending you on quests to learn more about its history or true nature, or confronting you with foes who want to claim it for themselves or prevent you from learning what you seek. The DM also determines the properties of your inheritance and how they figure into the item's history and importance. For instance, the object might be a minor magic item, or one that begins with a modest ability and increases in potency with the passage of time. Or, the true nature of your inheritance might not be apparent at first and is revealed only when certain conditions are met.\n\nWhen you begin your adventuring career, you can decide whether to tell your companions about your inheritance right away. Rather than attracting attention to yourself, you might want to keep your inheritance a secret until you learn more about what it means to you and what it can do for you.\n\n"}, {"n": "Initiate", "src": "psa", "gold": 15, "feat": "Trials Of The Five Gods", "skills": "Athletics, Intimidation", "desc": "Trials Of The Five Gods:\nYour life is oriented around your participation in the five trials that will determine your worthiness in the afterlife. While you prepare for and undergo those trials, you have constant access to training. A comfortable place to live and regular meals are provided to you by servitor mummies (the anointed) under the supervision of viziers. You can enjoy these benefits only as long as you obey the societal norms of Naktamun—training for the trials (with or without your crop), obeying the orders of the gods, and following the instructions of their viziers. If you violate these norms, you risk being treated as a dissenter. "}, {"n": "Inquisitor", "src": "psin", "gold": 15, "feat": "Legal Authority", "skills": "Investigation, Religion", "desc": "Legal Authority:\nAs an inquisitor of the church, you have the authority to arrest criminals. In the absence of other authorities, you are authorized to pass judgment and even carry out sentencing. If you abuse this power, however, your superiors in the church might strip it from you."}, {"n": "Investigator", "src": "", "gold": 10, "feat": "Watcher's Eye", "skills": "Investigation, Insight", "desc": "Watcher's Eye:\nYour experience in enforcing the law, and dealing with lawbreakers, gives you a feel for local laws and criminals. You can easily find the local outpost of the watch or a similar organization, and just as easily pick out the dens of criminal activity in a community, although you're more likely to be welcome in the former locations rather than the latter."}, {"n": "Iron Route Bandit", "src": "cos", "gold": 5, "feat": "Black-Market Breeder", "skills": "Stealth, Animal Handling", "desc": "Black-Market Breeder:\nYou know how to find people who are always looking for stolen animals & vehicles, whether to provide for animal pit fights, or to supply some desperate rogues the means to get away faster on mounts during an illegal job. This contact not only provides you with information of what such animals & vehicles are in high demand in the area, but also offer to give you favors and information (DM choice) if you bring such animals & vehicles to them"}, {"n": "Izzet Engineer", "src": "ggr", "gold": 5, "feat": "Urban Infrastructure", "skills": "Arcana, Investigation, Arcana, Investigation", "desc": "Urban Infrastructure:\nThe popular conception of the Izzet League is based on mad inventions, dangerous experiments, and explosive blasts. Much of that perception is accurate, but the league is also involved with mundane tasks of construction and architecture—primarily in crafting the infrastructure that allows Ravnicans to enjoy running water, levitating platforms, and other magical and technological wonders.\n\nYou have a basic knowledge of the structure of buildings, including the stuff behind the walls. You can also find blueprints of a specific building in order to learn the details of its construction. Such blueprints might provide knowledge of entry points, structural weaknesses, or secret spaces. Your access to such information isn't unlimited. If obtaining or using the information gets you in trouble with the law, the guild can't shield you from the repercussions"}, {"n": "Knight", "src": "phb", "gold": 20, "feat": "Retainer", "skills": "History, Persuasion", "desc": "Retainer:\nYou have the service of three retainers loyal to your family. These retainers can be attendants or messengers, and one might be a majordomo. Your retainers are commoners who can perform mundane tasks for you, but they do not fight for you, will not follow you into obviously dangerous areas (such as dungeons), and will leave if they are frequently endangered or abused."}, {"n": "Knight of Solamnia", "src": "dsdq", "gold": 10, "feat": "Squire of Solamnia", "skills": "Athletics, Survival, Athletics, Survival", "desc": "Squire of Solamnia:\nYou gain the Squire of Solamnia feat.\n\nIn addition, the Knights of Solamnia provide you free, modest lodging and food at any of their fortresses or encampments"}, {"n": "Knight of The Order", "src": "scag", "gold": 0, "feat": "Knightly Regard", "skills": "Persuasion, Arcana, History, Nature, Religion", "desc": "Knightly Regard:\nYou receive shelter and succor from members of your knightly order and those who are sympathetic to its aims. If your order is a religious one, you can gain aid from temples and other religious communities of your deity. Knights of civic orders can get help from the community- whether a lone settlement or a great nation that they serve, and knights of philosophical orders can find help from those they have aided in pursuit of their ideals, and those who share those ideals. This help comes in the form of shelter and meals, and healing when appropriate, as well as occasionally risky assistance, such as a band of local citizens rallying to aid a sorely pressed knight in a fight, or those who support the order helping to smuggle a knight out of town when he or she is being hunted unjustly. "}, {"n": "Lorehold Student", "src": "scc", "gold": 10, "feat": "Lorehold Initiate", "skills": "History, Religion, History, Religion", "desc": "Lorehold Initiate:\nYou gain the Strixhaven Initiate feat and must choose Lorehold within it.\n\nIn addition, if you have the Spellcasting or Pact Magic feature, the spells on the Lorehold Spells table are added to the spell list of your spellcasting class. (If you are a multiclass character with multiple spell lists, these spells are added to all of them.)\n\nLorehold Spells\n| Spell Level | Spells |\n| --- | --- |\n| 1st | Comprehend Languages, Identify |\n| 2nd | Borrowed Knowledge, Locate Object |\n| 3rd | Speak with Dead, Spirit Guardians |\n| 4th | Arcane Eye, Stone Shape |\n| 5th | Flame Strike, Legend Lore |"}, {"n": "Mage of High Sorcery", "src": "dsdq", "gold": 10, "feat": "Initiate of High Sorcery", "skills": "Arcana, History, Arcana, History", "desc": "Initiate of High Sorcery:\nYou gain the Initiate of High Sorcery feat.\n\nIn addition, the Mages of High Sorcery provide you with free, modest lodging and food indefinitely at any occupied Tower of High Sorcery and for one night at the home of an organization member"}, {"n": "Marine", "src": "gos", "gold": 0, "feat": "Steady", "skills": "Athletics, Survival, Athletics, Survival", "desc": "Steady:\nYou can move twice the normal amount of time (up to 16 hours) each day before being subject to the effect of a forced march. Additionally, you can automatically find a safe route to land a boat on shore, provided such a route exists"}, {"n": "Mercenary Veteran", "src": "scag", "gold": 0, "feat": "Mercenary Life", "skills": "Athletics, Persuasion", "desc": "Mercenary Life:\nYou know the mercenary life as only someone who has experienced it can. You are able to identify mercenary companies by their emblems, and you know a little about any such company, including the names and reputations of its commanders and leaders, and who has hired them recently. You can find the taverns and feast halls where mercenaries abide in any area, as long as you speak the language. You can find mercenary work between adventures sufficient to maintain a comfortable lifestyle"}, {"n": "Merchant", "src": "phb", "gold": 20, "feat": "Charismatic Demeanor", "skills": "Persuasion, Deception, Perception", "desc": "Charismatic Demeanor:\nYour experience with customers gives you an advantage with people, once a day, you can use this feature to give you advantage in Charisma checks that involve negotiation with others."}, {"n": "Mulmaster Aristocrat", "src": "homebrew", "gold": 0, "feat": "Highborn", "skills": "Deception, Performance", "desc": "Highborn:\nMulmaster is run by and for its aristocracy. Every other class of citizen in the city defers to you, and even the priesthood, Soldiery, Hawks, and Cloaks treat you with deference. Other aristocrats and nobles accept you in their circles and likely know you or of you. Your connections can get you the ear of a Zor or Zora under the right circumstances. "}, {"n": "Noble", "src": "phb", "gold": 25, "feat": "Position Of Privilege", "skills": "History, Persuasion", "desc": "Position Of Privilege:\nThanks to your noble birth, people are inclined to think the best of you. You are welcome in high society, and people assume you have the right to be wherever you are. The common folk and merchants make every effort to accommodate you and avoid your displeasure, and other people of high birth treat you as a member of the same social sphere. You can secure an audience with a local noble if you need to."}, {"n": "Orzhov Representative", "src": "ggr", "gold": 10, "feat": "Leverage", "skills": "Intimidation, Religion, Intimidation, Religion", "desc": "Leverage:\nYou can exert leverage over one or more individuals below you in the guild's hierarchy and demand their help as needs warrant. For example, you can have a message carried across a neighborhood, procure a short carriage ride without paying, or have others clean up a bloody mess you left in an alley. The DM decides if your demands are reasonable and if there are subordinates available to fulfill them. As your status in the guild improves, you gain influence over more people, including ones in greater positions of power"}, {"n": "Outlander", "src": "phb", "gold": 0, "feat": "Wanderer", "skills": "Athletics, Survival", "desc": "Wanderer:\nYou have an excellent memory for maps and geography, and you can always recall the general layout of terrain, settlements, and other features around you. In addition, you can find food and fresh water for yourself and up to five other people each day, provided that the land offers berries, small game, water, and so forth."}, {"n": "Phlan Insurgent", "src": "cos", "gold": 5, "feat": "Guerilla", "skills": "Stealth, Survival", "desc": "Guerilla:\nstreams, caves, and other natural features in which you can take refuge--or set up ambushes. You can quickly survey your environment for advantageous features. Additionally, you can scavenge around your natural surroundings to cobble together simple supplies (such as improvised torches, rope, patches of fabric, etc.) that are consumed after use."}, {"n": "Phlan Refugee", "src": "homebrew", "gold": 15, "feat": "Phlan Survivor", "skills": "Insight, Athletics", "desc": "Phlan Survivor:\nWhatever your prior standing was, you are now one of the many refugees that have come to Mulmaster. You are able to find refuge with others from Phlan and those who sympathize with your plight. Within Mulmaster this means that you can find a place to bed down, recover, and hide from the watch with either other refugees from Phlan, or the Zhents within the ghettos."}, {"n": "Pirate", "src": "phb", "gold": 0, "feat": "Bad Reputation", "skills": "Athletics, Perception", "desc": "Bad Reputation:\nNo matter where you go, people are afraid of you due to your reputation. When you are in a civilized settlement, you can get away with minor criminal offenses, such as refusing to pay for food at a tavern or breaking down doors at a local shop, since most people will not report your activity to the authorities."}, {"n": "Planar Philosopher", "src": "sato", "gold": 10, "feat": "Conviction", "skills": "Acrobatics, Animal Handling, Athletics, Deception, History, Insight, Intimidation, Investigation, Medicine, Nature, Perception, Performance, Persuasion, Religion, Sleight Of Hand, Stealth, Survival, Arcana", "desc": "Conviction:\nYou gain the Scion of the Outer Planes feat. In addition, members of your organization provide you free, modest lodging and food at any of their holdings or the homes of other faction members"}, {"n": "Prismari Student", "src": "scc", "gold": 10, "feat": "Prismari Initiate", "skills": "Acrobatics, Performance, Acrobatics, Performance", "desc": "Prismari Initiate:\nYou gain the Strixhaven Initiate feat and must choose Prismari within it.\n\nIn addition, if you have the Spellcasting or Pact Magic feature, the spells on the Prismari Spells table are added to the spell list of your spellcasting class. (If you are a multiclass character with multiple spell lists, these spells are added to all of them.)\n\nPrismari Spells\n| Spell Level | Spells |\n| --- | --- |\n| 1st | Chromatic Orb, Thunderwave |\n| 2nd | Flaming Sphere, Kinetic Jaunt |\n| 3rd | Haste, Water Walk |\n| 4th | Freedom of Movement, Wall of Fire |\n| 5th | Cone of Cold, Conjure Elemental |"}, {"n": "Quandrix Student", "src": "scc", "gold": 15, "feat": "Quandrix Initiate", "skills": "Arcana, Nature, Arcana, Nature", "desc": "Quandrix Initiate:\nYou gain the Strixhaven Initiate feat and must choose Quandrix within it.\n\nIn addition, if you have the Spellcasting or Pact Magic feature, the spells on the Quandrix Spells table are added to the spell list of your spellcasting class. (If you are a multiclass character with multiple spell lists, these spells are added to all of them.)\n\nQuandrix Spells\n| Spell Level | Spells |\n| --- | --- |\n| 1st | Entangle, Guiding Bolt |\n| 2nd | Enlarge/Reduce, Vortex Warp |\n| 3rd | Aura of Vitality, Haste |\n| 4th | Control Water, Freedom of Movement |\n| 5th | Circle of Power, Passwall |"}, {"n": "Rakdos Cultist", "src": "ggr", "gold": 10, "feat": "Fearsome Reputation", "skills": "Acrobatics, Performance, Acrobatics, Performance", "desc": "Fearsome Reputation:\nPeople recognize you as a member of the Cult of Rakdos, and they're careful not to draw your anger or ridicule. You can get away with minor criminal offenses, such as refusing to pay for food at a restaurant or breaking down a door at a local shop, if no legal authorities witness the crime. Most people are too daunted by you to report your wrongdoing to the Azorius"}, {"n": "Rewarded", "src": "bmt", "gold": 10, "feat": "Fortune's Favor", "skills": "Insight, Persuasion, Insight, Persuasion", "desc": "Fortune's Favor:\nYour unexpected good fortune is reflected by a minor boon. You gain the Lucky, Magic Initiate, or Skilled feat (your choice). Your choice of feat reflects the transformation that changed your life. An encounter with a genie who gave you three wishes might have resulted in magical powers represented by Magic Initiate. If you paid off all your family debts with a fortuitous round of three-dragon ante, you might be Lucky instead. Alternatively, you could use the Skilled feat to reflect whatever trial you endured to secure your new destiny and to model the knowledge and abilities imparted to you by whatever force transformed your life"}, {"n": "Ruined", "src": "bmt", "gold": 13, "feat": "Still Standing", "skills": "Stealth, Survival, Stealth, Survival", "desc": "Still Standing:\nYou have weathered ruinous misfortune, and you possess hidden reserves others don't expect. You gain the Alert, Skilled, or Tough feat (your choice). Your choice of feat reflects how you've dealt with the terrible loss that changed your life forever. If you've kept your senses sharp for every opportunity and climbed your way out of misery by seizing the tiniest scrap of hope, choose Alert. If you've redoubled your efforts to reclaim what was once yours, choose Skilled. If you've stoically persevered through your misfortune, select Tough"}, {"n": "Rune Carver", "src": "bgg", "gold": 10, "feat": "Rune Shaper", "skills": "History, Perception, History, Perception", "desc": "Rune Shaper:\nYou gain the Rune Shaper feat"}, {"n": "Sage", "src": "phb", "gold": 0, "feat": "Researcher", "skills": "Arcana, History", "desc": "Researcher:\nWhen you attempt to learn or recall a piece of lore, if you do not know that information, you often know where and from whom you can obtain it. Usually, this information comes from a library, scriptorium, university, or a sage or other learned person or creature. Your DM might rule that the knowledge you seek is secreted away in an almost inaccessible place, or that it simply cannot be found. Unearthing the deepest secrets of the multiverse can require an adventure or even a whole campaign."}, {"n": "Sailor", "src": "phb", "gold": 0, "feat": "Ship's Passage", "skills": "Athletics, Perception", "desc": "Ship's Passage:\nWhen you need to, you can secure free passage on a sailing ship for yourself and your adventuring companions. You might sail on the ship you served on, or another ship you have good relations with (perhaps one captained by a former crewmate). Because you’re calling in a favor, you can’t be certain of a schedule or route that will meet your every need. Your Dungeon Master will determine how long it takes to get where you need to go. In return for your free passage, you and your companions are expected to assist the crew during the voyage."}, {"n": "Secret Identity", "src": "homebrew", "gold": 5, "feat": "Secret Identity", "skills": "Deception, Stealth", "desc": "Secret Identity:\nYou have created a secret identity that you use to conceal your true race and that offers a covering explanation for your presence in Hillsfar. In addition, you can forge documents, including official papers and personal letters, as long as you have seen an example of the kind of document or the handwriting you are trying to copy."}, {"n": "Selesnya Initiate", "src": "ggr", "gold": 5, "feat": "Conclave's Shelter", "skills": "Nature, Persuasion, Nature, Persuasion", "desc": "Conclave's Shelter:\nAs a member of the Selesnya Conclave, you can count on your guild mates to provide shelter and aid. You and your companions can find a place to hide or rest in any Selesnya enclave in the city, unless you have proven to be a danger to them. The members of the enclave will shield you from the law or anyone else searching for you, though they will not risk their lives in this effort.\n\nIn addition, as a guild member you can receive free healing and care at a Selesnya enclave, though you must provide any material components needed for spells"}, {"n": "Shade Fanatic", "src": "homebrew", "gold": 15, "feat": "Secret Society", "skills": "Deception, Intimidation", "desc": "Secret Society:\nYou have a special way of communicating with others who feel the same way you do about the Shade. When you enter a village or larger city you can identify contact who will give you information on those that would hinder your goals and those would help you simply because of your desire to see the Shade Enclave return in all its glory. "}, {"n": "Shipwright", "src": "gos", "gold": 0, "feat": "I'll Patch It!", "skills": "History, Perception, History, Perception", "desc": "I'll Patch It!:\nProvided you have carpenter's tools and wood, you can perform repairs on a water vehicle. When you use this ability, you restore a number of hit points to the hull of a water vehicle equal to 5 times your proficiency modifier. A vehicle cannot be patched by you in this way again until after it has been pulled ashore and fully repaired"}, {"n": "Silverquill Student", "src": "scc", "gold": 15, "feat": "Silverquill Initiate", "skills": "Intimidation, Persuasion, Intimidation, Persuasion", "desc": "Silverquill Initiate:\nYou gain the Strixhaven Initiate feat and must choose Silverquill within it.\n\nIn addition, if you have the Spellcasting or Pact Magic feature, the spells on the Silverquill Spells table are added to the spell list of your spellcasting class. (If you are a multiclass character with multiple spell lists, these spells are added to all of them.)\n\nSilverquill Spells\n| Spell Level | Spells |\n| --- | --- |\n| 1st | Dissonant Whispers, Silvery Barbs |\n| 2nd | Calm Emotions, Darkness |\n| 3rd | Beacon of Hope, Daylight |\n| 4th | Compulsion, Confusion |\n| 5th | Dominate Person, Rary's Telepathic Bond |"}, {"n": "Simic Scientist", "src": "ggr", "gold": 10, "feat": "Researcher", "skills": "Arcana, Medicine, Arcana, Medicine", "desc": "Researcher:\nWhen you attempt to learn or recall a magical or scientific fact, if you don't know that information, you know where and from whom you can obtain it. Usually, this information comes from a Simic laboratory, or sometimes from an Izzet facility, a library, a university, or an independent scholar or other learned person or creature. Knowing where the information can be found doesn't automatically enable you to learn it; you might need to offer bribes, favors, or other incentives to induce people to reveal their secrets.\n\nYour DM might rule that the knowledge you seek is secreted away in an inaccessible place, or that it simply can't be found. Unearthing the deepest secrets of the multiverse can require an adventure or even a whole campaign"}, {"n": "Smuggler", "src": "gos", "gold": 15, "feat": "Down Low", "skills": "Athletics, Deception, Athletics, Deception", "desc": "Down Low:\nYou are acquainted with a network of smugglers who are willing to help you out of tight situations. While in a particular town, city, or other similarly sized community (DM's discretion), you and your companions can stay for free in safe houses. Safe houses provide a poor lifestyle. While staying at a safe house, you can choose to keep your presence (and that of your companions) a secret"}, {"n": "Soldier", "src": "phb", "gold": 0, "feat": "Military Rank", "skills": "Athletics, Intimidation", "desc": "Military Rank:\nYou have a military rank from your career as a soldier. Soldiers loyal to your former military organization still recognize your authority and influence, and they defer to you if they are of a lower rank. You can invoke your rank to exert influence over other soldiers and requisition simple equipment or horses for temporary use. You can also usually gain access to friendly military encampments and fortresses where your rank is recognized."}, {"n": "Spy", "src": "phb", "gold": 15, "feat": "Echo Of The Great Game", "skills": "Deception, Stealth", "desc": "Echo Of The Great Game:\nYears of stealth and trickery have taught you how to not draw attention to yourself. The way you walk, talk and move are deliberately forgettable, and utterly unextraordinary. While you are wearing common clothes, no one can remember your face nor any features about you, unless they actively make an effort to do so.\n\nIn addition, you know how to write in a special code that can only be read by people trained in deciphering it."}, {"n": "Stojanow Prisoner", "src": "cos", "gold": 0, "feat": "Ex-Convict", "skills": "Deception, Perception", "desc": "Ex-Convict:\nThe knowledge gained during your incarceration lets you gain insight into local guards and jailors. You know which will accept bribes, or look the other way for you. You can also seek shelter for yourself from authorities with other criminals in the area."}, {"n": "Ticklebelly Nomad", "src": "cos", "gold": 5, "feat": "At Home In The Wild", "skills": "Nature, Animal Handling", "desc": "At Home In The Wild:\nThe wilderness is your home and you are comfortable dwelling in it. You can find a place to hide, rest, or recuperate when out in the wild. This place of rest is secure enough to conceal you from most natural threats. Threats that are supernatural, magical, or are actively seeking you out might do so with difficulty depending on the nature of the threat (as determined by the DM). However, this feature doesn’t shield or conceal you from scrying, mental probing, nor from threats that don’t necessarily require the five senses to find you. "}, {"n": "Trade Sheriff", "src": "homebrew", "gold": 17, "feat": "Investigative Service", "skills": "Investigation, Persuasion", "desc": "Investigative Service:\nYou are part of a small force outside of Hillsfar You have a special way of communicating with others and they seem to be at ease around you. You can invoke your rank to allow you access to a crime scene or to requisition equipment or horses on a temporary basis. When you enter a town or village around Hillsfar you can identify a contact who will give you information on the local rumors and would help you simply because of your desire to get answers and information for anyone wanting to disrupt trade. "}, {"n": "Urban Bounty Hunter", "src": "scag", "gold": 20, "feat": "Ear To The Ground", "skills": "Deception, Insight, Persuasion, Stealth, Deception, Insight, Persuasion, Stealth", "desc": "Ear To The Ground:\nYou are in frequent contact with people in the segment of society that your chosen quarries move through. These people might be associated with the criminal underworld, the rough-and-tumble folk of the streets, or members of high society. This connection comes in the form of a contact in any city you visit, a person who provides information about the people and places of the local area. "}, {"n": "Urchin", "src": "phb", "gold": 0, "feat": "City Secrets", "skills": "Sleight Of Hand, Stealth", "desc": "City Secrets:\nYou know the secret patterns and flow to cities and can find passages through the urban sprawl that others would miss. When you are not in combat, you (and companions you lead) can travel between any two locations in the city twice as fast as your speed would normally allow."}, {"n": "Uthgardt Tribe Member", "src": "scag", "gold": 0, "feat": "Uthgardt Heritage", "skills": "Athletics, Survival", "desc": "Uthgardt Heritage:\nYou have an excellent knowledge of not only your tribe's territory, but also the terrain and natural resources of the rest of the North. You are familiar enough with any wilderness area that you find twice as much food and water as you normally would when you forage there. Additionally, you can call upon the hospitality of your people, and those folk allied with your tribe, often including members of druid circles, tribes of nomadic elves, the Harpers, and the priesthoods devoted to the gods of the First Circle."}, {"n": "Vizier", "src": "psa", "gold": 25, "feat": "Voice of Authority", "skills": "History, Religion", "desc": "Voice of Authority:\nYour voice is the voice of your god, at least in theory. Your job might include training and instructing initiates, and they are required to obey you. In any circumstance, an initiate is expected to defer to your voice and obey your commands. If you abuse this authority, though, your god might personally punish you."}, {"n": "Volstrucker Agent", "src": "egw", "gold": 10, "feat": "Shadow Network", "skills": "Deception, Stealth, Deception, Stealth", "desc": "Shadow Network:\nYou have access to the Volstrucker shadow network, which allows you to communicate with other members of the order over long distances. If you write a letter in a special arcane ink, address it to a member of the Volstrucker, and cast it into a fire, the letter will burn to cinders and materialize whole again on the person of the agent you addressed it to.\n\nThe ink used to send a letter across the shadow network is the same as that used by a wizard to scribe spells in a spellbook. Writing a letter in this ink costs 10 gp per page"}, {"n": "Waterdhavian Noble", "src": "scag", "gold": 20, "feat": "Kept In Style", "skills": "History, Persuasion", "desc": "Kept In Style:\nWhile you are in Waterdeep or elsewhere in the North your house sees to your everyday needs. Your name and signet are sufficient to cover most of your expenses; the inns, taverns, and feast halls you frequent are glad to record your debt and send an accounting to your family's estate in Waterdeep to settle what you owe. This advantage enables you to live a comfortable lifestyle without having to pay 2 gp a day for it, or reduces the cost of a wealthy or aristocratic lifestyle by that amount. You may not maintain a less affluent lifestyle and use the difference as income-the benefit is a line of credit, not an actual monetary reward. "}, {"n": "Witchlight Hand", "src": "wbtw", "gold": 8, "feat": "Carnival Fixture", "skills": "Performance, Sleight Of Hand, Performance, Sleight Of Hand", "desc": "Carnival Fixture:\nThe Witchlight Carnival provides you with free, modest lodging and food. In addition, you may wander about the carnival and partake of its many wonders at no cost to you, provided you don't disrupt its shows or cause any other trouble"}, {"n": "Witherbloom Student", "src": "scc", "gold": 15, "feat": "Witherbloom Initiate", "skills": "Nature, Survival, Nature, Survival", "desc": "Witherbloom Initiate:\nYou gain the Strixhaven Initiate feat and must choose Witherbloom within it.\n\nIn addition, if you have the Spellcasting or Pact Magic feature, the spells on the Witherbloom Spells table are added to the spell list of your spellcasting class. (If you are a multiclass character with multiple spell lists, these spells are added to all of them.)\n\nWitherbloom Spells\n| Spell Level | Spells |\n| --- | --- |\n| 1st | Cure Wounds, Inflict Wounds |\n| 2nd | Lesser Restoration, Wither and Bloom |\n| 3rd | Revivify, Vampiric Touch |\n| 4th | Blight, Death Ward |\n| 5th | Antilife Shell, Greater Restoration |"}];
let F=DATA.slice(),open=-1;
const SK=[r=>r.n,r=>r.src,r=>r.feat,r=>r.skills,r=>r.gold];

let sC=-1,sA=true;
function srt(c){
  if(sC===c)sA=!sA;else{sC=c;sA=true;}
  F.sort((a,b)=>{
    let va=SK[c](a),vb=SK[c](b);
    if(typeof va==='number'&&typeof vb==='number')return sA?(va-vb):(vb-va);
    va=String(va);vb=String(vb);
    return sA?va.localeCompare(vb,void 0,{numeric:true}):vb.localeCompare(va,void 0,{numeric:true});
  });
  document.querySelectorAll('thead th').forEach((th,i)=>th.className=i===sC?(sA?'asc':'desc'):'');
  open=-1;render();
}

function render(){
  const h=[];
  F.forEach((r,i)=>{
    h.push(`<tr onclick="tog(${i})"${open===i?' class="active"':''}>`+
      `<td>${esc(r.n)}</td><td>${esc(r.src).toUpperCase()}</td>`+
      `<td>${esc(r.feat)}</td><td style="font-size:12px">${esc(r.skills)}</td>`+
      `<td>${r.gold||'—'} gp</td></tr>`);
    h.push(`<tr class="desc-row" style="display:${open===i?'':'none'}"><td colspan="5">`+
      `<div class="desc-content">${esc(r.desc||'No description available.')}</div></td></tr>`);
  });
  document.getElementById('tb').innerHTML=h.join('');
  document.getElementById('cnt').textContent=F.length+'/'+DATA.length;
}
function tog(i){open=open===i?-1:i;render();}
function fil(){
  const q=document.getElementById('qs').value.toLowerCase();
  const fs=document.getElementById('fsr').value;
  F=DATA.filter(r=>
    (!q||(r.n+' '+r.feat+' '+r.skills).toLowerCase().includes(q))&&
    (!fs||r.src===fs));
  open=-1;render();
}
render();</script></body></html>
