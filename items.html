const DATA=[{"n": "+1 Dragonhide Belt", "src": "ftd", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This finely detailed belt is made of dragonhide. While wearing it, you gain a +1 bonus to the saving throw DCs of your ki features. In addition, you can use an action to regain ki points equal to a roll of your Martial Arts die. You can't use this action again until the next dawn.", "ed": "both"}, {"n": "+1 Fate Dealer's Deck", "src": "bmt", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "", "desc": "The backs of these cards are inscribed with glyphs representing the Inner Planes, the Outer Planes, or the holy symbols of various deities. While holding this deck, you can use it as a spellcasting focus, and you gain a +1 bonus to spell attack rolls and to your spell save DC.\n\nIn addition, while you're holding the deck, you can draw a card as an action to expend and roll one of your Hit Dice and add the deck's bonus to the number rolled. One creature you can see within 30 feet of you either takes radiant damage or regains hit points (your choice) equal to the total.", "ed": "both"}, {"n": "+1 Rod of the Pact Keeper", "src": "dmg", "tp": "rod", "rar": "uncommon", "rarn": 2, "mag": true, "att": true, "cur": false, "wt": "2 lb", "desc": "(requires attunement by a warlock)\n\nWhile holding this rod, you gain a +1 bonus to spell attack rolls and to the saving throw DCs of your Warlock spells.\n\nIn addition, you can regain one spell slot as a Magic action while holding the rod. You can't use this property again until you finish a Long Rest", "ed": "both"}, {"n": "+1 Wand of the War Mage", "src": "dmg", "tp": "wand", "rar": "uncommon", "rarn": 2, "mag": true, "att": true, "cur": false, "wt": "1 lb", "desc": "(requires attunement by a spellcaster)\n\nWhile you are holding this wand, you gain a +1 bonus to spell attack rolls. In addition, you ignore half cover when making a n't use this action again until the next dawn.", "ed": "both"}, {"n": "+3 Fate Dealer's Deck", "src": "bmt", "tp": "wondrous", "rar": "legendary", "rarn": 5, "mag": true, "att": true, "cur": false, "wt": "", "desc": "The backs of these cards are inscribed with glyphs representing the Inner Planes, the Outer Planes, or the holy symbols of various deities. While holding this deck, you can use it as a spellcasting focus, and you gain a +3 bonus to spell attack rolls and to your spell save DC.\n\nIn addition, while you're holding the deck, you can draw a card as an action to expend and roll one of your Hit Dice and add the deck's bonus to the number rolled. One creature you can see within 30 feet of you either takes radiant damage or regains hit points (your choice) equal to the total.", "ed": "both"}, {"n": "+3 Rod of the Pact Keeper", "src": "dmg", "tp": "rod", "rar": "very_rare", "rarn": 99, "mag": true, "att": true, "cur": false, "wt": "2 lb", "desc": "(requires attunement by a warlock)\n\nWhile holding this rod, you gain a +3 bonus to spell attack rolls and to the saving throw DCs of your Warlock spells.\n\nIn addition, you can regain one spell slot as a Magic action while holding the rod. You can't use this property again until you finish a Long Rest", "ed": "both"}, {"n": "+3 Wand of the War Mage", "src": "dmg", "tp": "wand", "rar": "very_rare", "rarn": 99, "mag": true, "att": true, "cur": false, "wt": "1 lb", "desc": "(requires attunement by a spellcaster)\n\nWhile you are holding this wand, you gain a +3 bonus to spell attack rolls. In addition, you ignore half cover when making a spell attack.", "ed": "both"}, {"n": "+3 Wraps of Unarmed Power", "src": "dmg", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "", "desc": "While wearing these wraps, you have a +3 bonus to attack rolls and damage rolls made with your Unarmed Strikes. Those strikes deal your choice of Force damage or their normal damage type", "ed": "2024"}, {"n": "+3 Wraps of Unarmed Prowess", "src": "bmt", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "", "desc": "While you're wearing these cloth wraps, your unarmed strikes are considered magical for the purpose of overcoming immunity and resistance to nonmagical attacks and damage, and you gain a +3 bonus to the attack and damage rolls of your unarmed strikes.", "ed": "both"}, {"n": "Abacus", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "2 lb", "desc": "", "ed": "both"}, {"n": "Acid", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "When you take the Attack action, you can replace one of your attacks with throwing a vial of Acid. Target one creature or object you can see within 20 feet of yourself. The target must succeed on a Dexterity saving throw (DC 8 plus your Dexterity modifier and Proficiency Bonus) or take 2d6 Acid damage", "ed": "2024"}, {"n": "Acid (vial)", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "As an action, you can splash the contents of this vial onto a creature within 5 feet of you or throw the vial up to 20 feet, shattering it on impact. In either case, make a ranged attack against a creature or object, treating the acid as an improvised weapon. On a hit, the target takes 2d6 acid damage.", "ed": "5e"}, {"n": "Airship", "src": "phb", "tp": "vehicle_air", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "Speed: 8 mph\nCarrying Capacity: 1 ton cargo, 20 passengers\nCrew 10, AC 13, HP 300\n\nSpeed. A ship sailing against a strong wind moves at half speed. In a dead calm (no wind), waterborne ships can't move under sail and must be rowed. Keelboats and Rowboats are used on lakes and rivers. If going downstream, add the speed of the current (typically 3 miles per hour) to the speed of the vehicle. These vehicles can't be rowed against any significant current, but they can be pulled upstream by draft animals on the shores. A Rowboat can be carried and weighs 100 pounds.\n\nCrew. A ship larger than a Keelboat or Rowboat needs a crew of skilled hirelings (see \"Services\") to function. The minimum number of skilled hirelings needed to crew a ship depends on the type of ship.\n\nPassengers. The number of Small and Medium passengers the ship can accommodate using hammocks. A ship outfitted with private accommodations can carry one-fifth as many passengers. A passenger usually pays 5 SP per day for a hammock, but prices can vary from ship to ship. A small private cabin usually costs 2 GP per day.\n\nDamage Threshold. See the rules glossary.\n\nShip Repair. Repairs to a damaged ship can be made while the vessel is berthed. Repairing 1 Hit Point of damage requires 1 day and costs 20 GP for materials and labor. If the repairs are made in a location where supplies and skilled labor are abundant, such as a city shipyard, the repair time and cost are halved", "ed": "both"}, {"n": "Alchemist's Fire", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "When you take the Attack action, you can replace one of your attacks with throwing a flask of Alchemist's Fire. Target one creature or object you can see within 20 feet of yourself. The target must succeed on a Dexterity saving throw (DC 8 plus your Dexterity modifier and Proficiency Bonus) or take 1d4 Fire damage and start burning", "ed": "2024"}, {"n": "Alchemist's Fire (flask)", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "This sticky, adhesive fluid ignites when exposed to air. As an action, you can throw this flask up to 20 feet, shattering it on impact. Make a ranged attack against a creature or object, treating the alchemist's fire as an improvised weapon. On a hit, the target takes 1d4 fire damage at the start of each of its turns. A creature can end this damage by using its action to make a DC 10 Dexterity check to extinguish the flames.", "ed": "5e"}, {"n": "Alchemist's Supplies", "src": "phb", "tp": "artisans_tools", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "8 lb", "desc": "Ability: Intelligence\n\nUtilize: Identify a substance (DC 15), or start a fire (DC 15)\n\nCraft: Acid, Alchemist's Fire, Component Pouch, Oil, Paper, Perfume\n\nArtisan's Tools are each focused on crafting items and pursuing a trade. Each type of Artisan's Tools tools requires a separate proficiency.\n\nIf you have proficiency with a tool, add your Proficiency Bonus to any ability check you make that uses the tool. If you have proficiency in a skill that's used with that check, you have Advantage on the check too", "ed": "both"}, {"n": "Alchemy Jug", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "12 lb", "desc": "This ceramic jug appears to be able to hold a gallon of liquid and weighs 12 pounds whether full or empty. The jug sloshes when it is shaken, even if the jug is empty.\n\nYou can take a Magic action and name one liquid from the Alchemy Jug Liquids table to cause the jug to produce the chosen liquid. Afterward, you can uncork the jug as a Utilize action and pour that liquid out, up to 2 gallons per minute. The maximum amount of liquid the jug can produce depends on the liquid you named.\n\nOnce the jug starts producing a liquid, it can't produce a different one, or more of one that has reached its maximum, until the next dawn.\n\n| Liquid | Max. Amount |\n| --- | --- |\n| Acid | 8 ounces |\n| Basic Poison | 4 ounces |\n| Beer | 4 gallons |\n| Honey | 1 gallon |\n| Mayonnaise | 2 gallons |\n| Oil | 1 quart |\n| Vinegar | 2 gallons |\n| Water, fresh | 8 gallons |\n| Water, salt | 12 gallons |\n| Wine | 1 gallon |", "ed": "both"}, {"n": "Ale (Gallon)", "src": "", "tp": "food_and_drink", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "", "ed": "5e"}, {"n": "Ale (Mug)", "src": "phb", "tp": "food_and_drink", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "", "ed": "both"}, {"n": "Amethyst Lodestone", "src": "ftd", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This fist-sized chunk of amethyst is infused with an amethyst dragon's ability to bend gravitational forces. While you are carrying the lodestone, you have advantage on Strength saving throws.\n\nThe lodestone has 6 charges for the following properties, which you can use while you are holding the stone. The stone regains 1d6 expended charges daily at dawn.\n\nFlight\nAs a bonus action, you can expend 1 charge to gain the power of flight for 10 minutes. For the duration, you gain a flying speed equal to your walking speed, and you can hover.\n\nGravitational Thrust\nAs an action, you can expend 1 charge to focus gravity around a creature you can see within 60 feet of you. The target must succeed on a DC 18 Strength saving throw or be pushed up to 20 feet in a direction of your choice.\n\nReverse Gravity\nAs an action, you can expend 3 charges to cast reverse gravity from the stone (save DC 18).", "ed": "both"}, {"n": "Amulet", "src": "phb", "tp": "spellcasting_focus", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "For an Amulet to be an effective Holy Symbol, it must be worn or held.\n\nA Holy Symbol takes a specific form and is bejeweled or painted to channel divine magic. A Cleric or Paladin can use a Holy Symbol as a Spellcasting Focus", "ed": "both"}, {"n": "Amulet of Health", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "1 lb", "desc": "Your Constitution score is 19 while you wear this amulet. It has no effect on you if your Constitution is already 19 or higher without it", "ed": "both"}, {"n": "Amulet of Proof against Detection and Location", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": true, "cur": false, "wt": "1 lb", "desc": "While wearing this amulet, you are hidden from divination magic. You can't be targeted by such magic or perceived through magical scrying sensors.", "ed": "5e"}, {"n": "Amulet of the Drunkard", "src": "egw", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "1 lb", "desc": "This amulet smells of old, ale-stained wood. While wearing it, you can regain 4d4 + 4 hit points when you drink a pint of beer, ale, mead, or wine. Once the amulet has restored hit points, it can't do so again until the next dawn.", "ed": "both"}, {"n": "Amulet of the Planes", "src": "dmg", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": true, "cur": false, "wt": "1 lb", "desc": "While wearing this amulet, you can take a Magic action to name a location that you are familiar with on another plane of existence. Then make a DC 15 Intelligence (Arcana) check. On a successful check, you cast Plane Shift. On a failed check, you and each creature and object within 15 feet of you travel to a random destination determined by rolling 1d100 and consulting the following table.\n\n| 1d100 | Destination |\n| --- | --- |\n| 01-60 | Random location on the plane you named |\n| 61-70 | Random location on an Inner Plane determined by rolling 1d6: on a 1, the Plane of Air; on a 2, the Plane of Earth; on a 3, the Plane of Fire; on a 4, the Plane of Water; on a 5, the Feywild; on a 6, the Shadowfell |\n| 71-80 | Random location on an Outer Plane determined by rolling 1d8: on a 1, Arborea; on a 2, Arcadia; on a 3, the Beastlands; on a 4, Bytopia; on a 5, Elysium; on a 6, Mechanus; on a 7, Mount Celestia; on an 8, Ysgard |\n| 81-90 | Random location on an Outer Plane determined by rolling 1d8: on a 1, the Abyss; on a 2, Acheron; on a 3, Carceri; on a 4, Gehenna; on a 5, Hades; on a 6, Limbo; on a 7, the Nine Hells; on an 8, Pandemonium |\n| 91-00 | Random location on the Astral Plane |", "ed": "both"}, {"n": "Antigravity Belt", "src": "qftis", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "Metal tubes ring the lower edge of this wide belt. It is powered by an energy cell stored in a metal case near the buckle. Placing a full energy cell in the belt gives the belt 10 charges.\n\nActivating the Belt\nAs a bonus action, you can expend any number of the belt's charges to activate it; the belt remains active for 1 minute per charge expended. You can use a bonus action to deactivate the belt early, but doing so doesn't recover any expended charges.\n\nWhen you activate the belt, and as a bonus action while it remains active, you can rise or descend vertically up to 20 feet. You remain floating in place while the property is active, and you can move yourself horizontally by being pushed or towed or by scooting yourself along a surface, such as a wall or ceiling, at half your walking speed. If you are still levitating when the belt deactivates, you fall.\n\nReplacing the Energy Cell\nWhile the belt has charges remaining, its energy cell can't be removed. Once the belt has 0 charges, you can replace the energy cell with a new cell by using an action or a bonus action.", "ed": "both"}, {"n": "Antitoxin", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "As a Bonus Action, you can drink a vial of Antitoxin to gain Advantage on saving throws to avoid or end the Poisoned condition for 1 hour", "ed": "2024"}, {"n": "Antitoxin (vial)", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "A creature that drinks this vial of liquid gains advantage on saving throws against poison for 1 hour. It confers no benefit to undead or constructs.", "ed": "5e"}, {"n": "Apparatus of Kwalish", "src": "dmg", "tp": "wondrous", "rar": "legendary", "rarn": 5, "mag": true, "att": false, "cur": false, "wt": "500 lb", "desc": "This item first appears to be a sealed iron barrel weighing 500 pounds. The barrel has a hidden catch, which can be found with a successful DC 20 Intelligence (Investigation) check. Releasing the catch unlocks a hatch at one end of the barrel, allowing two Medium or smaller creatures to crawl inside. Ten levers are set in a row at the far end, each in a neutral position, able to move up or down. When certain levers are used, the apparatus transforms to resemble a giant lobster.\n\nThe Apparatus of Kwalish is a Large object with the following statistics: AC 20; HP 200; Speed 30 ft., Swim 30 ft. (or 0 ft. for both if the legs aren't extended); Immunity to Poison and Psychic damage.\n\nTo be used as a vehicle, the apparatus requires one pilot. While the apparatus's hatch is closed, the compartment is airtight and watertight. The compartment holds enough air for 10 hours of breathing, divided by the number of breathing creatures inside.\n\nThe apparatus floats on water. It can also go underwater to a depth of 900 feet. Below that, the vehicle takes 2d6 Bludgeoning damage each minute from pressure.\n\nA creature in the compartment can take a Utilize action to move as many as two of the apparatus's levers up or down. After each use, a lever goes back to its neutral position. Each lever, from left to right, functions as shown in the Apparatus of Kwalish Levers table.\n\n| Lever | Up | Down |\n| --- | --- | --- |\n| 1 | Legs extend, allowing the apparatus to walk and swim. | Legs retract, reducing the apparatus's Speed and Swim Speed to 0 and making it unable to benefit from bonuses to speed. |\n| 2 | Forward window shutter opens. | Forward window shutter closes. |\n| 3 | Side window shutters open (two per side). | Side window shutters close (two per side). |\n| 4 | Two claws extend from the front side of the apparatus. | The claws retract. |\n| 5 | Each extended claw makes the following melee attack: +8 to hit, reach 5 ft. Hit: 7 (2d6) Bludgeoning damage. | Each extended claw makes the following melee attack: +8 to hit, reach 5 ft. Hit: The target has the Grappled condition (escape DC 15). |\n| 6 | The apparatus walks or swims forward provided its legs are extended. | The apparatus walks or swims backward provided its legs are extended. |\n| 7 | The apparatus turns 90 degrees counterclockwise provided its legs are extended. | The apparatus turns 90 degrees clockwise provided its legs are extended. |\n| 8 | Eyelike fixtures emit Bright Light in a 30-foot radius and Dim Light for an additional 30 feet. | The light turns off. |\n| 9 | The apparatus sinks up to 20 feet if it's in liquid. | The apparatus rises up to 20 feet if it's in liquid. |\n| 10 | The rear hatch unseals and opens. | The rear hatch closes and seals |", "ed": "both"}, {"n": "Arrow", "src": "phb", "tp": "ammunition", "rar": "common", "rarn": 1, "mag": false, "att": false, "cur": false, "wt": "0.8 lb", "desc": "Arrows are used with a weapon that has the ammunition property to make a ranged attack. Each time you attack with the weapon, you expend one piece of ammunition. Drawing the ammunition from a quiver, case, or other container is part of the attack (you need a free hand to load a one-handed weapon). At the end of the battle, you can recover half your expended ammunition by taking a minute to search the battlefield.\n\nArrows are typically stored in a Quiver (bought separately)", "ed": "both"}, {"n": "Ascendant Dragon Vessel", "src": "ftd", "tp": "wondrous", "rar": "legendary", "rarn": 5, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This vessel can be a potion bottle, drinking horn, or other container meant to hold a liquid.\n\nAs a bonus action, if the vessel is empty, you can speak the command word to fill the vessel with one of the following (your choice): ale, olive oil, mead, wine, whiskey, a potion of healing, a potion of greater healing, a potion of superior healing, a potion of supreme healing, a potion of climbing, a potion of fire breath, a potion of flying, or a potion of dragon's majesty. Once this property is used, it can't be used until the next dawn. A potion you create in this way loses its magical properties if it isn't imbibed within 24 hours.", "ed": "both"}, {"n": "Ascendant Scaled Ornament", "src": "ftd", "tp": "wondrous", "rar": "legendary", "rarn": 5, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This ornament can be jewelry, a cloak, or another wearable accessory. It appears to be fashioned from a dragon's scale, tooth, or claw, or it incorporates images in those shapes.\n\nYou gain a +1 bonus to AC, and you can't be charmed or frightened. Moreover, each creature of your choice within 30 feet of you has advantage on saving throws it makes to avoid being charmed or frightened or to end those conditions on itself.\n\nWhen you would take damage of the type dealt by the breath of the dragon in whose hoard the ornament became Wakened, you can use your reaction to take no damage instead, and you regain hit points equal to the damage you would have taken. Once this property is used, it can't be used again until the next dawn.\n\nWhile you are wearing the ornament, you gain a flying speed equal to your walking speed and can hover. While you are flying using this speed, spectral dragon wings appear on your back.", "ed": "both"}, {"n": "Assassin's Blood", "src": "dmg", "tp": "poison", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "A creature subjected to Assassin's Blood makes a DC 10 Constitution saving throw. On a failed save, the creature takes 6 (1d12) Poison damage and has the Poisoned condition for 24 hours. On a successful save, the creature takes half as much damage only", "ed": "both"}, {"n": "Baba Yaga's Dancing Broom", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": true, "cur": false, "wt": "", "desc": "The archfey Baba Yaga crafted many of these magic brooms. No two appear exactly alike. While holding the broom, you can take a Magic action to transform it into an Animated Broom under your control. The broom then moves into an unoccupied space as close to you as possible. The broom acts immediately after you on your Initiative count and remains animate until you take a Bonus Action and use a command word to render it inanimate.\n\nOn your turn, you can mentally command the animated broom if it is within 30 feet of you and you don't have the Incapacitated condition (no action required). You decide what action the broom takes and where it moves during its next turn, or you can issue it a general command, such as to attack your enemies or guard a location.\n\nIf the broom is reduced to 0 Hit Points, it shatters and is destroyed. If the broom reverts to its inanimate form before losing all its Hit Points it regains all of them", "ed": "2024"}, {"n": "Backpack", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "5 lb", "desc": "A Backpack holds up to 30 pounds within 1 cubic foot. It can also serve as a saddlebag", "ed": "both"}, {"n": "Bag of Beans", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This heavy cloth bag contains 3d4 dry beans when found. The bag weighs half a pound regardless of how many beans it contains and becomes a nonmagical item when it no longer contains any beans.\n\nIf you dump one or more beans out of the bag, they explode in a 10-foot-radius Sphere centered on them. All the dumped beans are destroyed in the explosion, and each creature in the Sphere, including you, makes a DC 15 Dexterity saving throw, taking 5d4 Force damage on a failed save or half as much damage on a successful one.\n\nIf you remove a bean from the bag, plant it in dirt or sand, and then water it, the bean disappears as it produces an effect 1 minute later from the ground where it was planted. The DM can choose an effect from the following table or determine it randomly.\n\n| 1d100 | Effect |\n| --- | --- |\n| 01 | 5d4 toadstools sprout. If a creature eats a toadstool, roll any die. On an odd roll, the eater must succeed on a DC 15 Constitution saving throw or take 5d6 Poison damage and have the Poisoned condition for 1 hour. On an even roll, the eater gains 5d6 Temporary Hit Points for 1 hour. |\n| 02-10 | A geyser erupts and spouts water, beer, mayonnaise, tea, vinegar, wine, or oil (DM's choice) 30 feet into the air for 1d4 minutes. |\n| 11-20 | A Treant sprouts. Roll any die. On an odd roll, the treant is Chaotic Evil. On an even roll, the treant is Chaotic Good. |\n| 21-30 | An animate but immobile stone statue in your likeness rises and makes verbal threats against you. If you leave it and others come near, it describes you as the most heinous of villains and directs the newcomers to find and attack you. If you are on the same plane of existence as the statue, it knows where you are. The statue becomes inanimate after 24 hours. |\n| 31-40 | A campfire with green flames springs forth and burns for 24 hours or until it is extinguished. |\n| 41-50 | Three Shrieker Fungi sprout. |\n| 51-60 | 1d4 + 4 bright-pink toads crawl forth. Whenever a toad is touched, it transforms into a Large or smaller monster of the DM's choice that acts in accordance with its alignment and nature. The monster remains for 1 minute, then disappears in a puff of bright-pink smoke. |\n| 61-70 | A hungry Bulette burrows up and attacks. |\n| 71-80 | A fruit tree grows. It has 1d10 + 20 fruit, 1d8 of which act as randomly determined potions. The tree vanishes after 1 hour. Picked fruit remains, retaining any magic for 30 days. |\n| 81-90 | A nest of 1d4 + 3 rainbow-colored eggs springs up. Any creature that eats an egg makes a DC 20 Constitution saving throw. On a successful save, a creature permanently increases its lowest ability score by 1, randomly choosing among equally low scores. On a failed save, the creature takes 10d6 Force damage from an internal explosion. |\n| 91-95 | A pyramid with a 60-foot-square base bursts upward. Inside is a burial chamber containing a Mummy, a Mummy Lord, or some other Undead of the DM's choice. Its sarcophagus contains treasure of the DM's choice. |\n| 96-00 | A giant beanstalk sprouts, growing to a height of the DM's choice. The top leads where the DM chooses, such as to a great view, a cloud giant's castle, or another plane of existence |", "ed": "both"}, {"n": "Bag of Devouring", "src": "dmg", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This bag resembles a Bag of Holding but is a feeding orifice for a gigantic extradimensional creature. Turning the bag inside out closes the orifice.\n\nThe extradimensional creature attached to the bag can sense whatever is placed inside the bag. Animal or vegetable matter placed wholly in the bag is devoured and lost forever. When part of a living creature is placed in the bag, as happens when someone reaches inside it, there is a 50 percent chance that the creature is pulled inside the bag. A creature inside the bag can take an action to try to escape, doing so with a successful DC 15 Strength (Athletics) check. Another creature can take an action to reach into the bag to pull a creature out, doing so with a successful DC 20 Strength (Athletics) check, provided the puller isn't pulled inside the bag first. Any creature that starts its turn inside the bag is devoured, its body destroyed.\n\nInanimate objects can be stored in the bag, which can hold a cubic foot of such material. However, once each day, the bag swallows any objects inside it and spits them out into another plane of existence. The DM determines the time and plane.\n\nIf the bag is pierced or torn, it is destroyed, and anything contained within it is transported to a random location on the Astral Plane", "ed": "both"}, {"n": "Bag of Holding", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "5 lb", "desc": "This bag has an interior space considerably larger than its outside dimensions—roughly 2 feet square and 4 feet deep on the inside. The bag can hold up to 500 pounds, not exceeding a volume of 64 cubic feet. The bag weighs 5 pounds, regardless of its contents. Retrieving an item from the bag requires a Utilize action.\n\nIf the bag is overloaded, pierced, or torn, it is destroyed, and its contents are scattered in the Astral Plane. If the bag is turned inside out, its contents spill forth unharmed, but the bag must be put right before it can be used again. The bag holds enough air for 10 minutes of breathing, divided by the number of breathing creatures inside.\n\nPlacing a Bag of Holding inside an extradimensional space created by a Heward's Handy Haversack, Portable Hole, or similar item instantly destroys both items and opens a gate to the Astral Plane. The gate originates where the one item was placed inside the other. Any creature within a 10-foot-radius Sphere centered on the gate is sucked through it to a random location on the Astral Plane. The gate then closes. The gate is one-way and can't be reopened", "ed": "both"}, {"n": "Bag of Tricks, Gray", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This bag made from gray cloth appears empty. Reaching inside the bag, however, reveals the presence of a small, fuzzy object.\n\nYou can take a Magic action to pull the fuzzy object from the bag and throw it up to 20 feet. When the object lands, it transforms into a creature you determine by rolling on the table below. See the Monster Manual for the creature's stat block. The creature vanishes at the next dawn or when it is reduced to 0 Hit Points.\n\nThe creature is Friendly to you and your allies, and it acts immediately after you on your Initiative count. You can take a Bonus Action to command how the creature moves and what action it takes on its next turn, such as attacking an enemy. In the absence of such orders, the creature acts in a fashion appropriate to its nature.\n\nOnce three fuzzy objects have been pulled from the bag, the bag can't be used again until the next dawn.\n\n| 1d8 | Creature |\n| --- | --- |\n| 1 | Weasel |\n| 2 | Giant Rat |\n| 3 | Badger |\n| 4 | Boar |\n| 5 | Panther |\n| 6 | Giant Badger |\n| 7 | Dire Wolf |\n| 8 | Giant Elk |", "ed": "both"}, {"n": "Bag of Tricks, Rust", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This bag made from rust cloth appears empty. Reaching inside the bag, however, reveals the presence of a small, fuzzy object.\n\nYou can take a Magic action to pull the fuzzy object from the bag and throw it up to 20 feet. When the object lands, it transforms into a creature you determine by rolling on the table below. See the Monster Manual for the creature's stat block. The creature vanishes at the next dawn or when it is reduced to 0 Hit Points.\n\nThe creature is Friendly to you and your allies, and it acts immediately after you on your Initiative count. You can take a Bonus Action to command how the creature moves and what action it takes on its next turn, such as attacking an enemy. In the absence of such orders, the creature acts in a fashion appropriate to its nature.\n\nOnce three fuzzy objects have been pulled from the bag, the bag can't be used again until the next dawn.\n\n| 1d8 | Creature |\n| --- | --- |\n| 1 | Rat |\n| 2 | Owl |\n| 3 | Mastiff |\n| 4 | Goat |\n| 5 | Giant Goat |\n| 6 | Giant Boar |\n| 7 | Lion |\n| 8 | Brown Bear |", "ed": "both"}, {"n": "Bag of Tricks, Tan", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This bag made from tan cloth appears empty. Reaching inside the bag, however, reveals the presence of a small, fuzzy object.\n\nYou can take a Magic action to pull the fuzzy object from the bag and throw it up to 20 feet. When the object lands, it transforms into a creature you determine by rolling on the table below. See the Monster Manual for the creature's stat block. The creature vanishes at the next dawn or when it is reduced to 0 Hit Points.\n\nThe creature is Friendly to you and your allies, and it acts immediately after you on your Initiative count. You can take a Bonus Action to command how the creature moves and what action it takes on its next turn, such as attacking an enemy. In the absence of such orders, the creature acts in a fashion appropriate to its nature.\n\nOnce three fuzzy objects have been pulled from the bag, the bag can't be used again until the next dawn.\n\n| 1d8 | Creature |\n| --- | --- |\n| 1 | Jackal |\n| 2 | Ape |\n| 3 | Baboon |\n| 4 | Axe Beak |\n| 5 | Black Bear |\n| 6 | Giant Weasel |\n| 7 | Giant Hyena |\n| 8 | Tiger |", "ed": "both"}, {"n": "Bagpipes", "src": "phb", "tp": "instrument", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "6 lb", "desc": "Ability: Charisma\n\nUtilize: Play a known tune (DC 10), or improvise a song (DC 15)\n\nIf you have proficiency with a tool, add your Proficiency Bonus to any ability check you make that uses the tool. If you have proficiency in a skill that's used with that check, you have Advantage on the check too", "ed": "both"}, {"n": "Baleful Talon", "src": "bmt", "tp": "weapon", "rar": "very_rare", "rarn": 99, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "You gain a +1 bonus to attack and damage rolls made with this hooked, obsidian dagger.\n\nWhen you hit a creature with this magic weapon and roll a 19 or 20 on the attack roll, the creature must make a DC 15 Constitution saving throw as the dagger flares with sickly light. The creature takes 6d6 necrotic damage on a failed save, or half as much on a successful one. If this damage reduces the creature to 0 hit points, the creature disintegrates into dust.", "ed": "both"}, {"n": "Ball Bearing", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "0.002 lb", "desc": "Most commonly found inside a Ball Bearings (Bag of 1,000).", "ed": "5e"}, {"n": "Ball Bearings", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "2 lb", "desc": "As a Utilize action, you can spill Ball Bearings from their pouch. They spread to cover a level, 10-foot-square area within 10 feet of yourself. A creature that enters this area for the first time on a turn must succeed on a DC 10 Dexterity saving throw or have the Prone condition. It takes 10 minutes to recover the Ball Bearings", "ed": "2024"}, {"n": "Ball Bearings (bag of 1,000)", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "2 lb", "desc": "As an action, you can spill these tiny metal balls from their pouch to cover a level area 10 feet square. A creature moving across the covered area must succeed on a DC 10 Dexterity saving throw or fall prone. A creature moving through the area at half speed doesn't need to make the saving throw.", "ed": "5e"}, {"n": "Barrel", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "70 lb", "desc": "A Barrel holds up to 40 gallons of liquid or up to 4 cubic feet of dry goods", "ed": "both"}, {"n": "Basic Fishing Equipment", "src": "aag", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "Basic Fishing Equipment includes a pole, a line, a hook, and either a lure or some bait.\n\nFishing is a popular pastime in Wildspace and the Astral Sea, though this activity isn't possible aboard a ship that is moving faster than its flying speed. At the end of each hour spent fishing, a character can make a DC 15 Wisdom (Survival) check. A failed check indicates no fish is caught during that hour. On a successful check, roll a d10 and consult the Fishing table to determine the catch.\n\n| d10 | Catch |\n| --- | --- |\n| 1–2 | Tiny, inedible fish (a creature that consumes it is poisoned for 1 hour) |\n| 3–5 | Tiny, edible fish (feeds one person) |\n| 6–8 | Small, edible fish (feeds up to four people) |\n| 9 | Hostile space eel (feeds up to twelve people) |\n| 10 | Hostile gray scavver (feeds up to twenty people), some other creature of the DM's choosing, or an Tiny object of the DM's choosing |", "ed": "both"}, {"n": "Basic Poison", "src": "phb", "tp": "poison", "rar": "", "rarn": 99, "mag": false, "att": false, "cur": false, "wt": "", "desc": "As a Bonus Action, you can use a vial of Basic Poison to coat one weapon or up to three pieces of ammunition. A creature that takes Piercing or Slashing damage from the poisoned weapon or ammunition takes an extra 1d4 Poison damage. Once applied, the poison retains potency for 1 minute or until its damage is dealt, whichever comes first", "ed": "2024"}, {"n": "Basic Poison (vial)", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "You can use the poison in this vial to coat one slashing or piercing weapon or up to three pieces of ammunition. Applying the poison takes an action. A creature hit by the poisoned weapon or ammunition must make a DC 10 Constitution saving throw or take 1d4 poison damage. Once applied, the poison retains potency for 1 minute before drying.", "ed": "both"}, {"n": "Basket", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "2 lb", "desc": "A Basket holds up to 40 pounds within 2 cubic feet", "ed": "both"}, {"n": "Bead of Force", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This small black sphere measures 3/4 of an inch in diameter and weighs an ounce. Typically, 1d4 + 4 Beads of Force are found together.\n\nYou can take a Magic action to throw the bead up to 60 feet. The bead explodes in a 10-foot-radius Sphere on impact and is destroyed. Each creature in the Sphere must succeed on a DC 15 Dexterity saving throw or take 5d4 Force damage. A sphere of transparent force then encloses the area for 1 minute. Any creature that failed the save and is completely within the area is trapped inside this sphere. Creatures that succeeded on the save or are partially within the area are pushed away from the center of the sphere until they are no longer inside it. Only breathable air can pass through the sphere's wall. No attack or other effect can pass through.\n\nAn enclosed creature can take a Utilize action to push against the sphere's wall, moving the sphere up to half the creature's Speed. The sphere can be picked up, and its magic causes it to weigh only 1 pound, regardless of the weight of creatures inside", "ed": "both"}, {"n": "Bead of Nourishment", "src": "dmg", "tp": "wondrous", "rar": "common", "rarn": 1, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This flavorless, gelatinous bead dissolves on your tongue and provides as much nourishment as 1 day of Rations", "ed": "2024"}, {"n": "Bead of Refreshment", "src": "dmg", "tp": "wondrous", "rar": "common", "rarn": 1, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This flavorless, gelatinous bead dissolves in liquid, transforming up to a pint of the liquid into fresh, cold drinking water. The bead has no effect on magical liquids or harmful substances such as poison", "ed": "2024"}, {"n": "Bedroll", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "7 lb", "desc": "A Bedroll sleeps one Small or Medium creature. While in a Bedroll, you automatically succeed on saving throws against extreme cold", "ed": "both"}, {"n": "Bell", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "When rung as a Utilize action, a Bell produces a sound that can be heard up to 60 feet away", "ed": "both"}, {"n": "Belt of Cloud Giant Strength", "src": "dmg", "tp": "wondrous", "rar": "legendary", "rarn": 5, "mag": true, "att": true, "cur": false, "wt": "", "desc": "While wearing this belt, your Strength score changes to 27. The item has no effect on you if your Strength without the belt is equal to or greater than the belt's score", "ed": "both"}, {"n": "Belt of Dwarvenkind", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "", "desc": "While wearing this belt, you gain the following benefits:\n\nDwarvish. You know Dwarvish.\n\nFriend of Dwarvenkind. You have Advantage on Charisma (Persuasion) checks made to interact with dwarves and duergar.\n\nToughness. Your Constitution increases by 2, to a maximum of 20.\nIn addition, while attuned to the belt, you have a 50 percent chance each day at dawn of growing a full beard if you can grow one, or a thicker beard if you already have one.\nIf you aren't a dwarf or duergar, you gain the following additional benefits while wearing the belt:\n\nDarkvision. You have Darkvision with a range of 60 feet.\n\nResilience. You have Resistance to Poison damage. You also have Advantage on saving throws you make to avoid or end the Poisoned condition", "ed": "both"}, {"n": "Belt of Fire Giant Strength", "src": "dmg", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": true, "cur": false, "wt": "", "desc": "While wearing this belt, your Strength score changes to 25. The item has no effect on you if your Strength without the belt is equal to or greater than the belt's score.", "ed": "both"}, {"n": "Belt of Frost Giant Strength", "src": "dmg", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": true, "cur": false, "wt": "", "desc": "While wearing this belt, your Strength score changes to 23. The item has no effect on you if your Strength without the belt is equal to or greater than the belt's score.", "ed": "both"}, {"n": "Belt of Hill Giant Strength", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "", "desc": "While wearing this belt, your Strength score changes to 21. The item has no effect on you if your Strength without the belt is equal to or greater than the belt's score.", "ed": "both"}, {"n": "Belt of Stone Giant Strength", "src": "dmg", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": true, "cur": false, "wt": "", "desc": "While wearing this belt, your Strength score changes to 23. The item has no effect on you if your Strength without the belt is equal to or greater than the belt's score.", "ed": "both"}, {"n": "Belt of Storm Giant Strength", "src": "dmg", "tp": "wondrous", "rar": "legendary", "rarn": 5, "mag": true, "att": true, "cur": false, "wt": "", "desc": "While wearing this belt, your Strength score changes to 29. The item has no effect on you if your Strength without the belt is equal to or greater than the belt's score.", "ed": "both"}, {"n": "Bigby's Beneficent Bracelet", "src": "bgg", "tp": "wondrous", "rar": "artifact", "rarn": 6, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This gorgeous jewelry piece, crafted by the wizard Bigby himself, consists of four gold rings attached via delicate chains to a wrist cuff studded with sapphires and diamonds.\n\nRandom Properties\nThe bracelet has the following random properties, determined by rolling on the appropriate table:\n\n- 1 minor beneficial property\n- 1 major beneficial property\n- 1 minor detrimental property\n\nDexterous Fingers\nWhile wearing the bracelet, you can cast mage hand.\n\nForce Sculpture\nBy focusing and channeling the bracelet's magic for 1 minute, you can create a spectral copy of a Large or smaller nonmagical object. The copy appears in an unoccupied space within 10 feet of you, and it is made of tangible but translucent force that mimics the size, weight, and other properties of the object it's copying. The copy must appear on a surface or liquid that can support it. Creatures can touch and interact with the copy as if it were a nonmagical object.\n\nThe copy is immune to all damage and can't be dispelled, but a disintegrate spell destroys it immediately. Otherwise, the copy disappears after 8 hours or when you dismiss it as an action.\n\nThe bracelet can create up to three copies and regains all expended uses at dawn.\n\nHelpful Hand\nAs an action, you can use the bracelet to cast Bigby's hand as a 9th-level spell (spell attack bonus +13). When you cast the spell this way, the spell doesn't require concentration. Once this property is used, it can't be used again until the next dawn.", "ed": "both"}, {"n": "Bit and bridle", "src": "phb", "tp": "tack_and_harness", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "", "ed": "both"}, {"n": "Blanket", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "3 lb", "desc": "While wrapped in a blanket, you have Advantage on saving throws against extreme cold", "ed": "both"}, {"n": "Blasted Goggles", "src": "bmt", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": true, "cur": false, "wt": "", "desc": "These tinker's goggles have 3 charges. As an action, you can expend 1 charge to shoot a beam of fiery light from the goggles at a creature you can see within 120 feet of yourself. The target must succeed on a DC 15 Dexterity saving throw or take 3d6 fire damage. The goggles regain 1d3 expended charges daily at dawn.\n\nCursed\nThe goggles are cursed, and becoming attuned to them extends the curse to you. You can't remove the goggles or end your attunement to them until you are targeted by a Remove Curse spell or similar magic.\n\nWhenever you use the goggles' fiery beam and the target rolls a 20 on the d20 for the saving throw, the goggles expose you to a flash of violent bright light. As a result, you have the blinded condition for 24 hours.", "ed": "both"}, {"n": "Block and Tackle", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "5 lb", "desc": "A Block and Tackle allows you to hoist up to four times the weight you can normally lift", "ed": "both"}, {"n": "Blood Fury Tattoo", "src": "tce", "tp": "wondrous", "rar": "legendary", "rarn": 5, "mag": true, "att": true, "cur": false, "wt": "", "desc": "Produced by a special needle, this magic tattoo evokes fury in its form and colors.\n\nTattoo Attunement: To attune to this item, you hold the needle to your skin where you want the tattoo to appear, pressing the needle there throughout the attunement process. When the attunement is complete, the needle turns into the ink that becomes the tattoo, which appears on the skin.\n\nIf your attunement to the tattoo ends, the tattoo vanishes, and the needle reappears in your space.\n\nBloodthirsty Strikes: The tattoo has 10 charges, and it regains all expended charges daily at dawn. While this tattoo is on your skin, you gain the following benefits:\n\n- When you hit a creature with a weapon attack, you can expend a charge to deal an extra 4d6 necrotic damage to the target, and you regain a number of hit points equal to the necrotic damage dealt.\n\n- When a creature you can see damages you, you can expend a charge and use your reaction to make a melee attack against that creature, with advantage on your attack roll.", "ed": "both"}, {"n": "Bloodrage Greataxe", "src": "bmt", "tp": "weapon", "rar": "uncommon", "rarn": 2, "mag": false, "att": false, "cur": false, "wt": "7 lb", "desc": "You gain a +2 bonus to attack and damage rolls made with this magic greataxe while you have half your hit points or fewer.", "ed": "both"}, {"n": "Blowgun Needle", "src": "", "tp": "ammunition", "rar": "common", "rarn": 1, "mag": false, "att": false, "cur": false, "wt": "0.32 lb", "desc": "", "ed": "5e"}, {"n": "Bobbing Lily Pad", "src": "wbtw", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": true, "cur": false, "wt": "20 lb", "desc": "This magic vehicle is a 10-foot-diameter leaf that floats on water. It has tendrils that propel it across land and across the water's surface (but not underwater), as well as through the air. It has a walking, flying, and swimming speed of 20 feet, and it can hover. It moves according to your spoken directions while you are riding it.\n\nThe lily pad can transport up to 300 pounds without hindrance. It can carry up to twice this weight, but it moves at half speed if it carries more than its normal capacity.", "ed": "both"}, {"n": "Bolt", "src": "phb", "tp": "ammunition", "rar": "common", "rarn": 1, "mag": false, "att": false, "cur": false, "wt": "1.2 lb", "desc": "Crossbow bolts are used with a weapon that has the ammunition property to make a ranged attack. Each time you attack with the weapon, you expend one piece of ammunition. Drawing the ammunition from a quiver, case, or other container is part of the attack (you need a free hand to load a one-handed weapon). At the end of the battle, you can recover half your expended ammunition by taking a minute to search the battlefield.\n\nBolts are typically stored in a Crossbow Bolt Case (bought separately)", "ed": "2024"}, {"n": "Bomb", "src": "dmg", "tp": "explosive", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "As an action, you can light a Bomb and throw it at a point up to 60 feet away, where it explodes. Each creature in a 5-foot-radius Sphere centered on that point makes a DC 12 Dexterity saving throw, taking 3d6 Fire damage on a failed save or half as much damage on a successful one", "ed": "both"}, {"n": "Bombard", "src": "aag", "tp": "vehicle_space", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "Bombards are built by giff. The major feature of each ship is an enormous cannon that fires massive cannon balls capable of blowing other ships to smithereens. (The cannon is included in the cost of the ship.) A bombard can carry up to fourteen giant cannon balls, each of which weighs 10 tons. These cannon balls make up most of the weight of the ship's cargo. A winch mounted on the aft deck is used to load the cannon balls on board.\n\nA bombard can float and sail on water, but it can't land safely on the ground (its keel would cause it to roll on its side).", "ed": "both"}, {"n": "Book", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "5 lb", "desc": "A Book contains fiction or nonfiction. If you consult an accurate nonfiction Book about its topic, you gain a +5 bonus to Intelligence (Arcana, History, Nature, or Religion) checks you make about that topic", "ed": "both"}, {"n": "Book of Exalted Deeds", "src": "dmg", "tp": "wondrous", "rar": "artifact", "rarn": 6, "mag": true, "att": true, "cur": false, "wt": "5 lb", "desc": "The definitive treatise on all that is good in the multiverse, the Book of Exalted Deeds figures prominently in many religions. Rather than being a scripture devoted to a particular faith, the book's authors filled the pages with their own visions of true virtue, providing guidance for defeating evil.\n\nThe Book of Exalted Deeds rarely lingers in one place. As soon as the book is read, it vanishes to some other corner of the multiverse where its moral guidance can bring hope to an endangered world. Although attempts have been made to copy the work, efforts to do so fail to capture its magical nature or translate the benefits it offers to those pure of heart and firm of purpose.\n\nA heavy clasp, wrought to look like angel wings, keeps the book's contents secure. Only a creature that is attuned to the book can release the clasp that holds it shut. Once the book is opened, the attuned creature must spend 80 hours reading and studying the book to digest its contents and gain its benefits.\n\nOther creatures that peruse the book's open pages can read the text but glean no deeper meaning and reap no benefits. A Fiend, an Undead, or a servant of a god from the Lower Planes that tries to read from the book takes 24d6 Radiant damage. This damage ignores Resistance and Immunity, and it can't be reduced or avoided by any means. A creature reduced to 0 Hit Points by this damage disappears in a flash and is destroyed, leaving its possessions behind. The book then vanishes, and the creature's Attunement to it ends.\n\nBenefits granted by the Book of Exalted Deeds last only as long as you strive to do good. If you fail to perform at least one act of kindness or generosity within the span of 10 days, or if you willingly perform an evil act, you lose all the benefits granted by the book.\n\nCelestial Calm. While attuned to the book, you have Immunity to the Charmed and Frightened conditions and Resistance to Psychic damage. These benefits become permanent after you spend the requisite amount of time reading and studying the book.\n\nDivine Wisdom. After you spend the requisite amount of time reading and studying the book, your Wisdom increases by 2, to a maximum of 24. You can't gain this benefit from the book more than once.\n\nEnlightened Magic. After you spend the requisite amount of time reading and studying the book, any spell slot you expend to cast a spell counts as a spell slot of one level higher.\n\nHalo. After you spend the requisite amount of time reading and studying the book, you gain a protective halo. This halo sheds Bright Light in a 10-foot radius and Dim Light for an additional 10 feet. You can dismiss or manifest the halo as a Bonus Action. While present, the halo gives you Advantage on Charisma (Persuasion) checks. In addition, Fiends and Undead within the halo's Bright Light make attack rolls against you with Disadvantage.\n\nRandom Properties. The Book of Exalted Deeds has the following random properties:\n\n- 2 minor beneficial properties\n= 2 major beneficial properties\n\nDestroying the Book. The Book of Exalted Deeds can't be destroyed. However, drowning the book in the River Styx removes all writing and imagery from its pages and renders the book powerless for 1d100 years", "ed": "both"}, {"n": "Book of Vile Darkness", "src": "dmg", "tp": "wondrous", "rar": "artifact", "rarn": 6, "mag": true, "att": true, "cur": false, "wt": "5 lb", "desc": "The contents of this foul manuscript are the meat and drink of the wicked. It contains knowledge so horrid that to even glimpse the scrawled pages invites doom.\n\nMost believe the lich-god Vecna authored the Book of Vile Darkness. He recorded in its pages every horrid idea, every corrupt thought, and every example of foul magic he came across or devised.\n\nOther practitioners of evil have added their own input to the book's catalog of vile knowledge. Their additions are clear, for the writers of later works stitched whatever they were writing into the tome or, in some cases, made notations and additions to existing text. There are places where pages are missing, torn, or covered so completely with ink, blood, and scratches that the original text can't be divined.\n\nNature can't abide the book's presence. Ordinary plants wither in its presence, common animals are unwilling to approach it, and the book gradually destroys whatever it touches. Even stone cracks and turns to powder if the book rests on it long enough.\n\nWhenever a creature that isn't a Fiend or an Undead attunes to the Book of Vile Darkness, that creature makes a DC 17 Charisma saving throw. On a failed save, the creature is magically transformed into a Larva under the DM's control. Only a Wish spell can reverse this vile transformation.\n\nA creature attuned to the book must spend 80 hours reading and studying it to digest its contents and use its Adjusted Ability Scores, Tireless Form, Spells, Vile Lore, and Vile Speech properties.\n\nThe Book of Vile Darkness remains with you only as long as you strive to work evil in the world. If you fail to perform at least one evil act within the span of 10 days, or if you willingly perform a good act, the book disappears, your Attunement to it ends immediately, and you lose all benefits granted by it. If you die while attuned to the book, an entity of great evil claims your soul. You can't be restored to life by any means while your soul remains imprisoned.\n\nAdjusted Ability Scores. One ability score of your choice increases by 2, to a maximum of 24. Another ability score of your choice decreases by 2, to a minimum of 3. The book can't adjust your ability scores again.\n\nTireless Form. While the book is on your person, you have Immunity to the Exhaustion condition.\n\nRandom Properties. The Book of Vile Darkness has the following random properties:\n\n- 3 minor beneficial properties\n- 1 major beneficial property\n- 3 minor detrimental properties\n- 2 major detrimental properties\n\nSpells. While holding the book and holding it, you can cast the following spells (save DC 18) from it:\n\n- Animate Dead\n- Circle of Death\n- Dominate Monster\n- Finger of Death\n\nOnce you use the book to cast a spell, you can't cast that spell again from it until the next dawn.\n\nVile Lore. You can reference the Book of Vile Darkness whenever you make an Intelligence check to recall information about some aspect of evil, such as lore about demons. When you do so, you have Advantage on that check.\n\nAt the DM's discretion, the book might reveal secrets no mortal should know, such as the true names of powerful Fiends, foul rites that allow one to transform into a death knight or lich, or long-lost spells crafted by beings so evil their names ought never to be spoken aloud.\n\nVile Speech. While the book is on your person, you can take a Magic action to recite words from its pages in a foul, dead language. Each time you do so, you take 1d12 Psychic damage, and each creature within 15 feet of you takes 3d6 Psychic damage unless the creature is a Fiend or an Undead.\n\nDestroying the Book. The Book of Vile Darkness allows pages to be torn from it, but any evil lore contained on those pages finds its way back into the book eventually, usually when a new author adds pages to the tome.\n\nIf a solar tears the book in two, the book is destroyed for 1d100 years, after which it re-forms in some far corner of the multiverse.\n\nA creature attuned to the book for 100 years can unearth a phrase hidden in the original text that, when translated to Celestial and spoken aloud, destroys both the speaker and the book in a flash of radiance. However, as long as evil exists in the multiverse, the book re-forms 1d10 × 100 years later", "ed": "both"}, {"n": "Boots of Elvenkind", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "", "desc": "While you wear these boots, your steps make no sound, regardless of the surface you are moving across. You also have Advantage on Dexterity (Stealth) checks", "ed": "both"}, {"n": "Boots of False Tracks", "src": "dmg", "tp": "wondrous", "rar": "common", "rarn": 1, "mag": true, "att": false, "cur": false, "wt": "", "desc": "While wearing these boots, you can have them leave tracks like those of any kind of Humanoid of your size", "ed": "2024"}, {"n": "Boots of Levitation", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "", "desc": "While you wear these boots, you can cast Levitate on yourself", "ed": "both"}, {"n": "Boots of Speed", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "", "desc": "While you wear these boots, you can take a Bonus Action to click the boots' heels together. If you do, the boots double your Speed, and any creature that makes an Opportunity Attack against you has Disadvantage on the attack roll. If you click your heels together again, you end the effect.\n\nWhen you've used the boots' property for a total of 10 minutes, the magic ceases to function for you until you finish a Long Rest", "ed": "both"}, {"n": "Boots of Striding and Springing", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": true, "cur": false, "wt": "", "desc": "While you wear these boots, your Speed becomes 30 feet unless your Speed is higher, and your Speed isn't reduced by you carrying weight in excess of your carrying capacity or wearing Heavy Armor.\n\nOnce on each of your turns, you can jump up to 30 feet by spending only 10 feet of movement", "ed": "both"}, {"n": "Boots of the Winterlands", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": true, "cur": false, "wt": "", "desc": "These furred boots are snug and feel warm. While wearing them, you gain the following benefits.\n\nCold Resistance. You have Resistance to Cold damage and can tolerate temperatures of 0 degrees Fahrenheit or lower without any additional protection.\n\nWinter Strider. You ignore Difficult Terrain created by ice or snow", "ed": "both"}, {"n": "Bottle of Boundless Coffee", "src": "scc", "tp": "wondrous", "rar": "common", "rarn": 1, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This metal bottle carries delicious, warm coffee. The bottle comes with a stopper, which is attached to the bottle by a little chain. Even when open, the bottle won't accept any liquid other than the coffee it produces. The coffee inside is always comfortably warm, and none of the heat can be felt through the bottle.\n\nEach time you drink the coffee, roll a d20. On a 1, the bottle refuses to dispense coffee for the next hour. If you pour coffee from the bottle, rather than drinking from it, the coffee vanishes the moment it leaves the bottle.", "ed": "both"}, {"n": "Bowl of Commanding Water Elementals", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": false, "cur": false, "wt": "24 lb", "desc": "While this bowl is filled with water and you are within 5 feet of it, you can take a Magic action to summon a Water Elemental. The elemental appears in an unoccupied space as close to the bowl as possible, understands your languages, obeys your commands, and takes its turn immediately after you on your Initiative count. The elemental disappears after 1 hour, when it dies, or when you dismiss it as a Bonus Action. The bowl can't be used this way again until the next dawn.\n\nThe bowl is about 1 foot in diameter and half as deep. It holds about 3 gallons", "ed": "both"}, {"n": "Bracers of Archery", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": true, "cur": false, "wt": "", "desc": "While wearing these bracers, you have proficiency with the Longbow and Shortbow, and you gain a +2 bonus to damage rolls made with such weapons", "ed": "both"}, {"n": "Bracers of Defense", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "", "desc": "While wearing these bracers, you gain a +2 bonus to Armor Class if you are wearing no armor and using no Shield", "ed": "both"}, {"n": "Brazier of Commanding Fire Elementals", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": false, "cur": false, "wt": "", "desc": "While you are within 5 feet of this brazier, you can take a Magic action to summon a Fire Elemental. The elemental appears in an unoccupied space as close to the brazier as possible, understands your languages, obeys your commands, and takes its turn immediately after you on your Initiative count. The elemental disappears after 1 hour, when it dies, or when you dismiss it as a Bonus Action. The brazier can't be used this way again until the next dawn", "ed": "both"}, {"n": "Bread (loaf)", "src": "phb", "tp": "food_and_drink", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "", "ed": "2024"}, {"n": "Breathing Bubble", "src": "egw", "tp": "wondrous", "rar": "common", "rarn": 1, "mag": true, "att": false, "cur": false, "wt": "1 lb", "desc": "This translucent, bubble-like sphere has a slightly tacky outer surface, and you gain the item's benefits only while wearing it over your head like a helmet.\n\nThe bubble contains 1 hour of breathable air. The bubble regains all its expended air daily at dawn.", "ed": "both"}, {"n": "Brewer's Supplies", "src": "phb", "tp": "artisans_tools", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "9 lb", "desc": "Ability: Intelligence\n\nUtilize: Detect poisoned drink (DC 15), or identify alcohol (DC 10)\n\nCraft: Antitoxin\n\nArtisan's Tools are each focused on crafting items and pursuing a trade. Each type of Artisan's Tools tools requires a separate proficiency.\n\nIf you have proficiency with a tool, add your Proficiency Bonus to any ability check you make that uses the tool. If you have proficiency in a skill that's used with that check, you have Advantage on the check too", "ed": "both"}, {"n": "Brooch of Living Essence", "src": "egw", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": true, "cur": false, "wt": "1 lb", "desc": "While wearing this nondescript brooch, spells and anything else that would detect or reveal your creature type treat you as humanoid, and those that would reveal your alignment treat it as neutral.", "ed": "both"}, {"n": "Brooch of Shielding", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": true, "cur": false, "wt": "", "desc": "While wearing this brooch, you have Resistance to Force damage, and you have Immunity to damage from the Magic Missile spell", "ed": "both"}, {"n": "Broom of Flying", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This wooden broom functions like a mundane broom until you stand astride it and take a Magic action to make it hover beneath you, at which time it can be ridden in the air. It has a Fly Speed of 50 feet. It can carry up to 400 pounds, but its Fly Speed becomes 30 feet while carrying over 200 pounds. The broom stops hovering when you land or when you're no longer riding it.\n\nAs a Magic action, you can send the broom to travel alone to a destination within 1 mile of you if you name the location and are familiar with it. The broom comes back to you when you take a Magic action and use a command word if the broom is still within 1 mile of you", "ed": "both"}, {"n": "Bucket", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "2 lb", "desc": "A Bucket holds up to half a cubic foot of contents", "ed": "both"}, {"n": "Bullseye Lantern", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "2 lb", "desc": "A Bullseye Lantern burns Oil as fuel to cast Bright Light in a 60-foot Cone and Dim Light for an additional 60 feet", "ed": "both"}, {"n": "Burglar's Pack", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "A Burglar's Pack contains the following items: Backpack, Ball Bearings, Bell, 10 Candles, Crowbar, Hooded Lantern, 7 flasks of Oil, 5 days of Rations, Rope, Tinderbox, and Waterskin", "ed": "both"}, {"n": "Burnt Othur Fumes", "src": "dmg", "tp": "poison", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "A creature subjected to Burnt Othur Fumes must succeed on a DC 13 Constitution saving throw or take 10 (3d6) Poison damage, and it must repeat the save at the start of each of its turns. On each successive failed save, the creature takes 3 (1d6) Poison damage. After three successful saves, the poison ends", "ed": "both"}, {"n": "Butcher's Bib", "src": "egw", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This black leather apron is perpetually covered by blood, even after being washed off. You gain the following benefits while wearing the apron:\n\n- Once per turn when you roll damage for a melee attack with a weapon, you can reroll the weapon's damage dice. If you do so, you must use the second total.\n\n- Your weapon attacks that deal slashing damage score a critical hit on a roll of 19 or 20 on the d20.", "ed": "both"}, {"n": "Calligrapher's Supplies", "src": "phb", "tp": "artisans_tools", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "5 lb", "desc": "Ability: Dexterity\n\nUtilize: Write text with impressive flourishes that guard against forgery (DC 15)\n\nCraft: Ink, Spell Scroll\n\nArtisan's Tools are each focused on crafting items and pursuing a trade. Each type of Artisan's Tools tools requires a separate proficiency.\n\nIf you have proficiency with a tool, add your Proficiency Bonus to any ability check you make that uses the tool. If you have proficiency in a skill that's used with that check, you have Advantage on the check too", "ed": "both"}, {"n": "Caltrop", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "0.1 lb", "desc": "As an action, you can spread a single bag of caltrops to cover a 5-foot-square area. Any creature that enters the area must succeed on a DC 15 Dexterity saving throw or stop moving and take 1 piercing damage. Until the creature regains at least 1 hit point, its walking speed is reduced by 10 feet. A creature moving through the area at half speed doesn't need to make the saving throw.", "ed": "5e"}, {"n": "Caltrops", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "2 lb", "desc": "As a Utilize action, you can spread Caltrops from their bag to cover a 5-foot-square area within 5 feet of yourself. A creature that enters this area for the first time on a turn must succeed on a DC 15 Dexterity saving throw or take 1 Piercing damage and have its Speed reduced to 0 until the start of its next turn. It takes 10 minutes to recover the Caltrops", "ed": "2024"}, {"n": "Caltrops (bag of 20)", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "2 lb", "desc": "As an action, you can spread a single bag of caltrops to cover a 5-foot-square area. Any creature that enters the area must succeed on a DC 15 Dexterity saving throw or stop moving and take 1 piercing damage. Until the creature regains at least 1 hit point, its walking speed is reduced by 10 feet. A creature moving through the area at half speed doesn't need to make the saving throw.", "ed": "5e"}, {"n": "Camel", "src": "phb", "tp": "mount", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "Speed: 50, Carrying Capacity: 450 lb", "ed": "both"}, {"n": "Candle", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "For 1 hour, a lit Candle sheds Bright Light in a 5-foot radius and Dim Light for an additional 5 feet", "ed": "both"}, {"n": "Candle of Invocation", "src": "dmg", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This candle's magic is activated when the candle is lit, which requires a Magic action. After burning for 4 hours, the candle is destroyed. You can snuff it out early for use at a later time. Deduct the time it burned in increments of 1 minute from its total burn time.\n\nWhile lit, the candle sheds Dim Light in a 30-foot radius. While you are within that light, you have Advantage on D20 Tests. In addition, a Cleric or Druid in the light can cast level 1 spells they have prepared without expending spell slots.\n\nAlternatively, when you light the candle for the first time, you can cast Gate with it. Doing so destroys the candle. The portal created by the spell links to a particular Outer Plane chosen by the DM or determined by rolling on the following table.\n\n| 1d100 | Outer Plane |\n| --- | --- |\n| 01-05 | Abyss |\n| 06-10 | Acheron |\n| 11-17 | Arborea |\n| 18-25 | Arcadia |\n| 26-33 | Beastlands |\n| 34-41 | Bytopia |\n| 42-46 | Carceri |\n| 47-54 | Elysium |\n| 55-59 | Gehenna |\n| 60-64 | Hades |\n| 65-69 | Limbo |\n| 70-77 | Mechanus |\n| 78-85 | Mount Celestia |\n| 86-90 | Nine Hells |\n| 91-95 | Pandemonium |\n| 96-00 | Ysgard |", "ed": "both"}, {"n": "Candle of the Deep", "src": "dmg", "tp": "wondrous", "rar": "common", "rarn": 1, "mag": true, "att": false, "cur": false, "wt": "", "desc": "The flame of this candle isn't extinguished when immersed in water. It gives off light and heat like a normal candle", "ed": "2024"}, {"n": "Canvas (1 sq. yd.)", "src": "dmg", "tp": "trade_good", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "", "ed": "both"}, {"n": "Cap of Water Breathing", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "", "desc": "While wearing this cap underwater, you can take a Magic action to create a bubble of air around your head. This bubble allows you to breathe normally underwater. This bubble stays with you until the cap is removed or you are no longer underwater", "ed": "both"}, {"n": "Cape of the Mountebank", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This cape smells faintly of brimstone. While wearing it, you can use it to cast Dimension Door as a Magic action. This property can't be used again until the next dawn.\n\nWhen you teleport with that spell, you leave behind a cloud of smoke. The space you left is Lightly Obscured by that smoke until the end of your next turn", "ed": "both"}, {"n": "Card Sharp's Deck", "src": "bmt", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "", "desc": "The cards of this deck shimmer around the edges. While holding this deck, you can use the following properties:\n\n- Deadly Deal: As an action, you can use this deck to make a ranged spell attack by throwing a spectral card and using Dexterity for the attack roll. The card has a range of 120 feet and deals 1d8 force damage on a hit.\n- Spray of Cards: As an action, you can shuffle the deck and cast the Spray of Cards spell at 3rd level from the deck (spell save DC 15). Once the deck has cast the spell, it can't cast the spell again until the next dawn.", "ed": "both"}, {"n": "Carpenter's Tools", "src": "phb", "tp": "artisans_tools", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "6 lb", "desc": "Ability: Strength\n\nUtilize: Seal or pry open a door or container (DC 20)\n\nCraft: Club, Greatclub, Quarterstaff, Barrel, Chest, Ladder, Pole, Portable Ram, Torch\n\nArtisan's Tools are each focused on crafting items and pursuing a trade. Each type of Artisan's Tools tools requires a separate proficiency.\n\nIf you have proficiency with a tool, add your Proficiency Bonus to any ability check you make that uses the tool. If you have proficiency in a skill that's used with that check, you have Advantage on the check too", "ed": "both"}, {"n": "Carpet of Flying, 3 ft. x 5 ft.", "src": "dmg", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "", "desc": "using the carpet's command word. It moves according to your directions if you are within 30 feet of it.\n\nA 3 ft. × 5 ft. carpet can carry up to 200 lb. at a fly speed of 80 feet. A carpet can carry up to twice the weight shown on the table, but its Fly Speed is halved if it carries more than its normal capacity", "ed": "both"}, {"n": "Carpet of Flying, 4 ft. x 6 ft.", "src": "dmg", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "", "desc": "You can make this carpet hover and fly by taking a Magic action and using the carpet's command word. It moves according to your directions if you are within 30 feet of it.\n\nA 4 ft. × 6 ft. carpet can carry up to 400 lb. at a fly speed of 60 feet. A carpet can carry up to twice the weight shown on the table, but its Fly Speed is halved if it carries more than its normal capacity", "ed": "both"}, {"n": "Carpet of Flying, 5 ft. x 7 ft.", "src": "dmg", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "", "desc": "You can make this carpet hover and fly by taking a Magic action and using the carpet's command word. It moves according to your directions if you are within 30 feet of it.\n\nA 5 ft. × 7 ft. carpet can carry up to 600 lb. at a fly speed of 40 feet. A carpet can carry up to twice the weight shown on the table, but its Fly Speed is halved if it carries more than its normal capacity", "ed": "both"}, {"n": "Carpet of Flying, 6 ft. x 9 ft.", "src": "dmg", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "", "desc": "You can make this carpet hover and fly by taking a Magic action and using the carpet's command word. It moves according to your directions if you are within 30 feet of it.\n\nA 6 ft. × 9 ft. carpet can carry up to 800 lb. at a fly speed of 30 feet. A carpet can carry up to twice the weight shown on the table, but its Fly Speed is halved if it carries more than its normal capacity", "ed": "both"}, {"n": "Carriage", "src": "phb", "tp": "vehicle_land", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "600 lb", "desc": "", "ed": "both"}, {"n": "Carrion Crawler Mucus", "src": "dmg", "tp": "poison", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "A creature subjected to Carrion Crawler Mucus must succeed on a DC 13 Constitution saving throw or have the Poisoned condition for 1 minute. The creature also has the Paralyzed condition while Poisoned in this way. The creature repeats the save at the end of each of its turns, ending the effect on itself on a success", "ed": "both"}, {"n": "Cart", "src": "phb", "tp": "vehicle_land", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "200 lb", "desc": "", "ed": "both"}, {"n": "Cartographer's Tools", "src": "phb", "tp": "artisans_tools", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "6 lb", "desc": "Ability: Wisdom\n\nUtilize: Draft a map of a small area (DC 15)\n\nCraft: Map\n\nArtisan's Tools are each focused on crafting items and pursuing a trade. Each type of Artisan's Tools tools requires a separate proficiency.\n\nIf you have proficiency with a tool, add your Proficiency Bonus to any ability check you make that uses the tool. If you have proficiency in a skill that's used with that check, you have Advantage on the check too", "ed": "both"}, {"n": "Cauldron of Rebirth", "src": "dmg", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": true, "cur": false, "wt": "", "desc": "(requires attunement by a druid or warlock)\n\nThis Tiny pot bears relief scenes of heroes on its cast-iron sides.\n\nYou can use the cauldron as a Spellcasting Focus for your spells, and it functions as a suitable component for the Scrying spell.\n\nBrew Potion. When you finish a Long Rest, you can use the cauldron to create a Potion of Healing (greater), which takes 1 minute. The potion lasts for 24 hours, then loses its magic if not consumed.\n\nRaise Dead. As a Magic action, you can
