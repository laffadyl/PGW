arrier.", "ed": "5e"}, {"n": "Scroll of Protection from Fiends", "src": "dmg", "tp": "scroll", "rar": "rare", "rarn": 3, "mag": false, "att": false, "cur": false, "wt": "", "desc": "Using an action to read the scroll encloses you in an invisible barrier that extends from you to form a 5-foot-radius, 10-foot-high cylinder. For 5 minutes, this barrier prevents fiends from entering or affecting anything within the cylinder. The cylinder moves with you and remains centered on you. However, if you move in such a way that a fiend would be inside the cylinder, the effect ends. A creature can attempt to overcome the barrier by using an action to make a DC 15 Charisma check. On a success, the creature ceases to be affected by the barrier.", "ed": "5e"}, {"n": "Scroll of Protection from Plants", "src": "dmg", "tp": "scroll", "rar": "rare", "rarn": 3, "mag": false, "att": false, "cur": false, "wt": "", "desc": "Using an action to read the scroll encloses you in an invisible barrier that extends from you to form a 5-foot-radius, 10-foot-high cylinder. For 5 minutes, this barrier prevents plants from entering or affecting anything within the cylinder. The cylinder moves with you and remains centered on you. However, if you move in such a way that a plant would be inside the cylinder, the effect ends. A creature can attempt to overcome the barrier by using an action to make a DC 15 Charisma check. On a success, the creature ceases to be affected by the barrier.", "ed": "5e"}, {"n": "Scroll of Protection from Undead", "src": "dmg", "tp": "scroll", "rar": "rare", "rarn": 3, "mag": false, "att": false, "cur": false, "wt": "", "desc": "Using an action to read the scroll encloses you in an invisible barrier that extends from you to form a 5-foot-radius, 10-foot-high cylinder. For 5 minutes, this barrier prevents undead from entering or affecting anything within the cylinder. The cylinder moves with you and remains centered on you. However, if you move in such a way that an undead would be inside the cylinder, the effect ends. A creature can attempt to overcome the barrier by using an action to make a DC 15 Charisma check. On a success, the creature ceases to be affected by the barrier.", "ed": "5e"}, {"n": "Scroll of Titan Summoning", "src": "dmg", "tp": "scroll", "rar": "legendary", "rarn": 5, "mag": true, "att": false, "cur": false, "wt": "", "desc": "When you take a Magic action to read this scroll, a particular titan named in the scroll appears in an unoccupied space on the ground or in water that you can see within 1 mile of yourself. The DM picks a suitable titan or determines it randomly by rolling on the table below.\n\nThe titan is Hostile toward all other creatures and disappears when it drops to 0 Hit Points. If the titan is summoned into a space that isn't large enough to contain it, the summoning fails, and the scroll is wasted.\n\n| 1d100 | Titan |\n| --- | --- |\n| 01-15 | Animal Lord |\n| 16-30 | Blob of Annihilation |\n| 31-45 | Colossus |\n| 46-60 | Elemental Cataclysm |\n| 61-75 | Empyrean |\n| 76-90 | Kraken (a kraken requires a body of water large enough to contain it, or the summoning fails and the scroll is wasted) |\n| 91-100 | Tarrasque |", "ed": "2024"}, {"n": "Sealing Wax", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "", "ed": "both"}, {"n": "Sending Stones", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "", "desc": "Sending Stones come in pairs, with each stone carved to match the other so the pairing is easily recognized. While you touch one stone, you can cast Sending from it. The target is the bearer of the other stone. If no creature bears the other stone, you know that fact as soon as you use the stone, and you don't cast the spell.\n\nOnce Sending is cast using either stone, the stones can't be used again until the next dawn. If one of the stones in a pair is destroyed, the other one becomes nonmagical", "ed": "both"}, {"n": "Sensory Stone", "src": "sato", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This small, smooth stone contains the essence of a single experience.\n\nAs an action, you or a willing creature you designate can touch the stone and experience the sensation as if it happened to the designated creature. The illusory experience is fleeting and harmless, however real it might feel in the moment.\n\nRecord Sensation\nYou can use your reaction to record a short sensation lasting no longer than 6 seconds experienced by a creature of your choice within 30 feet of yourself, infusing the essence of that experience into the stone. This replaces any sensation already stored within the stone.\n\nSiphon Sensation\nAs a bonus action, you can draw on the stone's magic to end the charmed or frightened condition on yourself, destroying the stone in the process.", "ed": "both"}, {"n": "Sentinel Shield", "src": "xdmg", "tp": "armor", "rar": "uncommon", "rarn": 2, "mag": false, "att": false, "cur": false, "wt": "6 lb", "desc": "While holding this shield, you have advantage on initiative rolls and Wisdom (Perception) checks. The shield is emblazoned with a symbol of an eye.", "ed": "both"}, {"n": "Serpent Venom", "src": "dmg", "tp": "poison", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "A creature subjected to Serpent Venom must succeed on a DC 11 Constitution saving throw, taking 10 (3d6) Poison damage on a failed save or half as much damage on a successful one", "ed": "both"}, {"n": "Shawm", "src": "phb", "tp": "instrument", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "Ability: Charisma\n\nUtilize: Play a known tune (DC 10), or improvise a song (DC 15)\n\nIf you have proficiency with a tool, add your Proficiency Bonus to any ability check you make that uses the tool. If you have proficiency in a skill that's used with that check, you have Advantage on the check too", "ed": "both"}, {"n": "Sheep", "src": "dmg", "tp": "trade_good", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "", "ed": "both"}, {"n": "Shovel", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "5 lb", "desc": "\nWorking for 1 hour, you can use a Shovel to dig a hole that is 5 feet on each side in soil or similar material", "ed": "both"}, {"n": "Shrieking Greaves", "src": "bmt", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": true, "wt": "", "desc": "Each of these black leg guards is decorated with a motif of monstrous skulls screaming in terror.\n\nThe greaves have 3 charges. While wearing these greaves, you can use a bonus action to expend 1 charge to increase your walking speed by 30 feet, and you have advantage on Dexterity saving throws. These effects last for 1 minute. The greaves regain 1d3 expended charges daily at dawn.\n\nCurse\nThe greaves are cursed, and becoming attuned to them extends the curse to you. You can't remove the greaves or end your attunement to them until you are targeted by a Remove Curse spell or similar magic.\n\nYou have disadvantage on saving throws against the frightened condition. Whenever you start your turn frightened, the greaves release an ear-piercing scream. You and each creature within 10 feet of you must make a DC 15 Constitution saving throw, taking 9 (2d8) thunder damage on a failed save, or half as much damage on a successful one.", "ed": "both"}, {"n": "Shrike Ship", "src": "aag", "tp": "vehicle_space", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "This swift vessel is a relatively recent design, quickly gaining popularity with merchants and pirates. A shrike ship's legs enable it to land safely on the ground. The ship can float but isn't built for traveling on water and sinks quickly in rough seas.\n\nStandard weaponry on a shrike ship includes three ballistae—one on the forecastle, one in the middle of the top deck, and one on the sterncastle. In a desperate situation, the ship's reinforced bow can be used as a piercing ram.", "ed": "both"}, {"n": "Signal Whistle", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "When blown as a Utilize action, a Signal Whistle produces a sound that can be heard up to 600 feet away", "ed": "both"}, {"n": "Signet Ring", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "", "ed": "both"}, {"n": "Silk (1 sq. yd.)", "src": "phb", "tp": "trade_good", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "", "ed": "both"}, {"n": "Silk Rope (50 feet)", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "5 lb", "desc": "Rope, whether made of hemp or silk, has 2 hit points and can be burst with a DC 17 Strength check.", "ed": "both"}, {"n": "Silver", "src": "dmg", "tp": "trade_good", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "", "ed": "both"}, {"n": "Silverquill Primer", "src": "scc", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": true, "cur": false, "wt": "", "desc": "The Silverquill Primer is a magic textbook created at Strixhaven's Silverquill College. The primer has 3 charges, and it regains 1d3 expended charges daily at dawn. If you make a Charisma (Intimidation) or a Charisma (Persuasion) check while holding the primer, you can expend 1 charge to give yourself a 1d4 bonus to the check, immediately after you roll the d20.\n\nIn addition, if you study the primer at the end of a long rest, you can choose one 1st-level spell from the bard or cleric spell list. Before you finish your next long rest, you can cast the chosen spell once without a spell slot if you are holding the primer. Your spellcasting ability for this spell is your choice of Intelligence, Wisdom, or Charisma.", "ed": "both"}, {"n": "Skull Helm", "src": "bmt", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": true, "cur": false, "wt": "", "desc": "While wearing this skull-shaped helm, you have resistance to cold, poison, and necrotic damage.\n\nAdditionally, while wearing the helm, you can cast Spirit of Death from it without requiring material components. Once you use the helm to cast the spell, the helm can't cast this spell again until the next dawn.", "ed": "both"}, {"n": "Sled", "src": "phb", "tp": "vehicle_land", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "300 lb", "desc": "", "ed": "both"}, {"n": "Sledgehammer", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "10 lb", "desc": "", "ed": "both"}, {"n": "Sleep Grenade", "src": "qftis", "tp": "explosive", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "As an action, a character can throw a grenade at a point up to 60 feet away, 120 feet with a grenade launcher.\n\nThis grenade releases a cloud of soporific mist that fills a 20-foot-radius sphere, then dissipates. Each creature in that area must succeed on a DC 15 Constitution saving throw or have the unconscious condition for 1 hour. The condition ends on a creature early if the creature takes damage or if another creature uses an action to shake it awake.", "ed": "both"}, {"n": "Sling Bullet", "src": "phb", "tp": "ammunition", "rar": "common", "rarn": 1, "mag": false, "att": false, "cur": false, "wt": "", "desc": "Sling bullets are used with a weapon that has the ammunition property to make a ranged attack. Each time you attack with the weapon, you expend one piece of ammunition. Drawing the ammunition from a quiver, case, or other container is part of the attack (you need a free hand to load a one-handed weapon). At the end of the battle, you can recover half your expended ammunition by taking a minute to search the battlefield.\n\nSling Bullets are typically stored in a Pouch (bought separately)", "ed": "both"}, {"n": "Sling of Giant Felling", "src": "bmt", "tp": "weapon", "rar": "uncommon", "rarn": 2, "mag": false, "att": false, "cur": false, "wt": "", "desc": "When you hit a Giant creature with a ranged attack roll using this magic sling, the creature must succeed on a DC 18 Constitution saving throw or have the prone condition.", "ed": "both"}, {"n": "Slippers of Spider Climbing", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": true, "cur": false, "wt": "", "desc": "While you wear these light shoes, you can move up, down, and across vertical surfaces and along ceilings, while leaving your hands free. You have a Climb Speed equal to your Speed. However, the slippers don't allow you to move this way on a slippery surface, such as one covered by ice or oil", "ed": "both"}, {"n": "Slumbering Dragon Vessel", "src": "ftd", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This vessel can be a potion bottle, drinking horn, or other container meant to hold a liquid.\n\nAs a bonus action, if the vessel is empty, you can speak the command word to fill the vessel with one of the following (your choice): ale, olive oil, a potion of healing, or a potion of climbing. Once this property is used, it can't be used until the next dawn. A potion you create in this way loses its magical properties if it isn't imbibed within 24 hours.", "ed": "both"}, {"n": "Slumbering Dragon-Touched Focus", "src": "ftd", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This wondrous item can be a scepter, an orb, an amulet, a crystal, or another finely crafted object. It typically incorporates imagery of dragons' wings, claws, teeth, or scales.\n\nYou have advantage on initiative rolls. While you are holding the focus, it can function as a spellcasting focus for all your spells.", "ed": "both"}, {"n": "Slumbering Scaled Ornament", "src": "ftd", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This ornament can be jewelry, a cloak, or another wearable accessory. It appears to be fashioned from a dragon's scale, tooth, or claw, or it incorporates images in those shapes.\n\nYou have advantage on saving throws you make to avoid being charmed or frightened or to end those conditions on you.", "ed": "both"}, {"n": "Smith's Tools", "src": "phb", "tp": "artisans_tools", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "8 lb", "desc": "Ability: Strength\n\nUtilize: Pry open a door or container (DC 20)\n\nCraft: Any Melee weapon (except Club, Greatclub, Quarterstaff, and Whip), Medium armor (except Hide), Heavy armor, Ball Bearings, Bucket, Caltrops, Chain, Crowbar, Firearm Bullets, Grappling Hook, Iron Pot, Iron Spikes, Sling Bullets\n\nArtisan's Tools are each focused on crafting items and pursuing a trade. Each type of Artisan's Tools tools requires a separate proficiency.\n\nIf you have proficiency with a tool, add your Proficiency Bonus to any ability check you make that uses the tool. If you have proficiency in a skill that's used with that check, you have Advantage on the check too", "ed": "both"}, {"n": "Smoke Grenade", "src": "dmg", "tp": "explosive", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "2 lb", "desc": "As an action, you can either throw a grenade at a point up to 60 feet away or use a Grenade Launcher to propel the grenade to a point up to 1,000 feet away. The grenade explodes at that point, creating a particular effect in a 20-foot-radius Sphere.\n\nThe area of the Sphere is Heavily Obscured by smoke for 1 minute. A strong wind (such as the Gust of Wind spell) disperses the smoke", "ed": "both"}, {"n": "Soap", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "", "ed": "both"}, {"n": "Soul Bag", "src": "mm", "tp": "other", "rar": "very_rare", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "", "desc": "When an evil humanoid dies as a result of a night hag's Nightmare Haunting, the hag catches the soul in this black sack made of stitched flesh. A soul bag can hold only one evil soul at a time, and only the night hag who crafted the bag can catch a soul with it. Crafting a soul bag takes 7 days and a humanoid sacrifice (whose flesh is used to make the bag).", "ed": "both"}, {"n": "Sovereign Glue", "src": "dmg", "tp": "wondrous", "rar": "legendary", "rarn": 5, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This viscous, milky-white substance can form a permanent adhesive bond between any two objects. It must be stored in a jar or flask that has been coated inside with Oil of Slipperiness. When found, a container contains 1d6 + 1 ounces.\n\nOne ounce of the glue can cover a 1-foot square surface. Applying an ounce of Sovereign Glue takes a Utilize action, and the applied glue takes 1 minute to set. Once it has done so, the bond it creates can be broken only by the application of Universal Solvent or Oil of Etherealness, or with a Wish spell", "ed": "both"}, {"n": "Space Galleon", "src": "aag", "tp": "vehicle_space", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "The space galleon is a mainstay among the host of vessels that ply Wildspace and the Astral Sea. Space galleons can easily pass for ordinary seafaring galleons. Because they can land on water and move across it like their namesakes, they can sail into ports on terrestrial worlds without attracting undue attention. Like an ordinary galleon, a space galleon isn't built to land on the ground (its keel would cause it to roll on its side). The ship's standard weaponry includes two forward-mounted ballistae and an aft-mounted mangonel.", "ed": "both"}, {"n": "Spaceship Trinket", "src": "qftis", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "Spaceship Trinkets\n\n| d100 | Trinket |\n| --- | --- |\n| 01–02 | Disembodied robot arm with a mind of its own |\n| 03–04 | Wearable blanket with sleeves and a hood |\n| 05–06 | Small, rectangular device that can record and play back audio of up to 1 minute in length |\n| 07–08 | Glow-in-the-dark ink pen |\n| 09–10 | Fashionable jumpsuit |\n| 11–12 | Compact scanner that reports whether an object is recyclable in a cheery tone |\n| 13–14 | Wristwatch programmed to beep at a specific time |\n| 15–16 | Handheld cylinder that produces a 15-foot cone of bright light for up to 1 hour every 24 hours |\n| 17–18 | Colorful toy ray gun with lights and sounds |\n| 19–20 | Bottle of fizzy, sweet-tasting liquid |\n| 21–22 | Map of an unexplored star system |\n| 23–24 | Motorized toothbrush that might have been used |\n| 25–26 | Tiny robot that shines boots and shoes |\n| 27–28 | Pressurized red canister with a flexible hose that, when squeezed as an action, sprays a 15-foot cone of foam. The foam extinguishes all nonmagical flames in the cone. The canister can perform this action only once. |\n| 29–30 | Loaf of space bread covered in blue-green mold |\n| 31–32 | Handheld screen that plays a children's story about a friendly, three-eyed frog named Swampy |\n| 33–34 | Compact device that displays the current weather |\n| 35–36 | Empty metal bottle that maintains the temperature of liquids stored in it for 1d4 hours |\n| 37–38 | Tiny disc that emits a high-pitched noise in the presence of smoke or mild cooking fumes |\n| 39–40 | Aerosolized can of metal polish |\n| 41–42 | Identification badge of a deceased crew member |\n| 43–44 | Depleted energy cell |\n| 45–46 | Pocket-sized instrument that clicks rapidly within 10 feet of radiation |\n| 47–48 | Vacuum-sealed package of shriveled frankfurters |\n| 49–50 | Tin hat that telepathically broadcasts the wearer's surface thoughts to creatures within 10 feet of it |\n| 51–52 | Chalky moon rock |\n| 53–54 | Collar that, when placed on a Medium or smaller Beast, translates its cries into Common |\n| 55–56 | Bottle of expired medicine for treating dizziness |\n| 57–58 | Tiny speaker that plays a catchy tune in an unknown language |\n| 59–60 | Handheld tool for removing bolts and screws |\n| 61–62 | Cautionary pamphlet about the dangers of space |\n| 63–64 | Miniature flying saucer |\n| 65–66 | Tiny, animatronic bunny that hops after the creature that activates it |\n| 67–68 | Stick of deodorant with a surprising scent |\n| 69–70 | Countertop appliance that can transform any fruit into a pulpy juice |\n| 71–72 | Glass pendant filled with stardust |\n| 73–74 | Pot containing an artificially dwarfed tree |\n| 75–76 | Otherworldly insect preserved in amber |\n| 77–78 | Syringe filled with a viscous, yellow serum |\n| 79–80 | Tiny brass orrery |\n| 81–82 | Log of passenger names |\n| 83–84 | Gas mask with a hole in it |\n| 85–86 | Small glass terrarium with an empty cocoon |\n| 87–88 | Dongle that never plugs in correctly on the first try |\n| 89–90 | Holster fashioned from an unknown reptile's hide |\n| 91–92 | Severed bundle of important-looking wires |\n| 93–94 | Prosthetic limb with magnetic attachments |\n| 95–96 | Set of polyhedral dice that buzz and flash when they land on their highest result |\n| 97–98 | Musical instrument that plays electronic tones |\n| 99–00 | Trading card of a beloved fictional hero from a far-off world |", "ed": "both"}, {"n": "Spell Bottle", "src": "egw", "tp": "wondrous", "rar": "legendary", "rarn": 5, "mag": true, "att": true, "cur": false, "wt": "8 lb", "desc": "This glass bottle can store one spell of up to 5th level at a time. When found, roll a d6 and subtract 1; the total determines the level of spell in the bottle (the DM chooses the spell, and 0 means the bottle is empty). A swirling blue vapor fills the bottle while it contains a spell.\n\nWhen the bottle is empty, any creature can cast a spell of 1st through 5th level into it by touching it while casting. The spell has no effect other than to be stored in the bottle.\n\nWhile holding the bottle, you can cast the spell stored in it. The spell uses the slot level, spell save DC, spell attack bonus, and spellcasting ability of the original caster, but is otherwise treated as if you cast the spell. The bottle becomes empty once the spell is cast.\n\nIf you’re holding the empty bottle when you see a creature casting a spell within 60 feet of you, you can open the bottle as a reaction in an attempt to interrupt the spell. If the creature is casting a spell of 3rd level or lower, the spell has no effect, and it is stored in the bottle. If it is casting a spell of 4th level or higher, make an Intelligence check. The DC equals 10 + the spell’s level. On a success, the spell has no effect, and it is stored in the bottle.", "ed": "both"}, {"n": "Spell Scroll (1st Level)", "src": "dmg", "tp": "scroll", "rar": "common", "rarn": 1, "mag": false, "att": false, "cur": false, "wt": "", "desc": "A spell scroll bears the words of a single spell, written as a mystical cipher. If the spell is on your class's spell list, you can read the scroll and cast its spell without providing any material components. Otherwise, the scroll is unintelligible. Casting the spell by reading the scroll requires the spell's normal casting time. Once the spell is cast, the words on the scroll fade, and it crumbles to dust. If the casting is interrupted, the scroll is not lost.\n\nIf the spell is on your class's spell list but of a higher level than you can normally cast, you must make an ability check using your spellcasting ability to determine whether you cast it successfully. The DC is 11. On a failed check, the spell disappears from the scroll with no other effect.\n\nOnce the spell is cast, the words on the scroll fade, and the scroll itself crumbles to dust.\n\nA spell cast from this scroll has a save DC of 13 and an attack bonus of 5.\n\nA wizard spell on a spell scroll can be copied just as spells in spellbooks can be copied. When a spell is copied from a spell scroll, the copier must succeed on a DC 11 Intelligence (Arcana) check. If the check succeeds, the spell is successfully copied. Whether the check succeeds or fails, the spell scroll is destroyed.", "ed": "5e"}, {"n": "Spell Scroll (2nd Level)", "src": "dmg", "tp": "scroll", "rar": "uncommon", "rarn": 2, "mag": false, "att": false, "cur": false, "wt": "", "desc": "A spell scroll bears the words of a single spell, written as a mystical cipher. If the spell is on your class's spell list, you can read the scroll and cast its spell without providing any material components. Otherwise, the scroll is unintelligible. Casting the spell by reading the scroll requires the spell's normal casting time. Once the spell is cast, the words on the scroll fade, and it crumbles to dust. If the casting is interrupted, the scroll is not lost.\n\nIf the spell is on your class's spell list but of a higher level than you can normally cast, you must make an ability check using your spellcasting ability to determine whether you cast it successfully. The DC is 12. On a failed check, the spell disappears from the scroll with no other effect.\n\nOnce the spell is cast, the words on the scroll fade, and the scroll itself crumbles to dust.\n\nA spell cast from this scroll has a save DC of 13 and an attack bonus of 5.\n\nA wizard spell on a spell scroll can be copied just as spells in spellbooks can be copied. When a spell is copied from a spell scroll, the copier must succeed on a DC 12 Intelligence (Arcana) check. If the check succeeds, the spell is successfully copied. Whether the check succeeds or fails, the spell scrol wise, the scroll is unintelligible. Casting the spell by reading the scroll requires the spell's normal casting time. Once the spell is cast, the scroll crumbles to dust. If the casting is interrupted, the scroll isn't lost.\n\nIf the spell is on your spell list but of a higher level than you can normally cast, you make a DC 19 ability check using your spellcasting ability to determine whether you cast the spell. On a failed check, the spell disappears from the scroll with no other effect.\n\nIf the spell requires a saving throw or an attack roll, the spell save DC is 19, and the attack bonus is +11.\n\nCopying a Scroll into a Spellbook. A Wizard spell on a Spell Scroll can be copied into a spellbook. When a level 9 spell is copied in this way, the copier must succeed on a DC 19 Intelligence (Arcana). On a successful check, the spell is copied. Whether the check succeeds or fails, the Spell Scroll is destroyed", "ed": "2024"}, {"n": "Spellbook", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "3 lb", "desc": "Essential for wizards, a spellbook is a leather-bound tome with 100 blank vellum pages suitable for recording spells.", "ed": "both"}, {"n": "Spelljamming Helm", "src": "aag", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "", "desc": "The function of this ornate chair is to propel and maneuver a ship on which it has been installed through space and air. It can also propel and maneuver a ship on water or underwater, provided the ship is built for such travel. The ship in question must weigh 1 ton or more.\n\nThe sensation of being attuned to a spelljamming helm is akin to the pins-and-needles effect one experiences after one's arm or leg falls asleep, but not as painful.\n\nWhile attuned to a spelljamming helm and sitting in it, you gain the following abilities for as long as you maintain concentration (as if concentrating on a spell):\n\n- You can use the spelljamming helm to move the ship through space, air, or water up to the ship's speed. If the ship is in space and no other objects weighing 1 ton or more are within 1 mile of it, you can use the spelljamming helm to move the vessel fast enough to travel 100 million miles in 24 hours.\n- You can steer the vessel, albeit in a somewhat clumsy fashion, in much the way that a rudder or oars can be used to maneuver a seafaring ship.\n- At any time, you can see and hear what's happening on and around the vessel as though you were standing in a location of your choice aboard it.\n\nTransfer Attunement\nYou can use an action to touch a willing spellcaster. That creature attunes to the spelljamming helm immediately, and your attunement to it ends.\n\nCost of a Spelljamming Helm\nA spelljamming helm propels and steers a ship much as sails, oars, and rudders work on a seafaring vessel, and a spelljamming helm is easy to create if one has the proper spell. Create spelljamming helm has a material component cost of 5,000 gp, so that's the least one can pay to acquire a spelljamming helm.\n\nWildspace merchants, including dohwars and mercanes, typically sell a spelljamming helm for substantially more than it cost to make. How much more depends on the market, but 7,500 gp would be a reasonable demand. A desperate buyer in a seller's market might pay 10,000 gp or more.", "ed": "both"}, {"n": "Spellwrought Tattoo", "src": "tce", "tp": "wondrous", "rar": "common", "rarn": 1, "mag": false, "att": false, "cur": false, "wt": "", "desc": "Produced by a special needle, this magic tattoo contains a single spell of up to 5th level, wrought on your skin by a magic needle. To use the tattoo, you must hold the needle against your skin and speak the command word. The needle turns into ink that becomes the tattoo, which appears on the skin in whatever design you like. Once the tattoo is there, you can cast its spell, requiring no material components. The tattoo glows faintly while you cast the spell and for the spell's duration. Once the spell ends, the tattoo vanishes from your skin.\n\nThe level of the spell in the tattoo determines the spell's saving throw DC, attack bonus, spellcasting ability modifier, and the tattoo's rarity, as shown in the Spellwrought Tattoo table.\n\nSpellwrought Tattoo\n| Spell Level | Rarity | Spellcasting Ability Modifier | Save DC | Attack Bonus |\n| --- | --- | --- | --- | --- |\n| Cantrip | Common | +3 | 13 | +5 |\n| 1st | Common | +3 | 13 | +5 |\n| 2nd | Uncommon | +3 | 13 | +5 |\n| 3rd | Uncommon | +4 | 15 | +7 |\n| 4th | Rare | +4 | 15 | +7 |\n| 5th | Rare | +5 | 17 | +9 |", "ed": "both"}, {"n": "Sphere of Annihilation", "src": "dmg", "tp": "wondrous", "rar": "legendary", "rarn": 5, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This 2-foot-diameter black sphere is a hole in the multiverse, hovering in space and stabilized by a magical field surrounding it.\n\nThe sphere obliterates all matter it passes through and all matter that passes through it. Artifacts are the exception. Unless an Artifact is susceptible to damage from a Sphere of Annihilation, it passes through the sphere unscathed. Anything else that touches the sphere but isn't wholly engulfed and obliterated by it takes 8d10 Force damage.\n\nControlling the Sphere. A Sphere of Annihilation is stationary until someone takes control of it. If you are within 60 feet of a sphere, you can take a Magic action to make a DC 25 Intelligence (Arcana) check. On a successful check, you control the sphere until the start of your next turn, and if it was under another creature's control, that creature loses control of the sphere. On a failed check, the sphere moves 10 feet toward you in a straight line.\n\nWhile in control of the sphere, you can take a Bonus Action to cause it to move in one direction of your choice, up to a number of feet equal to 5 times your Intelligence modifier (minimum 5 feet). Any creature whose space the sphere enters must succeed on a DC 19 Dexterity saving throw or be touched by it, taking 8d10 Force damage. A creature reduced to 0 Hit Points by this damage is obliterated, leaving its possessions behind but no other physical remains.\n\nSphere Interactions. If the sphere comes into contact with a planar portal (such as that created by the Gate spell) or an extradimensional space (such as that within a Portable Hole), the DM determines randomly what happens using the following table.\n\n| 1d100 | Result |\n| --- | --- |\n| 01-50 | The sphere is destroyed. |\n| 51-85 | The sphere moves through the portal or into the extradimensional space. |\n| 86-00 | A spatial rift sends the sphere and each creature and object within 180 feet of the sphere to a random plane of existence. |", "ed": "both"}, {"n": "Spindle of Fate", "src": "bmt", "tp": "wand", "rar": "legendary", "rarn": 5, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This wand is shaped like a drop spindle wrapped in red thread. The wand has 6 charges that can be used for the following properties:\n\n- Battle Foreknowledge: When you roll initiative, you can expend 1 charge to add or subtract your proficiency bonus from the total roll.\n- Doom Foretold: As an action, you can expend 2 charges to target a creature within 30 feet of yourself and invoke that creature's doom. While the target is on the same plane of existence as you, you can sense the direction to its location, and you know the direction of its movement if it's in motion. Additionally, once per turn when you deal damage to the doomed creature, you can roll 1d6 and add the number rolled to the damage roll. These benefits persist for 1 hour or until you target another creature with this effect.\n- Twist of Fate: When a creature within 60 feet of you makes a saving throw or an attack roll, you can use your reaction to expend 3 charges and alter the outcome, turning a failed saving throw into a successful one, a missed attack roll into a hit, or vice versa.\nThe wand regains 1d6 expended charges daily at dawn.", "ed": "both"}, {"n": "Spirit Board", "src": "dmg", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This ornate wooden board has the letters of the Common alphabet printed on one side, alongside the words \"Yes\" and \"No\" and symbols representing \"Weal\" and \"Woe.\" The board comes with a heartshaped, wooden planchette. This planchette must be resting on the lettered side of the board for the board's magic to function.\n\nThis board has 3 charges and regains 1 expended charge daily at dawn. While touching the planchette, you can take 1 minute to cast one of the spells on the table below. The table indicates how many charges you must expend to cast the spell. As you cast the spell, you call on the spirits of the dead to help guide the planchette across the board's surface, answering your questions by pointing to the letters or words on the board.\n\n| Spell | Charge Cost |\n| --- | --- |\n| Augury | 1 |\n| Commune | 3 |", "ed": "2024"}, {"n": "Sprig of Mistletoe", "src": "phb", "tp": "spellcasting_focus", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "A Druidic Focus takes a specific form and is carved, tied with ribbon, or painted to channel primal magic. A Druid or Ranger can use such an object as a Spellcasting Focus", "ed": "both"}, {"n": "Spyglass", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "Objects viewed through a Spyglass are magnified to twice their size", "ed": "both"}, {"n": "Squid Ship", "src": "aag", "tp": "vehicle_space", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "Among the oldest types of spelljamming vessels, squid ships are popular with privateers and are often used as patrol ships. Standard weapons on a squid ship include a forward-mounted mangonel, two aft-mounted ballistae, and a reinforced bow for ramming. The tentacles that extend from the bow account for nearly half the ship's keel length.\n\nSquid ships can float and sail on water, and they can land on the ground.", "ed": "both"}, {"n": "Stabling (per day)", "src": "phb", "tp": "tack_and_harness", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "", "ed": "both"}, {"n": "Staff of Charming", "src": "dmg", "tp": "staff", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "4 lb", "desc": "While holding this staff, you can use an action to expend 1 of its 10 charges to cast charm person, command, or comprehend languages from it using your spell save DC. The staff can also be used as a magic quarterstaff.\n\nIf you are holding the staff and fail a saving throw against an enchantment spell that targets only you, you can turn your failed save into a successful one. You can't use this property of the staff again until the next dawn. If you succeed on a save against an enchantment spell that targets only you, with or without the staff's intervention, you can use your reaction to expend 1 charge from the staff and turn the spell back on its caster as if you had cast the spell.\n\nThe staff regains 1d8 + 2 expended charges daily at dawn. If you expend the last charge, roll a d20. On a 1, the staff becomes a nonmagical quarterstaff.", "ed": "both"}, {"n": "Staff of Dunamancy", "src": "egw", "tp": "staff", "rar": "very_rare", "rarn": 99, "mag": true, "att": true, "cur": false, "wt": "6 lb", "desc": "This staff of polished gray wood bears numerous runes carved along its length. The staff has 10 charges and regains 1d6 + 4 expended charges daily at dawn. If you expend the last charge, roll a d20. On a 1, the staff turns into dust and is destroyed.\n\nWhile holding the staff, you can use an action to expend 2 or more of its charges to cast one of the following spells from it, using your spell save DC and spell attack bonus: fortune’s favor (2 charges), pulse wave (3 charges), or gravity sinkhole (4 charges).\n\nNew Possibility: If you are holding the staff and fail a saving throw against a spell that targets only you, you can turn your failed save into a successful one. This property can’t be used again until the next dawn.", "ed": "both"}, {"n": "Staff of Fire", "src": "dmg", "tp": "staff", "rar": "very_rare", "rarn": 99, "mag": true, "att": true, "cur": false, "wt": "4 lb", "desc": "You have resistance to fire damage while you hold this staff.\n\nThe staff has 10 charges. While holding it, you can use an action to expend 1 or more of its charges to cast one of the following spells from it, using your spell save DC: burning hands (1 charge), fireball (3 charges), or wall of fire (4 charges).\n\nThe staff regains 1d6 + 4 expended charges daily at dawn. If you expend the last charge, roll a d20. On a 1, the staff blackens, crumbles into cinders, and is destroyed.", "ed": "both"}, {"n": "Staff of Frost", "src": "dmg", "tp": "staff", "rar": "very_rare", "rarn": 99, "mag": true, "att": true, "cur": false, "wt": "4 lb", "desc": "You have resistance to cold damage while you hold this staff.\n\nThe staff has 10 charges. While holding it, you can use an action to expend 1 or more of its charges to cast one of the following spells from it, using your spell save DC: cone of cold (5 charges), fog cloud (1 charge), ice storm (4 charges), or wall of ice (4 charges).\n\nThe staff regains 1d6 + 4 expended charges daily at dawn. If you expend the last charge, roll a d20. On a 1. the staff turns to water and is destroyed.", "ed": "5e"}, {"n": "Staff of Healing", "src": "dmg", "tp": "staff", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "4 lb", "desc": "This staff has 10 charges. While holding it, you can use an action to expend 1 or more of its charges to cast one of the following spells from it, using your spell save DC and spellcasting ability modifier: cure wounds (1 charge per spell level, up to 4th), lesser restoration (2 charges) or mass cure wounds (5 charges).\n\nThe staff regains 1d6 + 4 expended charges daily at dawn. If you expend the last charge, roll a d20. On a 1. the staff vanishes in a flash of light, lost forever.", "ed": "5e"}, {"n": "Staff of Power", "src": "dmg", "tp": "staff", "rar": "very_rare", "rarn": 99, "mag": true, "att": true, "cur": false, "wt": "4 lb", "desc": "This staff can be wielded as a magic quarterstaff that grants a +2 bonus to attack and damage rolls made with it. While holding it, you gain a +2 bonus to Armor Class, saving throws, and spell attack rolls.\n\nThe staff has 20 charges for the following properties. The staff regains 2d8 + 4 expended charges daily at dawn. If you expend the last charge, roll a d20. On a 1, the staff retains its +2 bonus to attack and damage roll but loses all other properties. On a 20, the staff regain 1d8 + 2 charges.\n\nPower Strike\nWhen you hit with a melee attack using the staff, you can expend 1 charge to deal an extra 1d6 force damage to the target.\n\nSpells\nWhile holding this staff, you can use an action to expend 1 or more of its charges to cast one of the following spells from it, using your spell save DC and spell attack bonus: cone of cold (5 charges), fireball (5th-level version, 5 charges), globe of invulnerability (6 charges), hold monster (5 charges), levitate (2 charges). lightning bolt (5th-level version, 5 charges), magic missile (1 charge), ray of enfeeblement (1 charge), or wall of force (5 charges).\n\nRetributive Strike\nYou can use an action to break the staff over your knee or against a solid surface, performing a retributive strike. The staff is destroyed and releases its remaining magic in an explosion that expands to fill a 30-foot-radius sphere centered on it.\n\nYou have a 50 chance to instantly travel to a random plane of existence, avoiding the explosion. If you fail to avoid the effect, you take force damage equal to 16 × the number of charges in the staff. Every other creature in the area must make a DC 17 Dexterity saving throw. On a failed save, a creature takes an amount of damage based on how far away it is from the point of origin, as shown in the following table. On a successful save, a creature takes half as much damage.\n\n| Distance from Origin | Effect |\n| --- | --- |\n| 10 ft. away or closer | 8 × the number of charges in the staff |\n| 11 to 20 ft. away | 6 × the number of charges in the staff |\n| 21 to 30 ft. away | 4 × the number of charges in the staff |", "ed": "5e"}, {"n": "Staff of Striking", "src": "dmg", "tp": "staff", "rar": "very_rare", "rarn": 99, "mag": true, "att": true, "cur": false, "wt": "4 lb", "desc": "This staff can be wielded as a magic quarterstaff that grants a +3 bonus to attack and damage rolls made with it.\n\nThe staff has 10 charges. When you hit with a melee attack using it, you can expend up to 3 of its charges. For each charge you expend, the target takes an extra 1d6 force damage. The staff regains 1d6 + 4 expended charges daily at dawn. If you expend the last charge, roll a d20. On a 1, the staff becomes a nonmagical quarterstaff.", "ed": "5e"}, {"n": "Staff of Swarming Insects", "src": "dmg", "tp": "staff", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "4 lb", "desc": "This staff has 10 charges and regains 1d6 + 4 expended charges daily at dawn. If you expend the last charge, roll a d20. On a 1, a swarm of insects consumes and destroys the staff, then disperses.\n\nSpells\nWhile holding the staff, you can use an action to expend some of its charges to cast one of the following spells from it, using your spell save DC: giant insect (4 charges) or insect plague (5 charges).\n\nInsect Cloud\nWhile holding the staff, you can use an action and expend 1 charge to cause a swarm of harmless flying insects to spread out in a 30-foot radius from you. The insects remain for 10 minutes, making the area heavily obscured for creatures other than you. The swarm moves with you, remaining centered on you. A wind of at least 10 miles per hour disperses the swarm and ends the effect.", "ed": "both"}, {"n": "Staff of the Adder", "src": "dmg", "tp": "staff", "rar": "uncommon", "rarn": 2, "mag": true, "att": true, "cur": false, "wt": "4 lb", "desc": "You can use a bonus action to speak this staff's command word and make the head of the staff become that of an animate poisonous snake for 1 minute. By using another bonus action to speak the command word again, you return the staff to its normal inanimate form.\n\nYou can make a melee attack using the snake head, which has a reach of 5 feet. Your proficiency bonus applies to the attack roll. On a hit, the target takes 1d6 piercing damage and must succeed on a DC 15 Constitution saving throw or take 3d6 poison damage.\n\nThe snake head can be attacked while it is animate. It has an Armor Class of 15 and 20 hit points. If the head drops to 0 hit points, the staff is destroyed. As long as it's not destroyed, the staff regains all lost hit points when it reverts to its inanimate form.", "ed": "both"}, {"n": "Staff of the Ivory Claw", "src": "egw", "tp": "staff", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "6 lb", "desc": "This gray-and-cerulean staff is topped with a small dragon claw carved from ivory. While holding the staff, you gain a +1 bonus to spell attack rolls. Whenever you score a critical hit with a spell attack, the target takes an extra 3d6 radiant damage.", "ed": "both"}, {"n": "Staff of the Magi", "src": "dmg", "tp": "staff", "rar": "legendary", "rarn": 5, "mag": true, "att": true, "cur": false, "wt": "4 lb", "desc": "This staff can be wielded as a magic quarterstaff that grants a +2 bonus to attack and damage rolls made with it. While you hold it, you gain a +2 bonus to spell attack rolls.\n\nThe staff has 50 charges for the following properties. It regains 4d6 + 2 expended charges daily at dawn. If you expend the last charge, roll a d20. On a 20, the staff regains 1d12 + 1 charges.\n\nSpell Absorption\nWhile holding the staff, you have advantage on saving throws against spells. In addition, you can use your reaction when another creature casts a spell that targets only you. If you do, the staff absorbs the magic of the spell, canceling its effect and gaining a number of charges equal to the absorbed spell's level. However, if doing so brings the staff's total number of charges above 50, the staff explodes as if you activated its retributive strike (see below).\n\nSpells\nWhile holding the staff, you can use an action to expend some of its charges to cast one of the following spells from it, using your spell save DC and spellcasting ability: conjure elemental (7 charges), dispel magic (3 charges), fireball (7th-level version, 7 charges), flaming sphere (2 charges), ice storm (4 charges), invisibility (2 charges), knock (2 charges), lightning bolt (7th-level version, 7 charges), passwall (5 charges), plane shift (7 charges), telekinesis (5 charges), wall of fire (4 charges), or web (2 charges).\n\nYou can also use an action to cast one of the following spells from the staff without using any charges: arcane lock, detect magic, enlarge/reduce, light, mage hand, or protection from evil and good.\n\nRetributive Strike\nYou can use an action to break the staff over your knee or against a solid surface, performing a retributive strike. The staff is destroyed and releases its remaining magic in an explosion that expands to fill a 30-foot-radius sphere centered on it.\n\nYou have a 50 chance to instantly travel to a random plane of existence, avoiding the explosion. If you fail to avoid the effect, you take force damage equal to 16 × the number of charges in the staff. Every other creature in the area must make a DC 17 Dexterity saving throw. On a failed save, a creature takes an amount of damage based on how far away it is from the point of origin, as shown in the following table. On a successful save, a creature takes half as much damage.\n\n| Distance from Origin | Damage |\n| --- | --- |\n| 10 ft. away or closer | 8 × the number of charges in the staff |\n| 11 to 20 ft. away | 6 × the number of charges in the staff |\n| 21 to 30 ft. away | 4 × the number of charges in the staff |", "ed": "5e"}, {"n": "Staff of the Python", "src": "dmg", "tp": "staff", "rar": "uncommon", "rarn": 2, "mag": true, "att": true, "cur": false, "wt": "4 lb", "desc": "You can use an action to speak this staff's command word and throw the staff on the ground within 10 feet of you. The staff becomes a giant constrictor snake under your control and acts on its own initiative count. By using a bonus action to speak the command word again, you return the staff to its normal form in a space formerly occupied by the snake.\n\nOn your turn, you can mentally command the snake if it is within 60 feet of you and you aren't incapacitated. You decide what action the snake takes and where it moves during its next turn, or you can issue it a general command, such as to attack your enemies or guard a location.\n\nIf the snake is reduced to 0 hit points, it dies and reverts to its staff form. The staff then shatters and is destroyed. If the snake reverts to staff form before losing all its hit points, it regains all of them.", "ed": "both"}, {"n": "Staff of the Woodlands", "src": "dmg", "tp": "staff", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "4 lb", "desc": "This staff can be wielded as a magic quarterstaff that grants a +2 bonus to attack and damage rolls made with it. While holding it, you have a +2 bonus to spell attack rolls.\n\nThe staff has 10 charges for the following properties. It regains 1d6 + 4 expended charges daily at dawn. If you expend the last charge, roll a d20. On a 1, the staff loses its properties and becomes a nonmagical quarterstaff.\n\nSpells\nYou can use an action to expend 1 or more of the staff's charges to cast one of the following spells from it, using your spell save DC: animal friendship (1 charge), awaken (5 charges), barkskin (2 charges), locate animals or plants (2 charges), speak with animals (1 charge), speak with plants (3 charges), or wall of thorns (6 charges).\n\nYou can also use an action to cast the pass without trace spell from the staff without using any charges.\n\nTree Form\nYou can use an action to plant one end of the staff in fertile earth and expend 1 charge to transform the staff into a healthy tree. The tree is 60 feet tall and has a 5-foot-diameter trunk, and its branches at the top spread out in a 20-foot radius. The tree appears ordinary but radiates a faint aura of transmutation magic if targeted by detect magic. While touching the tree and using another action to speak its command word, you return the staff to its normal form. Any creature in the tree falls when it reverts to a staff.", "ed": "5e"}, {"n": "Staff of Thunder and Lightning", "src": "dmg", "tp": "staff", "rar": "very_rare", "rarn": 99, "mag": true, "att": true, "cur": false, "wt": "4 lb", "desc": "This staff can be wielded as a magic quarterstaff that grants a +2 bonus to attack and damage rolls made with it. It also has the following additional properties. When one of these properties is used, it can't be used again until the next dawn.\n\nLightning\nWhen you hit with a melee attack using the staff, you can cause the target to take an extra 2d6 lightning damage.\n\nThunder\nWhen you hit with a melee attack using the staff, you can cause the staff to emit a crack of thunder, audible out to 300 feet. The target you hit must succeed on a DC 17 Constitution saving throw or become stunned until the end of your next turn.\n\nLightning Strike\nYou can use an action to cause a bolt of lightning to leap from the staff's tip in a line that is 5 feet wide and 120 feet long. Each creature in that line must make a DC 17 Dexterity saving throw, taking 9d6 lightning damage on a failed save, or half as much damage on a successful one.\n\nThunderclap\nYou can use an action to cause the staff to issue a deafening thunderclap, audible out to 600 feet. Each creature within 60 feet of you (not including you) must make a DC 17 Constitution saving throw. On a failed save, a creature takes 2d6 thunder damage and becomes deafened for 1 minute. On a successful save, a creature takes half damage and isn't deafened.\n\nThunder and Lightning\nYou can use an action to use the Lightning Strike and Thunderclap properties at the same time. Doing so doesn't expend the daily use of those properties, only the use of this one.", "ed": "both"}, {"n": "Staff of Withering", "src": "dmg", "tp": "staff", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "4 lb", "desc": "This staff has 3 charges and regains 1d3 expended charges daily at dawn.\n\nThe staff can be wielded as a magic quarterstaff. On a hit, it deals damage as a normal quarterstaff, and you can expend 1 charge to deal an extra 2d10 necrotic damage to the target. In addition, the target must succeed on a DC 15 Constitution saving throw or have disadvantage for 1 hour on any ability check or saving throw that uses Strength or Constitution.", "ed": "both"}, {"n": "Star Moth", "src": "aag", "tp": "vehicle_space", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "Star moths are ships constructed and flown by astral elves, who don't like it when these ships end up in the hands of others.\n\nA star moth's hull is fashioned from a grown and sculpted organic substance, and its enormous, decorative wings are made of shimmering crystal. The vessel is built for space travel, but its design does enable it to float on water or land safely on the ground. Standard weaponry includes two ballistae nestled in the star moth's eye holes and a mangonel mounted above the bridge.", "ed": "both"}, {"n": "Steel Mirror", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "0.5 lb", "desc": "", "ed": "5e"}, {"n": "Stirring Chromatic Dragon-Touched Focus", "src": "ftd", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This wondrous item can be a scepter, an orb, an amulet, a crystal, or another finely crafted object. It typically incorporates imagery of dragons' wings, claws, teeth, or scales.\n\nYou have advantage on initiative rolls. While you are holding the focus, it can function as a spellcasting focus for all your spells.\n\nThe focus gains an additional property determined by the family of the dragon in whose hoard it became Stirring:\n\nWhenever you use a spell slot to cast a spell that deals acid, cold, fire, lightning, or poison damage, roll a d6, and you gain a bonus equal to the number rolled to one of the spell's damage rolls", "ed": "both"}, {"n": "Stirring Dragon Vessel", "src": "ftd", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This vessel can be a potion bottle, drinking horn, or other container meant to hold a liquid.\n\nAs a bonus action, if the vessel is empty, you can speak the command word to fill the vessel with one of the following (your choice): ale, olive oil, mead, a potion of healing, a potion of greater healing, a potion of climbing, or a potion of fire breath. Once this property is used, it can't be used until the next dawn. A potion you create in this way loses its magical properties if it isn't imbibed within 24 hours.", "ed": "both"}, {"n": "Stirring Gem Dragon-Touched Focus", "src": "ftd", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This wondrous item can be a scepter, an orb, an amulet, a crystal, or another finely crafted object. It typically incorporates imagery of dragons' wings, claws, teeth, or scales.\n\nYou have advantage on initiative rolls. While you are holding the focus, it can function as a spellcasting focus for all your spells.\n\nThe focus gains an additional property determined by the family of the dragon in whose hoard it became Stirring:\n\nWhenever you use a spell slot to cast a spell, you can immediately teleport to an unoccupied space you can see within 15 feet of you", "ed": "both"}, {"n": "Stirring Metallic Dragon-Touched Focus", "src": "ftd", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This wondrous item can be a scepter, an orb, an amulet, a crystal, or another finely crafted object. It typically incorporates imagery of dragons' wings, claws, teeth, or scales.\n\nYou have advantage on initiative rolls. While you are holding the focus, it can function as a spellcasting focus for all your spells.\n\nThe focus gains an additional property determined by the family of the dragon in whose hoard it became Stirring:\n\nWhen a creature you can see within 30 feet of you makes a saving throw, you can use your reaction to give that creature advantage on the saving throw", "ed": "both"}, {"n": "Stirring Scaled Ornament", "src": "ftd", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This ornament can be jewelry, a cloak, or another wearable accessory. It appears to be fashioned from a dragon's scale, tooth, or claw, or it incorporates images in those shapes.\n\nYou gain a +1 bonus to AC, and you can't be charmed or frightened. Moreover, each creature of your choice within 30 feet of you has advantage on saving throws it makes to avoid being charmed or frightened or to end those conditions on itself.", "ed": "both"}, {"n": "Stone of Controlling Earth Elementals", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": false, "cur": false, "wt": "", "desc": "While touching this 5-pound stone to the ground, you can take a Magic action to summon an Earth Elemental. The elemental appears in an unoccupied space you choose within 30 feet of yourself, obeys your commands, and takes its turn immediately after you on your Initiative count. The elemental disappears after 1 hour, when it dies, or when you dismiss it as a Bonus Action. The stone can't be used this way again until the next dawn", "ed": "both"}, {"n": "Stone of Good Luck", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": true, "cur": false, "wt": "", "desc": "While this polished agate is on your person, you gain a +1 bonus to ability checks and saving throws", "ed": "both"}, {"n": "String", "src": "phb", "tp": "", "rar": "", "rarn": 99, "mag": false, "att": false, "cur": false, "wt": "", "desc": "String is 10 feet long. You can tie a knot in it as a Utilize action", "ed": "2024"}, {"n": "Strixhaven Pennant", "src": "scc", "tp": "wondrous", "rar": "common", "rarn": 1, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This magic pennant bears the symbol of Strixhaven or one of its colleges: Lorehold, Prismari, Quandrix, Silverquill, or Witherbloom. While you wave the pennant, the symbol on it glitters, and the pennant sheds bright light in a 10-foot-radius and dim light for an additional 10 feet.", "ed": "both"}, {"n": "Talarith", "src": "bam", "tp": "wondrous", "rar": "legendary", "rarn": 5, "mag": true, "att": true, "cur": false, "wt": "", "desc": "The reigar who creates this piece of jewelry chooses its form: bracelet, brooch, diadem, or necklace. While the reigar wears the talarith, any weapon wielded by the reigar deals an extra 1d6 force damage when it hits.\n\nAs an action, a reigar can use its talarith to summon a golem that looks just like the reigar. The golem obeys the reigar's commands and uses the reigar's statistics, except it is a Construct that doesn't have a talarith of its own. The golem vanishes after 1 hour, or when it is reduced to 0 hit points. After summoning a golem, the reigar must finish a short or long rest before this property can be used again.", "ed": "both"}, {"n": "Talisman of Pure Good", "src": "dmg", "tp": "wondrous", "rar": "legendary", "rarn": 5, "mag": true, "att": true, "cur": false, "wt": "1 lb", "desc": "(requires attunement by a cleric or paladin)\n\nThis talisman is a mighty symbol of goodness. A Fiend or an Undead that touches the talisman takes 8d6 Radiant damage and takes the damage again each time it ends its turn holding or carrying the talisman.\n\nHoly Symbol. You can use the talisman as a Holy Symbol. You gain a +2 bonus to spell attack rolls while you wear or hold it.\n\nPure Rebuke. The talisman has 7 charges. While wearing or holding the talisman, you can take a Magic action to expend 1 charge and target one creature you can see on the ground within 120 feet of yourself. A flaming fissure opens under the target, and the target makes a DC 20 Dexterity saving throw. If the target is a Fiend or an Undead, it has Disadvantage on the save. On a failed save, the target falls into the fissure and is destroyed, leaving no remains. On a successful save, the target isn't cast into the fissure but takes 4d6 Psychic damage from the ordeal. In either case, the fissure then closes, leaving no trace of its existence. When you expend the last charge, the talisman disperses into motes of golden light and is destroyed", "ed": "both"}, {"n": "Talisman of the Sphere", "src": "dmg", "tp": "wondrous", "rar": "legendary", "rarn": 5, "mag": true, "att": true, "cur": false, "wt": "1 lb", "desc": "While holding or wearing this talisman, you have Advantage on any Intelligence (Arcana) check you make to control a Sphere of Annihilation. In addition, when you start your turn in control of a Sphere of Annihilation, you can take a Magic action to move it 10 feet plus a number of additional feet equal to 10 times your Intelligence modifier. This movement doesn't have to be in a straight line", "ed": "both"}, {"n": "Talisman of Ultimate Evil", "src": "dmg", "tp": "wondrous", "rar": "legendary", "rarn": 5, "mag": true, "att": true, "cur": false, "wt": "1 lb", "desc": "This item symbolizes unrepentant evil. A creature that isn't a Fiend or an Undead that touches the talisman takes 8d6 Necrotic damage and takes the damage again each time it ends its turn holding or carrying the talisman.\n\nHoly Symbol. You can use the talisman as a Holy Symbol. You gain a +2 bonus to spell attack rolls while you wear or hold it.\n\nUltimate End. The talisman has 6 charges. While wearing or holding the talisman, you can take a Magic action to expend 1 charge and target one creature you can see on the ground within 120 feet of yourself. A flaming fissure opens under the target, and the target makes a DC 20 Dexterity saving throw. If the target is a Celestial, it has Disadvantage on the save. On a failed save, the target falls into the fissure and is destroyed, leaving no remains. On a successful save, the target isn't cast into the fissure but takes 4d6 Psychic damage from the ordeal. In either case, the fissure then closes, leaving no trace of its existence. When you expend the last charge, the talisman dissolves into foul-smelling slime and is destroyed", "ed": "both"}, {"n": "Talking Doll", "src": "dmg", "tp": "wondrous", "rar": "common", "rarn": 1, "mag": true, "att": true, "cur": false, "wt": "", "desc": "While this doll is within 5 feet of you, you can spend a Short Rest telling it to say up to six phrases, none of which can be more than six words long, and set a condition under which the doll speaks each phrase. You can also replace old phrases with new ones. Whatever the condition, it must occur within 5 feet of the doll to make it speak. For example, whenever someone picks up the doll, it might say, \"I want a piece of candy.\" The doll's phrases are lost when your Attunement to the doll ends", "ed": "both"}, {"n": "Tankard", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "A tankard holds 1 pint of liquid.", "ed": "both"}, {"n": "Tankard of Sobriety", "src": "dmg", "tp": "wondrous", "rar": "", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This tankard has a stern face sculpted into one side. You can drink ale, wine, or any other nonmagical alcoholic beverage poured into it without becoming inebriated. The tankard has no effect on magical liquids or harmful substances such as poison", "ed": "2024"}, {"n": "Tasha's Creeping Keelboat", "src": "ditlcot", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This magic vehicle is a boat 10 feet wide and 30 feet long. It has four legs that propel it across land and water. It has a walking and swimming speed of 20 feet, but it can't travel underwater. The boat moves according to your spoken directions while you are riding it, and creatures of your choice gain a +1 bonus to their Armor Class while on the boat.\n\nThe boat can transport up to 1,000 pounds without hindrance. It can carry up to twice this weight, but it moves at half speed if it carries more than its normal capacity.", "ed": "both"}, {"n": "Telescopic Transporter", "src": "bmt", "tp": "wondrous", "rar": "legendary", "rarn": 5, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This enormous telescope allows you to view distant celestial objects, including stars, Wildspace systems, and Astral Sea phenomena like the cities of deities or the petrified husks of dead gods.\n\nAfter spending 1 hour calibrating the telescope, you can attempt to travel to the planet or celestial body at which the telescope is currently pointed. At the end of the hour, make a DC 17 Intelligence (Arcana) check. On a successful check, you and eight other willing creatures touching the telescope, along with everything all travelers are wearing and carrying, safely teleport to unoccupied spaces at the intended destination. On a failed check, a mishap occurs instead. The DM rolls on the Telescope Travel Mishaps table to determine the mishap or chooses a mishap that's good for the campaign.\n\nTelescope Travel Mishaps\n| d6 | Mishap |\n| --- | --- |\n| 1 | The travelers appear adrift in the Astral Sea. |\n| 2 | The travelers appear on a different plane of existence, determined randomly or chosen by the DM. |\n| 3 | Excess cosmic energy overloads the telescope, causing it to explode. Each creature within 60 feet of the telescope takes 8d6 necrotic damage. Any Humanoid who survives this damage is transformed into a different kind of creature, as if it had been subject to the Reincarnate spell. |\n| 4 | A creature from the Astral Sea (such as a githyanki knight) appears within 60 feet of the telescope. The DM decides its attitude. |\n| 5 | The travelers appear on a different planet or celestial body in the Wildspace system nearest to their target destination. |\n| 6 | The travelers arrive at their intended destination, but they each appear coated in harmless slime. |", "ed": "both"}, {"n": "Tent", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "20 lb", "desc": "A Tent sleeps up to two Small or Medium creatures", "ed": "2024"}, {"n": "Tentacle Rod", "src": "dmg", "tp": "rod", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "2 lb", "desc": "Made by the drow, this rod is a magic weapon that ends in three rubbery tentacles. While holding the rod, you can use an action to direct each tentacle to attack a creature you can see within 15 feet of you. Each tentacle makes a melee attack roll with a +9 bonus. On a hit, the tentacle deals 1d6 bludgeoning damage. If you hit a target with all three tentacles, it must make a DC 15 Constitution saving throw. On a failure, the creature's speed is halved, it has disadvantage on Dexterity saving throws, and it can't use reactions for 1 minute. Moreover, on each of its turns, it can take either an action or a bonus action, but not both. At the end of each of its turns, it can repeat the saving throw, ending the effect on itself on a success.", "ed": "both"}, {"n": "Thieves' Tools", "src": "phb", "tp": "tool", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "Ability: Dexterity\n\nUtilize: Pick a lock (DC 15), or disarm a trap (DC 15)\n\nIf you have proficiency with a tool, add your Proficiency Bonus to any ability check you make that uses the tool. If you have proficiency in a skill that's used with that check, you have Advantage on the check too", "ed": "both"}, {"n": "Three-Dragon Ante Set", "src": "phb", "tp": "gaming_set", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "Ability: Wisdom\n\nUtilize: Discern whether someone is cheating (DC 10), or win the game (DC 20)\n\nIf you have proficiency with a tool, add your Proficiency Bonus to any ability check you make that uses the tool. If you have proficiency in a skill that's used with that check, you have Advantage on the check too", "ed": "both"}, {"n": "Thunderbuss", "src": "bgg", "tp": "weapon", "rar": "very_rare", "rarn": 99, "mag": false, "att": false, "cur": false, "wt": "3 lb", "desc": "This magic ranged weapon is a flared pistol with the storm rune engraved along the barrel. You gain a +1 bonus to attack and damage rolls made with it. It requires no ammunition, its damage is thunder instead of piercing, and it doesn't have the loading property.\n\nInvoking the Rune\nAs a bonus action, you can invoke the weapon's rune to launch a ball of energy to a point you can see within 30 feet of yourself. The energy then detonates into a 10-foot-radius sphere of turbulent wind and thunder centered on that point, and each creature in that sphere must make a DC 14 Constitution saving throw. On a failed save, a creature takes 3d6 thunder damage, and it can't take reactions until the end of your next turn. On a successful save, a creature takes half as much damage only.\n\nOnce the rune has been invoked, it can't be invoked again until the next dawn.\n\nIt's up to you to decide whether a character has proficiency with a firearm. During their downtime, characters can train to acquire proficiency, assuming that they have enough ammunition to keep the weapons working while mastering their use.", "ed": "both"}, {"n": "Tinderbox", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "A Tinderbox is a small container holding flint, fire steel, and tinder (usually dry cloth soaked in light oil) used to kindle a fire. Using it to light a Candle, Lamp, Lantern, or Torch—or anything else with exposed fuel—takes a Bonus Action. Lighting any other fire takes 1 minute", "ed": "both"}, {"n": "Tinker's Tools", "src": "phb", "tp": "artisans_tools", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "10 lb", "desc": "Ability: Dexterity\n\nUtilize: Assemble a Tiny item composed of scrap, which falls apart in 1 minute (DC 20)\n\nCraft: Musket, Pistol, Bell, Bullseye Lantern, Flask, Hooded Lantern, Hunting Trap, Lock, Manacles, Mirror, Shovel, Signal Whistle, Tinderbox\n\nArtisan's Tools are each focused on crafting items and pursuing a trade. Each type of Artisan's Tools tools requires a separate proficiency.\n\nIf you have proficiency with a tool, add your Proficiency Bonus to any ability check you make that uses the tool. If you have proficiency in a skill that's used with that check, you have Advantage on the check too", "ed": "both"}, {"n": "Tome of Clear Thought", "src": "dmg", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "5 lb", "desc": "This book contains memory and logic exercises, and its words are charged with magic. If you spend 48 hours over a period of 6 days or fewer studying the book's contents and practicing its guidelines, your Intelligence score increases by 2, as does your maximum for that score. The manual then loses its magic, but regains it in a century", "ed": "both"}, {"n": "Tome of Leadership and Influence", "src": "dmg", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "5 lb", "desc": "This book contains guidelines for influencing and charming others, and its words are charged with magic. If you spend 48 hours over a period of 6 days or fewer studying the book's contents and practicing its guidelines, your Charisma score increases by 2, as does your maximum for that score. The manual then loses its magic, but regains it in a century", "ed": "both"}, {"n": "Tome of the Stilled Tongue", "src": "dmg", "tp": "wondrous", "rar": "legendary", "rarn": 5, "mag": true, "att": true, "cur": false, "wt": "5 lb", "desc": "This book has a desiccated tongue pinned to its front cover. Five of these tomes exist, and it's unknown which one is the original. The tongue on the first Tome of the Stilled Tongue belonged to a treacherous former servant of the lich Vecna. The tongues pinned to the covers of the four copies came from other spellcasters who crossed Vecna. The first few pages of each tome are filled with indecipherable scrawls. The remaining pages are blank.\n\nWhile attuned to this item, you can use it as a Spellbook and an Arcane Focus. In addition, while holding the tome, you can take a Bonus Action to cast a spell you have written in this tome, without expending a spell slot or using any Verbal or Somatic components. Once used, this property of the tome can't be used again until the next dawn.\n\nOnly you can remove the tongue from the book's cover. If you do so, all spells written in the book are permanently erased.\n\nVecna watches anyone using this tome and can write cryptic messages in it. These messages typically fade away after they are read", "ed": "both"}, {"n": "Tome of Understanding", "src": "dmg", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "5 lb", "desc": "This book contains intuition and insight exercises, and its words are charged with magic. If you spend 48 hours over a period of 6 days or fewer studying the book's contents and practicing its guidelines, your Wisdom score increases by 2, as does your maximum for that score. The manual then loses its magic, but regains it in a century", "ed": "both"}, {"n": "Torch", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "A Torch burns for 1 hour, casting Bright Light in a 20-foot radius and Dim Light for an additional 20 feet. When you take the Attack action, you can attack with the Torch, using it as a Simple Melee weapon. On a hit, the target takes 1 Fire damage", "ed": "both"}, {"n": "Torpor", "src": "dmg", "tp": "poison", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "A creature subjected to Torpor poison must succeed on a DC 15 Constitution saving throw or have the Poisoned condition for 4d6 hours. The creature's Speed is halved while the creature is Poisoned in this way", "ed": "both"}, {"n": "Totem", "src": "phb", "tp": "spellcasting_focus", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "", "ed": "both"}, {"n": "Traveler's Clothes", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "4 lb", "desc": "Traveler's Clothes are resilient garments designed for travel in various environments", "ed": "both"}, {"n": "Trinket", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "When you make your character, you can roll once on the Trinkets table to gain a Tiny trinket, a simple item lightly touched by mystery. The DM might also use this table. It can help stock a room in a dungeon or fill a creature's pockets.\n\nTrinkets\n| 1d100 | Trinket |\n| --- | --- |\n| 01 | A mummified goblin hand |\n| 02 | A crystal that faintly glows in moonlight |\n| 03 | A gold coin minted in an unknown land |\n| 04 | A diary written in a language you don't know |\n| 05 | A brass ring that never tarnishes |\n| 06 | An old chess piece made from glass |\n| 07 | A pair of knucklebone dice, each with a skull symbol on the side that would normally show six pips |\n| 08 | A small idol depicting a nightmarish creature that gives you unsettling dreams when you sleep near it |\n| 09 | A lock of someone's hair |\n| 10 | The deed for a parcel of land in a realm unknown to you |\n| 11 | A 1-ounce block made from an unknown material |\n| 12 | A small cloth doll skewered with needles |\n| 13 | A tooth from an unknown beast |\n| 14 | An enormous scale, perhaps from a dragon |\n| 15 | A bright-green feather |\n| 16 | An old divination card bearing your likeness |\n| 17 | A glass orb filled with moving smoke |\n| 18 | A 1-pound egg with a bright-red shell |\n| 19 | A pipe that blows bubbles |\n| 20 | A glass jar containing a bit of flesh floating in pickling fluid |\n| 21 | A gnome-crafted music box that plays a song you dimly remember from your childhood |\n| 22 | A wooden statuette of a smug halfling |\n| 23 | A brass orb etched with strange runes |\n| 24 | A multicolored stone disk |\n| 25 | A silver icon of a raven |\n| 26 | A bag containing forty-seven teeth, one of which is rotten |\n| 27 | A shard of obsidian that always feels warm to the touch |\n| 28 | A dragon's talon strung on a leather necklace |\n| 29 | A pair of old socks |\n| 30 | A blank book whose pages refuse to hold ink, chalk, graphite, or any other marking |\n| 31 | A silver badge that is a five-pointed star |\n| 32 | A knife that belonged to a relative |\n| 33 | A glass vial filled with nail clippings |\n| 34 | A rectangular metal device with two tiny metal cups on one end that throws sparks when wet |\n| 35 | A white, sequined glove sized for a human |\n| 36 | A vest with one hundred tiny pockets |\n| 37 | A weightless stone |\n| 38 | A sketch of a goblin |\n| 39 | An empty glass vial that smells of perfume |\n| 40 | A gemstone that looks like a lump of coal when examined by anyone but you |\n| 41 | A scrap of cloth from an old banner |\n| 42 | A rank insignia from a lost legionnaire |\n| 43 | A silver bell without a clapper |\n| 44 | A mechanical canary inside a lamp |\n| 45 | A miniature chest carved to look like it has numerous feet on the bottom |\n| 46 | A dead sprite inside a clear glass bottle |\n| 47 | A metal can that has no opening but sounds as if it is filled with liquid, sand, spiders, or broken glass (your choice) |\n| 48 | A glass orb filled with water, in which swims a clockwork goldfish |\n| 49 | A silver spoon with an M engraved on the handle |\n| 50 | A whistle made from gold-colored wood |\n| 51 | A dead scarab beetle the size of your hand |\n| 52 | Two toy soldiers, one missing a head |\n| 53 | A small box filled with different-sized buttons |\n| 54 | A candle that can't be lit |\n| 55 | A miniature cage with no door |\n| 56 | An old key |\n| 57 | An indecipherable treasure map |\n| 58 | A hilt from a broken sword |\n| 59 | A rabbit's foot |\n| 60 | A glass eye |\n| 61 | A cameo of a hideous person |\n| 62 | A silver skull the size of a coin |\n| 63 | An alabaster mask |\n| 64 | A cone of sticky black incense that stinks |\n| 65 | A nightcap that gives you pleasant dreams when you wear it |\n| 66 | A single caltrop made from bone |\n| 67 | A gold monocle frame without the lens |\n| 68 | A 1-inch cube, each side a different color |\n| 69 | A crystal doorknob |\n| 70 | A packet filled with pink dust |\n| 71 | A fragment of a beautiful song, written as musical notes on two pieces of parchment |\n| 72 | A silver teardrop earring containing a real teardrop |\n| 73 | An eggshell painted with scenes of misery in disturbing detail |\n| 74 | A fan that, when unfolded, shows a sleepy cat |\n| 75 | A set of bone pipes |\n| 76 | A four-leaf clover pressed inside a book discussing manners
