st of Corrosion", "src": "wbtw", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "1 lb", "desc": "As an action, you can throw this dust into the air, filling a 10-foot cube that extends out from you. Surfaces and objects made of nonmagical ferrous metal in the area instantly corrode and turn to dust, becoming useless and unsalvageable. Any creature in the area that is made wholly or partly out of ferrous metal must make a DC 13 Constitution saving throw, taking 4d8 necrotic damage on a failed save, or half as much damage on a successful one.\n\nFound in a small packet, this dust is made from finely ground rust monster antennae. There is enough dust in each packet for one use.", "ed": "both"}, {"n": "Dust of Deliciousness", "src": "egw", "tp": "wondrous", "rar": "unknown", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "1 lb", "desc": "This reddish brown dust can be sprinkled over any edible substance to greatly improve the flavor. The dust also dulls the eater’s senses: anyone eating food treated with this dust has disadvantage on Wisdom ability checks and Wisdom saving throws for 1 hour. There is enough dust to flavor six servings.", "ed": "both"}, {"n": "Dust of Disappearance", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This powder resembles fine sand. There is enough of it for one use. When you take a Utilize action to throw the dust into the air, you and each creature and object within a 10-foot Emanation originating from you have the Invisible condition for 2d4 minutes. The duration is the same for all subjects, and the dust is consumed when its magic takes effect. Immediately after an affected creature makes an attack roll, deals damage, or casts a spell, the Invisible condition ends for that creature", "ed": "both"}, {"n": "Dust of Dryness", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This small packet contains 1d6 + 4 pinches of dust. As a Utilize action, you can sprinkle a pinch of the dust over water, turning up to a 15-foot Cube of water into one marble-sized pellet, which floats or rests near where the dust was sprinkled. The pellet's weight is negligible. A creature can take a Utilize action to smash the pellet against a hard surface, causing the pellet to shatter and release the water the dust absorbed. Doing so destroys the pellet and ends its magic.\n\nAs a Utilize action, you can sprinkle a pinch of the dust on an Elemental within 5 feet of yourself that is composed mostly of water (such as a Water Elemental or a Water Weird). Such a creature exposed to a pinch of the dust makes a DC 13 Constitution saving throw, taking 10d6 Necrotic damage on a failed save or half as much damage on a successful one", "ed": "both"}, {"n": "Dust of Sneezing and Choking", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "", "desc": "Found in a small container, this powder resembles Dust of Disappearance, and Identify reveals it to be such. There is enough of it for one use.\n\nAs a Utilize action, you can throw the dust into the air, forcing yourself and every creature in a 30-foot Emanation originating from you to make a DC 15 Constitution saving throw. Constructs, Elementals, Oozes, Plants, and Undead succeed on the save automatically.\n\nOn a failed save, a creature begins sneezing uncontrollably; it has the Incapacitated condition and is suffocating. The creature repeats the save at the end of each of its turns, ending the effect on itself on a success. The effect also ends on any creature targeted by a Lesser Restoration spell", "ed": "both"}, {"n": "Dwarven Plate", "src": "dmg", "tp": "armor", "rar": "very_rare", "rarn": 99, "mag": false, "att": false, "cur": false, "wt": "65 lb", "desc": "While wearing this armor, you gain a +2 bonus to AC. In addition, if an effect moves you against your will along the ground, you can use your reaction to reduce the distance you are moved by up to 10 feet.", "ed": "both"}, {"n": "Dynamite (stick)", "src": "dmg", "tp": "explosive", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "As an action, a creature can light a stick of dynamite and throw it at a point up to 60 feet away. Each creature within 5 feet of that point must make a DC 12 Dexterity saving throw, taking 3d6 bludgeoning damage on a failed save, or half as much damage on a successful one.\n\nA character can bind sticks of dynamite together so they explode at the same time. Each additional stick increases the damage by 1d6 (to a maximum of 10d6) and the burst radius by 5 feet (to a maximum of 20 feet).\n\nDynamite can be rigged with a longer fuse to explode after a set amount of time, usually 1 to 6 rounds. Roll initiative for the dynamite. After the set number of rounds goes by, the dynamite explodes on that initiative.", "ed": "5e"}, {"n": "Ear Horn of Hearing", "src": "dmg", "tp": "wondrous", "rar": "", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "", "desc": "While held up to your ear, this horn suppresses the effects of the Deafened condition on you", "ed": "2024"}, {"n": "Efreeti Bottle", "src": "dmg", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "", "desc": "When you take a Magic action to remove the stopper of this painted brass bottle, a cloud of thick smoke flows out of it. At the end of your turn, the smoke disappears with a flash of harmless fire, and an Efreeti appears in an unoccupied space within 30 feet of you.\n\nThe first time the bottle is opened, the DM rolls on the following table to determine what happens.\n\n| 1d10 | Effect |\n| --- | --- |\n| 1 | The efreeti attacks you. After fighting for 5 rounds, the efreeti disappears, and the bottle loses its magic. |\n| 2-9 | The efreeti understands your languages and obeys your commands for 1 hour, after which it returns to the bottle, and a new stopper contains it. The stopper can't be removed for 24 hours. The next two times the bottle is opened, the same effect occurs. If the bottle is opened a fourth time, the efreeti escapes and disappears, and the bottle loses its magic. |\n| 10 | The efreeti understands your languages and can cast Wish once for you. It disappears when it grants the wish or after 1 hour, and the bottle loses its magic |", "ed": "both"}, {"n": "Eldritch Claw Tattoo", "src": "tce", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": true, "cur": false, "wt": "", "desc": "Produced by a special needle, this magic tattoo depicts clawlike forms and other jagged shapes.\n\nTattoo Attunement: To attune to this item, you hold the needle to your skin where you want the tattoo to appear, pressing the needle there throughout the attunement process. When the attunement is complete, the needle turns into the ink that becomes the tattoo, which appears on the skin.\n\nIf your attunement to the tattoo ends, the tattoo vanishes, and the needle reappears in your space.\n\nMagical Strikes: While the tattoo is on your skin, your unarmed strikes are considered magical for the purpose of overcoming immunity and resistance to nonmagical attacks, and you gain a +1 bonus to attack and damage rolls with unarmed strikes.\n\nEldritch Maul: As a bonus action, you can empower the tattoo for 1 minute. For the duration, each of your melee attacks with a weapon or an unarmed strike can reach a target up to 15 feet away from you, as inky tendrils launch toward the target. In addition, your melee attacks deal an extra 1d6 force damage on a hit. Once used, this bonus action can't be used again until the next dawn.", "ed": "both"}, {"n": "Elemental Gem, Blue Sapphire", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This gem contains a mote of elemental energy. When you take a Utilize action to break the gem, an Air Elemental is summoned, and the gem ceases to be magical. The elemental appears in an unoccupied space as close to the broken gem as possible, understands your languages, obeys your commands, and takes its turn immediately after you on your Initiative count. The elemental disappears after 1 hour, when it dies, or when you dismiss it as a Bonus Action", "ed": "both"}, {"n": "Elemental Gem, Emerald", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This gem contains a mote of elemental energy. When you take a Utilize action to break the gem, a Water Elemental is summoned, and the gem ceases to be magical. The elemental appears in an unoccupied space as close to the broken gem as possible, understands your languages, obeys your commands, and takes its turn immediately after you on your Initiative count. The elemental disappears after 1 hour, when it dies, or when you dismiss it as a Bonus Action", "ed": "both"}, {"n": "Elemental Gem, Red Corundum", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This gem contains a mote of elemental energy. When you take a Utilize action to break the gem, a Fire Elemental is summoned, and the gem ceases to be magical. The elemental appears in an unoccupied space as close to the broken gem as possible, understands your languages, obeys your commands, and takes its turn immediately after you on your Initiative count. The elemental disappears after 1 hour, when it dies, or when you dismiss it as a Bonus Action", "ed": "both"}, {"n": "Elemental Gem, Yellow Diamond", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This gem contains a mote of elemental energy. When you take a Utilize action to break the gem, an Earth Elemental is summoned, and the gem ceases to be magical. The elemental appears in an unoccupied space as close to the broken gem as possible, understands your languages, obeys your commands, and takes its turn immediately after you on your Initiative count. The elemental disappears after 1 hour, when it dies, or when you dismiss it as a Bonus Action", "ed": "both"}, {"n": "Elephant", "src": "phb", "tp": "mount", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "Speed: 40, Carrying Capacity: 1320 lb", "ed": "both"}, {"n": "Elixir of Health", "src": "dmg", "tp": "potion", "rar": "rare", "rarn": 3, "mag": true, "att": false, "cur": false, "wt": "", "desc": "When you drink this potion, you are cured of all magical contagions. In addition, the following conditions end on you: Blinded, Deafened, Paralyzed, and Poisoned.\n\nThe clear, red liquid has tiny bubbles of light in it", "ed": "both"}, {"n": "Elven Chain", "src": "dmg", "tp": "armor", "rar": "rare", "rarn": 3, "mag": false, "att": false, "cur": false, "wt": "20 lb", "desc": "You gain a +1 bonus to AC while you wear this armor. You are considered proficient with this armor even if you lack proficiency with medium armor.", "ed": "both"}, {"n": "Emblem", "src": "phb", "tp": "spellcasting_focus", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "For an Emblem to be an effective Holy Symbol, it must be borne on fabric (such as a tabard or banner) or a Shield.\n\nA Holy Symbol takes a specific form and is bejeweled or painted to channel divine magic. A Cleric or Paladin can use a Holy Symbol as a Spellcasting Focus", "ed": "both"}, {"n": "Emerald Pen", "src": "ftd", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This pen is tipped with an emerald nib and requires no ink to write. While holding this pen, you can cast illusory script at will, requiring no material components.", "ed": "both"}, {"n": "Enduring Spellbook", "src": "dmg", "tp": "wondrous", "rar": "", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This spellbook, along with anything written on its pages, can't be damaged by fire or water. In addition, the spellbook doesn't deteriorate with age", "ed": "2024"}, {"n": "Energy Cell", "src": "dmg", "tp": "ammunition", "rar": "common", "rarn": 1, "mag": false, "att": false, "cur": false, "wt": "", "desc": "", "ed": "both"}, {"n": "Entertainer's Pack", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "An Entertainer's Pack contains the following items: Backpack, Bedroll, Bell, Bullseye Lantern, 3 Costumes, Mirror, 8 flasks of Oil, 9 days of Rations, Tinderbox, and Waterskin", "ed": "both"}, {"n": "Ersatz Eye", "src": "dmg", "tp": "tool", "rar": "common", "rarn": 1, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This magical eye replaces a real one that was lost or removed. While the Ersatz Eye is embedded in your eye socket, you can see through the tiny orb as though it were your natural eye. You can insert or remove the Ersatz Eye as a Magic action, and it can't be removed against your will while you are alive", "ed": "both"}, {"n": "Essence of Ether", "src": "dmg", "tp": "poison", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "A creature subjected to Essence of Ether must succeed on a DC 15 Constitution saving throw or have the Poisoned condition for 8 hours. The creature also has the Unconscious condition while Poisoned in this way. The creature wakes up if it takes damage or if another creature takes an action to shake it awake", "ed": "both"}, {"n": "Eversmoking Bottle", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "", "desc": "As a Magic action, you can open or close this bottle.\n\nOpening the bottle causes thick smoke to billow out, forming a cloud that fills a 60-foot Emanation originating from the bottle. The area within the smoke is Heavily Obscured.\n\nEach minute the bottle remains open, the size of the Emanation increases by 10 feet until it reaches its maximum size of 120 feet.\n\nClosing the bottle causes the cloud to become fixed in place until it disperses after 10 minutes. A strong wind (such as that created by the Gust of Wind spell) disperses the cloud after 1 minute", "ed": "both"}, {"n": "Exotic Saddle", "src": "phb", "tp": "tack_and_harness", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "40 lb", "desc": "A saddle comes with a bit, a bridle, reins, and any other equipment needed to use the saddle. An Exotic Saddle is required for riding an aquatic or a flying mount", "ed": "both"}, {"n": "Explorer's Pack", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "55 lb", "desc": "An Explorer's Pack contains the following items: Backpack, Bedroll, 2 flasks of Oil, 10 days of Rations, Rope, Tinderbox, 10 Torches, and Waterskin", "ed": "both"}, {"n": "Eye of Vecna", "src": "dmg", "tp": "wondrous", "rar": "artifact", "rarn": 6, "mag": true, "att": true, "cur": false, "wt": "", "desc": "Vecna was a mighty wizard who, through magic and conquest, forged a terrible empire. For all his power, however, Vecna feared death and took steps to prevent his demise by becoming a lich.\n\nA treacherous lieutenant named Kas brought Vecna's rule to an end in a terrible battle. Of Vecna, all that remained were one hand and one eye, grisly Artifacts that still seek to work Vecna's will in the world.\n\nThe Eye of Vecna and the Hand of Vecna are separate Artifacts that might be found together or separately. The eye looks like a bloodshot organ torn free from the socket. The hand is a shriveled left extremity.\n\nRandom Properties of the Eye and Hand. The Eye of Vecna has the following random properties:\n\n- 1 minor beneficial property\n- 1 major beneficial property\n- 1 minor detrimental property\n\nAttuning to the Eye. To attune to the eye, you must press it into your empty socket. The eye grafts itself to your head and remains there until you die. If the eye is ever removed, you die.\n\nProperties of the Eye. While you are attuned to the eye, your alignment is Neutral Evil, and you gain the following benefits:\n\nTruesight. You have Truesight out to 240 feet.\n\nSpellcasting. The eye has 8 charges and regains 1d4 + 4 expended charges daily at dawn. You can cast a spell on the Eye of Vecna Spells table from the eye (save DC 18). The table indicates how many charges you must expend to cast the spell. Each time you cast a spell from the eye, there is a 5 percent chance that Vecna tears your soul from your body, devours it, and then takes control of the body like a puppet. If that happens, you become an NPC under the DM's control.\n\n| Spell | Charge Cost |\n| --- | --- |\n| Clairvoyance | 2 |\n| Crown of Madness | 1 |\n| Disintegrate | 4 |\n| Dominate Monster | 5 |\n| Eyebite | 4 |\n\nX-ray Vision. You can take a Magic action to gain X-ray vision with a range of 30 feet for 1 minute. To you, solid objects within that radius appear transparent and don't prevent light from passing through themselves. The vision can penetrate 1 foot of stone, 1 inch of common metal, or up to 3 feet of wood or dirt. Thicker substances block the vision, as does a thin sheet of lead.\n\nDestroying the Eye and Hand. If the Eye of Vecna and the Hand of Vecna are both attached to the same creature and that creature is slain by the Sword of Kas, both the eye and the hand burst into flame, turn to ash, and are destroyed. Any other attempt to destroy the eye or hand seems to work, but the Artifact reappears in one of Vecna's many hidden vaults, where it waits to be rediscovered.", "ed": "both"}, {"n": "Eyes of Charming", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": true, "cur": false, "wt": "", "desc": "These crystal lenses fit over the eyes. They have 3 charges. While wearing them, you can expend 1 or more charges to cast Charm Person (save DC 13). For 1 charge, you cast the level 1 version of the spell. You increase the spell's level by one for each additional charge you expend. The lenses regain all expended charges daily at dawn", "ed": "both"}, {"n": "Eyes of Minute Seeing", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "", "desc": "These crystal lenses fit over the eyes. While wearing them, your vision improves significantly out to a range of 1 foot, granting you Darkvision within that range and Advantage on Intelligence (Investigation) checks made to examine something within that range", "ed": "both"}, {"n": "Eyes of the Eagle", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": true, "cur": false, "wt": "", "desc": "These crystal lenses fit over the eyes. While wearing them, you have Advantage on Wisdom (Perception) checks that rely on sight. In conditions of clear visibility, you can make out details of even extremely distant creatures and objects as small as 2 feet across", "ed": "both"}, {"n": "Fabulist Gem", "src": "bmt", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This glittering red gem is commonly found embedded in a ring or brooch.\n\nWhile wearing the gem, you gain the following benefits.\n\nCounterfeit Coins\nYou can use your action to magically create a pile of coins, worth no more than 100 gp total, in an unoccupied space within 10 feet of yourself. The pile must appear on a surface that can support it. After 1 hour, the coins vanish, regardless of where they are. Once this action is used, it can't be used again until the next dawn.\n\nIllusory Fashion\nAs a bonus action, you can magically change the appearance of your clothing and armor. You can change the style, color, and apparent quality of what you're wearing, or you can make it appear as if you were wearing different garments entirely. In either case, the changes wrought by this magic fail to pass physical inspection.", "ed": "both"}, {"n": "Fargab", "src": "dsotdq", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "These backpack-sized devices are created in pairs, with matching numbers engraved on them, and allow communication over a long distance using radio frequencies. While wearing a fargab, you can use an action to speak into the device's mouthpiece and send a short message of twenty-five words or less to another creature wearing the matched fargab while it is within 18 miles of you. The message emits from the speakers of the device and can be heard up to 10 feet away from the device. If no creature is wearing the fargab, the speakers make static noises instead.", "ed": "both"}, {"n": "Feed (per day)", "src": "phb", "tp": "tack_and_harness", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "10 lb", "desc": "", "ed": "both"}, {"n": "Figurine of Wondrous Power, Bronze Griffon", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": false, "cur": false, "wt": "", "desc": "A Figurine of Wondrous Power is a statuette small enough to fit in a pocket. If you take a Magic action to throw the figurine to a point on the ground within 60 feet of yourself, the figurine becomes a living creature specified in the figurine's description below. If the space where the creature would appear is occupied by other creatures or objects, or if there isn't enough space for the creature, the figurine doesn't become a creature.\n\nThe creature is Friendly to you and your allies. It understands your languages, obeys your commands, and takes its turn immediately after you on your Initiative count. If you issue no commands, the creature defends itself but takes no other actions.\n\nThe creature exists for a duration specific to each figurine. At the end of the duration, the creature reverts to its figurine form. It reverts to a figurine early if its creature form drops to 0 Hit Points or if you take a Magic action while touching the creature to make it revert to figurine form. When the creature becomes a figurine again, its property can't be used again until a certain amount of time has passed, as specified below.\n\nBronze Griffon (Rare). This bronze statuette is of a griffon rampant. It can become a Griffon for up to 6 hours. Once it has been used, it can't be used again until 5 days have passed", "ed": "both"}, {"n": "Figurine of Wondrous Power, Ebony Fly", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": false, "cur": false, "wt": "", "desc": "A Figurine of Wondrous Power is a statuette small enough to fit in a pocket. If you take a Magic action to throw the figurine to a point on the ground within 60 feet of yourself, the figurine becomes a living creature specified in the figurine's description below. If the space where the creature would appear is occupied by other creatures or objects, or if there isn't enough space for the creature, the figurine doesn't become a creature.\n\nThe creature is Friendly to you and your allies. It understands your languages, obeys your commands, and takes its turn immediately after you on your Initiative count. If you issue no commands, the creature defends itself but takes no other actions.\n\nThe creature exists for a duration specific to each figurine. At the end of the duration, the creature reverts to its figurine form. It reverts to a figurine early if its creature form drops to 0 Hit Points or if you take a Magic action while touching the creature to make it revert to figurine form. When the creature becomes a figurine again, its property can't be used again until a certain amount of time has passed, as specified below.\n\nEbony Fly (Rare). This ebony statuette, carved in the likeness of a horsefly, can become a Giant Fly for up to 12 hours and can be ridden as a mount. Once it has been used, it can't be used again until 2 days have passed", "ed": "both"}, {"n": "Figurine of Wondrous Power, Golden Lions", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": false, "cur": false, "wt": "", "desc": "A Figurine of Wondrous Power is a statuette small enough to fit in a pocket. If you take a Magic action to throw the figurine to a point on the ground within 60 feet of yourself, the figurine becomes a living creature specified in the figurine's description below. If the space where the creature would appear is occupied by other creatures or objects, or if there isn't enough space for the creature, the figurine doesn't become a creature.\n\nThe creature is Friendly to you and your allies. It understands your languages, obeys your commands, and takes its turn immediately after you on your Initiative count. If you issue no commands, the creature defends itself but takes no other actions.\n\nThe creature exists for a duration specific to each figurine. At the end of the duration, the creature reverts to its figurine form. It reverts to a figurine early if its creature form drops to 0 Hit Points or if you take a Magic action while touching the creature to make it revert to figurine form. When the creature becomes a figurine again, its property can't be used again until a certain amount of time has passed, as specified below.\n\nGolden Lions (Rare). These gold statuettes of lions are always created in pairs. You can use one figurine or both simultaneously. Each can become a Lion for up to 1 hour. Once a lion has been used, it can't be used again until 7 days have passed", "ed": "both"}, {"n": "Figurine of Wondrous Power, Ivory Goats", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": false, "cur": false, "wt": "", "desc": "A Figurine of Wondrous Power is a statuette small enough to fit in a pocket. If you take a Magic action to throw the figurine to a point on the ground within 60 feet of yourself, the figurine becomes a living creature specified in the figurine's description below. If the space where the creature would appear is occupied by other creatures or objects, or if there isn't enough space for the creature, the figurine doesn't become a creature.\n\nThe creature is Friendly to you and your allies. It understands your languages, obeys your commands, and takes its turn immediately after you on your Initiative count. If you issue no commands, the creature defends itself but takes no other actions.\n\nThe creature exists for a duration specific to each figurine. At the end of the duration, the creature reverts to its figurine form. It reverts to a figurine early if its creature form drops to 0 Hit Points or if you take a Magic action while touching the creature to make it revert to figurine form. When the creature becomes a figurine again, its property can't be used again until a certain amount of time has passed, as specified below.\n\nIvory Goats (Rare). These ivory statuettes of goats are always created in sets of three. Each goat looks unique and functions differently from the others. Their properties are as follows:\n\nGoat of Terror. This figurine can become a Giant Goat for up to 3 hours. The goat can't attack, but you can (harmlessly) remove its horns and use them as weapons. One horn becomes a +1 Lance, and the other becomes a +2 Longsword. Removing a horn requires a Magic action, and the weapons disappear and the horns return when the goat reverts to figurine form. While you ride the goat, any Hostile creature that starts its turn within a 30-foot Emanation originating from the goat must succeed on a DC 15 Wisdom saving throw or have the Frightened condition for 1 minute, until you are no longer riding the goat, or until the goat reverts to figurine form. The Frightened creature repeats the save at the end of each of its turns, ending the effect on itself on a success. Once it succeeds on the save, a creature is immune to this effect for the next 24 hours. Once the figurine has been used, it can't be used again until 15 days have passed.\n\nGoat of Traveling. This figurine can become a Large goat with the same statistics as a Riding Horse. It has 24 charges, and each hour or portion thereof it spends in goat form costs 1 charge. While it has charges, you can use it as often as you wish. When it runs out of charges, it reverts to a figurine and can't be used again until 7 days have passed, when it regains all expended charges.\n\nGoat of Travail. This figurine can become a Giant Goat for up to 3 hours. Once it has been used, it can't be used again until 30 days have passed", "ed": "both"}, {"n": "Figurine of Wondrous Power, Marble Elephant", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": false, "cur": false, "wt": "", "desc": "A figurine of wondrous power is a statuette of a beast small enough to fit in a pocket. If you use an action to speak the command word and throw the figurine to a point on the ground within 60 feet of you, the figurine becomes a living creature. If the space where the creature would appear is occupied by other creatures or objects, or if there isn't enough space for the creature, the figurine doesn't become a creature.\n\nThe creature is friendly to you and your companions. It understands your languages and obeys your spoken commands. If you issue no commands, the creature defends itself but takes no other actions.\n\nThe creature exists for a duration specific to each figurine. At the end of the duration, the creature reverts to its figurine form. It reverts to a figurine early if it drops to 0 hit points or if you use an action to speak the command word again while touching it. When the creature becomes a figurine again, its property can't be used again until a certain amount of time has passed, as specified in the figurine's description.\n\nMarble Elephant.\n\nThis marble statuette is about 4 inches high and long. It can become an elephant for up to 24 hours. Once it has been used, it can't be used again until 7 days have passed.", "ed": "5e"}, {"n": "Figurine of Wondrous Power, Obsidian Steed", "src": "dmg", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "", "desc": "A Figurine of Wondrous Power is a statuette small enough to fit in a pocket. If you take a Magic action to throw the figurine to a point on the ground within 60 feet of yourself, the figurine becomes a living creature specified in the figurine's description below. If the space where the creature would appear is occupied by other creatures or objects, or if there isn't enough space for the creature, the figurine doesn't become a creature.\n\nThe creature is Friendly to you and your allies. It understands your languages, obeys your commands, and takes its turn immediately after you on your Initiative count. If you issue no commands, the creature defends itself but takes no other actions.\n\nThe creature exists for a duration specific to each figurine. At the end of the duration, the creature reverts to its figurine form. It reverts to a figurine early if its creature form drops to 0 Hit Points or if you take a Magic action while touching the creature to make it revert to figurine form. When the creature becomes a figurine again, its property can't be used again until a certain amount of time has passed, as specified below.\n\nObsidian Steed (Very Rare). This polished obsidian horse can become a Nightmare for up to 24 hours. The nightmare fights only to defend itself. Once it has been used, it can't be used again until 5 days have passed.\n\nThe figurine has a 10 percent chance each time you use it to ignore your orders, including a command to revert to figurine form. If you mount the nightmare while it is ignoring your orders, you and the nightmare are instantly transported to a random location on the plane of Hades, where the nightmare reverts to figurine form", "ed": "both"}, {"n": "Figurine of Wondrous Power, Onyx Dog", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": false, "cur": false, "wt": "", "desc": "A Figurine of Wondrous Power is a statuette small enough to fit in a pocket. If you take a Magic action to throw the figurine to a point on the ground within 60 feet of yourself, the figurine becomes a living creature specified in the figurine's description below. If the space where the creature would appear is occupied by other creatures or objects, or if there isn't enough space for the creature, the figurine doesn't become a creature.\n\nThe creature is Friendly to you and your allies. It understands your languages, obeys your commands, and takes its turn immediately after you on your Initiative count. If you issue no commands, the creature defends itself but takes no other actions.\n\nThe creature exists for a duration specific to each figurine. At the end of the duration, the creature reverts to its figurine form. It reverts to a figurine early if its creature form drops to 0 Hit Points or if you take a Magic action while touching the creature to make it revert to figurine form. When the creature becomes a figurine again, its property can't be used again until a certain amount of time has passed, as specified below.\n\nOnyx Dog (Rare). This onyx statuette of a dog can become a Mastiff for up to 6 hours. The mastiff has an Intelligence of 8 and can speak Common. It also has Blindsight with a range of 60 feet. Once it has been used, it can't be used again until 7 days have passed", "ed": "both"}, {"n": "Figurine of Wondrous Power, Serpentine Owl", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": false, "cur": false, "wt": "", "desc": "A Figurine of Wondrous Power is a statuette small enough to fit in a pocket. If you take a Magic action to throw the figurine to a point on the ground within 60 feet of yourself, the figurine becomes a living creature specified in the figurine's description below. If the space where the creature would appear is occupied by other creatures or objects, or if there isn't enough space for the creature, the figurine doesn't become a creature.\n\nThe creature is Friendly to you and your allies. It understands your languages, obeys your commands, and takes its turn immediately after you on your Initiative count. If you issue no commands, the creature defends itself but takes no other actions.\n\nThe creature exists for a duration specific to each figurine. At the end of the duration, the creature reverts to its figurine form. It reverts to a figurine early if its creature form drops to 0 Hit Points or if you take a Magic action while touching the creature to make it revert to figurine form. When the creature becomes a figurine again, its property can't be used again until a certain amount of time has passed, as specified below.\n\nSerpentine Owl (Rare). This serpentine statuette of an owl can become a Giant Owl for up to 8 hours. The owl can communicate telepathically with you at any range if you and it are on the same plane of existence. Once it has been used, it can't be used again until 2 days have passed", "ed": "both"}, {"n": "Figurine of Wondrous Power, Silver Raven", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "", "desc": "A Figurine of Wondrous Power is a statuette small enough to fit in a pocket. If you take a Magic action to throw the figurine to a point on the ground within 60 feet of yourself, the figurine becomes a living creature specified in the figurine's description below. If the space where the creature would appear is occupied by other creatures or objects, or if there isn't enough space for the creature, the figurine doesn't become a creature.\n\nThe creature is Friendly to you and your allies. It understands your languages, obeys your commands, and takes its turn immediately after you on your Initiative count. If you issue no commands, the creature defends itself but takes no other actions.\n\nThe creature exists for a duration specific to each figurine. At the end of the duration, the creature reverts to its figurine form. It reverts to a figurine early if its creature form drops to 0 Hit Points or if you take a Magic action while touching the creature to make it revert to figurine form. When the creature becomes a figurine again, its property can't be used again until a certain amount of time has passed, as specified below.\n\nSilver Raven (Uncommon). This silver statuette of a raven can become a Raven for up to 12 hours. Once it has been used, it can't be used again until 2 days have passed. While in raven form, the figurine grants you the ability to cast Animal Messenger on it", "ed": "both"}, {"n": "Fine Clothes", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "6 lb", "desc": "Fine Clothes are made of expensive fabrics and adorned with expertly crafted details. Some events and locations admit only people wearing these clothes", "ed": "both"}, {"n": "Fine Wine (Bottle)", "src": "phb", "tp": "food_and_drink", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "", "ed": "both"}, {"n": "Firearm Bullet", "src": "phb", "tp": "ammunition", "rar": "common", "rarn": 1, "mag": false, "att": false, "cur": false, "wt": "", "desc": "The ammunition of a firearm is destroyed upon use.\n\nFirearm Bullets are typically stored in a Pouch (bought separately)", "ed": "2024"}, {"n": "Fish Suit", "src": "aag", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This bulky suit, which fully encases your head and body, takes 1 minute to don or doff. While worn, it enables you to breathe in an airless environment and renders you immune to the harmful effects of any gas that surrounds you. The suit also grants you a swimming speed equal to your walking speed while underwater, or a flying speed equal to your walking speed in an environment with no gravity.", "ed": "both"}, {"n": "Fishing Tackle", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "4 lb", "desc": "This kit includes a wooden rod, silken line, corkwood bobbers, steel hooks, lead sinkers, velvet lures, and narrow netting.", "ed": "both"}, {"n": "Flask", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "A Flask holds up to 1 pint", "ed": "both"}, {"n": "Flour", "src": "dmg", "tp": "trade_good", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "", "ed": "both"}, {"n": "Flute", "src": "phb", "tp": "instrument", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "Ability: Charisma\n\nUtilize: Play a known tune (DC 10), or improvise a song (DC 15)\n\nIf you have proficiency with a tool, add your Proficiency Bonus to any ability check you make that uses the tool. If you have proficiency in a skill that's used with that check, you have Advantage on the check too", "ed": "both"}, {"n": "Flying Citadel Helm", "src": "dsotdq", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": true, "cur": false, "wt": "", "desc": "The function of this ornate chair is to propel and maneuver a flying citadel on which it has been installed. The chair has AC 15, 18 hit points, and immunity to poison and psychic damage. It is destroyed if reduced to 0 hit points.\n\nThe sensation of being attuned to a flying citadel helm is akin to the pins-and-needles effect one experiences after one's arm or leg falls asleep, but not as intense.\n\nWhile attuned to a flying citadel helm and sitting in it, you gain the following abilities for as long as you maintain concentration (as if concentrating on a spell):\n\n- You can use the flying citadel helm to move the citadel through the air, up to 80 feet per round, or up to 8 miles per hour.\n- You can steer the citadel, albeit in a somewhat clumsy fashion, in much the way that a rudder or oars can be used to maneuver a seafaring ship.\n- At any time, you can see and hear from the highest point outside the citadel as though you were at that location.\n\nIf no creature attuned to the helm is maintaining concentration, the citadel remains motionless in its space.\n\nTransfer Attunement\nYou can use an action or a bonus action to touch a willing spellcaster, whereupon that creature attunes to the flying citadel helm immediately, and your attunement to the flying citadel helm ends.\n\nCrash\nShould the flying citadel helm be destroyed, the citadel it is installed on loses power and begins to crumble. If the crumbling citadel is in the air, it descends at a rate of 30 feet per round, or 300 feet per minute. Any creature on the citadel or on the ground within 120 feet of the citadel when it lands must make a DC 20 Dexterity saving throw, taking 39 (6d12) bludgeoning damage on a failed save, or half as much damage on a successful one.", "ed": "both"}, {"n": "Flying Fish Ship", "src": "aag", "tp": "vehicle_space", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "Aside from space galleons, flying fish ships are the most common vessels in Wildspace, favorites among merchants and adventurers alike.\n\nA flying fish ship can float and sail on water, but it isn't built to land on the ground (the ventral fins would snap under the weight of the ship during landing, and the keel would cause the ship to roll to one side).\n\nTypical weapons on a flying fish ship include a forward-mounted mangonel and an aftmounted ballista.", "ed": "both"}, {"n": "Folding Boat", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": false, "cur": false, "wt": "4 lb", "desc": "This object appears as a wooden box that measures 12 inches long, 6 inches wide, and 6 inches deep. It weighs 4 pounds and floats. It can be opened to store items inside. This item also has three command words, each requiring a Magic action to use:\n\nFirst Command Word. The box unfolds into a Rowboat.\n\nSecond Command Word. The box unfolds into a Keelboat.\n\nThird Command Word. The Folding Boat folds back into a box if no creatures are aboard. Any objects in the vessel that can't fit inside the box remain outside the box as it folds. Any objects in the vessel that can fit inside the box do so.\n\nWhen the box becomes a vessel, its weight becomes that of a normal vessel its size, and anything that was stored in the box remains in the boat.\n\nIf either vessel is reduced to 0 Hit Points, the Folding Boat is destroyed", "ed": "both"}, {"n": "Forgery Kit", "src": "phb", "tp": "tool", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "5 lb", "desc": "Ability: Dexterity\n\nUtilize: Mimic 10 or fewer words of someone else's handwriting (DC 15), or duplicate a wax seal (DC 20)\n\nIf you have proficiency with a tool, add your Proficiency Bonus to any ability check you make that uses the tool. If you have proficiency in a skill that's used with that check, you have Advantage on the check too", "ed": "both"}, {"n": "Fragmentation Grenade", "src": "dmg", "tp": "explosive", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "As an action, a character can throw a grenade at a point up to 60 feet away. With a grenade launcher, the character can propel the grenade up to 120 feet away.\n\nEach creature within 20 feet of an exploding fragmentation grenade must make a DC 15 Dexterity saving throw, taking 5d6 piercing damage on a failed save, or half as much damage on a successful one.", "ed": "5e"}, {"n": "Galley", "src": "phb", "tp": "vehicle_water", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "Speed: 4 mph\nCarrying Capacity: 150 tons cargo\nCrew 80, AC 15, HP 500, Damage Threshold 20\n\nSpeed. A ship sailing against a strong wind moves at half speed. In a dead calm (no wind), waterborne ships can't move under sail and must be rowed. Keelboats and Rowboats are used on lakes and rivers. If going downstream, add the speed of the current (typically 3 miles per hour) to the speed of the vehicle. These vehicles can't be rowed against any significant current, but they can be pulled upstream by draft animals on the shores. A Rowboat can be carried and weighs 100 pounds.\n\nCrew. A ship larger than a Keelboat or Rowboat needs a crew of skilled hirelings (see \"Services\") to function. The minimum number of skilled hirelings needed to crew a ship depends on the type of ship.\n\nPassengers. The number of Small and Medium passengers the ship can accommodate using hammocks. A ship outfitted with private accommodations can carry one-fifth as many passengers. A passenger usually pays 5 SP per day for a hammock, but prices can vary from ship to ship. A small private cabin usually costs 2 GP per day.\n\nDamage Threshold. See the rules glossary.\n\nShip Repair. Repairs to a damaged ship can be made while the vessel is berthed. Repairing 1 Hit Point of damage requires 1 day and costs 20 GP for materials and labor. If the repairs are made in a location where supplies and skilled labor are abundant, such as a city shipyard, the repair time and cost are halved", "ed": "both"}, {"n": "Gate Warden Trinket", "src": "sato", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "| d6 | Trinket |\n| --- | --- |\n| 1 | A tiny vial pendant filled with a drop of honey that glows faintly |\n| 2 | A small lead ingot that has a strange thumbprint pressed into it and whispers when held tightly |\n| 3 | Two lodestone spheres that chime when they attract each other |\n| 4 | A smoldering pebble of coal that, while always hot, doesn't burn skin, fur, scales, or clothing |\n| 5 | A feather that sheds dim light in a 5-foot radius |\n| 6 | A ring made from a chain link that, once donned, won't come off without pulling painfully hard |", "ed": "both"}, {"n": "Gauntlets of Ogre Power", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": true, "cur": false, "wt": "", "desc": "Your Strength score is 19 while you wear these gauntlets. They have no effect on you if your Strength is already 19 or higher without them.", "ed": "both"}, {"n": "Gem of Brightness", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "1 lb", "desc": "This prism has 50 charges. While you are holding it, you can take a Magic action and use one of three command words to cause one of the following effects:\n\nFirst Command Word. The gem sheds Bright Light in a 30-foot radius and Dim Light for an additional 30 feet. This effect doesn't expend a charge. It lasts until you take a Bonus Action to repeat the command word or until you use another function of the gem.\n\nSecond Command Word. You expend 1 charge and cause the gem to fire a brilliant beam of light at one creature you can see within 60 feet of yourself. The creature must succeed on a DC 15 Constitution saving throw or have the Blinded condition for 1 minute. The creature repeats the save at the end of each of its turns, ending the effect on itself on a success.\n\nThird Command Word. You expend 5 charges and cause the gem to flare with intense light in a 30-foot Cone. Each creature in the Cone makes a saving throw as if struck by the beam created with the second command word.\n\nWhen all of the gem's charges are expended, the gem becomes a nonmagical jewel worth 50 GP", "ed": "both"}, {"n": "Gem of Seeing", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "1 lb", "desc": "This gem has 3 charges. As a Magic action, you can expend 1 charge. For the next 10 minutes, you have Truesight out to 120 feet when you peer through the gem.\n\nThe gem regains 1d3 expended charges daily at dawn", "ed": "both"}, {"n": "Ginger", "src": "dmg", "tp": "trade_good", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "", "ed": "both"}, {"n": "Glamoured Studded Leather", "src": "dmg", "tp": "armor", "rar": "rare", "rarn": 3, "mag": false, "att": false, "cur": false, "wt": "13 lb", "desc": "While wearing this armor, you gain a +1 bonus to AC. You can also use a bonus action to speak the armor's command word and cause the armor to assume the appearance of a normal set of clothing or some other kind of armor. You decide what it looks like, including color, style, and accessories, but the armor retains its normal bulk and weight. The illusory appearance lasts until you use this property again or remove the armor.", "ed": "both"}, {"n": "Glass Bottle", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "2 lb", "desc": "A bottle holds 1½ pints of liquid.", "ed": "both"}, {"n": "Glassblower's Tools", "src": "phb", "tp": "artisans_tools", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "5 lb", "desc": "Ability: Intelligence\n\nUtilize: Discern what a glass object held in the past 24 hours (DC 15)\n\nCraft: Glass Bottle, Magnifying Glass, Spyglass, Vial\n\nArtisan's Tools are each focused on crafting items and pursuing a trade. Each type of Artisan's Tools tools requires a separate proficiency.\n\nIf you have proficiency with a tool, add your Proficiency Bonus to any ability check you make that uses the tool. If you have proficiency in a skill that's used with that check, you have Advantage on the check too", "ed": "both"}, {"n": "Gloves of Missile Snaring", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": true, "cur": false, "wt": "", "desc": "If you're hit by an attack roll made with a Ranged or Thrown weapon while wearing these gloves, you can take a Reaction to reduce the damage by 1d10 plus your Dexterity modifier if you have a free hand. If you reduce the damage to 0, you can catch the ammunition or weapon if it is small enough for you to hold in that hand", "ed": "both"}, {"n": "Gloves of Swimming and Climbing", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": true, "cur": false, "wt": "", "desc": "While wearing these gloves, climbing and swimming don't cost you extra movement, and you gain a +5 bonus to Strength (Athletics) checks made to climb or swim", "ed": "both"}, {"n": "Gloves of Thievery", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "", "desc": "These gloves are invisible while worn. While wearing them, you gain a +5 bonus to Dexterity (Sleight of Hand) checks and Dexterity checks made to pick locks", "ed": "both"}, {"n": "Glowrune Pigment", "src": "bgg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This set of 1d4 + 2 small paint pots contains pigments mixed from crushed luminescent gemstones. This magical paint bestows temporary magical gifts on creatures with runes drawn on their skin with this paint.\n\nOne paint pot contains enough pigment to paint one rune. A creature can spend 10 minutes to paint one of the following runes onto itself or another creature:\n\nJourney Rune\n3 doesn't cost the painted creature extra movement.\n\nLife Rune\nThe painted creature gains 10 temporary hit points and has advantage on death saving throws.\n\nLight Rune\nThe painted creature gains darkvision to a range of 30 feet. If the painted creature already has darkvision from another source, the range of its darkvision increases by 30 feet.\n\nMountain Rune\nThe painted creature is immune to being knocked prone and has advantage on Strength and Constitution saving throws.\n\nShield Rune\nThe painted creature has advantage on Dexterity saving throws against effects that deal damage.\n\nA creature can benefit from only one painted rune at a time, so a new rune painted on a creature has no effect unless the old one is removed first. The rune's benefits last for 8 hours or until the painted creature uses its action to wipe away the rune.", "ed": "both"}, {"n": "Goat", "src": "dmg", "tp": "trade_good", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "", "ed": "both"}, {"n": "Goggles of Night", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "", "desc": "While wearing these dark lenses, you have Darkvision out to 60 feet. If you already have Darkvision, wearing the goggles increases its range by 60 feet", "ed": "both"}, {"n": "Goggles of Object Reading", "src": "egw", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": true, "cur": false, "wt": "", "desc": "These leather-framed goggles feature purple crystal lenses. While wearing the goggles, you have advantage on Intelligence (Arcana) checks made to reveal information about a creature or object you can see.\n\nIn addition, you can cast the identify spell using the googles. Once you do so, you can’t do so again until the next dawn.", "ed": "both"}, {"n": "Gold", "src": "dmg", "tp": "trade_good", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "", "ed": "both"}, {"n": "Gold Canary Figurine of Wondrous Power", "src": "ftd", "tp": "wondrous", "rar": "legendary", "rarn": 5, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This gold statuette is carved in the likeness of a canary and is small enough to fit in a pocket. If you use an action to speak the command word and throw the figurine to a point on the ground within 60 feet of you, the figurine becomes a living creature in one of two forms (you choose). If there isn't enough space for the creature where it would appear, the figurine doesn't become a creature. The two forms are as follows:\n\nGiant Canary Form\nThe figurine becomes a giant canary for up to 8 hours and can be ridden as a mount. Once the figurine has become a giant canary, it can't be used this way again until the next dawn.\n\nGold Dragon Form\nWhile you are missing half or more of your hit points, you can speak a different command word and the figurine becomes an adult gold dragon (see its stat block in the Bestiary) for up to 1 hour. The dragon can't use any legendary actions or lair actions. Once the figurine has become an adult gold dragon, it can't be used this way again until 1 year has passed.\n\nIn either form, the creature is friendly to you and your companions. It understands your languages and obeys your spoken commands. If you issue no commands, the creature defends itself but takes no other actions.\n\nThe creature exists for a duration specific to each form. At the end of the duration, the creature reverts to its figurine form. It reverts to a figurine early if it drops to 0 hit points or if you use an action to speak the command word again while touching it. When the creature becomes a figurine again, its property can't be used again until a certain amount of time has passed, as specified in the description.", "ed": "both"}, {"n": "Goose Egg Trinket", "src": "bgg", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "Sometimes, an egg laid by a giant goose inexplicably contains some kind of small trinket or minor magic item. Once it lays a golden egg, a giant goose can't do so again for a year and a day.\n\nYou can use the Goose Egg Trinket table to determine the contents of a golden egg. A giant goose's egg can be a great way to give characters an item that's important to the story of an adventure or your campaign.\n\nGoose Egg Trinket\n| d12 | Egg Contents |\n| --- | --- |\n| 1 | The egg is empty, but the inside of the shell is inscribed with a poem or an intricate illustration. |\n| 2 | The gold shell encloses a candy egg. |\n| 3 | The egg holds a small toy goose that makes a loud honking noise when squeezed. |\n| 4 | The egg contains a Potion of Hill Giant Strength with no container. |\n| 5 | The egg holds a pearl of power. |\n| 6 | The egg contains a brooch of shielding. |\n| 7 | The egg contains a Figurine of Wondrous Power, Silver Raven that activates automatically as the egg is opened, releasing what appears to be a living bird. |\n| 8–12 | The egg is empty. |", "ed": "both"}, {"n": "Grappling Hook", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "4 lb", "desc": "As a Utilize action, you can throw the Grappling Hook at a railing, a ledge, or another catch within 50 feet of yourself, and the hook catches on if you succeed on a DC 13 Dexterity (Acrobatics) check. If you tied a Rope to the hook, you can then climb it", "ed": "both"}, {"n": "Grasping Whip", "src": "bmt", "tp": "weapon", "rar": "rare", "rarn": 3, "mag": false, "att": false, "cur": false, "wt": "3 lb", "desc": "You gain a +1 bonus to attack and damage rolls made with this magic whip. When you hit a creature or object that is Large or smaller with this whip, you can pull that creature or object 5 feet toward you instead of dealing damage.", "ed": "both"}, {"n": "Grenade Launcher", "src": "dmg", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "7 lb", "desc": "As an action, a character can throw a grenade at a point up to 60 feet away. With a grenade launcher, the character can propel the grenade up to 120 feet away.", "ed": "both"}, {"n": "Gunpowder (Keg)", "src": "dmg", "tp": "explosive", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "20 lb", "desc": "Setting fire to a keg full of Gunpowder causes it to explode. When a keg explodes, each creature in a 10-foot-radius Sphere centered on the keg makes a DC 12 Dexterity saving throw, taking 24 (7d6) Fire damage on a failed save or half as much damage on a successful one", "ed": "2024"}, {"n": "Gunpowder (powder horn)", "src": "dmg", "tp": "explosive", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "2 lb", "desc": "Setting fire to a powder horn full of Gunpowder causes it to explode. When a powder horn explodes, each creature in a 10-foot-radius Sphere centered on the powder horn makes a DC 12 Dexterity saving throw, taking 10 (3d6) Fire damage on a failed save or half as much damage on a successful one", "ed": "2024"}, {"n": "Gunpowder Horn", "src": "dmg", "tp": "explosive", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "2 lb", "desc": "Gunpowder is chiefly used to propel a bullet out of the barrel of a pistol or rifle, or it is formed into a bomb. Gunpowder is sold in small wooden kegs or in water-resistant powder horns.\n\nSetting fire to a container full of gunpowder can cause it to explode, dealing fire damage to creatures within 10 feet of it (3d6 for a powder horn). A successful DC 12 Dexterity saving throw halves the damage. Setting fire to an ounce of gunpowder causes it to flare for 1 round, shedding bright light in a 30-foot radius and dim light for an additional 30 feet.", "ed": "5e"}, {"n": "Gunpowder Keg", "src": "dmg", "tp": "explosive", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "20 lb", "desc": "Gunpowder is chiefly used to propel a bullet out of the barrel of a pistol or rifle, or it is formed into a bomb. Gunpowder is sold in small wooden kegs or in water-resistant powder horns.\n\nSetting fire to a container full of gunpowder can cause it to explode, dealing fire damage to creatures within 10 feet of it (7d6 for a keg). A successful DC 12 Dexterity saving throw halves the damage. Setting fire to an ounce of gunpowder causes it to flare for 1 round, shedding bright light in a 30-foot radius and dim light for an additional 30 feet.", "ed": "5e"}, {"n": "Hag Eye", "src": "dmg", "tp": "other", "rar": "rare", "rarn": 3, "mag": true, "att": false, "cur": false, "wt": "", "desc": "A hag coven can craft a magic item called a hag eye, which is made from a real eye coated in varnish and often fitted to a pendant or other wearable item. The hag eye is usually entrusted to a minion for safekeeping and transport. A hag in the coven can take an action to see what the hag eye sees if the hag eye is on the same plane of existence. A hag eye has AC 10, 1 hit point, and darkvision with a radius of 60 feet. If it is destroyed, each coven member takes 3d10 psychic damage and is blinded for 24 hours.\n\nA hag coven can have only one hag eye at a time, and creating a new one requires all three members of the coven to perform a ritual. The ritual takes 1 hour, and the hags can't perform it while blinded. During the ritual, if the hags take any action other than performing the ritual, they must start over.", "ed": "both"}, {"n": "Hammer", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "3 lb", "desc": "", "ed": "both"}, {"n": "Hammerhead Ship", "src": "aag", "tp": "vehicle_space", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "Hammerhead ships are popular craft, especially among pirates and merchants carrying heavy cargo. They can float on water and sail across it, but they aren't built to land on the ground (their keels would cause them to tip to one side). Standard weapons on a hammerhead ship include fore and aft mangonels, a ballista, and a reinforced bow for ramming.", "ed": "both"}, {"n": "Hand of Vecna", "src": "dmg", "tp": "wondrous", "rar": "artifact", "rarn": 6, "mag": true, "att": true, "cur": false, "wt": "", "desc": "Vecna was a mighty wizard who, through magic and conquest, forged a terrible empire. For all his power, however, Vecna feared death and took steps to prevent his demise by becoming a lich.\n\nA treacherous lieutenant named Kas brought Vecna's rule to an end in a terrible battle. Of Vecna, all that remained were one hand and one eye, grisly Artifacts that still seek to work Vecna's will in the world.\n\nThe Eye of Vecna and the Hand of Vecna are separate Artifacts that might be found together or separately. The eye looks like a bloodshot organ torn free from the socket. The hand is a shriveled left extremity.\n\nRandom Properties of the Eye and Hand. The Hand of Vecna has the following random properties:\n\n- 1 minor beneficial property\n- 1 major beneficial property\n- 1 minor detrimental property\n\nAttuning to the Hand. To attune to the hand, you must press it against the stump where your left hand was. The hand grafts itself to your arm and becomes a functioning appendage. If the hand is ever removed, you die.\n\nProperties of the Hand. When you are attuned to the hand, your alignment is Neutral Evil, and you gain the following benefits:\n\nGreat Strength. Your Strength becomes 20 unless it is already 20 or higher.\n\nIcy Touch. Any melee spell attack you make with the hand and any melee attack made with a weapon held by it deals an extra 2d8 Cold damage on a hit.\n\nSpellcasting. The hand has 8 charges and regains 1d4 + 4 expended charges daily at dawn. You can cast a spell on the Hand of Vecna Spells table from the hand (save DC 18). The table indicates how many charges you must expend to cast the spell. Each time you cast a spell from it, the hand casts Suggestion on you (save DC 18; no Concentration required), demanding that you commit an evil act. The hand might have a specific act in mind or leave it up to you.\n\nHand of Vecna Spells\n| Spell | Charge Cost |\n| --- | --- |\n| Finger of Death | 5 |\n| Sleep | 1 |\n| Slow | 2 |\n| Teleport | 3 |\n\nDestroying the Eye and Hand. If the Eye of Vecna and the Hand of Vecna are both attached to the same creature and that creature is slain by the Sword of Kas, both the eye and the hand burst into flame, turn to ash, and are destroyed. Any other attempt to destroy the eye or hand seems to work, but the Artifact reappears in one of Vecna's many hidden vaults, where it waits to be rediscovered", "ed": "both"}, {"n": "Harp of Gilded Plenty", "src": "bgg", "tp": "wondrous", "rar": "legendary", "rarn": 5, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This golden harp is sculpted in the image of the god Iallanis, depicted as a young cloud giant woman. When a creature comes within 5 feet of the harp, the instrument animates and is capable of speaking, singing, and playing by itself.\n\nWhenever you attempt to attune to the harp, you must first make either a DC 15 Charisma (Performance) check or a DC 20 Charisma (Persuasion) check to convince the harp that you are worthy, attuning to the harp on a success. If you fail, you can't attempt to attune to the harp again until the next dawn. Once you have successfully attuned to the harp, the harp resizes to suit you.\n\nStalwart Song\nWhenever you make a Charisma check while attuned to the harp, you can treat a roll of 9 or lower on the die as a 10.\n\nFeast of Plenty\nIf you spend 10 minutes playing the harp, you can cast the heroes' feast spell from it. Once this property is used, it can't be used again until 1d10 + 10 days have passed.\n\nSoothing Melody\nAs an action, you can use the harp to cast the calm emotions spell (save DC 19). When the spell is cast using the harp, its duration increases to 1 hour, provided you maintain concentration on the spell. This property can be used five times, and it regains all uses at dawn.\n\nSentience\nThe harp is a sentient, chaotic good object with an Intelligence of 13, a Wisdom of 15, and a Charisma of 20. It has hearing and darkvision to a range of 120 feet.\n\nThe harp can speak, read, and understand Common and Giant. It can also communicate telepathically with the creature attuned to it.\n\nThe harp has a dramatic and pompous personality, taking extreme pride in the quality of music produced from its strings. If the harp is shorter than 6 feet tall, it bemoans its height.", "ed": "both"}, {"n": "Hat of Disguise", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": true, "cur": false, "wt": "", "desc": "While wearing this hat, you can cast the Disguise Self spell. The spell ends if the hat is removed", "ed": "both"}, {"n": "Hat of Many Spells", "src": "dmg", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": true, "cur": false, "wt": "", "desc": "(requires attunement by a wizard)\n\nThis pointed hat has the following properties.\n\nSpellcasting Focus. While holding the hat, you can use it as a Spellcasting Focus for your Wizard spells. Any spell you cast using the hat gains a special Somatic component: you must reach into the hat and \"pull\" the spell out of it.\n\nUnknown Spell. While holding the hat, you can try to cast a level 1+ spell you don't know. The spell must be on the Wizard spell list, it must be of a level you can cast, and it can't have Material components costing more than 1,000 GP. Once you decide on the spell, you must expend a spell slot of the spell's level. Then, to determine whether you cast the spell, make an Intelligence (Arcana) check (DC 10 plus the spell's level). On a successful check, you cast the spell using its normal casting time, and you can't use this property again until you finish a Short or Long Rest. On a failed check, you fail to cast the spell and a random effect occurs instead, determined by rolling on the following table.\n\nAny spell you cast from the hat uses your spell save DC and spell attack bonus.\n\n| 1d100 | Effect |\n| --- | --- |\n| 01-50 | You cast a random spell determined by rolling 1d10: on a 1, Enlarge/Reduce (enlarge effect); on a 2, Enlarge/Reduce (reduce effect); on a 3, Faerie Fire; on a 4, Fireball; on a 5, Gust of Wind; on a 6, Invisibility (cast on yourself); on a 7, Lightning Bolt; on an 8, Phantasmal Force; on a 9, Polymorph; on a 10, Stinking Cloud. |\n| 51-55 | You have the Stunned condition until the end of your next turn, believing something awesome just happened. |\n| 56-60 | A harmless swarm of butterflies fills a 10-foot Cube within 30 feet of yourself. The swarm disperses after 1 minute. |\n| 61-65 | You pull a nonmagical object out of the hat. Roll 1d4 to determine the object: on a 1, a vial of Acid; on a 2, a flask of Alchemist's Fire; on a 3, a Crowbar; on a 4, a lit Torch. |\n| 66-70 | You suffer a bout of \"magic sickness\" and have the Poisoned condition for 1 hour. |\n| 71-75 | You have the Petrified condition until the end of your next turn. |\n| 76-80 | You pull a nonmagical object out of the hat. Roll 1d4 to determine the object: on a 1, a Dagger; on a 2, a Rope with a Grappling Hook tied to one end; on a 3, a bag of Caltrops; on a 4, a gem worth 50 GP. |\n| 81-85 | A creature appears in an unoccupied space as close to you as possible. The creature isn't under your control and acts as it normally would, and it disappears after 1 hour or when it drops to 0 Hit Points. Roll 1d4 to determine the creature: on a 1, a Camel; on a 2, a Constrictor Snake; on a 3, an Elephant; on a 4, a Mule. |\n| 86-90 | A Hostile Swarm of Bats flies out of the hat, occupies your space, and attacks you. |\n| 91-95 | A vertical, 10-foot-diameter, two-way portal to another plane of existence opens in an unoccupied space within 30 feet of you and remains open until the end of your next turn. The DM determines where it leads. |\n| 96-00 | You pull a magic item out of the hat. Roll 1d6 to determine the item's rarity: on a 1-3, Common; on a 4-5, Uncommon; on a 6, Rare. The DM chooses the item, which disappears after 1 hour if it's not consumed or destroyed before then |", "ed": "2024"}, {"n": "Hat of Vermin", "src": "dmg", "tp": "wondrous", "rar": "common", "rarn": 1, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This hat has 3 charges. While holding the hat, you can take a Magic action to expend 1 charge and summon your choice of a Bat, a Frog, or a Rat. The summoned creature magically appears in the hat and tries to get away from you as quickly as possible. The creature is Indifferent toward you and other creatures, and it isn't under your control. It behaves as an ordinary creature of its kind and disappears after 1 hour or when it drops to 0 Hit Points. The hat regains all expended charges daily at dawn", "ed": "2024"}, {"n": "Hat of Wizard", "src": "dmg", "tp": "wondrous", "rar": "common", "rarn": 1, "mag": true, "att": true, "cur": false, "wt": "", "desc": "(requires attunement by a wizard)\n\nThis cone-shaped hat is adorned with moons and stars. While you are wearing it, you gain the following benefits.\n\nSpellcasting Focus. You can use the hat as a Spellcasting Focus for your Wizard spells.\n\nUnknown Spell. As a Magic action, you can try to cast a cantrip that you don't know. The cantrip must be on the Wizard spell list and have a casting time of an action, and you make a DC 10 Intelligence (Arcana) check. On a successful check, you cast the spell. On a failed check, the spell fails, and the action used to cast the spell is wasted. In either case, you can't use this property again until you finish a Long Rest", "ed": "2024"}, {"n": "Headband of Intellect", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": true, "cur": false, "wt": "", "desc": "Your Intelligence score is 19 while you wear this headband. It has no effect on you if your Intelligence is 19 or higher without it", "ed": "both"}, {"n": "Healer's Kit", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "3 lb", "desc": "A Healer's Kit has ten uses. As a Utilize action, you can expend one of its uses to stabilize an Unconscious creature that has 0 Hit Points without needing to make a Wisdom (Medicine) check", "ed": "both"}, {"n": "Heartstone", "src": "mm", "tp": "other", "rar": "very_rare", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This lustrous black gem allows a night hag to become ethereal while it is in her possession. The touch of a heartstone also cures any disease. Crafting a heartstone takes 30 days.", "ed": "both"}, {"n": "Helm of Brilliance", "src": "dmg", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This helm is set with 1d10 diamonds, 2d10 rubies, 3d10 fire opals, and 4d10 opals. Any gem pried from the helm crumbles to dust. When all the gems are removed or destroyed, the helm loses its magic.\n\nYou gain the following benefits while wearing the helm.\n\nDiamond Light. As long as it has at least one diamond, the helm emits a 30-foot Emanation. When at least one Undead is within that area, the Emanation is filled with Dim Light. Any Undead that starts its turn in that area takes 1d6 Radiant damage.\n\nFire Opal Flames. As long as the helm has at least one fire opal, you can take a Magic action to cause one weapon you are holding to burst into flames. The flames emit Bright Light in a 10-foot radius and Dim Light for an additional 10 feet. The flames are harmless to you and the weapon. When you hit with an attack using the blazing weapon, the target takes an extra 1d6 Fire damage. The fl ames last until you take a Bonus Action to extinguish them or until you drop or stow the weapon.\n\nRuby Resistance. As long as the helm has at least one ruby, you have Resistance to Fire damage.\n\nSpells. You can cast one of the following spells (save DC 18), using one of the helm's gems of the specified type as a component: Daylight (opal), Fireball (fire opal), Prismatic Spray (diamond), or Wall of Fire (ruby). The gem is destroyed when the spell is cast and disappears from the helm.\n\nTaking Fire Damage. Roll 1d20 if you are wearing the helm and take Fire damage as a result of failing a saving throw against a spell. On a roll of 1, the helm emits beams of light from its remaining gems and is then destroyed. Each creature within a 60-foot Emanation originating from you must succeed on a DC 17 Dexterity saving throw or be struck by a beam, taking Radiant damage equal to the number of gems in the helm", "ed": "both"}, {"n": "Helm of Comprehending Languages", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "", "desc": "While wearing this helm, you can use an action to cast the comprehend languages spell from it at will.", "ed": "both"}, {"n": "Helm of Perfect Potential", "src": "bgg", "tp": "wondrous", "rar": "artifact", "rarn": 6, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This copper-hued helm contains a shard of the Elemental Chaos embedded in its forehead, surrounded by a motif of a rising sun. Legend says Annam fashioned this helm for his daughter Diancastra to hold the fragment of chaos she used to prove her worth to her father.\n\nRandom Properties\nThe helm has the following random properties:\n\n- 2 minor beneficial properties\n- 1 major beneficial property\n- 1 minor detrimental property\n\nMaster of Guile\nWhile wearing the helm, you have advantage on Charisma (Deception) and Wisdom (Insight) checks.\n\nArrow of Elemental Havoc\nAs a bonus action while wearing the helm, you can launch a bolt of searing elemental energy toward a creature you can see within 90 feet of yourself. The target must make a DC 20 Dexterity saving throw. On a failed save, the creature takes 4d6 acid, cold, fire, lightning, or thunder damage (your choice). On a successful save, the creature takes half as much damage.\n\nSpellcasting\nThe helm has 6 charges and regains 1d6 charges each dawn. As an action while wearing the helm, you can expend 1 or more of its charges to cast one of the following spells (save DC 20): elemental weapon (1 charge), call lightning (2 charges), wall of fire (3 charges), conjure elemental (4 charges), tsunami (5 charges).", "ed": "both"}, {"n": "Helm of Telepathy", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": true, "cur": false, "wt": "", "desc": "While wearing this helm, you have telepathy with a range of 30 feet, and you can cast Detect Thoughts or Suggestion (save DC 13) from the helm. Once either spell is cast from the helm, that spell can't be cast from it again until the next dawn", "ed": "both"}, {"n": "Helm of Teleportation", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This helm has 3 charges. While wearing it, you can expend 1 charge to cast Teleport from it. The helm regains 1d3 expended charges daily at dawn", "ed": "both"}, {"n": "Hempen Rope (50 feet)", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "10 lb", "desc": "Rope, whether made of hemp or silk, has 2 hit points and can be burst with a DC 17 Strength check.", "ed": "5e"}, {"n": "Herbalism Kit", "src": "phb", "tp": "tool", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "3 lb", "desc": "Ability: Intelligence\n\nUtilize: Identify a plant (DC 10)\n\nCraft: Antitoxin, Candle, Healer's Kit, Potion of Healing\n\nIf you have proficiency with a tool, add your Proficiency Bonus to any ability check you make that uses the tool. If you have proficiency in a skill that's used with that check, you have Advantage on the check too", "ed": "both"}, {"n": "Heward's Handy Haversack", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": false, "cur": false, "wt": "5 lb", "desc": "This backpack has a central pouch and two side pouches, each of which is an extradimensional space. Each side pouch can hold up to 200 pounds of material, not exceeding a volume of 25 cubic feet. The central pouch can hold up to 500 pounds of material, not exceeding a volume of 64 cubic feet. The haversack always weighs 5 pounds, regardless of its contents.\n\nRetrieving an item from the haversack requires a Utilize action or a Bonus Action (your choice). When you reach into the haversack for a specific item, the item is always magically on top.\n\nIf any of its pouches is overloaded, pierced, or torn, the haversack ruptures and is destroyed. If the haversack is destroyed, its contents are lost forever, although an Artifact always turns up again somewhere. If the haversack is turned inside out, its contents spill forth unharmed, and the haversack must be put right before it can be used again.\n\nEach pouch of the haversack holds enough air for 10 minutes of breathing, divided by the number of breathing creatures inside.\n\nPlacing the haversack inside an extradimensional space created by a Bag of Holding, Portable Hole, or similar item instantly destroys both items and opens a gate to the Astral Plane. The gate originates where the one item was placed inside the other. Any creature within 10 feet of the gate and not behind Total Cover is sucked through it and deposited in a random location on the Astral Plane. The gate then closes. The gate is one-way only and can't be reopened", "ed": "both"}, {"n": "Heward's Handy Spice Pouch", "src": "dmg", "tp": "wondrous", "rar": "", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This belt pouch appears empty and has 10 charges. While holding the pouch, you can take a Magic action to expend 1 charge, name any nonmagical food seasoning (such as salt, pepper, saffron, or cilantro), and remove a pinch of the desired seasoning from the pouch. A pinch is enough to season a single meal. The pouch regains 1d6 + 4 expended charges daily at dawn", "ed": "2024"}, {"n": "Holy Water", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "When you take the Attack action, you can
