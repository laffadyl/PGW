cause the cauldron to grow large enough for a Medium creature to crouch within. You can revert the cauldron to its normal size as a Magic action, harmlessly shunting anything that can't fit inside to the nearest unoccupied space.\n\nIf you place the corpse of a Humanoid into the cauldron and cover the corpse with 200 pounds of salt (which costs 10 GP) for at least 8 hours, the salt is consumed and the creature returns to life as if by Raise Dead at the next dawn. Once used, this property can't be used again for 7 days", "ed": "2024"}, {"n": "Censer of Controlling Air Elementals", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": false, "cur": false, "wt": "1 lb", "desc": "While gently swinging this censer, you can take a Magic action to summon an Air Elemental. The elemental appears in an unoccupied space as close to the censer as possible, understands your languages, obeys your commands, and takes its turn immediately after you on your Initiative count. The elemental disappears after 1 hour, when it dies, or when you dismiss it as a Bonus Action. The censer can't be used this way again until the next dawn", "ed": "both"}, {"n": "Chain", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "10 lb", "desc": "As a Utilize action, you can wrap a Chain around an unwilling creature within 5 feet of yourself that has the Grappled, Incapacitated, or Restrained condition if you succeed on a DC 13 Strength (Athletics) check. If the creature's legs are bound, the creature has the Restrained condition until it escapes. Escaping the Chain requires the creature to make a successful DC 18 Dexterity (Acrobatics) check as an action. Bursting the Chain requires a successful DC 20 Strength (Athletics) check as an action", "ed": "2024"}, {"n": "Chain (10 feet)", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "10 lb", "desc": "A chain has 10 hit points. It can be burst with a successful DC 20 Strength check.", "ed": "5e"}, {"n": "Chalk (1 piece)", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "", "ed": "both"}, {"n": "Chariot", "src": "phb", "tp": "vehicle_land", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "100 lb", "desc": "", "ed": "both"}, {"n": "Charlatan's Die", "src": "dmg", "tp": "wondrous", "rar": "", "rarn": 99, "mag": true, "att": true, "cur": false, "wt": "", "desc": "Whenever you roll this six-sided die, you can control which number it rolls", "ed": "2024"}, {"n": "Cheese (wedge)", "src": "phb", "tp": "food_and_drink", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "", "ed": "2024"}, {"n": "Chest", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "25 lb", "desc": "A Chest holds up to 12 cubic feet of contents", "ed": "both"}, {"n": "Chicken", "src": "dmg", "tp": "trade_good", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "", "ed": "both"}, {"n": "Chime of Opening", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": false, "cur": false, "wt": "1 lb", "desc": "This hollow metal tube measures about 1 foot long and weighs 1 pound. As a Magic action, you can strike the chime to cast Knock. The spell's customary knocking sound is replaced by the clear, ringing tone of the chime, which is audible out to 300 feet. The chime can be used 10 times. After the tenth time, it cracks and becomes useless", "ed": "both"}, {"n": "Chromatic Rose", "src": "wbtw", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": false, "cur": false, "wt": "0.5 lb", "desc": "This magic rose comes in one of five colors, as noted in the Chromatic Roses table. While a rose is held, it gains a harmless visual effect as indicated on the table.\n\nWhile holding the rose by its stem, you gain resistance to damage of the type associated with the rose's color. If you would take more than 10 damage of this type from a single source (after applying the resistance), the rose disintegrates, and you take no damage instead.\n\nAs an action, you can blow the petals from the rose to produce a 20-foot cone of acid, lightning, poisonous gas, fire, or cold, as dictated by the rose's damage type. Each creature in the cone must make a DC 15 Constitution saving throw, taking 3d10 damage of the appropriate type on a failed save, or half as much damage on a successful one. Using this property destroys the rose.\n\nChromatic Roses\n| Color | Visual Effect | Damage Type |\n| --- | --- | --- |\n| Black | Drips acid | Acid |\n| Blue | Crackles with lightning | Lightning |\n| Green | Issues green gas | Poison |\n| Red | Wreathed in fire | Fire |\n| White | Covered with frost | Cold |", "ed": "both"}, {"n": "Chunk of Meat", "src": "phb", "tp": "food_and_drink", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "", "ed": "both"}, {"n": "Cinnamon", "src": "dmg", "tp": "trade_good", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "", "ed": "both"}, {"n": "Circlet of Blasting", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "", "desc": "While wearing this circlet, you can cast Scorching Ray with it (+5 to hit). The circlet can't cast this spell again until the next dawn", "ed": "both"}, {"n": "Climber's Kit", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "12 lb", "desc": "A Climber's Kit includes boot tips, gloves, pitons, and a harness. As a Utilize action, you can use the Climber's Kit to anchor yourself; when you do, you can't fall more than 25 feet from the anchor point, and you can't move more than 25 feet from there without undoing the anchor as a Bonus Action", "ed": "both"}, {"n": "Cloak of Arachnida", "src": "dmg", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This fine garment is made of black silk interwoven with faint, silvery threads. While wearing it, you gain the following benefits.\n\nPoison Resistance. You have Resistance to Poison damage.\n\nSpider Climb. You have a Climb Speed equal to your Speed and can move up, down, and across vertical surfaces and along ceilings, while leaving your hands free.\n\nSpider Walk. You can't be caught in webs of any sort and can move through webs as if they were Difficult Terrain.\n\nWeb. You can cast Web (save DC 13). The web created by the spell fills twice its normal area. Once used, this property can't be used again until the next dawn", "ed": "both"}, {"n": "Cloak of Billowing", "src": "dmg", "tp": "wondrous", "rar": "common", "rarn": 1, "mag": true, "att": false, "cur": false, "wt": "", "desc": "While wearing this cloak, you can take a Bonus Action to make it billow dramatically for 1 minute", "ed": "2024"}, {"n": "Cloak of Displacement", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "", "desc": "While you wear this cloak, it magically projects an illusion that makes you appear to be standing in a place near your actual location, causing any creature to have Disadvantage on attack rolls against you. If you take damage, the property ceases to function until the start of your next turn. This property is suppressed while your Speed is 0", "ed": "both"}, {"n": "Cloak of Elvenkind", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": true, "cur": false, "wt": "", "desc": "While you wear this cloak, Wisdom (Perception) checks made to perceive you have Disadvantage, and you have Advantage on Dexterity (Stealth) checks", "ed": "both"}, {"n": "Cloak of Invisibility", "src": "dmg", "tp": "wondrous", "rar": "legendary", "rarn": 5, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This cloak has 3 charges and regains 1d3 expended charges daily at dawn. While wearing the cloak, you can take a Magic action to pull its hood over your head and expend 1 charge to give yourself the Invisible condition for 1 hour. The effect ends early if you pull the hood down (no action required) or cease wearing the hood", "ed": "both"}, {"n": "Cloak of Many Fashions", "src": "dmg", "tp": "wondrous", "rar": "common", "rarn": 1, "mag": true, "att": false, "cur": false, "wt": "", "desc": "While wearing this cloak, you can take a Bonus Action to change the style, color, and apparent quality of the garment. The cloak's weight doesn't change. Regardless of its appearance, the cloak can't be anything but a cloak. Although it can duplicate the appearance of other magic cloaks, it doesn't gain their magical properties", "ed": "both"}, {"n": "Cloak of Protection", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": true, "cur": false, "wt": "", "desc": "You gain a +1 bonus to Armor Class and saving throws while you wear this cloak", "ed": "both"}, {"n": "Cloak of the Bat", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "", "desc": "While wearing this cloak, you have Advantage on Dexterity (Stealth) checks. In an area of Dim Light or Darkness, you can grip the edges of the cloak and use it to gain a Fly Speed of 40 feet. If you ever fail to grip the cloak's edges while flying in this way, or if you are no longer in Dim Light or Darkness, you lose this Fly Speed.\n\nWhile wearing the cloak in an area of Dim Light or Darkness, you can cast Polymorph on yourself, shape-shifting into a Bat. While in that form, you retain your Intelligence, Wisdom, and Charisma scores. The cloak can't be used this way again until the next dawn", "ed": "both"}, {"n": "Cloak of the Manta Ray", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "", "desc": "While wearing this cloak, you can breathe underwater, and you have a Swim Speed of 60 feet", "ed": "both"}, {"n": "Clockwork Amulet", "src": "dmg", "tp": "wondrous", "rar": "", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This copper amulet contains tiny interlocking gears and is powered by magic from Mechanus, a plane of clockwork predictability. Faint ticking and whirring noises emanate from within.\n\nWhen you make an attack roll while wearing the amulet, you can forgo rolling the d20 to get a 10 on the die. Once used, this property can't be used again until the next dawn", "ed": "2024"}, {"n": "Clothes of Mending", "src": "dmg", "tp": "wondrous", "rar": "", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This elegant outfit magically mends itself to counteract daily wear and tear. Pieces of the outfit that are destroyed can't be repaired in this way", "ed": "2024"}, {"n": "Cloves", "src": "dmg", "tp": "trade_good", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "", "ed": "both"}, {"n": "Cobbler's Tools", "src": "phb", "tp": "artisans_tools", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "5 lb", "desc": "Ability: Dexterity\n\nUtilize: Modify footwear to give Advantage on the wearer's next Dexterity (Acrobatics) check (DC 10)\n\nCraft: Climber's Kit\n\nArtisan's Tools are each focused on crafting items and pursuing a trade. Each type of Artisan's Tools tools requires a separate proficiency.\n\nIf you have proficiency with a tool, add your Proficiency Bonus to any ability check you make that uses the tool. If you have proficiency in a skill that's used with that check, you have Advantage on the check too", "ed": "both"}, {"n": "Coin of Delving", "src": "egw", "tp": "wondrous", "rar": "common", "rarn": 1, "mag": true, "att": false, "cur": false, "wt": "1 lb", "desc": "This scintillating copper coin sheds dim light in a 5-foot radius. If dropped a distance greater than 5 feet, the coin issues a melodious ringing sound when it hits a surface. Any creature that can hear the chime can determine the distance the coin dropped based on the tone.", "ed": "both"}, {"n": "Command Amulet", "src": "mm", "tp": "other", "rar": "", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "1 lb", "desc": "Each Shield Guardian is magically bound to an amulet. While the guardian and its amulet are on the same plane of existence, the amulet's wearer can telepathically call the guardian to travel to it, and the guardian knows the distance and direction to the amulet. If the guardian is within 60 feet of the amulet's wearer, half of any damage the wearer takes (round up) is transferred to the guardian.\n\nA shield guardian's command amulet might be passed down through a magic-using society or family for generations", "ed": "2024"}, {"n": "Common Clothes", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "3 lb", "desc": "", "ed": "both"}, {"n": "Common Wine (bottle)", "src": "phb", "tp": "food_and_drink", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "", "ed": "2024"}, {"n": "Common Wine (Pitcher)", "src": "", "tp": "food_and_drink", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "", "ed": "5e"}, {"n": "Component Pouch", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "2 lb", "desc": "A Component Pouch is watertight and filled with compartments that hold all the free Material components of your spells", "ed": "both"}, {"n": "Concussion Grenade", "src": "qftis", "tp": "explosive", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "As an action, a character can throw a grenade at a point up to 60 feet away, 120 feet with a grenade launcher.\n\nThis grenade explodes in a concussive blast that fills a 20-foot-radius sphere. Each creature in that area must make a DC 15 Dexterity saving throw, taking (6d6) force damage on a failed save or half as much damage on a successful one.", "ed": "both"}, {"n": "Cook's Utensils", "src": "phb", "tp": "artisans_tools", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "8 lb", "desc": "Ability: Wisdom\n\nUtilize: Improve food's flavor (DC 10), or detect spoiled or poisoned food (DC 15)\n\nCraft: Rations\n\nArtisan's Tools are each focused on crafting items and pursuing a trade. Each type of Artisan's Tools tools requires a separate proficiency.\n\nIf you have proficiency with a tool, add your Proficiency Bonus to any ability check you make that uses the tool. If you have proficiency in a skill that's used with that check, you have Advantage on the check too", "ed": "both"}, {"n": "Copper", "src": "dmg", "tp": "trade_good", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "", "ed": "both"}, {"n": "Corpse Slayer", "src": "", "tp": "weapon", "rar": "rare", "rarn": 3, "mag": false, "att": false, "cur": false, "wt": "", "desc": "You gain a +1 bonus to attack and damage rolls made with this magic weapon.\n\nWhen you hit an undead creature with an attack using this weapon, the attack deals an extra 1d8 damage of the weapon's type, and the creature has disadvantage on saving throws against effects that turn undead until the start of your next turn.", "ed": "both"}, {"n": "Costume", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "4 lb", "desc": "While wearing a Costume, you have Advantage on any ability check you make to impersonate the person or type of person it represents", "ed": "2024"}, {"n": "Costume Clothes", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "4 lb", "desc": "", "ed": "5e"}, {"n": "Cotton Cloth (1 sq. yd.)", "src": "dmg", "tp": "trade_good", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "", "ed": "both"}, {"n": "Cow", "src": "dmg", "tp": "trade_good", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "", "ed": "both"}, {"n": "Crossbow Bolt", "src": "", "tp": "ammunition", "rar": "common", "rarn": 1, "mag": false, "att": false, "cur": false, "wt": "1.2 lb", "desc": "", "ed": "5e"}, {"n": "Crossbow Bolt Case", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "A Crossbow Bolt Case holds up to 20 Bolts", "ed": "both"}, {"n": "Crowbar", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "5 lb", "desc": "Using a Crowbar gives you Advantage on Strength checks where the Crowbar's leverage can be applied", "ed": "both"}, {"n": "Crown of the Wrath Bringer", "src": "bgg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This jagged iron circlet bears ornaments in the shape of the enemy rune. When worn, the crown glows with pale light as it draws upon the wearer's fury to strike opponents with vicious terror.\n\nWhen you make an attack roll against a creature and hit it while wearing this crown, you can spend and roll one of your unspent Hit Dice. The creature takes extra psychic damage equal to the number rolled.\n\nInvoking the Rune\nAs an action, you can invoke the crown's rune to cast the fear spell (save DC 15) with it; the spell has a duration of 1 minute and doesn't require concentration. Once the rune has been invoked, it can't be invoked again until the next dawn.", "ed": "both"}, {"n": "Crown of Whirling Comets", "src": "bmt", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This delicate silver tiara is decorated with stellar iconography. While you wear the crown, the gems on the tiara's points detach and closely orbit your head.\n\nThe crown has 6 charges for the following properties, which you can use while wearing the crown:\n\n- Star Flight: As a bonus action, you can spend 1 charge to gain the power of flight for 10 minutes. For the duration, you gain a flying speed equal to your walking speed, and you can hover. While flying, you glow faintly with starlight.\n- Starlight Strike: As an action, you can spend any number of charges to launch bolts of frigid starlight. You launch a number of bolts equal to the number of charges spent, and you can direct the bolts to target one creature or several, so long as all creatures are within 120 feet of you and you can see them. The bolts automatically strike their targets, and each bolt deals 2d4 cold damage.\n- Whirling Hail: As an action, you can spend 3 charges and cast the Ice Storm spell (save DC 16).\nThe crown regains 1d6 expended charges daily at dawn.", "ed": "both"}, {"n": "Crystal", "src": "phb", "tp": "spellcasting_focus", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "An Arcane Focus takes a specific form and is bejeweled or carved to channel arcane magic. A Sorcerer, Warlock, or Wizard can use such an item as a Spellcasting Focus", "ed": "2024"}, {"n": "Crystal Ball", "src": "dmg", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": true, "cur": false, "wt": "3 lb", "desc": "The typical crystal ball, a very rare item, is about 6 inches in diameter. While touching it, you can cast the scrying spell (save DC 17) with it", "ed": "both"}, {"n": "Crystal Ball of Mind Reading", "src": "dmg", "tp": "wondrous", "rar": "legendary", "rarn": 5, "mag": true, "att": true, "cur": false, "wt": "3 lb", "desc": "While touching this crystal orb, you can cast Scrying (save DC 17) with it. In addition, you can cast Detect Thoughts (save DC 17) targeting creatures you can see within 30 feet of the spell's sensor. You don't need to concentrate on this Detect Thoughts spell to maintain it during its duration, but it ends if the Scrying spell ends", "ed": "both"}, {"n": "Crystal Ball of Telepathy", "src": "dmg", "tp": "wondrous", "rar": "legendary", "rarn": 5, "mag": true, "att": true, "cur": false, "wt": "3 lb", "desc": "While touching this crystal orb, you can cast Scrying (save DC 17) with it. In addition, you can communicate telepathically with creatures you can see within 30 feet of the spell's sensor. You can also cast Suggestion (save DC 17) through the sensor on one of those creatures. You don't need to concentrate on this Suggestion to maintain it during its duration, but it ends if Scrying ends. You can't cast Suggestion in this way again until the next dawn", "ed": "both"}, {"n": "Crystal Ball of True Seeing", "src": "dmg", "tp": "wondrous", "rar": "legendary", "rarn": 5, "mag": true, "att": true, "cur": false, "wt": "3 lb", "desc": "While touching this crystal orb, you can cast Scrying (save DC 17) with it. In addition, you have Truesight with a range of 120 feet centered on the spell's sensor", "ed": "both"}, {"n": "Cube of Force", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This cube is about an inch across. Each face has a distinct marking on it. You can press one of those faces, expend the number of charges required for it, and thereby cast the spell associated with it, as shown in the Cube of Force Faces table.\n\nThe cube starts with 10 charges, and it regains 1d6 expended charges daily at dawn.\n\n| Spell | Charge Cost |\n| --- | --- |\n| Mage Armor | 1 |\n| Shield | 1 |\n| Leomund's Tiny Hut | 3 |\n| Mordenkainen's Private Sanctum | 4 |\n| Otiluke's Resilient Sphere | 4 |\n| Wall of Force | 5 |", "ed": "both"}, {"n": "Cube of Summoning", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This Tiny cube looks like a jack-in-the-box. When you wind its crank as a Magic action, a merry tune emits from the box, the lid pops open, a creature appears in the nearest unoccupied space, and the lid closes. The lid can't otherwise be opened.\n\nRoll on the Cube of Summoning table to determine which spell the cube casts to summon the creature. The spell is cast at level 5 (save DC 17, +9 attack bonus) and doesn't require Concentration, but you otherwise function as the spell's caster.\n\nOnce the cube summons a creature, the cube can't do so again until the next dawn.\n\n| 1d6 | Spell |\n| --- | --- |\n| 1 | Summon Aberration |\n| 2 | Summon Beast |\n| 3 | Summon Construct |\n| 4 | Summon Dragon |\n| 5 | Summon Elemental |\n| 6 | Summon Fey |", "ed": "2024"}, {"n": "Cubic Gate", "src": "dmg", "tp": "wondrous", "rar": "legendary", "rarn": 5, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This cube is 3 inches across and radiates palpable magical energy. The six sides of the cube are each keyed to a different plane of existence, one of which is the Material Plane. The other sides are linked to planes determined by the DM.\n\nThe cube has 3 charges and regains 1d3 expended charges daily at dawn. As a Magic action, you can expend 1 of the cube's charges to cast one of the following spells using the cube.\n\nGate. Pressing one side of the cube, you cast Gate, opening a portal to the plane of existence keyed to that side.\n\nPlane Shift. Pressing one side of the cube twice, you cast Plane Shift, transporting the targets to the plane of existence keyed to that side", "ed": "both"}, {"n": "Cuddly Strixhaven Mascot", "src": "scc", "tp": "wondrous", "rar": "common", "rarn": 1, "mag": true, "att": false, "cur": false, "wt": "", "desc": "Representing one of the mascots of Strixhaven, this soft, Tiny, magic toy is perfect for cuddling. If you press it to your arm, shoulder, or leg as an action, the toy stays attached there for 1 hour or until you use an action to remove it.\n\nThe toy can also be used to fight off fear. When you make a saving throw to avoid or end the frightened condition on yourself, you can give yourself advantage on the roll if the toy is on your person. You must decide to do so before rolling the d20. If the save succeeds, you can't use the toy in this way until you finish a long rest.", "ed": "both"}, {"n": "Daern's Instant Fortress", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": false, "cur": false, "wt": "", "desc": "As a Magic action, you can place this 1-inch adamantine statuette on the ground and, using a command word, cause it to grow rapidly into a square adamantine tower. Repeating the command word causes the tower to revert to statuette form, which works only if the tower is empty. Each creature in the area where the tower appears is pushed to an unoccupied space outside but next to the tower. Objects in the area that aren't being worn or carried are also pushed clear of the tower.\n\nThe tower is 20 feet on a side and 30 feet high, with arrow slits on all sides and a battlement atop it. Its interior is divided into two floors, with a ladder, staircase, or ramp (your choice) connecting them. This ladder, staircase, or ramp ends at a trapdoor leading to the roof. When created, the tower has a single door at ground level on the side facing you. The door opens only at your command, which you can issue as a Bonus Action. It is immune to the Knock spell and similar magic.\n\nMagic prevents the tower from being tipped over. The roof, the door, and the walls each have AC 20; HP 100; Immunity to Bludgeoning, Piercing, and Slashing damage except that which is dealt by siege equipment; and Resistance to all other damage. Shrinking the tower back down to statuette form doesn't repair damage to the tower. Only a Wish spell can repair the tower (this use of the spell counts as replicating a spell of level 8 or lower). Each casting of Wish causes the tower to regain all its Hit Points", "ed": "both"}, {"n": "Damselfly Ship", "src": "aag", "tp": "vehicle_space", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "This swift but cramped ship is made mostly of metal. It can't float on water, but its legs enable it to land safely on the ground. A sliding hatch just behind the wings allows access to the ship's mangonel turret. The ship's cargo hold can easily be turned into crew cabins or another weapon deck.\n\nDamselfly ships are often used as courier vessels and armored transports. Explorers and pirates like them because they're fast and sturdy. Military leaders use them as command ships for the same reasons.\n\nDamselfly ship owners are a proud lot, fond of painting their ships in colorful patterns as well as customizing their vessels with special equipment. Large, private gatherings of damselfly ship owners are not uncommon; they use these get-togethers to show off their ships and to race one another through asteroid belts and other obstacle courses, either for rewards or bragging rights.", "ed": "both"}, {"n": "Daoud's Wondrous Lanthorn", "src": "qftis", "tp": "wondrous", "rar": "artifact", "rarn": 6, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This artifact destroys wealth to provide light and protection. Wrought from the finest yellow gold, the lantern has four faces, and an unwavering amber flame burns within it. The faces of the lantern are fitted with faceted gemstone lenses.\n\nThe lantern is a symbol of the teachings of Daoud, who was once a priest of Istus, a god of fate. When Daoud was stripped of his possessions, he developed a radical new philosophy in his quest to understand fate. He urged followers of his ideology to eschew wealth and seek out all fortunes, good and ill, to unravel the cloth of destiny.\n\nRandom Properties\nThe lantern has the following random properties:\n\n- 2 minor beneficial properties\n- 1 major beneficial property\n- 1 minor detrimental property\n\nPrecious Fuel:\n\nThe lantern burns only one source of fuel: powdered gemstones placed in the lantern's base. The lantern can hold a maximum of 10,000 gp worth of powdered gems, and it contains 9,000 gp of fuel when found. Thereafter it attempts to burn 100 gp of fuel after each year passes, keeping the lantern burning for another year. If no fuel is available, the lantern's flame goes out. You can add more fuel to the lantern as part of a short or long rest. Once added, fuel can't be removed from the lantern's base.\n\nThe lantern's flame can't be extinguished by any means other than running out of fuel. If the lantern's flame goes out, the creature attuned to it immediately dies. One exception to this rule exists, which is \"Destroying the Lantern\".\n\nDestroying the Lantern:\n\nTo destroy the lantern, the creature attuned to it must forsake all material possessions except for the lantern and common clothes. Then the creature must willingly snuff the lantern's flame with the intention to destroy the artifact. When its flame is snuffed in this way, the lantern's gold corrodes, the lenses and remaining gemstone fuel turn to worthless sand, and the creature attuned to it is spared.\n\nRevealing Light:\n\nThe lantern sheds \"bright light\" in a 60-foot radius and \"dim light\" for an additional 60 feet. Invisible creatures and objects are visible while in the lantern's \"bright light\".\n\nWhile attuned to the lantern, you can use a bonus action to dim the lantern, reducing the light to \"dim light\" in a 5-foot radius, or brighten the lantern back to its normal \"bright light\" radius.\n\nLenses:\n\nWhen found, the lantern's faces display the following gem lenses: diamond, emerald, ruby, and sapphire. As part of a short or long rest, you can magically change any of these gem lenses to a different type of gem shown in the Lenses table. The gem lenses can't be removed from the lantern.\n\nAs an action while holding the lantern, you can burn some of the lantern's fuel to cast a spell (save DC 20) through one or more of its current gem lenses, as noted in the Lenses table. The spell's target or point of origin must be in the lantern's area of \"bright light\". If there isn't enough fuel left to cast the spell, the last of the remaining fuel is expended, and the flame goes out.\n\nLenses\n\n| Lens Color | Spell | Fuel Cost |\n| --- | --- | --- |\n| Amethyst | Reverse Gravity | 3,000 gp |\n| Diamond | Disintegrate | 2,000 gp |\n| Emerald | Haste | 500 gp |\n| Jacinth | Flame Strike | 1,000 gp |\n| Ruby | Hold Monster | 1,000 gp |\n| Sapphire | Fear | 500 gp |\n| Topaz | Slow | 500 gp |\n| Any four colors | Prismatic Wall | 5,000 gp |", "ed": "both"}, {"n": "Dark Shard Amulet", "src": "dmg", "tp": "wondrous", "rar": "", "rarn": 99, "mag": true, "att": true, "cur": false, "wt": "1 lb", "desc": "(requires attunement by a warlock)\n\nThis amulet is fashioned from a shard of resilient material originating from an otherworldly realm. While you are wearing it, you gain the following benefits.\n\nSpellcasting Focus. You can use the amulet as a Spellcasting Focus for your Warlock spells.\n\nUnknown Spell. As a Magic action, you can try to cast a cantrip that you don't know. The cantrip must be on the Warlock spell list and have a casting time of an action, and you make a DC 10 Intelligence (Arcana) check. On a successful check, you cast the spell. On a failed check, the spell fails, and the action used to cast it is wasted. In either case, you can't use this property again until you finish a Long Rest", "ed": "2024"}, {"n": "Decanter of Endless Water", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "2 lb", "desc": "This stoppered flask sloshes when shaken, as if it contains water. The decanter weighs 2 pounds.\n\nYou can take a Magic action to remove the stopper and issue one of three command words, whereupon an amount of fresh water or salt water (your choice) pours out of the flask. The water stops pouring out at the start of your next turn. Choose from the following command words:\n\nSplash. The decanter produces 1 gallon of water.\n\nFountain. The decanter produces 5 gallons of water.\n\nGeyser. The decanter produces 30 gallons of water that gushes forth in a Line 30 feet long and 1 foot wide. If you're holding the decanter, you can aim the geyser in one direction (no action required). One creature of your choice in the Line must succeed on a DC 13 Strength saving throw or take 1d4 Bludgeoning damage and have the Prone condition. Instead of a creature, you can target one object in the Line that isn't being worn or carried and that weighs no more than 200 pounds. The object is knocked over by the geyser", "ed": "both"}, {"n": "Deck of Dimensions", "src": "bmt", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": true, "cur": false, "wt": "", "desc": "The backs of the cards in this deck are decorated with intricate designs representing different planes of existence. The deck has 6 charges. While holding it, you can expend 1 or more of its charges to use the following properties:\n\n- Marked Card: As a bonus action, you can expend 1 charge to draw a card from the deck and place it in an unoccupied space within 5 feet of you. The card then becomes marked with an invisible sigil. Once within the next 24 hours, as an action, you can speak the marked card's name and teleport to the card's location, along with any equipment you are wearing or carrying, appearing in the closest unoccupied space to the card. After you teleport in this way, or after 8 hours, the card returns to the deck, and the mark on it fades.\n- Riffling Portal: As an action, you can expend 3 charges to cast the Arcane Gate spell from the deck. The deck vanishes, and fluttering cards create the spell's portal rings. When the spell ends, the deck reappears in your possession.\n- Shuffling Stride: As a bonus action, you can expend 1 charge to throw a card from the deck to an unoccupied space within 60 feet of yourself and teleport, along with any equipment you're wearing or carrying, to that space. The card then vanishes and returns to the deck.\nThe deck regains 1d6 expended charges daily at dawn.", "ed": "both"}, {"n": "Deck of Illusions", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This box contains a set of cards. A full deck has 34 cards: 32 depicting specific creatures and two with a mirrored surface. A deck found as treasure is usually missing 1d20 - 1 cards.\n\nThe magic of the deck functions only if its cards are drawn at random. You can take a Magic action to draw a card at random from the deck and throw it to the ground at a point within 30 feet of yourself. An illusion of a creature, determined by rolling on the Deck of Illusions table, forms over the thrown card and remains until dispelled. The illusory creature created by the card looks and behaves like a real creature of its kind, except that it can do no harm. While you are within 120 feet of the illusory creature and can see it, you can take a Magic action to move it anywhere within 30 feet of its card.\n\nAny physical interaction with the illusory creature reveals it to be false, because objects pass through it. A creature that takes a Study action to visually inspect the illusory creature identifies it as an illusion with a successful DC 15 Intelligence (Investigation) check. The illusion lasts until its card is moved or the illusion is dispelled (using a Dispel Magic spell or a similar effect). When the illusion ends, the image on its card disappears, and that card can't be used again.\n\n| 1d100 | Illusion |\n| --- | --- |\n| 01-03 | Adult Red Dragon |\n| 04-06 | Archmage |\n| 07-09 | Assassin |\n| 10-12 | Bandit Captain |\n| 13-15 | Beholder |\n| 16-18 | Berserker |\n| 19-21 | Bugbear Warrior |\n| 22-24 | Cloud Giant |\n| 25-27 | Druid |\n| 28-30 | Erinyes |\n| 31-33 | Ettin |\n| 34-36 | Fire Giant |\n| 37-39 | Frost Giant |\n| 40-42 | Gnoll Warrior |\n| 43-45 | Goblin Warrior |\n| 46-48 | Guardian Naga |\n| 49-51 | Hill Giant |\n| 52-54 | Hobgoblin Warrior |\n| 55-57 | Incubus |\n| 58-60 | Iron Golem |\n| 61-63 | Knight |\n| 64-66 | Kobold Warrior |\n| 67-69 | Lich |\n| 70-72 | Medusa |\n| 73-75 | Night Hag |\n| 76-78 | Ogre |\n| 79-81 | Oni |\n| 82-84 | Priest |\n| 85-87 | Succubus |\n| 88-90 | Troll |\n| 91-93 | Warrior Veteran |\n| 94-96 | Wyvern |\n| 97-00 | The card drawer |", "ed": "both"}, {"n": "Deck of Many More Things", "src": "bmt", "tp": "wondrous", "rar": "legendary", "rarn": 5, "mag": true, "att": false, "cur": false, "wt": "", "desc": "Over the centuries since the first Deck of Many Things was created, many have sought and failed to replicate it. But some have created new cards. These forty-four additional cards are known collectively as the Deck of Many More Things.\n\nLike the Deck of Many Things, the Deck of Many More Things manifests differently on various worlds. While it can include fewer or different cards, it frequently appears with a Deck of Many Things as part of a combined deck of sixty-six illuminated cards. The combined deck is usually protected by a box or pouch. The forty-four cards of the Deck of Many More Things bear similar imagery to those in the Deck of Many Things and have potent magical effects, which are detailed later in this description. Notably, cards from the Deck of Many More Things are more likely to be beneficial, though about a third of them are still dangerous.\n\nBefore you draw a card, you must declare how many cards you intend to draw and then draw them randomly. Unless a card allows you to draw additional cards, any cards drawn exceeding this number have no effect.\n\nAs soon as you draw a card, its magic takes effect. You must draw each card you declared no more than 1 hour after the previous draw. Unless a card states otherwise, if you fail to draw the chosen number, the remaining number of cards fly from the deck and take effect simultaneously.\n\nUnless it is the Fool or the Jester card, a drawn card immediately takes effect, fades from existence, and reappears in the deck, making it possible to draw the same card multiple times.\n\nThe DM can use the physical cards provided in The Deck of Many Things card set to build a combined Deck of Many Things and Deck of Many More Things, including whichever cards they desire. Alternatively, roll on the Deck of Many More Things table below to randomly determine what cards are drawn.\n\nDeck of Many More Things\n| d100 | Card |\n| --- | --- |\n| 01 | Aberration |\n| 02 | Balance* |\n| 03 | Beast |\n| 04 | Book |\n| 05 | Bridge |\n| 06 | Campfire |\n| 07 | Cavern |\n| 08 | Celestial |\n| 09 | Comet* |\n| 10 | Construct |\n| 11 | Corpse |\n| 12 | Crossroads |\n| 13 | Donjon* |\n| 14 | Door |\n| 15 | Dragon |\n| 16 | Elemental |\n| 17 | Euryale* |\n| 18 | Expert |\n| 19 | Fates* |\n| 20 | Fey |\n| 21 | Fiend |\n| 22 | Flames* |\n| 23 | Fool* |\n| 24 | Gem* |\n| 25 | Giant |\n| 26 | Humanoid |\n| 27 | Jester* |\n| 28 | Key* |\n| 29 | Knight* |\n| 30 | Lance |\n| 31 | Mage |\n| 32 | Map |\n| 33 | Maze |\n| 34 | Mine |\n| 35 | Monstrosity |\n| 36 | Moon* |\n| 37 | Ooze |\n| 38 | Path |\n| 39 | Pit |\n| 40 | Plant |\n| 41 | Priest |\n| 42 | Prisoner |\n| 43 | Puzzle* |\n| 44 | Ring |\n| 45 | Rogue* |\n| 46 | Ruin* |\n| 47 | Sage* |\n| 48 | Shield |\n| 49 | Ship |\n| 50 | Skull* |\n| 51 | Staff |\n| 52 | Stairway |\n| 53 | Star* |\n| 54 | Statue |\n| 55 | Sun* |\n| 56 | Talons* |\n| 57 | Tavern |\n| 58 | Temple |\n| 59 | Throne* |\n| 60 | Tomb |\n| 61 | Tower |\n| 62 | Tree |\n| 63 | Undead |\n| 64 | Void* |\n| 65 | Warrior |\n| 66 | Well |\n| 67-00 | Roll again |\n\nAberration\nYou gain telepathy within a range of 90 feet.\n\nBeast\nYou immediately transform into a random Beast with a CR of 5 or lower. Your game statistics—including your ability scores, hit points, and possible actions—are replaced by the Beast's game statistics, and any nonmagical equipment you're wearing or carrying melds into your new form and can't be used. Any magic items you're carrying drop in an unoccupied space within 5 feet of your new form.\n\nYou remain transformed in this way for 2d12 days; nothing can alter your form while you're under the effects of this card, but the Wish spell can end the transformation early. When you revert to your normal form, you return to the same state you were in when you initially transformed.\n\nBook\nYou gain the ability to speak, read, and write 1d6 + 2 languages of your choice.\n\nBridge\nYou gain the ability to cast the Time Stop spell 1d3 times. Use your Intelligence, Wisdom, or Charisma as the spellcasting ability (your choice).\n\nCampfire\nYou immediately gain the benefits of finishing a long rest.\n\nCavern\nYou gain a climbing speed equal to your walking speed. You also gain the ability to move up, down, across vertical surfaces, and along ceilings, while leaving your hands free.\n\nCelestial\nYou sprout a pair of softly luminescent, feathered wings from your back and gain a flying speed of 30 feet.\n\nConstruct\nA homunculus appears in an unoccupied space within 5 feet of you. The appearance of the homunculus is determined by the DM, and the homunculus treats you as its creator.\n\nCorpse\nYou immediately drop to 0 hit points, have the unconscious condition, and must begin making death saving throws. Spells and other magical effects that restore hit points have no effect on you until you are stabilized. If you fail three death saving throws, you die and can be resurrected only by the Wish spell.\n\nCrossroads\nRoll a d20. If the roll is even, you age 1d10 years. If the roll is odd, you become younger by 1d10 years, to a minimum of 1 year. This effect can be undone only by the Wish spell, divine intervention, or similar magic.\n\nDoor\nYou gain the ability to cast the Gate spell 1d4 times, requiring no material components. Use your Intelligence, Wisdom, or Charisma as the spellcasting ability (your choice).\n\nDragon\nA dragon egg appears at your feet and immediately hatches into a dragon wyrmling. The type of dragon is chosen by the DM. The wyrmling views you as its parent and is staunchly loyal to you and your allies.\n\nElemental\nYou become immune to one of the following damage types (choose immediately upon drawing this card): acid, cold, fire, lightning, or thunder.\n\nExpert\nYour Dexterity score increases by 2, to a maximum of 22.\n\nFey\nA fey crossing opens into the Feywild, and you're immediately pulled through it, disappearing in a flash of rainbow-colored light. You draw no more cards.\n\nThe fey crossing appears as a shimmering fractal of light above the deck, and it remains open for 1 minute after the card is drawn. The precise location in the Feywild to which the fey crossing leads is determined by the DM.\n\nFiend\nA powerful Fiend appears in a nearby unoccupied space and offers you a deal. The precise nature of this deal is up to the DM, but usually the Fiend offers some material reward in exchange for you and your allies completing a task for the Fiend. The Fiend is indifferent to you and can be bargained with; it keeps its side of any bargain it makes, though it might twist the wording of any agreement to suit its purposes. If attacked, or if negotiations fail and you refuse the Fiend's offer, it returns to its home plane.\n\nGiant\nYou immediately grow 2d10 inches in height, and your hit point maximum and current hit points both increase by 20.\n\nHumanoid\nYou can immediately choose to stop drawing from the deck, regardless of how many cards you initially declared.\n\nLance\nAll your ability scores increase by 1, to a maximum of 20.\n\nMage\nYour Intelligence score increases by 2, to a maximum of 22.\n\nMap\nAt any time you choose within 1 year of drawing this card, you can mentally name or describe an object or individual that is familiar to you. You immediately know the location of the object or individual, as well as the distance between you and the object or individual, even if the object or individual is on a different plane of existence. If you named an individual, you know if they are alive and any conditions they have. If you named an object, you know if it is broken or not. If you named a magic item that has charges, you know how many charges it has remaining.\n\nMaze\nYou gain 1d3 levels of exhaustion.\n\nMine\nA pile of 2d6 gems (each worth 5,000 gp) and 1d10 chunks of precious ore (each worth 2,500 gp) appears at your feet.\n\nMonstrosity\nA Large or larger Monstrosity with a challenge rating of 10 or less (chosen by the DM) appears in an unoccupied space within 15 feet of you. The creature is hostile toward you and attacks immediately. The creature disappears when it is killed or when you are reduced to 0 hit points. If there isn't enough space for a Large or larger creature to appear, this card has no effect.\n\nOoze\nA gelatinous cube immediately appears in your space and engulfs you. The gelatinous cube is hostile and remains until it is destroyed. If there isn't enough space for the gelatinous cube to appear, this card has no effect.\n\nPath\nYour walking speed increases by 10 feet.\n\nPit\nA pit opens beneath you. You plummet 3d6 × 10 feet, take damage from the fall, and have the prone condition.\n\nPlant\nYou gain the ability to cast Speak with Plants without using a spell slot; you must finish a long rest before you can cast it this way again. If you have spell slots of 3rd level or higher, you can cast this spell using them. Use your Intelligence, Wisdom, or Charisma as the spellcasting ability (your choice).\n\nPriest\nYour Wisdom score increases by 2, to a maximum of 22.\n\nPrisoner\nGlowing chains made of magical force appear and wrap around you. You have the restrained condition until the chains are destroyed or you are freed. While you have this condition, you can't cast spells, and any magic items you're wearing or carrying have their properties suppressed. You draw no more cards. The chains are immune to damage and can't be dispelled using the Dispel Magic spell or similar magic. However, a Disintegrate spell destroys the chains instantly, freeing you. Another creature can also free you by succeeding on a DC 30 Dexterity check using thieves' tools.\n\nRing\nA rare or rarer magic ring appears on your finger. If you have the attunement slots available, you're automatically attuned to the ring when it appears. The DM chooses the ring.\n\nShield\nA rare or rarer suit of magic armor that you are proficient with appears in your hands. The DM chooses the armor. If you lack proficiency with any armor, your base AC instead now equals 12 + your Dexterity modifier while you aren't wearing armor.\n\nShip\nYou gain proficiency in three skills chosen by the DM.\n\nStaff\nA rare or rarer magic rod, staff, or wand appears in your hands. The DM chooses the item.\n\nStairway\nYou can choose to either decrease your number of declared draws by two or receive a rare or rarer wondrous item, which appears in your hands. The DM chooses the item.\n\nStatue\nYou immediately have the petrified condition as your body is transformed into marble. The petrification lasts until you are freed with the Greater Restoration spell or similar magic.\n\nTavern\nYour Charisma score increases by 2 to a maximum of 22.\n\nTemple\nA deity or entity of similar power becomes bound to aid you. At any point in time between drawing the card and when you die, you can use your action to call on this entity for divine intervention, and the entity is bound to answer. The parameters and nature of this intervention are chosen by the DM. If you die without having used this intervention, the deity fulfills its obligation by casting the Resurrection spell on you. Once the entity has answered your call for divine intervention or resurrected you, the entity is no longer bound to aid you.\n\nTomb\nAt any time you choose within 1 year of drawing this card, you can cast the True Resurrection spell once without expending a spell slot or requiring material components. Use your Intelligence, Wisdom, or Charisma as the spellcasting ability (your choice).\n\nTower\nDraw two additional cards beyond your declared number of draws. The magic of these cards doesn't immediately take effect; instead, choose one of the two additional cards to keep, returning the other to the deck. The magic of the card you keep takes effect immediately thereafter.\n\nTree\nYour skin immediately becomes rough, like tree bark. Your base AC now equals 15 + your Dexterity modifier while you aren't wearing armor, but you have vulnerability to fire damage. This transformation can be undone only by the Wish spell, divine intervention, or similar magic.\n\nUndead\nSomewhere on the Material Plane, a revenant rises. This revenant blames you for its existence and relentlessly hunts you to exact its revenge. The revenant exists until either 1 year passes, the revenant kills you, or you use a Wish spell to banish it permanently to the afterlife.\n\nWarrior\nYour Strength score increases by 2 to a maximum of 22.\n\nWell\nYou learn three cantrips of your choice from any spell list.", "ed": "both"}, {"n": "Deck of Many Things", "src": "dmg", "tp": "wondrous", "rar": "legendary", "rarn": 5, "mag": true, "att": false, "cur": false, "wt": "", "desc": "Usually found in a box or pouch, this deck contains a number of cards made of ivory or vellum. Most (75 percent) of these decks have thirteen cards, but some have twenty-two. Use the appropriate column of the Deck of Many Things table when randomly determining cards drawn from the deck.\n\nBefore you draw a card, you must declare how many cards you intend to draw and then draw them randomly. Any cards drawn in excess of this number have no effect. Otherwise, as soon as you draw a card from the deck, its magic takes effect. You must draw each card no more than 1 hour after the previous draw. If you fail to draw the chosen number, the remaining number of cards fly from the deck on their own and take effect all at once.\n\nOnce a card is drawn, it disappears. Unless the card is the Fool or Jester, the card reappears in the deck, making it possible to draw the same card twice. (Once the Fool or Jester has left the deck, reroll on the table if that card comes up again.)\n\nDeck of Many Things\n| 1d100 (13-Card Deck) | 1d100 (22-Card Deck) | Card |\n| --- | --- | --- |\n| / | 01-05 | Balance |\n| / | 06-10 | Comet |\n| / | 11-14 | Donjon |\n| 01-08 | 15-18 | Euryale |\n| / | 19-23 | Fates |\n| 09-16 | 24-27 | Flames |\n| / | 28-31 | Fool |\n| / | 32-36 | Gem |\n| 17-24 | 37-41 | Jester |\n| 25-32 | 42-46 | Key |\n| 33-40 | 47-51 | Knight |\n| 41-48 | 52-56 | Moon |\n| / | 57-60 | Puzzle |\n| 49-56 | 61-64 | Rogue |\n| 57-64 | 65-68 | Ruin |\n| / | 69-73 | Sage |\n| 65-72 | 74-77 | Skull |\n| 73-80 | 78-82 | Star |\n| 81-88 | 83-87 | Sun |\n| / | 88-91 | Talons |\n| 89-96 | 92-96 | Throne |\n| 97-00 | 97-00 | Void |\nEach card's effect is described below.\n\nBalance. You can increase one of your ability scores by 2, to a maximum of 22, provided you also decrease another one of your ability scores by 2. You can't decrease an ability that has a score of 5 or lower. Alternatively, you can choose not to adjust your ability scores, in which case this card has no effect.\n\nComet. The next time you enter combat against one or more Hostile creatures, you can select one of them as your foe when you roll Initiative. If you reduce your foe to 0 Hit Points during that combat, you have Advantage on Death Saving Throws for 1 year. If someone else reduces your chosen foe to 0 Hit Points or you don't choose a foe, this card has no effect.\n\nDonjon. You disappear and become entombed in a state of suspended animation in an extradimensional sphere. Everything you're wearing and carrying disappears with you except for Artifacts, which stay behind in the space you occupied when you disappeared. You remain imprisoned until you are found and removed from the sphere. You can't be located by any Divination magic, but a Wish spell can reveal the location of your prison. You draw no more cards.\n\nEuryale. The card's medusa-like visage curses you. You take a -2 penalty to saving throws while cursed in this way. Only a god or the magic of the Fates card can end this curse.\n\nFates. Reality's fabric unravels and spins anew, allowing you to avoid or erase one event as if it never happened. You can use the card's magic as soon as you draw the card or at any other time before you die.\n\nFlames. A powerful devil becomes your enemy. The devil seeks your ruin and torments you, savoring your suffering before attempting to slay you. This enmity lasts until either you or the devil dies.\n\nA Question of Enmity\nTwo of the cards in the Deck of Many Things can earn a character the enmity of another being. With the Flames card, the enmity is overt. The character should experience the devil's malevolent efforts on multiple occasions. Seeking out the fiend shouldn't be a simple task, and the adventurer should clash with the devil's allies and followers a few times before being able to confront the devil.\n\nIn the case of the Rogue card, the enmity is secret and should come from someone thought to be a friend or an ally. As Dungeon Master, you should wait for a dramatically appropriate moment to reveal this enmity, leaving the adventurer guessing who is likely to become a betrayer.\n\nFool. You have Disadvantage on D20 Tests for the next 72 hours. Draw another card; this draw doesn't count as one of your declared draws.\n\nGem. Twenty-five pieces of jewelry worth 2,000 GP each or fifty gems worth 1,000 GP each appear at your feet.\n\nJester. You have Advantage on D20 Tests for the next 72 hours, or you can draw two additional cards beyond your declared draws.\n\nKey. A Rare or rarer magic weapon with which you are proficient appears on your person. The DM chooses the weapon.\n\nKnight. You gain the service of a Knight, who magically appears in an unoccupied space you choose within 30 feet of yourself. The knight has the same alignment as you and serves you loyally until death, believing the two of you have been drawn together by fate. Work with your DM to create a name and backstory for this NPC. The DM can use a different stat block to represent the knight, as desired.\n\nMoon. You gain the ability to cast Wish 1d3 times.\n\nPuzzle. Permanently reduce your Intelligence or Wisdom by 1d4 + 1 (to a minimum score of 1). You can draw one additional card beyond your declared draws.\n\nRogue. An NPC of the DM's choice becomes Hostile toward you. You don't know the identity of this NPC until they or someone else reveals it. Nothing less than a Wish spell or divine intervention can end the NPC's hostility toward you.\n\nRuin. All forms of wealth that you carry or own, other than magic items, are lost to you. Portable property vanishes. Businesses, buildings, and land you own are lost in a way that alters reality the least. If you have a Bastion (see the Dungeon Master's Guide), it is destroyed by some calamity beyond your control. Any documentation that proves you should own something lost to this card also disappears.\n\nSage. At any time you choose within one year of drawing this card, you can ask a question in meditation and mentally receive a truthful answer to that question.\n\nSkull. An Avatar of Death appears in an unoccupied space as close to you as possible. The avatar targets only you with its attacks, appearing as a ghostly skeleton clad in a tattered black robe and carrying a spectral scythe. The avatar disappears when it drops to 0 Hit Points or you die. If an ally of yours deals damage to the avatar, that ally summons another Avatar of Death. The new avatar appears in an unoccupied space as close to that ally as possible and targets only that ally with its attacks. You and your allies can each summon only one avatar as a consequence of this draw. A creature slain by an avatar can't be restored to life.\n\nStar. Increase one of your ability scores by 2, to a maximum of 24.\n\nSun. A magic item (chosen by the DM) appears on your person. In addition, you gain 10 Temporary Hit Points daily at dawn until you die.\n\nTalons. Every magic item you wear or carry disintegrates. Artifacts in your possession vanish instead.\n\nThrone. You gain proficiency and Expertise in your choice of History, Insight, Intimidation, or Persuasion. In addition, you gain rightful ownership of a small keep somewhere in the world. However, the keep is currently home to one or more monsters, which must be cleared out before you can claim the keep as yours.\n\nVoid. Your soul is drawn from your body and contained in an object in a place of the DM's choice. One or more powerful beings guard the place. While your soul is trapped in this way, your body is inert, ceases aging, and requires no food, air, or water. A Wish spell can't return your soul to your body, but the spell reveals the location of the object that holds your soul. You draw no more cards", "ed": "both"}, {"n": "Deck of Miscellany", "src": "bmt", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This wooden box contains a set of thirty-two parchment cards.\n\nDeck of Miscellany\n| Card | Item |\n| --- | --- |\n| 3 ♦ | Wooden abacus |\n| 4 ♦ | Four Perfume (vial) |\n| 5 ♦ | 5 days' worth of Rations (1 day) |\n| 6 ♦ | Iron pot |\n| 7 ♦ | Disguise kit |\n| 8 ♦ | Window (up to 5 feet wide and 5 feet high), which you can place on a vertical surface up to 5 feet thick and which allows you to look through the surface |\n| 9 ♦ | Manacles |\n| 10 ♦ | Ten Parchment (one sheet) |\n| 3 ♥ | Three dagger |\n| 4 ♥ | Four Oil (flask) |\n| 5 ♥ | Five silk robes |\n| 6 ♥ | Forgery kit |\n| 7 ♥ | Quarterstaff |\n| 8 ♥ | Fishing tackle |\n| 9 ♥ | Leather pouch containing 18 gp |\n| 10 ♥ | 10 crossbow bolt |\n| 3 ♣ | Three book, written in Common, about random historical events |\n| 4 ♣ | Canvas Two-Person Tent |\n| 5 ♣ | Silk Rope (50 feet) |\n| 6 ♣ | Two crowbar |\n| 7 ♣ | Healer's kit |\n| 8 ♣ | Eight gems worth 5 gp each |\n| 9 ♣ | Lamp |\n| 10 ♣ | Chain (10 feet) |\n| 3 ♠ | Three spear |\n| 4 ♠ | Steel mirror |\n| 5 ♠ | 15-foot wooden pole |\n| 6 ♠ | Burlap sack |\n| 7 ♠ | Two sets of fine clothes |\n| 8 ♠ | Shovel |\n| 9 ♠ | Light hammer |\n| 10 ♠ | Ten arrow |\n\nThe face of each card bears an illustration of a different item or set of items. As an action, you can draw a card of your choice from the deck and throw it to the ground in an unoccupied space within 5 feet of yourself. When the card hits the ground, the card permanently transforms into the item or set of items depicted on its face. An altered deck of real-world playing cards can simulate the deck, as shown on the Deck of Miscellany table.", "ed": "both"}, {"n": "Deck of Oracles", "src": "bmt", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "", "desc": "The illustrations on this deck of oracle cards move or change subtly when viewed indirectly. When you finish a long rest, you can spend 10 minutes consulting the cards for an omen of the coming day. Roll a d20 and record the number rolled. Once in the next 8 hours, immediately after a creature within 60 feet of you makes an ability check, an attack roll, or a saving throw, you can use your reaction to discard the d20 roll; the creature must use the number you rolled in place of its roll.\n\nAdditionally, while holding the cards, you can cast Divination from them. Once this property is used, it can't be used again until the next dawn.", "ed": "both"}, {"n": "Deck of Wild Cards", "src": "bmt", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This deck of heavy vellum cards hums with the magic of the Elemental Chaos.\n\nThe magic of the deck functions only if cards are drawn at random (a deck of real-world playing cards can simulate the deck). As an action, you can draw a random card from this deck and throw it to make a ranged spell attack, using Dexterity for the attack roll. The card has a range of 30 feet. On a hit, it deals 1d4 slashing damage and imposes a magical effect determined by its suit, as detailed in the Deck of Wild Cards table. The card immediately returns to the deck after it hits or misses a target.\n\nDeck of Wild Cards\n| d4 | Suit | Effect |\n| --- | --- | --- |\n| 1 | ♣ (Rods) | The card explodes in a burst of fire. The target and each creature within 5 feet of it must succeed on a DC 15 Dexterity saving throw or take 2d8 fire damage. |\n| 2 | ♦ (Coins) | The card shoots streaks of lightning. The target must make a DC 15 Dexterity saving throw. On a failed save, the target has the blinded condition until the end of your next turn, and each creature within 10 feet of the target takes 1d6 lightning damage. |\n| 3 | ♥ (Cups) | The card covers the target in a thick layer of ice. The target takes 1d10 cold damage and must succeed on a DC 15 Constitution saving throw or have the restrained condition until the end of your next turn. |\n| 4 | ♠ (Swords) | The card unleashes a sharp, concussive blast. The target and each creature within 5 feet of it take 1d6 force damage and must succeed on a DC 15 Strength saving throw or have the prone condition. |", "ed": "both"}, {"n": "Deck of Wonder", "src": "bmt", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "", "desc": "Created in the image of the Deck of Many Things, this deck of ivory or vellum cards bestows an assortment of minor benefits and penalties on those who draw from it. Most (75 percent) of these decks have only thirteen cards, but the rest have twenty-two.\n\nBefore you draw a card, you must declare how many cards you intend to draw, then draw them randomly. Any additional cards drawn have no effect. Unless a card states otherwise, as soon as you draw a card from the deck, its magic takes effect. You must draw each card you declared no more than 1 hour after the previous draw. If you fail to draw the chosen number, the remaining number of cards fly from the deck and take effect simultaneously.\n\nUnless it is the Mystery card, a drawn card immediately takes effect, fades from existence, and reappears in the deck, making it possible to draw the same card multiple times.\n\nYou can use an altered deck of playing cards to simulate the deck, as shown in the Deck of Wonder table.\n\nDeck of Wonder\n| Card | Card Title |\n| --- | --- |\n| A ♦ | Chancellor* |\n| K ♦ | Day |\n| Q ♦ | Night |\n| J ♦ | Dawn |\n| 2 ♦ | Dusk* |\n| A ♥ | Destiny* |\n| K ♥ | Crown |\n| Q ♥ | Lock |\n| J ♥ | Champion |\n| 2 ♥ | Coin* |\n| A ♣ | Vulture* |\n| K ♣ | Chaos |\n| Q ♣ | Order |\n| J ♣ | Beginning |\n| 2 ♣ | Mystery* |\n| A ♠ | Isolation* |\n| K ♠ | End |\n| Q ♠ | Monster |\n| J ♠ | Knife |\n| 2 ♠ | Justice* |\n| Joker (with ™) | Student* |\n| Joker (without ™) | Mischief |\n\nBeginning\nYour hit point maximum and current hit points increase by 2d10. Your hit point maximum remains increased in this way for the next 8 hours.\n\nChampion\nYou gain a +1 bonus to weapon attack and damage rolls. This bonus lasts for 8 hours.\n\nChancellor\nWithin 8 hours of drawing this card, you can cast Augury once as an action, requiring no material components. Use your Intelligence, Wisdom, or Charisma as the spellcasting ability (your choice).\n\nChaos\nYou gain resistance to one of the following damage types (chosen by the DM): acid, cold, fire, lightning, or thunder. This resistance lasts for 1d12 days.\n\nCoin\nFive pieces of jewelry, each worth 100 gp, or ten gemstones, each worth 50 gp, appear at your feet.\n\nCrown\nYou learn the Friends cantrip. Use your Intelligence, Wisdom, or Charisma as the spellcasting ability (your choice). If you already know this cantrip, the card has no effect.\n\nDawn\nThis card invigorates you. For the next 8 hours, you can add your proficiency bonus to your initiative rolls.\n\nDay\nYou gain a +1 bonus to saving throws. This benefit lasts until you finish a long rest.\n\nDestiny\nThis card protects you against an untimely demise. The first time after drawing this card that you would drop to 0 hit points from taking damage, you instead drop to 1 hit point.\n\nDusk\nThis card supernaturally saps your energy. You have disadvantage on initiative rolls. This effect lasts until you finish a long rest, but it can be ended early by a Remove Curse spell or similar magic.\n\nEnd\nThis card is an omen of death. You take 2d10 necrotic damage, and your hit point maximum is reduced by an amount equal to the damage taken. This effect can't reduce your hit point maximum below 10 hit points. This reduction lasts until you finish a long rest, but it can be ended early by a Remove Curse spell or similar magic.\n\nIsolation\nYou disappear, along with anything you are wearing or carrying, and become trapped in a harmless extradimensional space for 1d4 minutes. You draw no more cards. You then reappear in the space you left or the nearest unoccupied space. When you reappear, you must succeed on a DC 11 Constitution saving throw or have the poisoned condition for 1 hour as your body reels from the extradimensional travel.\n\nJustice\nYou momentarily gain the ability to balance the scales of fate. For the next 8 hours, whenever you or a creature within 60 feet of you is about to roll a d20 with advantage or disadvantage, you can use your reaction to prevent the roll from being affected by advantage or disadvantage.\n\nKnife\nAn uncommon magic weapon you're proficient with appears in your hands. The DM chooses the weapon.\n\nLock\nYou gain the ability to cast Knock 1d3 times. Use your Intelligence, Wisdom, or Charisma as the spellcasting ability (your choice).\n\nMischief\nYou receive an uncommon wondrous item (chosen by the DM), or you can draw two additional cards beyond your declared draws.\n\nMonster\nThis card's monstrous visage curses you. While cursed in this way, whenever you make a saving throw, you must roll 1d4 and subtract the number rolled from the total. The curse lasts until you finish a long rest, but it can be ended early with a Remove Curse spell or similar magic.\n\nMystery\nYou have disadvantage on Intelligence saving throws for 1 hour. Discard this card and draw from the deck again; together, the two draws count as one of your declared draws.\n\nNight\nYou gain darkvision within a range of 300 feet. This darkvision lasts for 8 hours.\n\nOrder\nYou gain resistance to one of the following damage types (chosen by the DM): force, necrotic, poison, psychic, or radiant. This resistance lasts for 1d12 days.\n\nStudent\nYou gain proficiency in Wisdom saving throws. If you already have this proficiency, you instead gain proficiency in Intelligence or Charisma saving throws (your choice).\n\nVulture\nOne nonmagical item or piece of equipment in your possession (chosen by the DM) disappears. The item remains nearby but concealed for a short time, so it can be found with a successful DC 15 Wisdom (Perception) check. If the item isn't recovered within 1 hour, it disappears forever.", "ed": "both"}, {"n": "Delver's Claws", "src": "bgg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "", "desc": "The back of this weatherworn leather glove is adorned with three large metal hooks shaped like a mole's claws. Stitched into the glove's palm is the mountain rune.\n\nThe glove is considered a simple melee weapon with the finesse and light properties, and it deals 1d4 slashing damage on a hit. While attuned to the glove, you gain a burrowing speed equal to your walking speed and blindsight to 15 feet.\n\nInvoking the Rune\nAs an action, you can invoke the glove's rune to bolster yourself with the sturdiness of the earth. Spend and roll a number of your unspent Hit Dice up to a maximum equal to your proficiency bonus. You then regain a number of hit points equal to the total roll plus your Constitution modifier.\n\nOnce the rune has been invoked, it can't be invoked again until the next dawn.", "ed": "both"}, {"n": "Demonomicon of Iggwilv", "src": "dmg", "tp": "wondrous", "rar": "artifact", "rarn": 6, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This treatise, composed by Iggwilv the archmage, documents the Abyss's layers and inhabitants and is widely regarded as the most thorough and blasphemous tome of demonology in the multiverse. The tome recounts both the oldest and most current profanities of the Abyss and demons. Demons have attempted to censor the text, and while sections have been ripped from the book's spine, the general chapters remain, ever revealing demonic secrets. Caged behind lines of script roils a secret piece of the Abyss itself, which keeps the book up-to-date, no matter how many pages are removed, and it longs to be more than mere reference material.\n\nAbyssal Lore. You can reference the Demonomicon whenever you make an Intelligence check to discern information about demons or a Wisdom (Survival) check related to the Abyss. When you do so, you gain Advantage on the check.\n\nContainment. The first ten pages of the Demonomicon are blank. As a Magic action while holding the book, you can target a Fiend that you can see that is trapped within the area of a Magic Circle spell. The Fiend must succeed on a DC 20 Charisma saving throw with Disadvantage or become trapped within one of the Demonomicon's blank pages, which fills with writing detailing the trapped creature's widely known name and depravities. Once used, this action can't be used again until the next dawn.\n\nWhen you finish a Long Rest, if you and the Demonomicon are on the same plane of existence, one trapped creature within the book can attempt to possess you. You make a DC 20 Charisma saving throw. On a failed save, you are possessed by the creature, which controls you like a puppet. As a Magic action, the possessing creature can release you and appear in the closest unoccupied space to you. On a successful save, the Fiend can't try to possess you again for 7 days (but another Fiend trapped in the book can certainly try).\n\nWhen the tome is discovered, it has 1d4 Fiends occupying its pages—typically an assortment of demons.\n\nEnsnarement. While carrying the book, whenever you cast Magic Circle naming only Fiends or cast Planar Binding targeting a Fiend, the spell is cast at level 9, regardless of what level spell slot you used, if any. Additionally, the Fiend has Disadvantage on its saving throw against the spell.\n\nFiendish Scourging. While carrying the book, when you make a damage roll for a spell you cast against a Fiend, you use the maximum possible result instead of rolling.\n\nRandom Properties. The Artifact has the following random properties:\n\n- 2 minor beneficial properties\n- 1 minor detrimental property\n- 1 major detrimental property\n\nSpells. The book has 8 charges and regains 1d8 expended charges daily at dawn. While holding the book, you can take a Magic action to cast one of the spells (save DC 20) on the following table. The table indicates how many charges you must expend to cast the spell.\n\n| Spell | Charge Cost |\n| --- | --- |\n| Magic Circle | 1 |\n| Magic Jar | 3 |\n| Planar Ally | 3 |\n| Planar Binding | 2 |\n| Plane Shift (to the Abyss only) | 3 |\n| Summon Fiend | 3 |\n| Tasha's Hideous Laughter | 0 |\n\nDestroying the Demonomicon. To destroy the book, six different demon lords must each tear out a sixth of the book's pages. If this occurs, the pages reappear after 24 hours. Before all those hours pass, anyone who opens the book's remaining binding is transported to a nascent layer of the Abyss that lies hidden within the book. At the heart of this deadly, semisentient domain lies a long-lost Artifact, Fraz-Urb'luu's Staff. If the staff is dragged from the pocket plane, the tome is reduced to a mundane and out-of-date copy of the Tome of Zyx, the work that served as the foundation of the Demonomicon of Iggwilv. The Tome of Zyx can be destroyed like any ordinary book. Once the staff emerges, the demon lord Fraz-Urb'luu knows instantly", "ed": "2024"}, {"n": "Dice Set", "src": "phb", "tp": "gaming_set", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "Ability: Wisdom\n\nUtilize: Discern whether someone is cheating (DC 10), or win the game (DC 20)\n\nIf you have proficiency with a tool, add your Proficiency Bonus to any ability check you make that uses the tool. If you have proficiency in a skill that's used with that check, you have Advantage on the check too", "ed": "both"}, {"n": "Dimensional Shackles", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": false, "cur": false, "wt": "", "desc": "You can take a Utilize action to place these shackles on a creature that has the Incapacitated condition. The shackles adjust to fit a creature of Small to Large size. The shackles prevent a creature bound by them from using any method of extradimensional movement, including teleportation or travel to a different plane of existence. They don't prevent the creature from passing through an interdimensional portal.\n\nYou and any creature you designate when you use the shackles can take a Utilize action to remove them. Once every 30 days, the bound creature can make a DC 30 Strength (Athletics) check. On a successful check, the creature breaks free and destroys the shackles", "ed": "both"}, {"n": "Diplomat's Pack", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "39 lb", "desc": "A Diplomat's Pack contains the following items: Chest, Fine Clothes, Ink, 5 Ink Pens, Lamp, 2 Map or Scroll Cases, 4 flasks of Oil, 5 sheets of Paper, 5 sheets of Parchment, Perfume, and Tinderbox", "ed": "both"}, {"n": "Disguise Kit", "src": "phb", "tp": "tool", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "3 lb", "desc": "Ability: Charisma\n\nUtilize: Apply makeup (DC 10)\n\nCraft: Costume\n\nIf you have proficiency with a tool, add your Proficiency Bonus to any ability check you make that uses the tool. If you have proficiency in a skill that's used with that check, you have Advantage on the check too", "ed": "both"}, {"n": "Dispelling Stone", "src": "egw", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "1 lb", "desc": "This smooth, rainbow-colored, egg-shaped stone can be thrown up to 30 feet and explodes in a 10-foot-radius sphere of magical energy on impact, destroying the stone. Any active spell of 5th level or lower in the sphere ends.", "ed": "both"}, {"n": "Donjon's Sundering Sphere", "src": "bmt", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This marble-size crystal sphere glows with extraplanar energy.\n\nAs part of attuning to this item, you press the crystal sphere to the hilt of a nonmagical melee weapon of your choice, magically attaching the sphere to the weapon. The weapon becomes a magic weapon with a +1 bonus to attack and damage rolls. While wielding this weapon, you gain the following benefits:\n\n- Dimensional Anchor: You have advantage on saving throws against spells or effects that would send you to an extradimensional space, a demiplane, or another plane of existence against your will.\n- Isolating Smite: When you hit a creature with this weapon, you can force the creature to make a DC 16 Charisma saving throw. On a failed save, the creature is banished to a harmless demiplane until the end of its next turn. When the banished creature returns, it reappears in the space it left or the nearest unoccupied space if that space is occupied. Once this property is used, it can't be used again until the next dawn.\nWhen you end your attunement to the sphere, the sphere harmlessly detaches from the weapon, and the weapon reverts to a nonmagical piece of equipment.", "ed": "both"}, {"n": "Donkey", "src": "phb", "tp": "mount", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "", "ed": "both"}, {"n": "Draft Horse", "src": "phb", "tp": "mount", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "Speed: 40, Carrying Capacity: 540 lb", "ed": "both"}, {"n": "Dragonchess Set", "src": "phb", "tp": "gaming_set", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "Ability: Wisdom\n\nUtilize: Discern whether someone is cheating (DC 10), or win the game (DC 20)\n\nIf you have proficiency with a tool, add your Proficiency Bonus to any ability check you make that uses the tool. If you have proficiency in a skill that's used with that check, you have Advantage on the check too", "ed": "both"}, {"n": "Dread Helm", "src": "dmg", "tp": "wondrous", "rar": "common", "rarn": 1, "mag": true, "att": false, "cur": false, "wt": "", "desc": "While you're wearing this fearsome steel helm, your eyes glow red and the rest of your face is hidden in shadow", "ed": "both"}, {"n": "Driftglobe", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "1 lb", "desc": "This small sphere of thick glass weighs 1 pound. If you are within 60 feet of it, you can command it to emanate light equivalent to that of the Light or Daylight spell (your choice). Once used, the Daylight effect can't be used again until the next dawn.\n\nYou can issue another command as a Magic action to make the illuminated globe rise into the air and float no more than 5 feet off the ground. The globe hovers in this way until you or another creature grasps it. If you move more than 60 feet from the hovering globe, it follows you until it is within 60 feet of you. It takes the shortest route to do so. If prevented from moving, the globe sinks gently to the ground and becomes inactive, and its light winks out", "ed": "both"}, {"n": "Drow Poison", "src": "dmg", "tp": "poison", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "This poison is typically made only by the drow, and only in a place far removed from sunlight. A creature subjected to this poison must succeed on a DC 13 Constitution saving throw or be poisoned for 1 hour. If the saving throw fails by 5 or more, the creature is also unconscious while poisoned in this way. The creature wakes up if it takes damage or if another creature takes an action to shake it awake.", "ed": "5e"}, {"n": "Drum", "src": "phb", "tp": "instrument", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "3 lb", "desc": "Ability: Charisma\n\nUtilize: Play a known tune (DC 10), or improvise a song (DC 15)\n\nIf you have proficiency with a tool, add your Proficiency Bonus to any ability check you make that uses the tool. If you have proficiency in a skill that's used with that check, you have Advantage on the check too", "ed": "both"}, {"n": "Dulcimer", "src": "phb", "tp": "instrument", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "10 lb", "desc": "Ability: Charisma\n\nUtilize: Play a known tune (DC 10), or improvise a song (DC 15)\n\nIf you have proficiency with a tool, add your Proficiency Bonus to any ability check you make that uses the tool. If you have proficiency in a skill that's used with that check, you have Advantage on the check too", "ed": "both"}, {"n": "Dungeoneer's Pack", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "55 lb", "desc": "A Dungeoneer's Pack contains the following items: Backpack, Caltrops, Crowbar, 2 flasks of Oil, 10 days of Rations, Rope, Tinderbox, 10 Torches, and Waterskin", "ed": "both"}, {"n": "Du
