 replace one of your attacks with throwing a flask of Holy Water. Target one creature you can see within 20 feet of yourself. The target must succeed on a Dexterity saving throw (DC 8 plus your Dexterity modifier and Proficiency Bonus) or take 2d8 Radiant damage if it is a Fiend or an Undead", "ed": "2024"}, {"n": "Holy Water (flask)", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "As an action, you can splash the contents of this flask onto a creature within 5 feet of you or throw it up to 20 feet, shattering it on impact. In either case, make a ranged attack against a target creature, treating the holy water as an improvised weapon. If the target is a fiend or undead, it takes 2d6 radiant damage.\n\nA cleric or paladin may create holy water by performing a special ritual. The ritual takes 1 hour to perform, uses 25 gp worth of powdered silver, and requires the caster to expend a 1st-level spell slot.", "ed": "5e"}, {"n": "Hooded Lantern", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "2 lb", "desc": "A Hooded Lantern burns Oil as fuel to cast Bright Light in a 30-foot radius and Dim Light for an additional 30 feet. As a Bonus Action, you can lower the hood, reducing the light to Dim Light in a 5-foot radius, or raise it again", "ed": "both"}, {"n": "Horizon Puzzle Cube", "src": "bgg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": false, "cur": false, "wt": "", "desc": "A Horizon puzzle cube is an 8-inch magical cube made of gold, iron, crystal, and copper, and it is worth 5,000 gp to a sage or collector. A functioning puzzle cube can be solved with 30 minutes of work and a successful DC 25 Intelligence (Investigation) check. When the cube is solved, a 30-foot-diameter portal appears before the creature who solved the cube, leading to the northeastern platform of Horizon's Edge. The portal is two-way and remains open for 10 minutes or until a creature uses an action to change the puzzle's configuration. Puzzle cubes don't function while on Horizon's Edge, but a device somewhere in the demiplane allows a cube to function in reverse while the cube is fitted into it.", "ed": "both"}, {"n": "Horn", "src": "phb", "tp": "instrument", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "2 lb", "desc": "Ability: Charisma\n\nUtilize: Play a known tune (DC 10), or improvise a song (DC 15)\n\nIf you have proficiency with a tool, add your Proficiency Bonus to any ability check you make that uses the tool. If you have proficiency in a skill that's used with that check, you have Advantage on the check too", "ed": "both"}, {"n": "Horn of Blasting", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": false, "cur": false, "wt": "", "desc": "You can take a Magic action to blow the horn, which emits a thunderous blast in a 30-foot Cone that is audible out to 600 feet. Each creature in the Cone makes a DC 15 Constitution saving throw. On a failed save, a creature takes 5d8 Thunder damage and has the Deafened condition for 1 minute. On a successful save, a creature takes half as much damage only. Glass or crystal objects in the Cone that aren't being worn or carried take 10d8 Thunder damage.\n\nEach use of the horn's magic has a 20 percent chance of causing the horn to explode. The explosion deals 10d6 Force damage to the user and destroys the horn", "ed": "both"}, {"n": "Horn of Silent Alarm", "src": "dmg", "tp": "wondrous", "rar": "", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This horn has 4 charges and regains 1d4 expended charges daily at dawn. As a Magic action, you can blow the horn while expending 1 charge. One creature of your choice hears the horn's blare, provided that creature is within 600 feet of the horn. No other creature hears the horn", "ed": "2024"}, {"n": "Horn of Valhalla, Brass", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": false, "cur": false, "wt": "", "desc": "You can take a Magic action to blow this horn. In response, warrior spirits from the plane of Ysgard appear in unoccupied spaces within 60 feet of you. Each spirit uses the Berserker stat block and returns to Ysgard after 1 hour or when it drops to 0 Hit Points. The spirits look like living, breathing warriors, and they have Immunity to the Charmed and Frightened conditions. Once you use the horn, it can't be used again until 7 days have passed.\n\nA brass horn summons 3 Berserkers. To use the brass horn, you must have Proficiency with all Simple weapons.\n\nIf you blow the horn without meeting its requirement, the summoned Berserkers attack you. If you meet the requirement, they are Friendly to you and your allies and follow your commands", "ed": "both"}, {"n": "Horn of Valhalla, Bronze", "src": "dmg", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "2 lb", "desc": "You can take a Magic action to blow this horn. In response, warrior spirits from the plane of Ysgard appear in unoccupied spaces within 60 feet of you. Each spirit uses the Berserker stat block and returns to Ysgard after 1 hour or when it drops to 0 Hit Points. The spirits look like living, breathing warriors, and they have Immunity to the Charmed and Frightened conditions. Once you use the horn, it can't be used again until 7 days have passed.\n\nA bronze horn summons 4 Berserkers. To use the bronze horn, you must have training with all Medium armor.\n\nIf you blow the horn without meeting its requirement, the summoned Berserkers attack you. If you meet the requirement, they are Friendly to you and your allies and follow your commands", "ed": "both"}, {"n": "Horn of Valhalla, Iron", "src": "dmg", "tp": "wondrous", "rar": "legendary", "rarn": 5, "mag": true, "att": false, "cur": false, "wt": "2 lb", "desc": "You can take a Magic action to blow this horn. In response, warrior spirits from the plane of Ysgard appear in unoccupied spaces within 60 feet of you. Each spirit uses the Berserker stat block and returns to Ysgard after 1 hour or when it drops to 0 Hit Points. The spirits look like living, breathing warriors, and they have Immunity to the Charmed and Frightened conditions. Once you use the horn, it can't be used again until 7 days have passed.\n\nA iron horn summons 5 Berserkers. To use the iron horn, you must have Proficiency with all Martial weapons.\n\nIf you blow the horn without meeting its requirement, the summoned Berserkers attack you. If you meet the requirement, they are Friendly to you and your allies and follow your commands", "ed": "both"}, {"n": "Horn of Valhalla, Silver", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": false, "cur": false, "wt": "2 lb", "desc": "You can take a Magic action to blow this horn. In response, warrior spirits from the plane of Ysgard appear in unoccupied spaces within 60 feet of you. Each spirit uses the Berserker stat block and returns to Ysgard after 1 hour or when it drops to 0 Hit Points. The spirits look like living, breathing warriors, and they have Immunity to the Charmed and Frightened conditions. Once you use the horn, it can't be used again until 7 days have passed.\n\nA silver horn summons 2 Berserkers. They are Friendly to you and your allies and follow your commands", "ed": "both"}, {"n": "Horseshoes of a Zephyr", "src": "dmg", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "", "desc": "These horseshoes come in a set of four. As a Magic action, you can touch one of the horseshoes to the hoof of a horse or similar creature, whereupon the horseshoe affixes itself to the hoof. Removing a horseshoe also takes a Magic action.\n\nWhile all four shoes are affixed to the hooves of a horse or similar creature, they allow the creature to move normally while floating 4 inches above a surface. This effect means the creature can cross or stand above nonsolid or unstable surfaces, such as water or lava. The creature leaves no tracks and ignores Difficult Terrain. In addition, the creature can travel for up to 12 hours a day without gaining Exhaustion levels from extended travel", "ed": "both"}, {"n": "Horseshoes of Speed", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": false, "cur": false, "wt": "", "desc": "These horseshoes come in a set of four. As a Magic action, you can touch one of the horseshoes to the hoof of a horse or similar creature, whereupon the horseshoe affixes itself to the hoof. Removing a horseshoe also takes a Magic action.\n\nWhile all four horseshoes are attached to the same creature, its Speed is increased by 30 feet", "ed": "both"}, {"n": "Hourglass", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "", "ed": "both"}, {"n": "House of Cards", "src": "bmt", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This deck of cards is decorated with geometric shapes that have a protective motif. While you're holding the deck, you can use an action to shuffle it and cause the cards to deal themselves out and transform into a shelter made of cards. The shelter can be shaped however you desire, but it must fit in a 40-foot cube centered on a point within 30 feet of you. The shelter has one door and up to four windows, and only you can open or close them. It has a floor and a roof, and it maintains a comfortable temperature inside.\n\nThe shelter has AC 15, 50 hit points, and immunity to poison and psychic damage. The shelter lasts for 24 hours, until you dismiss it as an action, or until it is reduced to 0 hit points. When the shelter's duration ends, it transforms back into a deck of cards and appears in your hand. Once the deck has transformed into a shelter, it can't be used again until the next dawn.", "ed": "both"}, {"n": "Hunk of Cheese", "src": "phb", "tp": "food_and_drink", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "", "ed": "5e"}, {"n": "Hunting Trap", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "25 lb", "desc": "As a Utilize action, you can set a Hunting Trap, which is a sawtooth steel ring that snaps shut when a creature steps on a pressure plate in the center. The trap is affixed by a heavy chain to an immobile object, such as a tree or a spike driven into the ground. A creature that steps on the plate must succeed on a DC 13 Dexterity saving throw or take 1d4 Piercing damage and have its Speed reduced to 0 until the start of its next turn. Thereafter, until the creature breaks free of the trap, its movement is limited by the length of the chain (typically 3 feet). A creature can use its action to make a DC 13 Strength (Athletics) check, freeing itself or another creature within its reach on a success. Each failed check deals 1 Piercing damage to the trapped creature", "ed": "both"}, {"n": "Iggwilv's Cauldron", "src": "wbtw", "tp": "wondrous", "rar": "artifact", "rarn": 6, "mag": true, "att": true, "cur": false, "wt": "80 lb", "desc": "The cauldron has two forms. Only Iggwilv or Baba Yaga can change the cauldron from one form to another (by using an action to touch it), which either can do without being attuned to the item. In its first form, the cauldron is made of solid gold and embossed on the outside with images of bare-branched trees, falling leaves, and broomsticks. In its second form, the cauldron is made of iron and embossed on the outside with images of bats, toads, cats, lizards, and snakes—eight of each animal. In either form, the cauldron is roughly 3 feet in diameter and has a 2-foot-wide mouth, a round lid with a molded handle at the top, and eight clawed feet for stability. The cauldron weighs 80 pounds when empty, and it can hold up to 100 gallons of liquid.\n\nAttunement: Any Humanoid creature that attunes to the cauldron must succeed on a DC 15 Constitution saving throw or be aged to the point of decrepitude. In this state, the creature’s speed is halved, the range of its vision and hearing is reduced to 30 feet, and it has disadvantage on all ability checks, attack rolls, and saving throws. The creature will reach the end of its natural life span in 3d8 days. Only a wish spell or divine intervention can reverse this aging effect on the creature.\n\nThree hags can attune to the cauldron simultaneously, provided they have formed a coven. If the coven disbands, the attunement ends for all three hags.\n\nRandom Properties. Regardless of the form it takes, the cauldron has the following random properties:\n\n- 1 minor beneficial property (determined by rolling on the Minor Beneficial Properties table)\n\n- 1 minor detrimental property (determined by rolling on the Minor Detrimental Properties table)\n\nTHE WITCH QUEEN’S CAULDRON\n\nAs explained in the description of Iggwilv’s Cauldron, the poem titled “The Witch Queen’s Cauldron” is an incantation that hints at the time-freezing property of the artifact:\n\nEight cats perch atop eight dead attending\nEight lizards flee from eight rats scavenging\nEight toads climbing meet eight dead and falling\nEight snakes sneak under eight bats screaming\nEight eyes open, always dreaming\nAll on the cauldron that is ever seeming.\n\nGold Cauldron: The gold cauldron has the following properties:\n\n- If water is poured into the cauldron and stirred for 1 minute, it transforms into a hearty, hot stew that provides one nourishing meal for up to four people per gallon of water used. The stew remains hot while in the cauldron, then cools naturally after it is removed. The outside of the cauldron remains safe to touch despite the heat of the stew.\nIf wine is poured into the cauldron and stirred for 10 minutes, it transforms into a magical elixir that fortifies up to four people per gallon of wine used. Any creature that imbibes the elixir gains 10 temporary hit points. Any of the elixir that isn’t consumed within 1 hour vanishes. Once used, this property of the cauldron can’t be used again until the next dawn.\n- When the cauldron is filled with 90 gallons of water mixed with 10 gallons of wine, it can be used as the focus for a scrying spell. When this spell is cast using the cauldron as its focus, the target of the spell fails its saving throw automatically, and the spell works even if its caster and the target are on different planes of existence. When the spell ends, all the liquid in the cauldron vanishes.\n- Dipping the bristles of an ordinary broom into the water-filled cauldron transforms the broom into a broom of flying for 3 days. Once used, this property of the cauldron can’t be used again until the next dawn.\n\nIron Cauldron: The iron cauldron has the following properties:\n\nYou can use an action to scream into the empty cauldron, which magically summons a swarm of bats that flies out of the cauldron and acts immediately after you in the initiative order. The swarm obeys your commands and disappears after 1 minute if it hasn’t been destroyed by then. Once used, this property of the cauldron can’t be used again until the next dawn.\nIf at least 1 gallon of blood is poured into the cauldron and stirred for 1 minute, it turns into a cloud of harmless black smoke that erupts from the cauldron and dissipates quickly. At the same time, all Humanoid creatures within a certain radius of the cauldron fall unconscious for 1 hour, except those that are attuned to the cauldron or immune to being charmed. The radius of the effect is 100 feet per gallon of blood used. An unconscious creature awakens if it takes damage or if someone uses an action to shake or slap it. Once used, this property of the cauldron can’t be used again until the next dawn.\nTying a dead frog or toad to the end of an ordinary branch and dipping it in the water-filled cauldron transforms the branch into a wand of polymorph with 3 charges. This wand can’t recharge and crumbles to ashes when its final charge is expended. Once used, this property of the cauldron can’t be used again for 8 days.\nIf you spend 1 minute touching the cauldron with a unicorn’s horn while reciting the poem called “The Witch Queen’s Cauldron”, all creatures within 1,000 feet of the cauldron except those that are attuned to it become frozen in time. A time-frozen creature is incapacitated, can’t move or speak, doesn’t age, and is unaware of its surroundings or the passage of time. Moreover, it can’t be moved, harmed in any way, or affected by any other magic. All other conditions and effects on the creature are suppressed until it is no longer frozen in time. Destroying the cauldron, sending it to another plane of existence, or touching it with a unicorn’s horn for 1 minute while reciting “The Witch Queen’s Cauldron” ends the time-freezing effect on all creatures. The effect also ends on any creature that comes into contact with an antimagic field or is touched by a unicorn’s horn.\n\nDestroying the Cauldron: The cauldron is a Medium object with AC 19, 80 hit points, and immunity to damage from any source other than a flame tongue or frost brand weapon. Reducing the cauldron to 0 hit points with such a weapon shatters the cauldron into eight pieces of roughly equal size, whereupon all ongoing effects created by the cauldron end as it loses its magic.\n\nThe destruction of Iggwilv’s Cauldron causes all hags in the multiverse to lose the Shared Spellcasting trait gained by being in a coven.\n\nReconstructing the Cauldron: If all eight pieces of the shattered cauldron are within 5 feet of one another, a wish spell can reassemble them, restoring the cauldron and all its properties. The cauldron’s reconstruction also restores the Shared Spellcasting trait of hag covens throughout the multiverse.", "ed": "both"}, {"n": "Iggwilv's Horn", "src": "ditlcot", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "", "desc": "You can use an action to blow this horn to cast one of the following spells from it: Arms of Hadar, Fog Cloud, Gust of Wind, or Web. If the spell requires a saving throw, the spell save DC is 13.\n\nOnce the horn has been used to cast a spell, it can't be used to cast that spell again until the next dawn.", "ed": "both"}, {"n": "Immovable Rod", "src": "dmg", "tp": "rod", "rar": "uncommon", "rarn": 2, "mag": false, "att": false, "cur": false, "wt": "2 lb", "desc": "This iron rod has a button on one end. You can take a Utilize action to press the button, which causes the rod to become magically fixed in place. Until you or another creature takes a Utilize action to push the button again, the rod doesn't move, even if it defies gravity. The rod can hold up to 8,000 pounds of weight. More weight causes the rod to deactivate and fall. A creature can take a Utilize action to make a DC 30 Strength (Athletics) check, moving the fixed rod up to 10 feet on a successful check", "ed": "both"}, {"n": "Ink", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "Ink comes in a 1-ounce bottle, which provides enough ink to write about 500 pages", "ed": "2024"}, {"n": "Ink (1-ounce bottle)", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "Ink (1-ounce bottle)", "ed": "5e"}, {"n": "Ink Pen", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "Using Ink, an Ink Pen is used to write or draw", "ed": "both"}, {"n": "Instrument of Illusions", "src": "dmg", "tp": "wondrous", "rar": "common", "rarn": 1, "mag": true, "att": false, "cur": false, "wt": "", "desc": "While you are playing this musical instrument, you can take a Magic action to create harmless, illusory visual effects within a 5-foot Emanation originating from the instrument. If you are a Bard, the size of the Emanation increases to 15 feet. Sample visual effects include luminous musical notes, a spectral dancer, butterflies, and gently falling snow. The magical effects have neither substance nor sound, and they are obviously illusory. The effects end when you stop playing", "ed": "2024"}, {"n": "Instrument of Scribing", "src": "dmg", "tp": "wondrous", "rar": "common", "rarn": 1, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This musical instrument has 3 charges and regains all expended charges daily at dawn. While you are playing it, you can take a Magic action to expend 1 charge and write a magical message on a nonmagical object or surface that you can see within 30 feet of yourself. The message can be up to six words long and is written in a language you know. If you are a Bard, you can scribe an additional seven words and make the message glow faintly, allowing it to be seen in nonmagical Darkness. Casting the Dispel Magic spell on the message erases it. Otherwise, the message fades away after 24 hours", "ed": "both"}, {"n": "Instrument of the Bards, Anstruth Harp", "src": "dmg", "tp": "instrument", "rar": "very_rare", "rarn": 99, "mag": true, "att": true, "cur": false, "wt": "2 lb", "desc": "An instrument of the bards is an exquisite example of its kind, superior to an ordinary instrument in every way. Seven types of these instruments exist, each named after a legendary bard college. A creature that attempts to play the instrument without being attuned to it must succeed on a DC 15 Wisdom saving throw or take 2d4 psychic damage.\n\nYou can use an action to play the instrument and cast one of its spells. Once the instrument has been used to cast a spell, it can't be used to cast that spell again until the next dawn. The spells use your spellcasting ability and spell save DC.\n\nYou can play the instrument while casting a spell that causes any of its targets to be charmed on a failed saving throw, thereby imposing disadvantage on the save. This effect applies only if the spell has a somatic or a material component.\n\nAll instruments of the bards can be used to cast the following spells: fly, invisibility, levitate, and protection from evil and good.\n\nIn addition, the Anstruth harp can be used to cast control weather, cure wounds (5th level), and wall of thorns.", "ed": "both"}, {"n": "Instrument of the Bards, Canaith Mandolin", "src": "dmg", "tp": "instrument", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "2 lb", "desc": "An instrument of the bards is an exquisite example of its kind, superior to an ordinary instrument in every way. Seven types of these instruments exist, each named after a legendary bard college. A creature that attempts to play the instrument without being attuned to it must succeed on a DC 15 Wisdom saving throw or take 2d4 psychic damage.\n\nYou can use an action to play the instrument and cast one of its spells. Once the instrument has been used to cast a spell, it can't be used to cast that spell again until the next dawn. The spells use your spellcasting ability and spell save DC.\n\nYou can play the instrument while casting a spell that causes any of its targets to be charmed on a failed saving throw, thereby imposing disadvantage on the save. This effect applies only if the spell has a somatic or a material component.\n\nAll instruments of the bards can be used to cast the following spells: fly, invisibility, levitate, and protection from evil and good.\n\nIn addition, the Canaith mandolin can be used to cast cure wounds (3rd level), dispel magic, and protection from energy (lightning only).", "ed": "both"}, {"n": "Instrument of the Bards, Cli Lyre", "src": "dmg", "tp": "instrument", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "2 lb", "desc": "An instrument of the bards oun, a god of knowledge and prophecy revered on some worlds. Many types of Ioun Stones exist, each type a distinct combination of shape and color.\n\nWhen you take a Magic action to toss an Ioun Stone into the air, the stone orbits your head at a distance of 1d3 feet, conferring its benefit to you while doing so. You can have up to three Ioun Stones orbiting your head at the same time.\n\nEach Ioun Stone orbiting your head is considered to be an object you are wearing. The orbiting stone avoids contact with other creatures and objects, adjusting its orbit to avoid collisions and thwarting all attempts by other creatures to attack or snatch it.\n\nAs a Utilize action, you can seize and stow any number of Ioun Stones orbiting your head. If your Attunement to an Ioun Stone ends while it's orbiting your head, the stone falls as though you had dropped it.\n\nWhile this pale lavender ellipsoid orbits your head, you can take a Reaction to cancel a spell of level 4 or lower cast by a creature you can see. A canceled spell has no effect, and any resources used to cast it are wasted. Once the stone has canceled 20 levels of spells, it burns out, turns dull gray, and loses its magic", "ed": "both"}, {"n": "Ioun Stone, Agility", "src": "dmg", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": true, "cur": false, "wt": "", "desc": "Roughly marble sized, Ioun Stones are named after Ioun, a god of knowledge and prophecy revered on some worlds. Many types of Ioun Stones exist, each type a distinct combination of shape and color.\n\nWhen you take a Magic action to toss an Ioun Stone into the air, the stone orbits your head at a distance of 1d3 feet, conferring its benefit to you while doing so. You can have up to three Ioun Stones orbiting your head at the same time.\n\nEach Ioun Stone orbiting your head is considered to be an object you are wearing. The orbiting stone avoids contact with other creatures and objects, adjusting its orbit to avoid collisions and thw ugh you had dropped it.\n\nYou gain a +1 bonus to Armor Class while this dusty-rose prism orbits your head", "ed": "both"}, {"n": "Ioun Stone, Regeneration", "src": "dmg", "tp": "wondrous", "rar": "legendary", "rarn": 5, "mag": true, "att": true, "cur": false, "wt": "", "desc": "Roughly marble sized, Ioun Stones are named after Ioun, a god of knowledge and prophecy revered on some worlds. Many types of Ioun Stones exist, each type a distinct combination of shape and color.\n\nWhen you take a Magic action to toss an Ioun Stone into the air, the stone orbits your head at a distance of 1d3 feet, conferring its benefit to you while doing so. You can have up to three Ioun Stones orbiting your head at the same time.\n\nEach Ioun Stone orbiting your head is considered to be an object you are wearing. The orbiting stone avoids contact with other creatures and objects, adjusting its orbit to avoid collisions and thwarting all attempts by other creatures to attack or snatch it.\n\nAs a Utilize action, you can seize and stow any number of Ioun Stones orbiting your head. If your Attunement to an Ioun Stone ends while it's orbiting your head, the stone falls as though you had dropped it.\n\nYou regain 15 Hit Points at the end of each hour this pearly white spindle orbits your head if you have at least 1 Hit Point", "ed": "both"}, {"n": "Ioun Stone, Reserve", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "", "desc": "Roughly marble sized, Ioun Stones are named after Ioun, a god of knowledge and prophecy revered on some worlds. Many types of Ioun Stones exist, each type a distinct combination of shape and color.\n\nWhen you take a Magic action to toss an Ioun Stone into the air, the stone orbits your head at a distance of 1d3 feet, conferring its benefit to you while doing so. You can have up to three Ioun Stones orbiting your head at the same time.\n\nEach Ioun Stone orbiting your head is considered to be an object you are wearing. The orbiting stone avoids contact with other creatures and objects, adjusting its orbit to avoid collisions and thwarting all attempts by other creatures to attack or snatch it.\n\nAs a Utilize action, you can seize and stow any number of Ioun Stones orbiting your head. If your Attunement to an Ioun Stone ends while it's orbiting your head, the stone falls as though you had dropped it.\n\nThis vibrant purple prism stores spells cast into it, holding them until you use them. The stone can store up to 4 levels of spells at a time. When found, it contains 1d4 levels of stored spells chosen by the DM.\n\nAny creature can cast a spell of level 1 through 4 into the stone by touching it as the spell is cast. The spell has no effect, other than to be stored in the stone. If the stone can't hold the spell, the spell is expended without effect. The level of the slot used to cast the spell determines how much space it uses.\n\nWhile this stone orbits your head, you can cast any spell stored in it. The spell uses the slot level, spell save DC, spell attack bonus, and spellcasting ability of the original caster but is otherwise treated as if you cast the spell. The spell cast from the stone is no longer stored in it, freeing up space", "ed": "both"}, {"n": "Ioun Stone, Strength", "src": "dmg", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": true, "cur": false, "wt": "", "desc": "Roughly marble sized, Ioun Stones are named after Ioun, a god of knowledge and prophecy revered on some worlds. Many types of Ioun Stones exist, each type a distinct combination of shape and color.\n\nWhen you take a Magic action to toss an Ioun Stone into the air, the stone orbits your head at a distance of 1d3 feet, conferring its benefit to you while doing so. You can have up to three Ioun Stones orbiting your head at the same time.\n\nEach Ioun Stone orbiting your head is considered to be an object you are wearing. The orbiting stone avoids contact with other creatures and objects, adjusting its orbit to avoid collisions and thwarting all attempts by other creatures to attack or snatch it.\n\nAs a Utilize action, you can seize and stow any number of Ioun Stones orbiting your head. If your Attunement to an Ioun Stone ends while it's orbiting your head, the stone falls as though you had dropped it.\n\nYour Strength increases by 2, to a maximum of 20, while this pale blue rhomboid orbits your head", "ed": "both"}, {"n": "Ioun Stone, Sustenance", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "", "desc": "Roughly marble sized, Ioun Stones are named after Ioun, a god of knowledge and prophecy revered on some worlds. Many types of Ioun Stones exist, each type a distinct combination of shape and color.\n\nWhen you take a Magic action to toss an Ioun Stone into the air, the stone orbits your head at a distance of 1d3 feet, conferring its benefit to you while doing so. You can have up to three Ioun Stones orbiting your head at the same time.\n\nEach Ioun Stone orbiting your head is considered to be an object you are wearing. The orbiting stone avoids contact with other creatures and objects, adjusting its orbit to avoid collisions and thwarting all attempts by other creatures to attack or snatch it.\n\nAs a Utilize action, you can seize and stow any number of Ioun Stones orbiting your head. If your Attunement to an Ioun Stone ends while it's orbiting your head, the stone falls as though you had dropped it.\n\nYou don't need to eat or drink while this clear spindle orbits your head", "ed": "both"}, {"n": "Iron", "src": "dmg", "tp": "trade_good", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "", "ed": "both"}, {"n": "Iron Bands of Bilarro", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": false, "cur": false, "wt": "1 lb", "desc": "This rusty iron sphere measures 3 inches in diameter and weighs 1 pound. You can take a Magic action to throw the sphere at a Huge or smaller creature you can see within 60 feet of yourself. As the sphere moves through the air, it opens into a tangle of metal bands.\n\nMake a ranged attack roll with an attack bonus equal to your Dexterity modifier plus your Proficiency Bonus. On a hit, the target has the Restrained condition until you take a Bonus Action to issue a command that releases it. Doing so or missing with the attack causes the bands to contract and become a sphere once more.\n\nA creature that can touch the bands, including the one Restrained, can take an action to make a DC 20 Strength (Athletics) check to break the iron bands. On a successful check, the item is destroyed, and the Restrained creature is freed. On a failed check, any further attempts made by that creature automatically fail until 24 hours have elapsed.\n\nOnce the bands are used, they can't be used again until the next dawn", "ed": "both"}, {"n": "Iron Flask", "src": "dmg", "tp": "wondrous", "rar": "legendary", "rarn": 5, "mag": true, "att": false, "cur": false, "wt": "1 lb", "desc": "While holding this brass-stoppered iron flask, you can take a Magic action to target a creature that you can see within 60 feet of yourself. If the flask is empty and the target is native to a plane of existence other than the one you're on, the target must succeed on a DC 17 Wisdom saving throw or be trapped in the flask. If the target has been trapped by the flask before, it has Advantage on the save. Once trapped, a creature remains in the flask until released. The flask can hold only one creature at a time. A creature trapped in the flask doesn't age and doesn't need to breathe, eat, or drink.\n\nYou can take a Magic action to remove the flask's stopper and release the creature in the flask. The creature then obeys your commands for 1 hour, understanding those commands even if it doesn't know the language in which the commands are given. If you issue no commands or give the creature a command that is likely to result in its death or imprisonment, it defends itself but otherwise takes no actions. At the end of the duration, the creature acts in accordance with its normal disposition and alignment.\n\nAn Identify spell reveals if the flask contains a creature, but the only way to determine the type of creature is to open the flask. A newly discovered Iron Flask might already contain a creature chosen by the DM or determined randomly by rolling on the following table (see the Monster Manual for the creature's stat block).\n\n| 1d100 | Contents |\n| --- | --- |\n| 01-50 | No creature |\n| 51 | Arcanaloth |\n| 52-54 | Bone Devil |\n| 55-56 | Cambion |\n| 57-58 | Dao |\n| 59 | Deva |\n| 60-61 | Djinni |\n| 62-63 | Efreeti |\n| 64-65 | Erinyes |\n| 66-67 | Fomorian |\n| 68 | Githyanki Knight |\n| 69 | Githzerai Zerth |\n| 70-71 | Glabrezu |\n| 72-74 | Hezrou |\n| 75 | Incubus |\n| 76-77 | Invisible Stalker |\n| 78-79 | Marid |\n| 80 | Marilith |\n| 81-82 | Mezzoloth |\n| 83-84 | Nalfeshnee |\n| 85-86 | Night Hag |\n| 87-88 | Nycaloth |\n| 89 | Planetar |\n| 90-91 | Red Slaad |\n| 92-93 | Salamander |\n| 94 | Solar |\n| 95 | Succubus |\n| 96 | Ultroloth |\n| 97-99 | Vrock |\n| 00 | Xorn |", "ed": "both"}, {"n": "Iron Pot", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "10 lb", "desc": "An iron pot holds 1 gallon of liquid.", "ed": "both"}, {"n": "Iron Spike", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "0.5 lb", "desc": "Iron Spikes come in bundles of ten. As a Utilize action, you can use a blunt object, such as a Light Hammer, to hammer a spike into wood, earth, or a similar material. You can do so to jam a door shut or to then tie a Rope or Chain to the Spike", "ed": "both"}, {"n": "Iron Spikes", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "5 lb", "desc": "Iron Spikes come in bundles of ten. As a Utilize action, you can use a blunt object, such as a Light Hammer, to hammer a spike into wood, earth, or a similar material. You can do so to jam a door shut or to then tie a Rope or Chain to the Spike", "ed": "2024"}, {"n": "Iron Spikes (10)", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "5 lb", "desc": "", "ed": "5e"}, {"n": "Jester's Mask", "src": "bmt", "tp": "wondrous", "rar": "legendary", "rarn": 5, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This colorful, harlequin domino mask is edged with pearls. While wearing this mask, you gain the following benefits:\n\n- Charismatic Focus: You can use the mask as a spellcasting focus. You gain a +3 bonus to any spell attack rolls and spell saving throw DCs that use Charisma as the spellcasting ability.\n- Marvelous Escape: When a creature hits you with an attack roll, you can use your reaction to disappear in a puff of smoke and colorful sparkles. You take no damage and instead teleport, along with anything you are wearing or carrying, to an unoccupied space you can see within 30 feet of yourself. Once this reaction is used, it can't be used again until the next dawn.\n- Topsy-Turvy: When you roll a 1 on a d20, you can treat the roll as if you rolled a 20 instead. Once this property is used, it can't be used again until the next dawn.", "ed": "both"}, {"n": "Jeweler's Tools", "src": "phb", "tp": "artisans_tools", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "2 lb", "desc": "Ability: Intelligence\n\nUtilize: Discern a gem's value (DC 15)\n\nCraft: Arcane Focus, Holy Symbol\n\nArtisan's Tools are each focused on crafting items and pursuing a trade. Each type of Artisan's Tools tools requires a separate proficiency.\n\nIf you have proficiency with a tool, add your Proficiency Bonus to any ability check you make that uses the tool. If you have proficiency in a skill that's used with that check, you have Advantage on the check too", "ed": "both"}, {"n": "Jug", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "4 lb", "desc": "A jug holds 1 gallon of liquid.", "ed": "both"}, {"n": "Kagonesti Forest Shroud", "src": "dsotdq", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This cloak appears to be made of autumnal leaves woven together. While you wear this cloak, you have advantage on Dexterity (Stealth) checks, and you can use a bonus action to magically teleport, along with any equipment you are wearing or carrying, to an unoccupied space you can see within 30 feet of yourself. You then have advantage on the next attack roll you make before the end of the turn. Once this bonus action is used, it can't be used again until the next dawn.", "ed": "both"}, {"n": "Keelboat", "src": "phb", "tp": "vehicle_water", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "Speed: 1 mph\nCarrying Capacity: 1/2 ton cargo, 6 passengers\nCrew 1, AC 15, HP 100, Damage Threshold 10\n\nSpeed. A ship sailing against a strong wind moves at half speed. In a dead calm (no wind), waterborne ships can't move under sail and must be rowed. Keelboats and Rowboats are used on lakes and rivers. If going downstream, add the speed of the current (typically 3 miles per hour) to the speed of the vehicle. These vehicles can't be rowed against any significant current, but they can be pulled upstream by draft animals on the shores. A Rowboat can be carried and weighs 100 pounds.\n\nCrew. A ship larger than a Keelboat or Rowboat needs a crew of skilled hirelings (see \"Services\") to function. The minimum number of skilled hirelings needed to crew a ship depends on the type of ship.\n\nPassengers. The number of Small and Medium passengers the ship can accommodate using hammocks. A ship outfitted with private accommodations can carry one-fifth as many passengers. A passenger usually pays 5 SP per day for a hammock, but prices can vary from ship to ship. A small private cabin usually costs 2 GP per day.\n\nDamage Threshold. See the rules glossary.\n\nShip Repair. Repairs to a damaged ship can be made while the vessel is berthed. Repairing 1 Hit Point of damage requires 1 day and costs 20 GP for materials and labor. If the repairs are made in a location where supplies and skilled labor are abundant, such as a city shipyard, the repair time and cost are halved", "ed": "both"}, {"n": "Keg of Alchemist's Fire", "src": "lox", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "A keg of alchemist's fire lobbed at a creature or an object deals 21 (6d6) fire damage on a hit. Further, the target is set ablaze and takes the damage again every round (in the case of a creature, at the start of each of its turns) until the fire is put out. A creature within reach of the blaze can take an action to smother the flames using a blanket or carpet, reducing the fire damage by 2d6. Three such actions are needed to fully put out the fire.", "ed": "both"}, {"n": "Keoghtom's Ointment", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This glass jar, 3 inches in diameter, contains 1d4 + 1 doses of a thick mixture that smells faintly of aloe. The jar and its contents weigh 1/2 pound.\n\nAs a Utilize action, you can swallow one dose of the ointment or apply it to a creature within 5 feet of yourself. The creature that receives it regains 2d8 + 2 Hit Points and ceases to have the Poisoned condition", "ed": "both"}, {"n": "Ladder", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "25 lb", "desc": "A Ladder is 10 feet tall. You must climb to move up or down it", "ed": "2024"}, {"n": "Ladder (10-foot)", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "25 lb", "desc": "Ladder (10-foot)", "ed": "5e"}, {"n": "Lamp", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "A Lamp burns Oil as fuel to cast Bright Light in a 15-foot radius and Dim Light for an additional 30 feet", "ed": "both"}, {"n": "Lamprey Ship", "src": "aag", "tp": "vehicle_space", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "Lamprey ships are antiquated, being among the oldest spelljamming ships still in use. Psurlons are particularly fond of them.\n\nUsing the metal grappling jaws built into its bow, a lamprey ship can attach itself to another ship, which is a critical feature during boarding actions. Other standard weapons include four ballistae on the main deck.\n\nA lamprey can float on water, though it can't land safely on the ground. Lamprey ships that land on the ground have the distressing habit of rolling over, as more than a few crews have discovered to their dismay.", "ed": "both"}, {"n": "Lantern of Revealing", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "2 lb", "desc": "While lit, this hooded lantern burns for 6 hours on 1 pint of oil, shedding Bright Light in a 30-foot radius and Dim Light for an additional 30 feet. Invisible creatures and objects are visible as long as they are in the lantern's Bright Light. You can take a Utilize action to lower the hood, reducing the lantern's light to Dim Light in a 5-foot radius", "ed": "both"}, {"n": "Lash of Immolation", "src": "bgg", "tp": "weapon", "rar": "rare", "rarn": 3, "mag": false, "att": false, "cur": false, "wt": "3 lb", "desc": "The handle of this dark leather whip bears the fire rune, and embers dance around the whip's tail.\n\nYou gain a +1 bonus to attack and damage rolls made with this weapon, and on a hit, the whip deals an extra 1d6 fire damage. When you score a critical hit with an attack using this whip, the target also has the restrained condition until the start of your next turn, as fiery bands lash around the target.\n\nInvoking the Rune\nWhen you make an attack with the whip and hit, you can use your reaction to invoke the whip's rune. Doing so increases the extra fire damage dealt by the whip to 2d6.\n\nOnce the rune has been invoked, it can't be invoked again until the next dawn.", "ed": "both"}, {"n": "Leatherworker's Tools", "src": "phb", "tp": "artisans_tools", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "5 lb", "desc": "Ability: Dexterity\n\nUtilize: Add a design to a leather item (DC 10)\n\nCraft: Sling, Whip, Hide Armor, Leather Armor, Studded Leather Armor, Backpack, Crossbow Bolt Case, Map or Scroll Case, Parchment, Pouch, Quiver, Waterskin\n\nArtisan's Tools are each focused on crafting items and pursuing a trade. Each type of Artisan's Tools tools requires a separate proficiency.\n\nIf you have proficiency with a tool, add your Proficiency Bonus to any ability check you make that uses the tool. If you have proficiency in a skill that's used with that check, you have Advantage on the check too", "ed": "both"}, {"n": "Linen (1 sq. yd.)", "src": "dmg", "tp": "trade_good", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "", "ed": "both"}, {"n": "Living Ship", "src": "aag", "tp": "vehicle_space", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "Druids, rangers, and clerics devoted to gods of nature are often found aboard living ships, as are Wildspace explorers who don't want to have to worry about their ship's air envelope becoming fouled during a long voyage.\n\nThis ship's main distinctive feature is the fully grown treant on the aft deck. The treant has a speed of 0 because its roots are woven into the deck; it and the ship are inseparable. If the ship is reduced to 0 hit points, the treant dies of shock. The ship can function if its treant dies, but the treant can never be replaced with another.\n\nWhen the treant finishes a long rest, it repairs the ship's hull, enabling the ship to regain 4d12 hit points, and refreshes the ship's air envelope (turning deadly air into foul air, or foul air into fresh air).\n\nA living ship can float on water and sail across it, but it can't land safely on the ground (its keel would cause it to roll on its side). Its standard weaponry is an aft-mounted ballista.", "ed": "both"}, {"n": "Loaf of Bread", "src": "phb", "tp": "food_and_drink", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "", "ed": "5e"}, {"n": "Lock", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "A Lock comes with a key. Without the key, a creature can use Thieves' Tools to pick this Lock with a successful DC 15 Dexterity (Sleight of Hand) check", "ed": "both"}, {"n": "Lock of Trickery", "src": "dmg", "tp": "wondrous", "rar": "", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This lock appears to be an ordinary Lock and comes with a single key. The tumblers in this lock magically adjust to thwart burglars. Dexterity checks made to pick the lock have Disadvantage", "ed": "2024"}, {"n": "Lolth's Sting", "src": "dmg", "tp": "", "rar": "", "rarn": 99, "mag": false, "att": false, "cur": false, "wt": "", "desc": "A creature subjected to Lolth's Sting must succeed on a DC 13 Constitution saving throw or have the Poisoned condition for 1 hour. If the creature fails the save by 5 or more, the creature also has the Unconscious condition while Poisoned in this way. The creature wakes up if it takes damage or if another creature takes an action to shake it awake", "ed": "2024"}, {"n": "Longship", "src": "phb", "tp": "vehicle_water", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "Speed: 3 mph\nCarrying Capacity: 10 tons cargo, 150 passengers\nCrew 40, AC 15, HP 300, Damage Threshold 15\n\nSpeed. A ship sailing against a strong wind moves at half speed. In a dead calm (no wind), waterborne ships can't move under sail and must be rowed. Keelboats and Rowboats are used on lakes and rivers. If going downstream, add the speed of the current (typically 3 miles per hour) to the speed of the vehicle. These vehicles can't be rowed against any significant current, but they can be pulled upstream by draft animals on the shores. A Rowboat can be carried and weighs 100 pounds.\n\nCrew. A ship larger than a Keelboat or Rowboat needs a crew of skilled hirelings (see \"Services\") to function. The minimum number of skilled hirelings needed to crew a ship depends on the type of ship.\n\nPassengers. The number of Small and Medium passengers the ship can accommodate using hammocks. A ship outfitted with private accommodations can carry one-fifth as many passengers. A passenger usually pays 5 SP per day for a hammock, but prices can vary from ship to ship. A small private cabin usually costs 2 GP per day.\n\nDamage Threshold. See the rules glossary.\n\nShip Repair. Repairs to a damaged ship can be made while the vessel is berthed. Repairing 1 Hit Point of damage requires 1 day and costs 20 GP for materials and labor. If the repairs are made in a location where supplies and skilled labor are abundant, such as a city shipyard, the repair time and cost are halved", "ed": "both"}, {"n": "Lorehold Primer", "src": "scc", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": true, "cur": false, "wt": "", "desc": "The Lorehold Primer is a magic textbook created at Strixhaven's Lorehold College. The primer has 3 charges, and it regains 1d3 expended charges daily at dawn. If you make an Intelligence (History) or Intelligence (Religion) check while holding the primer, you can expend 1 charge to give yourself 1d4 bonus to the check, immediately after you roll the d20.\n\nIn addition, if you study the primer at the end of a long rest, you can choose one 1st-level spell from the cleric or wizard spell list. Before you finish your next long rest, you can cast the chosen spell once without a spell slot if you are holding the primer. Your spellcasting ability for this spell is your choice of Intelligence, Wisdom, or Charisma.", "ed": "both"}, {"n": "Lute", "src": "phb", "tp": "instrument", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "2 lb", "desc": "Ability: Charisma\n\nUtilize: Play a known tune (DC 10), or improvise a song (DC 15)\n\nIf you have proficiency with a tool, add your Proficiency Bonus to any ability check you make that uses the tool. If you have proficiency in a skill that's used with that check, you have Advantage on the check too", "ed": "both"}, {"n": "Luxon Beacon", "src": "egw", "tp": "wondrous", "rar": "legendary", "rarn": 5, "mag": false, "att": false, "cur": false, "wt": "", "desc": "This dodecahedron of faintly glowing crystal is heavier than it appears. A set of handles are affixed to its sides, and it pulsates and thrums when touched.\n\nFragment of Possibility. A creature that touches the beacon and concentrates for 1 minute receives a Fragment of Possibility, which looks like a Tiny, grayish bead of energy that follows the creature around, staying within 1 foot of it at all times. The fragment lasts for 8 hours or until used. Once the beacon grants a Fragment of Possibility, it can’t grant another until the next dawn. A creature with a Fragment of Possibility from a Luxon beacon can’t gain another Fragment of Possibility from any source.\n\nWhen a creature with a Fragment of Possibility makes an attack roll, an ability check, or a saving throw, it can expend its fragment to roll an additional d20 and choose which of the d20s to use. Alternatively, when an attack roll is made against the creature, it can expend its fragment to roll a d20 and choose which of the d20s to use, the one it rolled or the one the attacker rolled.\n\nIf the original d20 roll has advantage or disadvantage, the creature rolls its d20 after advantage or disadvantage has been applied to the original roll.\n\nSoul Snare. If a follower of the Luxon who has undergone a ritual of consecution dies within 100 miles of a Luxon beacon, their soul is ensnared by it. This soul will be reincarnated within the body of a random humanoid baby developing within 100 miles of the beacon.", "ed": "both"}, {"n": "Lyre", "src": "phb", "tp": "instrument", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "2 lb", "desc": "Ability: Charisma\n\nUtilize: Play a known tune (DC 10), or improvise a song (DC 15)\n\nIf you have proficiency with a tool, add your Proficiency Bonus to any ability check you make that uses the tool. If you have proficiency in a skill that's used with that check, you have Advantage on the check too", "ed": "both"}, {"n": "Magnifying Glass", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "A Magnifying Glass grants Advantage on any ability check made to appraise or inspect a highly detailed item. Lighting a fire with a Magnifying Glass requires light as bright as sunlight to focus, tinder to ignite, and about 5 minutes for the fire to ignite", "ed": "both"}, {"n": "Malice", "src": "dmg", "tp": "poison", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "A creature subjected to Malice must succeed on a DC 15 Constitution saving throw or have the Poisoned condition for 1 hour. The creature also has the Blinded condition while Poisoned in this way", "ed": "both"}, {"n": "Manacles", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "6 lb", "desc": "As a Utilize action, you can use Manacles to bind an unwilling Small or Medium creature within 5 feet of yourself that has the Grappled, Incapacitated, or Restrained condition if you succeed on a DC 13 Dexterity (Sleight of Hand) check. While bound, a creature has Disadvantage on attack rolls, and the creature is Restrained if the Manacles are attached to a chain or hook that is fixed in place. Escaping the Manacles requires a successful DC 20 Dexterity (Sleight of Hand) check as an action. Bursting them requires a successful DC 25 Strength (Athletics) check as an action.\n\nEach set of Manacles comes with a key. Without the key, a creature can use Thieves' Tools to pick the Manacles' lock with a successful DC 15 Dexterity (Sleight of Hand) check", "ed": "both"}, {"n": "Mantle of Spell Resistance", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "", "desc": "You have Advantage on saving throws against spells while you wear this cloak", "ed": "both"}, {"n": "Manual of Bodily Health", "src": "dmg", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "5 lb", "desc": "This book contains health and diet tips, and its words are charged with magic. If you spend 48 hours over a period of 6 days or fewer studying the book's contents and practicing its guidelines, your Constitution score increases by 2, as does your maximum for that score. The manual then loses its magic, but regains it in a century", "ed": "both"}, {"n": "Manual of Clay Golems", "src": "dmg", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "5 lb", "desc": "This tome contains information and incantations necessary to make a clay golem. To decipher and use the manual, you must be a spellcaster with at least two 5th-level spell slots. A creature that can't use a manual of golems and attempts to read it takes 6d6 psychic damage.\n\nTo create a clay golem, you must spend 30 days, working without interruption with the manual at hand and resting no more than 8 hours per day. You must also pay 65,000 gp to purchase supplies.\n\nOnce you finish creating the golem, the book is consumed in eldritch flames. The golem becomes animate when the ashes of the manual are sprinkled on it. It is under your control, and it understands and obeys your spoken commands", "ed": "both"}, {"n": "Manual of Flesh Golems", "src": "dmg", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "5 lb", "desc": "This tome contains information and incantations necessary to make a flesh golem. To decipher and use the manual, you must be a spellcaster with at least two 5th-level spell slots. A creature that can't use a manual of golems and attempts to read it takes 6d6 psychic damage.\n\nTo create a flesh golem, you must spend 60 days, working without interruption with the manual at hand and resting no more than 8 hours per day. You must also pay 50,000 gp to purchase supplies.\n\nOnce you finish creating the golem, the book is consumed in eldritch flames. The golem becomes animate when the ashes of the manual are sprinkled on it. It is under your control, and it understands and obeys your spoken commands", "ed": "both"}, {"n": "Manual of Gainful Exercise", "src": "dmg", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "5 lb", "desc": "This book describes fitness exercises, and its words are charged with magic. If you spend 48 hours over a period of 6 days or fewer studying the book's contents and practicing its guidelines, your Strength score increases by 2, as does your maximum for that score. The manual then loses its magic, but regains it in a century", "ed": "both"}, {"n": "Manual of Iron Golems", "src": "dmg", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "5 lb", "desc": "This tome contains information and incantations necessary to make a iron golem. To decipher and use the manual, you must be a spellcaster with at least two 5th-level spell slots. A creature that can't use a manual of golems and attempts to read it takes 6d6 psychic damage.\n\nTo create an iron golem, you must spend 120 days, working without interruption with the manual at hand and resting no more than 8 hours per day. You must also pay 100,000 gp to purchase supplies.\n\nOnce you finish creating the golem, the book is consumed in eldritch flames. The golem becomes animate when the ashes of the manual are sprinkled on it. It is under your control, and it understands and obeys your spoken commands", "ed": "both"}, {"n": "Manual of Quickness of Action", "src": "dmg", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "5 lb", "desc": "This book contains coordination and balance exercises, and its words are charged with magic. If you spend 48 hours over a period of 6 days or fewer studying the book's contents and practicing its guidelines, your Dexterity score increases by 2, as does your maximum for that score. The manual then loses its magic, but regains it in a century", "ed": "both"}, {"n": "Manual of Stone Golems", "src": "dmg", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "5 lb", "desc": "This tome contains information and incantations necessary to make a stone golem. To decipher and use the manual, you must be a spellcaster with at least two 5th-level spell slots. A creature that can't use a manual of golems and attempts to read it takes 6d6 psychic damage.\n\nTo create a stone golem, you must spend 90 days, working without interruption with the manual at hand and resting no more than 8 hours per day. You must also pay 80,000 gp to purchase supplies.\n\nOnce you finish creating the golem, the book is consumed in eldritch flames. The golem becomes animate when the ashes of the manual are sprinkled on it. It is under your control, and it understands and obeys your spoken commands", "ed": "both"}, {"n": "Map", "src": "phb", "tp": "", "rar": "", "rarn": 99, "mag": false, "att": false, "cur": false, "wt": "", "desc": "If you consult an accurate Map, you gain a +5 bonus to Wisdom (Survival) checks you make to find your way in the place represented on it", "ed": "2024"}, {"n": "Map or Scroll Case", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "A Map or Scroll Case holds up to 10 sheets of paper or 5 sheets of parchment", "ed": "both"}, {"n": "Mason's Tools", "src": "phb", "tp": "artisans_tools", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "8 lb", "desc": "Ability: Strength\n\nUtilize: Chisel a symbol or hole in stone (DC 10)\n\nCraft: Block and Tackle\n\nArtisan's Tools are each focused on crafting items and pursuing a trade. Each type of Artisan's Tools tools requires a separate proficiency.\n\nIf you have proficiency with a tool, add your Proficiency Bonus to any ability check you make that uses the tool. If you have proficiency in a skill that's used with that check, you have Advantage on the check too", "ed": "both"}, {"n": "Masque Charm", "src": "scc", "tp": "wondrous", "rar": "common", "rarn": 1, "mag": true, "att": false, "cur": false, "wt": "", "desc": "A masque charm is a small silver pin. While wearing this charm, you can use an action to cast the disguise self spell (DC 13 to discern the disguise). Once the spell is cast, it can't be cast from the charm again until the next sunset. When casting the spell, you can have the spell last for its normal 1 hour duration or for 6 hours. If you choose the 6-hour duration, the charm becomes nonmagical when the spell ends. In either case, the spell ends if the charm is removed from you.", "ed": "both"}, {"n": "Master's Amulet", "src": "mm", "tp": "other", "rar": "rare", "rarn": 3, "mag": true, "att": false, "cur": false, "wt": "", "desc": "Every shield guardian has an amulet magically linked to it. A shield guardian can have only one corresponding amulet, and if that amulet is destroyed, the shield guardian is incapacitated until a replacement amulet is created. A shield guardian's amulet is subject to direct attack if it isn't being worn or carried. It has AC 10, 10 hit points, and immunity to poison and psychic damage. Crafting an amulet requires 1 week and costs 1,000 gp in components.\n\nA shield guardian's solitary focus is to protect the amulet's wearer. The amulet's wearer can command the guardian to attack its enemies or to guard the wielder against attack. If an attack threatens to injure the wearer, the construct can magically absorb the blow into its own body, even at a distance.\n\nA spellcaster can store a single spell within a shield guardian, which can then cast the spell on command or under specific conditions. Many a wizard has been rendered helpless by enemies, only to surprise those foes when its shield guardian unleashes potent magical power.", "ed": "both"}, {"n": "Mastiff", "src": "phb", "tp": "mount", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "Speed: 40, Carrying Capacity: 195 lb", "ed": "both"}, {"n": "Medallion of Thoughts", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": true, "cur": false, "wt": "1 lb", "desc": "The medallion has 5 charges. While wearing it, you can expend 1 charge to cast Detect Thoughts (save DC 13) from it. The medallion regains 1d4 expended charges daily at dawn", "ed": "both"}, {"n": "Merchant's Scale", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "3 lb", "desc": "A scale includes a small balance, pans, and a suitable assortment of weights up to 2 pounds. With it, you can measure the exact weight of small objects, such as raw precious metals or trade goods, to help determine their worth.", "ed": "both"}, {"n": "Mess Kit", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "This tin box contains a cup and simple cutlery. The box clamps together, and one side can be used as a cooking pan and the other as a plate or shallow bowl.", "ed": "both"}, {"n": "Midnight Tears", "src": "dmg", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "A creature that ingests this poison suffers no effect until the stroke of midnight. If the poison has not been neutralized before then, the creature must succeed on a DC 17 Constitution saving throw, taking 31 (9d6) poison damage on a failed save, or half as much damage on a successful one.", "ed": "both"}, {"n": "Military Saddle", "src": "phb", "tp": "tack_and_harness", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "30 lb", "desc": "A military saddle braces the rider, helping you keep your seat on an active mount in battle. It gives you advantage on any check you make to remain mounted.", "ed": "both"}, {"n": "Mimir", "src": "sato", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "5 lb", "desc": "This skull-shaped device is filled with knowledge. The device weighs 5 pounds and is covered with subtle etchings of planar sigils.\n\nAs a bonus action, you can toss the device into the air, whereupon it floats at a distance of 1d3 feet from you and you can access its properties. While the mimir is floating, a creature other than you can use an action to grasp or net the device, either by making a successful unarmed strike against AC 22 or a successful DC 22 Dexterity (Acrobatics) check. You can use a bonus action to seize and stow the device.\n\nThe device has AC 22, 25 hit points, immunity to poison and psychic damage, and resistance to all other damage. It is considered to be an object that is being worn while it is floating near you.\n\nEsoteric Knowledge\nWhile the device is floating, you can use an action to cast legend lore from the device. The device speaks the revealed lore aloud. Once this property has been used, it can't be used again until the next dawn.\n\nPlanar Knowledge\nThe device knows basic, useful information about the planes of existence. While the device is floating, it verbally answers questions you or anyone you designate poses to it about that topic. It knows the information about the planes as well as basic information about the gate-towns of the Outlands", "ed": "both"}, {"n": "Miner's Pick", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "10 lb", "desc": "", "ed": "both"}, {"n": "Mirror", "src": "phb", "tp": "", "rar": "", "rarn": 99, "mag": false, "att": false, "cur": false, "wt": "", "desc": "A handheld steel Mirror is useful for personal cosmetics but also for peeking around corners and reflecting light as a signal", "ed": "2024"}, {"n": "Mirror of Life Trapping", "src": "dmg", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "50 lb", "desc": "When this 4-foot-tall, 2-foot-wide mirror is viewed indirectly, its surface shows faint images of creatures. The mirror weighs 50 pounds, and it has AC 11, HP 10, Immunity to Poison and Psychic damage, and Vulnerability to Bludgeoning damage. It shatters and is destroyed when reduced to 0 Hit Points.\n\nIf the mirror is hanging on a vertical surface and you are within 5 feet of it, you can take a Magic action and use a command word to activate it. It remains activated until you take a Magic action and repeat the command word to deactivate it.\n\nAny creature other than you that sees its reflection in the activated mirror while within 30 feet of the mirror must succeed on a DC 15 Charisma saving throw or be trapped, along with anything it is wearing or carrying, in one of the mirror's twelve extradimensional cells. A creature that knows the mirror's nature makes the save with Advantage, and Constructs succeed on the save automatically.\n\nAn extradimensional cell is an infinite expanse filled with thick fog that reduces visibility to 10 feet. Creatures trapped in the mirror's cells don't age, and they don't need to eat, drink, or sleep. A creature trapped within a cell can escape using magic that permits planar travel. Otherwise, the creature is confined to the cell until freed.\n\nIf the mirror traps a creature but its twelve extradimensional cells are already occupied, the mirror frees one trapped creature at random to accommodate the new prisoner. A freed creature appears in an unoccupied space within sight of the mirror but facing away from it. If the mirror is shattered, all creatures it contains are freed and appear in unoccupied spaces near it.\n\nWhile within 5 feet of the mirror, you can take a Magic action to name one creature trapped in it or call out a particular cell by number. The creature named or contained in the named cell appears as an image on the mirror's surface. You and the creature can then communicate.\n\nIn a similar way, you can take a Magic action and use a second command word to free one creature trapped in the mirror. The freed creature appears, along with its possessions, in the unoccupied space nearest to the mirror and facing away from it.\n\nPlacing the mirror inside an extradimensional space created by a Bag of Holding, Portable Hole, or similar item instantly destroys both items and opens a gate to the Astral Plane. The gate originates where the one item was placed inside the other. Any creature within 10 feet of the gate and not behind Total Cover is sucked through it to a random location on the Astral Plane. The gate then closes. The gate is one-way only and can't be reopened", "ed": "both"}, {"n": "Mirror of Reflected Pasts", "src": "dsotdq", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": true, "cur": false, "wt": "25 lb", "desc": "This mirror of elven design allows those who stare into it to reflect on positive memories. The 3-foot-tall mirror weighs 25 pounds, and it has AC 11, 10 hit points, and vulnerability to bludgeoning damage. It shatters and is destroyed if reduced to 0 hit points.\n\nWhile holding the mirror upright, you can use an action to speak its command word and activate it. While activated, the mirror hovers in the air, and it can be destroyed but not moved. It remains activated until you use an action to speak the command word again or your attunement to the mirror ends, at which point the mirror harmlessly floats to the ground. Once the mirror has been deactivated, it can't be activated again until the next dawn.\n\nIf a non-Construct creature other than you sees its reflection in the activated mirror while within 30 feet of it, that creature must succeed on a DC 15 Wisdom saving throw or become paralyzed until the mirror is deactivated or until that creature can no longer see the mirror. A creature paralyzed by the mirror can repeat the saving throw at the end of each of its turns, ending the effect on a success. If a creature's saving throw is successful or the effect ends for it, the creature is immune to this mirror's effect for the next 24 hours.\n\nWhile paralyzed by the mirror, the creature sees events from their past reflected in the mirror's glass. These memories aren't real, but rather idealized versions of those occurrences. Nearby observers can glimpse flashes of these memories if looking indirectly at the mirror.", "ed": "both"}, {"n": "Mistral Mantle", "src": "bgg", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This thick, fur-lined cloak has the frost rune stitched on the hem in silvery blue thread. Frigid wind swirls around the cloak, regardless of the weather.\n\nWhile wearing this cloak, you have resistance to cold damage. Additionally, when you move within 5 feet of a creature, you can cause the cloak's cold wind to buffet the creature. The creature must succeed on a DC 14 Dexterity saving throw or take 1d6 cold damage and have the prone condition. A creature can be affected by the mantle only once during a turn.\n\nInvoking the Rune\nAs an action, you can invoke the mantle's rune to cast the sleet storm spell (save DC 14) with it. When you use the mantle to cast the spell, the area of the spell isn't 3 for you, and you can see through the storm, ignoring the normal penalties of a heavily obscured area.\n\nOnce the rune has been invoked, it can't be invoked again until the next dawn.", "ed": "both"}, {"n": "Modern Bullet", "src": "", "tp": "ammunition", "rar": "common", "rarn": 1, "mag": false, "att": false, "cur": false, "wt": "1.6 lb", "desc": "", "ed": "5e"}, {"n": "Mule", "src": "phb", "tp": "mount", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "Speed: 40, Carrying Capacity: 420 lb", "ed": "both"}, {"n": "Murgaxor's Orb", "src": "scc", "tp": "wondrous", "rar": "legendary", "rarn": 5, "mag": true, "att": true, "cur": true, "wt": "", "desc": "Sentience\nMurgaxor's orb is a sentient, chaotic evil magic item with the following properties:\n\n- The orb has an Intelligence of 20, a Wisdom of 16, and a Charisma of 16, as well as hearing and darkvision out to a range of 30 feet.\n- The orb can speak, read, and understand Common, and it can communicate telepathically with any creature touching it.\n- At any time during your turn, the orb can cast the suggestion spell (save DC 17), targeting you or one other creature that touched the orb within the last 24 hours. This isn't a power of the orb that you control.\n\nCurse\nAny Humanoid you touch while holding the orb must succeed on a DC 10 Wisdom saving throw or become cursed. Each creature cursed by the orb bears an echo of Murgaxor's hateful thoughts, and that creature suffers from headaches that are persistent but not debilitating until the curse ends. On your turn, the orb can use an action to produce one of the following effects, targeting one or more creatures it has cursed:\n\nUnconsciousness\nThe cursed creature falls unconscious for 1 hour. The creature is roused if it takes damage or someone uses an action to shake or slap it awake.\n\nVisions of Terror\nThe cursed creature sees terrifying visions, causing it to view all creatures that aren't also cursed as dangerous monsters for 10 minutes. The cursed creature must use its action each round to make one attack against the nearest non-cursed creature. If the cursed creature has multiple possible targets, it attacks one at random. This effect ends if the cursed creature is incapacitated.\n\nAfter either of these effects ends, the affected creature is no longer cursed. The curse can also be removed from a creature with a remove curse spell or similar magic. All cases of the curse end if Murgaxor's orb is destroyed.\n\nMagical Signature\nAs a side effect of the orb's curse, the spell detect magic reveals an aura of enchantment surrounding creatures bearing the curse. This aura is distinctive, but in a way detect magic offers no further details about.\n\nDestroying the Orb\nMurgaxor's orb has AC 18; 20 hit points; immunity to necrotic, poison, and psychic damage; and resistance to all other types of damage. If reduced to 0 hit points, the orb shatters.", "ed": "both"}, {"n": "Mystery Key", "src": "dmg", "tp": "wondrous", "rar": "", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "", "desc": "A question mark is worked into the head of this key. The key has a 5 percent chance of unlocking any lock into which it's inserted. Once it unlocks something, the key disappears", "ed": "2024"}, {"n": "Narycrash", "src": "dsotdq", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "This backpack-sized device holds a balloon-based parachute. If you fall while wearing this device, you can use your reaction to deploy the parachute. Once deployed, the parachute rapidly inflates, and you descend 60 feet per round and take no damage from falling. When you are 10 feet away from the ground, roll a d20. If you roll a 5 or less, the parachute gives out, and you begin to fall normally.", "ed": "both"}, {"n": "Nature's Mantle", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": true, "cur": false, "wt": "", "desc": "(requires attunement by a druid or ranger)\n\nThis cloak shifts color and texture to blend with the terrain surrounding you. While wearing the cloak, you can use it as a Spellcasting Focus for your Druid and Ranger spells.\n\nWhile you are in an area that is Lightly Obscured, you can Hide as a Bonus Action even if you are being directly observed", "ed": "2024"}, {"n": "Nautiloid", "src": "aag", "tp": "vehicle_space", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "Built and used by mind flayers, nautiloids are designed exclusively for space travel. They can't float on water, nor can they land safely on the ground.\n\nAs an action, a creature attuned to a nautiloid's spelljamming helm and in physical contact with the ship can transport the nautiloid and all creatures and objects aboard it to a different plane of existence, at or near a destination envisioned by the spelljammer (or to a random location on the plane if no destination is envisioned). This property is a feature of the ship, not the spelljamming helm. Each time this property is used, roll a d6. On a 5–6, the property recharges after 1 minute; otherwise, it can't be used again for 24 hours.", "ed": "both"}, {"n": "Navigator's Tools", "src": "phb", "tp": "tool", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "2 lb", "desc": "Ability: Wisdom\n\nUtilize: Plot a course (DC 10), or determine position by stargazing (DC 15)\n\nIf you have proficiency with a tool, add your Proficiency Bonus to any ability check you make that uses the tool. If you have proficiency in a skill that's used with that check, you have Advantage on the check too", "ed": "both"}, {"n": "Necklace of Adaptation", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": true, "cur": false, "wt": "1 lb", "desc": "While wearing this necklace, you can breathe normally in any environment, and you have Advantage on saving throws made to avoid or end the Poisoned condition", "ed": "both"}, {"n": "Necklace of Fireballs", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": false, "cur": false, "wt": "1 lb", "desc": "This necklace has 1d6 + 3 beads hanging from it. You can take a Magic action to detach a bead and throw it up to 60 feet away. When it reaches the end of its trajectory, the bead detonates as a level 3 Fireball (save DC 15).\n\nYou can hurl multiple beads, or even the whole necklace, at one time. When you do so, increase the damage of the Fireball by 1d6 for each bead after the first (maximum 12d6)", "ed": "both"}, {"n": "Necklace of Prayer Beads", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "1 lb", "desc": "This necklace has 1d4 + 2 magic beads made from aquamarine, black pearl, or topaz. It also has many nonmagical beads made from stones such as amber, bloodstone, citrine, coral, jade, pearl, or quartz. If a magic bead is removed from the necklace, that bead loses its magic.\n\nSix types of magic beads exist. The DM decides the type of each bead on the necklace or determines it randomly by rolling on the table below. A necklace can have more than one bead of the same type. To use one, you must be wearing the necklace. Each bead contains a spell that you can cast from it as a Bonus Action (using your spell save DC if a save is necessary). Once a magic bead's spell is cast, that bead can't be used again until the next dawn.\n\n| 1d20 | Bead | Spell |\n| --- | --- | --- |\n| 1-6 | Bead of Blessing | Bless |\n| 7-12 | Bead of Curing | Cur
