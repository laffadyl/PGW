 and etiquette |\n| 77 | A sheet of parchment upon which is drawn a mechanical contraption |\n| 78 | An ornate scabbard that fits no blade you have found |\n| 79 | An invitation to a party where a murder happened |\n| 80 | A bronze pentacle with an etching of a rat's head in its center |\n| 81 | A purple handkerchief embroidered with the name of an archmage |\n| 82 | Half a floor plan for a temple, a castle, or another structure |\n| 83 | A bit of folded cloth that, when unfolded, turns into a stylish cap |\n| 84 | A receipt of deposit at a bank in a far-off city |\n| 85 | A diary with seven missing pages |\n| 86 | An empty silver snuffbox bearing the inscription \"dreams\" on its lid |\n| 87 | An iron holy symbol devoted to an unknown god |\n| 88 | A book about a legendary hero's rise and fall, with the last chapter missing |\n| 89 | A vial of dragon blood |\n| 90 | An ancient arrow of elven design |\n| 91 | A needle that never bends |\n| 92 | An ornate brooch of dwarven design |\n| 93 | An empty wine bottle bearing a pretty label that says, \"The Wizard of Wines Winery, Red Dragon Crush, 331422-W\" |\n| 94 | A mosaic tile with a multicolored, glazed surface |\n| 95 | A petrified mouse |\n| 96 | A black pirate flag adorned with a dragon's skull and crossbones |\n| 97 | A tiny mechanical crab or spider that moves about when it's not being observed |\n| 98 | A glass jar containing lard with a label that reads, \"Griffon Grease\" |\n| 99 | A wooden box with a ceramic bottom that holds a living worm with a head on each end of its body |\n| 00 | A metal urn containing the ashes of a hero |", "ed": "both"}, {"n": "Truth Serum", "src": "dmg", "tp": "poison", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "A creature subjected to Truth Serum must succeed on a DC 11 Constitution saving throw or have the Poisoned condition for 1 hour. The Poisoned creature can't knowingly communicate a lie", "ed": "both"}, {"n": "Turtle Ship", "src": "aag", "tp": "vehicle_space", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "A turtle ship is encased in a protective metal shell, as befits its name, and bristles with weapons. In addition to its roomy quarters, it can carry a decent- sized payload, making it popular among traders and others who need a lot of cargo space. The ship can land on the ground, and it floats on water. Sliding panels can be closed to make the hull airtight, enabling the ship to travel underwater safely, even to great depths. If the ship takes damage while on or under the water, interior hatches can be sealed to prevent the ship from flooding completely.\n\nStandard weaponry on a turtle ship includes three forward-mounted ballistae and a rear-facing mangonel. These weapons can't be used while the ship is underwater.", "ed": "both"}, {"n": "Two-Person Tent", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "20 lb", "desc": "A simple and portable canvas shelter, a tent sleeps two.", "ed": "5e"}, {"n": "Tyrant Ship", "src": "aag", "tp": "vehicle_space", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "Beholders carve tyrant ships out of stone using their disintegration rays and use these ships to wander the Astral Plane, looking for worlds to conquer and rival beholders to destroy. No two tyrant ships look alike, but they all have one or more features reminiscent of their creators, such as a bulbous shape and eyestalks.\n\nA spherical chamber on the ship's command deck functions as a spelljamming helm that only beholders can attune to. Any beholder that occupies this chamber can attune to it. Reducing a tyrant ship to 0 hit points not only destroys it but also destroys the ship's spelljamming helm and eyestalk cannons.\n\nA tyrant ship can't float on water, but it can safely land on the ground.", "ed": "both"}, {"n": "Universal Solvent", "src": "dmg", "tp": "wondrous", "rar": "legendary", "rarn": 5, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This tube holds milky liquid with a strong alcohol smell. When found, a tube contains 1d6 + 1 ounces.\n\nYou can take a Utilize action to pour 1 or more ounces of solvent from the tube onto a surface within reach. Each ounce instantly dissolves up to 1 square foot of adhesive it touches, including Sovereign Glue", "ed": "both"}, {"n": "Veteran's Cane", "src": "dmg", "tp": "wondrous", "rar": "", "rarn": 99, "mag": true, "att": false, "cur": false, "wt": "", "desc": "As a Bonus Action, you can transform this walking cane into an ordinary Longsword or change the Longsword back into a walking cane. In either case, you must be holding the item", "ed": "2024"}, {"n": "Vial", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "A vial can hold up to 4 ounces of liquid.", "ed": "both"}, {"n": "Viol", "src": "phb", "tp": "instrument", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "Ability: Charisma\n\nUtilize: Play a known tune (DC 10), or improvise a song (DC 15)\n\nIf you have proficiency with a tool, add your Proficiency Bonus to any ability check you make that uses the tool. If you have proficiency in a skill that's used with that check, you have Advantage on the check too", "ed": "both"}, {"n": "Vox Seeker", "src": "egw", "tp": "wondrous", "rar": "common", "rarn": 1, "mag": true, "att": false, "cur": false, "wt": "4 lb", "desc": "This clockwork device resembles a metal crab the size of a dinner plate. Every action used to wind up the device allows it to operate for 1 minute, to a maximum of 10 minutes. While operational, the item uses the vox seeker stat block (available in Bestiary). This automaton is under the DM’s control. A vox seeker reduced to 0 hit points is destroyed.", "ed": "both"}, {"n": "Wagon", "src": "phb", "tp": "vehicle_land", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "400 lb", "desc": "", "ed": "both"}, {"n": "Wakened Dragon Vessel", "src": "ftd", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This vessel can be a potion bottle, drinking horn, or other container meant to hold a liquid.\n\nAs a bonus action, if the vessel is empty, you can speak the command word to fill the vessel with one of the following (your choice): ale, olive oil, mead, wine, a potion of healing, a potion of greater healing, a potion of superior healing, a potion of climbing, a potion of fire breath, or a potion of flying. Once this property is used, it can't be used until the next dawn. A potion you create in this way loses its magical properties if it isn't imbibed within 24 hours.", "ed": "both"}, {"n": "Wakened Gem Dragon-Touched Focus", "src": "ftd", "tp": "wondrous", "rar": "legendary", "rarn": 5, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This wondrous item can be a scepter, an orb, an amulet, a crystal, or another finely crafted object. It typically incorporates imagery of dragons' wings, claws, teeth, or scales.\n\nYou have advantage on initiative rolls. While you are holding the focus, it can function as a spellcasting focus for all your spells.\n\nThe focus gains an additional property determined by the family of the dragon in whose hoard it became Stirring:\n\nWhenever you use a spell slot to cast a spell, you can immediately teleport to an unoccupied space you can see within 15 feet of you.\n\nWhile you are holding a Wakened focus, you can use it to cast certain spells. Once the item is used to cast a given spell, it can't be used to cast that spell again until the next dawn. The spells are determined by the family of the dragon in whose hoard it became Wakened.\n\n- Rary's telepathic bond, Raulothim's psychic lance\n\nWhen you cast a spell of 1st level or higher while holding this focus, you can treat the spell as if it were cast using a 9th-level spell slot. Once this property is used, it can't be used again until the next dawn.", "ed": "both"}, {"n": "Wakened Metallic Dragon-Touched Focus", "src": "ftd", "tp": "wondrous", "rar": "legendary", "rarn": 5, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This wondrous item can be a scepter, an orb, an amulet, a crystal, or another finely crafted object. It typically incorporates imagery of dragons' wings, claws, teeth, or scales.\n\nYou have advantage on initiative rolls. While you are holding the focus, it can function as a spellcasting focus for all your spells.\n\nThe focus gains an additional property determined by the family of the dragon in whose hoard it became Stirring:\n\nWhen a creature you can see within 30 feet of you makes a saving throw, you can use your reaction to give that creature advantage on the saving throw.\n\nWhile you are holding a Wakened focus, you can use it to cast certain spells. Once the item is used to cast a given spell, it can't be used to cast that spell again until the next dawn. The spells are determined by the family of the dragon in whose hoard it became Wakened.\n\n- Fizban's platinum shield, legend lore\n\nWhen you cast a spell of 1st level or higher while holding this focus, you can treat the spell as if it were cast using a 9th-level spell slot. Once this property is used, it can't be used again until the next dawn.", "ed": "both"}, {"n": "Wakened Scaled Ornament", "src": "ftd", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This ornament can be jewelry, a cloak, or another wearable accessory. It appears to be fashioned from a dragon's scale, tooth, or claw, or it incorporates images in those shapes.\n\nYou gain a +1 bonus to AC, and you can't be charmed or frightened. Moreover, each creature of your choice within 30 feet of you has advantage on saving throws it makes to avoid being charmed or frightened or to end those conditions on itself.\n\nWhen you would take damage of the type dealt by the breath of the dragon in whose hoard the ornament became Wakened, you can use your reaction to take no damage instead, and you regain hit points equal to the damage you would have taken. Once this property is used, it can't be used again until the next dawn.", "ed": "both"}, {"n": "Wakenend Chromatic Dragon-Touched Focus", "src": "ftd", "tp": "wondrous", "rar": "legendary", "rarn": 5, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This wondrous item can be a scepter, an orb, an amulet, a crystal, or another finely crafted object. It typically incorporates imagery of dragons' wings, claws, teeth, or scales.\n\nYou have advantage on initiative rolls. While you are holding the focus, it can function as a spellcasting focus for all your spells.\n\nThe focus gains an additional property determined by the family of the dragon in whose hoard it became Stirring:\n\nWhenever you use a spell slot to cast a spell that deals acid, cold, fire, lightning, or poison damage, roll a d6, and you gain a bonus equal to the number rolled to one of the spell's damage rolls.\n\nWhile you are holding a Wakened focus, you can use it to cast certain spells. Once the item is used to cast a given spell, it can't be used to cast that spell again until the next dawn. The spells are determined by the family of the dragon in whose hoard it became Wakened:\n\n- Hold monster, Rime's binding ice.\n\nWhen you cast a spell of 1st level or higher while holding this focus, you can treat the spell as if it were cast using a 9th-level spell slot. Once this property is used, it can't be used again until the next dawn.", "ed": "both"}, {"n": "Wand", "src": "phb", "tp": "", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "An Arcane Focus takes a specific form and is bejeweled or carved to channel arcane magic. A Sorcerer, Warlock, or Wizard can use such an item as a Spellcasting Focus", "ed": "2024"}, {"n": "Wand of Binding", "src": "dmg", "tp": "wand", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "1 lb", "desc": "This wand has 7 charges for the following properties. It regains 1d6 + 1 expended charges daily at dawn. If you expend the wand's last charge, roll a d20. On a 1, the wand crumbles into ashes and is destroyed.\n\nSpells\nWhile holding the wand, you can use an action to expend some of its charges to cast one of the following spells (save DC 17): hold monster (5 charges) or hold person (2 charges).", "ed": "both"}, {"n": "Wand of Conducting", "src": "dmg", "tp": "wand", "rar": "common", "rarn": 1, "mag": true, "att": false, "cur": false, "wt": "1 lb", "desc": "This wand has 3 charges. While holding it, you can take a Magic action to expend 1 charge and create orchestral music by waving it around. The music can be heard out to 120 feet and ends when you stop waving the wand.\n\nRegaining Charges. The wand regains all expended charges daily at dawn. If you expend the wand's last charge, roll 1d20. On a 1, a sad tuba sound plays as the wand crumbles into dust and is destroyed", "ed": "2024"}, {"n": "Wand of Enemy Detection", "src": "dmg", "tp": "wand", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "1 lb", "desc": "This wand has 7 charges. While holding it, you can take a Magic action to expend 1 charge. For 1 minute, you know the direction of the nearest creature Hostile to you within 60 feet, but not its distance from you. The wand can sense the presence of Hostile creatures that are Invisible, ethereal, disguised, or hidden, as well as those in plain sight. The effect ends if you stop holding the wand.\n\nRegaining Charges. The wand regains 1d6 + 1 expended charges daily at dawn. If you expend the wand's last charge, roll 1d20. On a 1, the wand crumbles into ashes and is destroyed", "ed": "both"}, {"n": "Wand of Fear", "src": "dmg", "tp": "wand", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "1 lb", "desc": "This wand has 7 charges for the following properties. It regains 1d6 + 1 expended charges daily at dawn. If you expend the wand's last charge, roll a d20. On a 1, the wand crumbles into ashes and is destroyed.\n\nCommand\nWhile holding the wand, you can use an action to expend 1 charge and command another creature to flee or grovel, as with the command spell (save DC 15).\n\nCone of Fear\nWhile holding the wand, you can use an action to expend 3 charges, to cast Fear in a 60-foot cone", "ed": "both"}, {"n": "Wand of Fireballs", "src": "dmg", "tp": "wand", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "1 lb", "desc": "This wand has 7 charges. While holding it, you can expend no more than 3 charges to cast Fireball (save DC 15) from it. For 1 charge, you cast the level 3 version of the spell. You can increase the spell's level by 1 for each additional charge you expend.\n\nRegaining Charges. The wand regains 1d6 + 1 expended charges daily at dawn. If you expend the wand's last charge, roll 1d20. On a 1, the wand crumbles into ashes and is destroyed", "ed": "both"}, {"n": "Wand of Lightning Bolts", "src": "dmg", "tp": "wand", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "1 lb", "desc": "This wand has 7 charges. While holding it, you can expend no more than 3 charges to cast Lightning Bolt (save DC 15) from it. For 1 charge, you cast the level 3 version of the spell. You can increase the spell's level by 1 for each additional charge you expend.\n\nRegaining Charges. The wand regains 1d6 + 1 expended charges daily at dawn. If you expend the wand's last charge, roll 1d20. On a 1, the wand crumbles into ashes and is destroyed", "ed": "both"}, {"n": "Wand of Magic Detection", "src": "dmg", "tp": "wand", "rar": "uncommon", "rarn": 2, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "This wand has 3 charges. While holding it, you can expend 1 charge to cast Detect Magic from it. The wand regains 1d3 expended charges daily at dawn", "ed": "both"}, {"n": "Wand of Magic Missiles", "src": "dmg", "tp": "wand", "rar": "uncommon", "rarn": 2, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "This wand has 7 charges. While holding it, you can expend no more than 3 charges to cast Magic Missile from it. For 1 charge, you cast the level 1 version of the spell. You can increase the spell's level by 1 for each additional charge you expend.\n\nRegaining Charges. The wand regains 1d6 + 1 expended charges daily at dawn. If you expend the wand's last charge, roll 1d20. On a 1, the wand crumbles into ashes and is destroyed", "ed": "both"}, {"n": "Wand of Orcus", "src": "dmg", "tp": "wand", "rar": "artifact", "rarn": 6, "mag": true, "att": true, "cur": false, "wt": "4 lb", "desc": "The ghastly Wand of Orcus rarely leaves Orcus's side. The device, as evil as its creator, shares the demon lord's aims to snuff out the lives of all living things and bind the Material Plane in the stasis of undeath. Orcus allows the wand to slip from his grasp from time to time. When it does, it magically appears wherever its master senses an opportunity to achieve some fell goal.\n\nMade from bones as hard as iron, the wand is topped with a magically enlarged skull that once belonged to a human hero slain by Orcus. The wand can magically change in size to better conform to the grip of its user. Plants wither, drinks spoil, flesh rots, and vermin thrive in the wand's presence.\n\nAny creature besides Orcus that tries to attune to the wand must make a DC 17 Constitution saving throw. On a successful save, the creature takes 10d6 necrotic damage. On a failed save, the creature dies and rises as a zombie.\n\nIn the hands of one who is attuned to it, the wand can be wielded as a magic mace that grants a +3 bonus to attack and damage rolls made with it. The wand deals an extra 2d12 necrotic damage on a hit.\n\nRandom Properties\nThe Wand of Orcus has the following random properties:\n\n- 2 minor beneficial properties\n- 1 major beneficial property\n- 2 minor detrimental properties\n- 1 major detrimental property\n\nThe detrimental properties of the Wand of Orcus are suppressed while the wand is attuned to Orcus himself.\n\nProtection\nYou gain a +3 bonus to Armor Class while holding the wand.\n\nSpells\nThe wand has 7 charges. While holding it, you can use an action and expend 1 or more of its charges to cast one of the following spells (save DC 18) from it: animate dead (1 charge), blight (2 charges), circle of death (3 charges), finger of death (3 charges), power word kill (4 charges), or speak with dead (1 charge). The wand regains 1d4 + 3 expended charges daily at dawn.\n\nWhile attuned to the wand, Orcus or a follower blessed by him can cast each of the wand's spells using 2 fewer charges (minimum of 0).\n\nCall Undead\nWhile you are holding the wand, you can use an action to conjure skeletons and zombies, calling forth as many of them as you can divide 500 hit points among, each undead having average hit points. The undead magically rise up from the ground or otherwise form in unoccupied spaces within 300 feet of you and obey your commands until they are destroyed or until dawn of the next day, when they collapse into inanimate piles of bones and rotting corpses. Once you use this property of the wand, you can't use it again until the next dawn.\n\nWhile attuned to the wand, Orcus can summon any kind of undead, not just skeletons and zombies. The undead don't perish or disappear at dawn the following day, remaining until Orcus dismisses them.\n\nSentience\nThe Wand of Orcus is a sentient, chaotic evil item with an Intelligence of 16, a Wisdom of 12, and a Charisma of 16. It has hearing and darkvision out to a range of 120 feet.\n\nThe wand communicates telepathically with its wielder and can speak, read, and understand Abyssal and Common.\n\nPersonality\nThe wand's purpose is to help satisfy Orcus's desire to slay everything in the multiverse. The wand is cold, cruel, nihilistic, and bereft of humor. In order to further its master's goals, the wand feigns devotion to its current user and makes grandiose promises that it has no intention of fulfilling, such as vowing to help its user overthrow Orcus.\n\nDestroying the Wand\nDestroying the Wand of Orcus requires that it be taken to the Positive Energy Plane by the ancient hero whose skull surmounts it. For this to happen, the long-lost hero must first be restored to life—no easy task, given the fact that Orcus has imprisoned the hero's soul and keeps it hidden and well guarded.\n\nBathing the wand in positive energy causes it to crack and explode, but unless the above conditions are met, the wand instantly reforms on Orcus's layer of the Abyss.", "ed": "5e"}, {"n": "Wand of Paralysis", "src": "dmg", "tp": "wand", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "1 lb", "desc": "This wand has 7 charges. While holding it, you can take a Magic action to expend 1 charge to cause a thin blue ray to streak from the tip toward a creature you can see within 60 feet of yourself. The target must succeed on a DC 15 Constitution saving throw or have the Paralyzed condition for 1 minute. At the end of each of the target's turns, it repeats the save, ending the effect on itself on a success.\n\nRegaining Charges. The wand regains 1d6 + 1 expended charges daily at dawn. If you expend the wand's last charge, roll 1d20. On a 1, the wand crumbles into ashes and is destroyed", "ed": "both"}, {"n": "Wand of Polymorph", "src": "dmg", "tp": "wand", "rar": "very_rare", "rarn": 99, "mag": true, "att": true, "cur": false, "wt": "1 lb", "desc": "This wand has 7 charges. While holding it, you can expend 1 charge to cast Polymorph (save DC 15) from it.\n\nRegaining Charges. The wand regains 1d6 + 1 expended charges daily at dawn. If you expend the wand's last charge, roll 1d20. On a 1, the wand crumbles into ashes and is destroyed", "ed": "both"}, {"n": "Wand of Pyrotechnics", "src": "dmg", "tp": "wand", "rar": "common", "rarn": 1, "mag": true, "att": false, "cur": false, "wt": "1 lb", "desc": "This wand has 7 charges. While holding it, you can take a Magic action to expend 1 charge and create a harmless burst of multicolored light at a point you can see up to 120 feet away. The burst of light is accompanied by a crackling noise that can be heard up to 300 feet away. The light is as bright as a torch flame but lasts only a second.\n\nRegaining Charges. The wand regains 1d6 + 1 expended charges daily at dawn. If you expend the wand's last charge, roll 1d20. On a 1, the wand erupts in a harmless pyrotechnic display and is destroyed", "ed": "2024"}, {"n": "Wand of Scowls", "src": "xge", "tp": "wand", "rar": "common", "rarn": 1, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This wand has 3 charges. While holding it, you can use an action to expend 1 of its charges and target a Humanoid you can see within 30 feet of you. The target must succeed on a DC 10 Charisma saving throw or be forced to scowl for 1 minute.\n\nThe wand regains all expended charges daily at dawn. If you expend the wand’s last charge, roll a d20. On a 1, the wand transforms into a wand of smiles.", "ed": "both"}, {"n": "Wand of Secrets", "src": "dmg", "tp": "wand", "rar": "uncommon", "rarn": 2, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "This wand has 3 charges and regains 1d3 expended charges daily at dawn. While holding it, you can take a Magic action to expend 1 charge, and if a secret door or trap is within 60 feet of you, the wand pulses and points at the one nearest to you", "ed": "both"}, {"n": "Wand of Smiles", "src": "xge", "tp": "wand", "rar": "common", "rarn": 1, "mag": true, "att": false, "cur": false, "wt": "1 lb", "desc": "This wand has 3 charges. While holding it, you can use an action to expend 1 of its charges and target a Humanoid you can see within 30 feet of you. The target must succeed on a DC 10 Charisma saving throw or be forced to smile for 1 minute.\n\nThe wand regains all expended charges daily at dawn. If you expend the wand’s last charge, roll a d20. On a 1, the wand transforms into a wand of scowls.", "ed": "both"}, {"n": "Wand of Web", "src": "dmg", "tp": "wand", "rar": "uncommon", "rarn": 2, "mag": true, "att": true, "cur": false, "wt": "1 lb", "desc": "This wand has 7 charges. While holding it, you can expend 1 charge to cast Web (save DC 13) from it.\n\nRegaining Charges. The wand regains 1d6 + 1 expended charges daily at dawn. If you expend the wand's last charge, roll 1d20. On a 1, the wand crumbles into ashes and is destroyed", "ed": "both"}, {"n": "Wand of Wonder", "src": "dmg", "tp": "wand", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "1 lb", "desc": "This wand has 7 charges. While holding it, you can take a Magic action to expend 1 charge while choosing a point within 120 feet of yourself. That location becomes the point of origin of a spell or other magical effect determined by rolling on the Wand of Wonder Effects table. Spells cast from the wand have a save DC of 15. If a spell's maximum range is normally less than 120 feet, it becomes 120 feet when cast from the wand. If an effect has multiple possible subjects, the DM determines randomly which among them are affected.\n\nRegaining Charges. The wand regains 1d6 + 1 expended charges daily at dawn. If you expend the wand's last charge, roll 1d20. On a 1, the wand crumbles into dust and is destroyed.\n\n| 1d100 | Effect |\n| --- | --- |\n| 01-20 | You cast a spell originating from the chosen point. Roll 1d10 to determine the spell: on a 1-2, Darkness; on a 3-4, Faerie Fire; on a 5-6, Fireball; on a 7-8, Slow; on a 9-10, Stinking Cloud. |\n| 21-25 | Nothing happens at the chosen point of origin. Instead, you have the Stunned condition until the start of your next turn, believing something awesome just happened. |\n| 26-30 | You cast Gust of Wind. The Line created by the spell extends from you to the chosen point of origin. |\n| 31-35 | Nothing happens at the chosen point of origin. Instead, you take 1d6 Psychic damage. |\n| 36-40 | Heavy rain falls for 1 minute in a 120-foot-high, 60-foot-radius Cylinder centered on the chosen point of origin. During that time, the area of effect is Lightly Obscured. |\n| 41-45 | A cloud of 600 oversized butterflies fills a 60-foot-high, 30-foot-radius Cylinder centered on the chosen point of origin. The butterflies remain for 10 minutes, during which time the area of effect is Heavily Obscured. |\n| 46-50 | You cast Lightning Bolt. The Line created by the spell extends from you to the chosen point of origin. |\n| 51-55 | The creature closest to the chosen point of origin is enlarged as if you had cast Enlarge/Reduce on it. If the target isn't you and can't be affected by that spell, you become the target instead. |\n| 56-60 | A magically formed creature appears in an unoccupied space as close to the chosen point of origin as possible. The creature isn't under your control, acts as it normally would, and disappears after 1 hour or when it drops to 0 Hit Points. Roll 1d4 to determine which creature appears. On a 1, a Rhinoceros appears; on a 2, an Elephant appears; and on a 3-4, a Rat appears. |\n| 61-64 | Grass covers a 60-foot-radius circle of ground, with the center of that circle as close to the chosen point of origin as possible. Grass that's already there grows to ten times its normal size and remains overgrown for 1 minute. |\n| 65-68 | An object of the DM's choice disappears into the Ethereal Plane. The object must be neither worn nor carried, within 120 feet of the chosen point of origin, and no larger than 10 feet in any dimension. If there are no such objects in range, nothing happens. |\n| 69-72 | Nothing happens at the chosen point of origin. Instead, you shrink as if you had cast Enlarge/Reduce on yourself and remain in that state for 1 minute. |\n| 73-77 | Leaves grow from the creature nearest to the chosen point of origin. Unless they are picked off, the leaves turn brown and fall off after 24 hours. |\n| 78-82 | Nothing happens at the chosen point of origin. Instead, a burst of colorful, shimmering light extends from you in a 30-foot Emanation. Each creature in the area must succeed on a DC 15 Constitution saving throw or have the Blinded condition for 1 minute. A creature repeats the save at the end of each of its turns, ending the effect on itself on a success. |\n| 83-87 | Nothing happens at the chosen point of origin. Instead, you cast Invisibility on yourself. |\n| 88-92 | Nothing happens at the chosen point of origin. Instead, a stream of 1d4 × 10 gems, each worth 1 GP, shoots from the wand's tip in a Line 30 feet long and 5 feet wide toward the chosen point of origin. Each gem deals 1 Bludgeoning damage, and the total damage of the gems is divided equally among all creatures in the Line. |\n| 93-97 | You cast Polymorph, targeting the creature closest to the chosen point of origin. Roll 1d4 to determine the target's new form. On a 1, the new form is a Black Bear; on a 2, the new form is a Giant Wasp; on a 3-4, the new form is a Frog. |\n| 98-00 | The creature closest to the chosen point of origin makes a DC 15 Constitution saving throw. On a failed save, the creature has the Restrained condition and begins to turn to stone. While Restrained in this way, the creature repeats the save at the end of its next turn. On a successful save, the effect ends. On a failed save, the creature has the Petrified condition instead of the Restrained condition. The petrification lasts until the creature is freed by the Greater Restoration spell or similar magic |", "ed": "both"}, {"n": "War Horn of Valor", "src": "bgg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This brass war horn is engraved with the war rune, which glows purple when the horn is blown.\n\nYou can blow the horn as a bonus action. When you do, if you have the frightened condition, you immediately end that condition on yourself. You also have advantage on saving throws against being frightened until the start of your next turn.\n\nInvoking the Rune\nWhen you blow the horn, you can also invoke the rune, imbuing the horn's deep call with protective magic that affects creatures of your choice within 30 feet of yourself. You and all affected creatures gain a +1 bonus to AC until the start of your next turn.\n\nOnce the rune has been invoked, it can't be invoked again until the next dawn.", "ed": "both"}, {"n": "Warhorse", "src": "phb", "tp": "mount", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "Speed: 60, Carrying Capacity: 540 lb", "ed": "both"}, {"n": "Warrior's Passkey", "src": "bmt", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This silver skeleton key is warm to the touch. While holding the key in its key form, you can use an action to cast the Knock spell from the key.\n\nTransforming the Key\nWhile holding the key, you can use a bonus action to transform it into a magic longsword. You are considered proficient with the sword, and you have a +1 bonus to attack and damage rolls made with it. On a hit, the sword deals 1d10 force damage. The item remains in its sword form until it leaves your grasp or you use another bonus action to revert it to its key form.\n\nIf you end your attunement to the item while it's in its sword form, it automatically reverts to its key form.", "ed": "both"}, {"n": "Warship", "src": "phb", "tp": "vehicle_water", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "Speed: 2½ mph\nCarrying Capacity: 200 tons cargo, 60 passengers\nCrew 60, AC 15, HP 500, Damage Threshold 20\n\nSpeed. A ship sailing against a strong wind moves at half speed. In a dead calm (no wind), waterborne ships can't move under sail and must be rowed. Keelboats and Rowboats are used on lakes and rivers. If going downstream, add the speed of the current (typically 3 miles per hour) to the speed of the vehicle. These vehicles can't be rowed against any significant current, but they can be pulled upstream by draft animals on the shores. A Rowboat can be carried and weighs 100 pounds.\n\nCrew. A ship larger than a Keelboat or Rowboat needs a crew of skilled hirelings (see \"Services\") to function. The minimum number of skilled hirelings needed to crew a ship depends on the type of ship.\n\nPassengers. The number of Small and Medium passengers the ship can accommodate using hammocks. A ship outfitted with private accommodations can carry one-fifth as many passengers. A passenger usually pays 5 SP per day for a hammock, but prices can vary from ship to ship. A small private cabin usually costs 2 GP per day.\n\nDamage Threshold. See the rules glossary.\n\nShip Repair. Repairs to a damaged ship can be made while the vessel is berthed. Repairing 1 Hit Point of damage requires 1 day and costs 20 GP for materials and labor. If the repairs are made in a location where supplies and skilled labor are abundant, such as a city shipyard, the repair time and cost are halved", "ed": "both"}, {"n": "Wasp Ship", "src": "aag", "tp": "vehicle_space", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "Wasp ships are lightweight wooden vessels capable of landing safely on the ground, but not on water. They appeal to adventurers because they're affordable and don't require a large crew. Pirates like them because they're swift. Aristocrats are fond of using them as flying yachts because the ship's cargo hold can be easily converted into posh living quarters.\n\nThe ship's raised back provides high ground for a weapon emplacement, which is typically equipped with a ballista.", "ed": "both"}, {"n": "Waterskin", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "5 lb", "desc": "A Waterskin holds up to 4 pints. If you don't drink sufficient water, you risk dehydration", "ed": "both"}, {"n": "Wayfarer's Boots", "src": "bgg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "", "desc": "This pair of boots is made of durable cloth, with the journey rune stitched in golden thread above each heel. While you are wearing this item, your walking speed increases by 10 feet, and you have advantage on Wisdom (Survival) checks.\n\nInvoking the Runes\nAs a bonus action, you can invoke the boots' runes to cast the expeditious retreat spell with them. Once the runes have been invoked, they can't be invoked again until the next dawn.", "ed": "both"}, {"n": "Weaver's Tools", "src": "phb", "tp": "artisans_tools", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "5 lb", "desc": "Ability: Dexterity\n\nUtilize: Mend a tear in clothing (DC 10), or sew a Tiny design (DC 10)\n\nCraft: Padded Armor, Basket, Bedroll, Blanket, Fine Clothes, Net, Robe, Rope, Sack, String, Tent, Traveler's Clothes\n\nArtisan's Tools are each focused on crafting items and pursuing a trade. Each type of Artisan's Tools tools requires a separate proficiency.\n\nIf you have proficiency with a tool, add your Proficiency Bonus to any ability check you make that uses the tool. If you have proficiency in a skill that's used with that check, you have Advantage on the check too", "ed": "both"}, {"n": "Well of Many Worlds", "src": "dmg", "tp": "wondrous", "rar": "legendary", "rarn": 5, "mag": true, "att": false, "cur": false, "wt": "", "desc": "This fine black cloth, soft as silk, is folded up to the dimensions of a handkerchief. It unfolds into a circular sheet 6 feet in diameter.\n\nYou can take a Magic action to unfold the Well of Many Worlds and place it on a solid surface, whereupon it forms a two-way, 6-foot-diameter, circular portal to another world or plane of existence. Each time the item opens a portal, the DM decides where it leads. The portal remains open until a creature within 5 feet of it takes a Magic action to close it by taking hold of the edges of the cloth and folding it up.\n\nOnce the Well of Many Worlds has opened a portal, it can't do so again for 1d8 hours", "ed": "both"}, {"n": "Wheat", "src": "dmg", "tp": "trade_good", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "", "ed": "both"}, {"n": "Whetstone", "src": "phb", "tp": "adventuring_gear", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "", "ed": "both"}, {"n": "Wildspace Orrery", "src": "aag", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "", "desc": "Inside a Wildspace system, this portable arcane device automatically tracks the positions and movements of all suns, planets, moons, and comets within that system, projecting a display of all these bodies in the space above its current location. In that display, a white, pulsating pinprick of light marks the orrery's location.", "ed": "both"}, {"n": "Wind Fan", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": false, "cur": false, "wt": "", "desc": "While holding this fan, you can cast Gust of Wind (save DC 13) from it. Each subsequent time the fan is used before the next dawn, it has a cumulative 20 percent chance of not working; if the fan fails to work, it tears into useless, nonmagical tatters", "ed": "both"}, {"n": "Winged Boots", "src": "dmg", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": true, "cur": false, "wt": "", "desc": "These boots have 4 charges and regain 1d4 expended charges daily at dawn. While wearing the boots, you can take a Magic action to expend 1 charge, gaining a Fly Speed of 30 feet for 1 hour. If you are flying when the duration expires, you descend at a rate of 30 feet per round until you land", "ed": "both"}, {"n": "Wings of Flying", "src": "dmg", "tp": "wondrous", "rar": "rare", "rarn": 3, "mag": true, "att": true, "cur": false, "wt": "", "desc": "While wearing this cloak, you can take a Magic action to turn the cloak into a pair of wings on your back. The wings lasts for 1 hour or until you end the effect early as a Magic action. The wings give you a Fly Speed of 60 feet. If you are aloft when the wings disappear, you fall. When the wings disappear, you can't use them again for 1d12 hours", "ed": "both"}, {"n": "Witherbloom Primer", "src": "scc", "tp": "wondrous", "rar": "uncommon", "rarn": 2, "mag": true, "att": true, "cur": false, "wt": "", "desc": "The Witherbloom Primer is a magic textbook created at Strixhaven's Witherbloom College. The primer has 3 charges, and it regains 1d3 expended charges daily at dawn. If you make an Intelligence (Nature) or Wisdom (Survival) check while holding the primer, you can expend 1 charge to give yourself a 1d4 bonus to the check, immediately after you roll the d20.\n\nIn addition, if you study the primer at the end of a long rest, you can choose one 1st-level spell from the druid or wizard spell list. Before you finish your next long rest, you can cast the chosen spell once without a spell slot if you are holding the primer. Your spellcasting ability for this spell is your choice of Intelligence, Wisdom, or Charisma.", "ed": "both"}, {"n": "Woodcarver's Tools", "src": "phb", "tp": "artisans_tools", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "5 lb", "desc": "Ability: Dexterity\n\nUtilize: Mend a tear in clothing (DC 10), or sew a Tiny design (DC 10)\n\nCraft: Padded Armor, Basket, Bedroll, Blanket, Fine Clothes, Net, Robe, Rope, Sack, String, Tent, Traveler's Clothes\n\nArtisan's Tools are each focused on crafting items and pursuing a trade. Each type of Artisan's Tools tools requires a separate proficiency.\n\nIf you have proficiency with a tool, add your Proficiency Bonus to any ability check you make that uses the tool. If you have proficiency in a skill that's used with that check, you have Advantage on the check too", "ed": "both"}, {"n": "Wyrmreaver Gauntlets", "src": "bgg", "tp": "wondrous", "rar": "very_rare", "rarn": 99, "mag": true, "att": true, "cur": false, "wt": "", "desc": "Originally crafted for ground-bound giant brawlers to fight against dragons and other enormous predators of the sky, these studded gauntlets are engraved with the dragon rune.\n\nWhile you are wearing these gauntlets, your unarmed strike deals an additional 1d6 force damage on a hit. Additionally, whenever you finish a long rest, choose one of the following damage types: acid, cold, fire, lightning, or poison. You have resistance to the chosen damage type until you finish another long rest.\n\nInvoking the Runes\nAs a bonus action, you can invoke the gauntlets' runes and summon two enormous spectral fists that envelop the gauntlets and mimic your hand motions. The fists can also launch themselves to strike distant opponents, returning immediately to your space after they hit or miss.\n\nThe fists last for 1 minute or until you are incapacitated. While the spectral fists are active, unarmed strikes you make on your turn have a reach of 30 feet, and when you hit a creature with an opportunity attack made with your unarmed strike, the creature must succeed on a Strength saving throw (DC equals 8 + your proficiency bonus + your Strength modifier) or have the prone condition.\n\nOnce the runes have been invoked, they can't be invoked again until the next dawn.", "ed": "both"}, {"n": "Wyvern Poison", "src": "dmg", "tp": "poison", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "", "desc": "A creature subjected to Wyvern Poison makes a DC 14 Constitution saving throw, taking 24 (7d6) Poison damage on a failed save or half as much damage on a successful one", "ed": "both"}, {"n": "Yew Wand", "src": "phb", "tp": "spellcasting_focus", "rar": "none", "rarn": 0, "mag": false, "att": false, "cur": false, "wt": "1 lb", "desc": "A Druidic Focus takes a specific form and is carved, tied with ribbon, or painted to channel primal magic. A Druid or Ranger can use such an object as a Spellcasting Focus", "ed": "both"}];
let F=DATA.slice(),open=-1;
const SK=[r=>r.n,r=>r.tp,r=>r.rarn,r=>r.mag?1:0,r=>r.att?1:0,r=>r.cur?1:0,r=>r.wt,r=>r.src,r=>r.ed];

let sC=-1,sA=true;
function srt(c){
  if(sC===c)sA=!sA;else{sC=c;sA=true;}
  F.sort((a,b)=>{
    let va=SK[c](a),vb=SK[c](b);
    if(typeof va==='number'&&typeof vb==='number')return sA?(va-vb):(vb-va);
    va=String(va);vb=String(vb);
    return sA?va.localeCompare(vb,void 0,{numeric:true}):vb.localeCompare(va,void 0,{numeric:true});
  });
  document.querySelectorAll('thead th').forEach((th,i)=>th.className=i===sC?(sA?'asc':'desc'):'');
  open=-1;render();
}

function ck(v){return v?'<span class="ck">✓</span>':'<span class="cx">—</span>';}
function render(){
  const h=[];
  F.forEach((r,i)=>{
    h.push(`<tr onclick="tog(${i})"${open===i?' class="active"':''}>`+
      `<td>${esc(r.n)}</td><td>${esc(r.tp||'—')}</td>`+
      `<td>${esc(r.rar||'—')}</td>`+
      `<td>${ck(r.mag)}</td><td>${ck(r.att)}</td><td>${ck(r.cur)}</td>`+
      `<td>${esc(r.wt||'—')}</td><td>${esc(r.src).toUpperCase()}</td>`+
      `<td>${edBadge(r.ed)}</td></tr>`);
    h.push(`<tr class="desc-row" style="display:${open===i?'':'none'}"><td colspan="9">`+
      `<div class="desc-content">${esc(r.desc||'No description available.')}</div></td></tr>`);
  });
  document.getElementById('tb').innerHTML=h.join('');
  document.getElementById('cnt').textContent=F.length+'/'+DATA.length;
}
function tog(i){open=open===i?-1:i;render();}
function fil(){
  const q=document.getElementById('qs').value.toLowerCase();
  const ft=document.getElementById('ftp').value;
  const fr=document.getElementById('frar').value;
  const fm=document.getElementById('fmag').value;
  const fs=document.getElementById('fsr').value;
  const fe=document.getElementById('fEd').value;
  F=DATA.filter(r=>
    (!q||(r.n+' '+r.tp+' '+r.rar).toLowerCase().includes(q))&&
    (!ft||r.tp===ft)&&(!fr||r.rar===fr)&&
    (fm===''||(fm==='1'?r.mag:!r.mag))&&
    (!fs||r.src===fs)&&(!fe||r.ed===fe));
  open=-1;render();
}
render();</script></body></html>
