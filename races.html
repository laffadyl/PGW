const DATA=[{"n": "Aarakocra", "src": "mom", "sz": "—", "sp": "30 ft, fly 30 ft", "asi": "—", "traits": "Flight, Wind Caller", "desc": "Flight:\nYou have a flying speed equal to your walking speed. You can't use this flying speed if you're wearing medium or heavy armor\n\nWind Caller:\nYou can cast the gust of wind spell with this trait, without requiring a material component. Once you cast the spell with this trait, you can't do so again until you finish a long rest. You can also cast the spell using any spell slots you have of 2nd level or higher.\n\nIntelligence, Wisdom, or Charisma is your spellcasting ability for when you cast gust of wind with this trait (choose when you select this race)", "ed": "both"}, {"n": "Aasimar", "src": "phb", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Celestial Resistance, Darkvision, Healing Hands, Light Bearer, Celestial Revelation", "desc": "Celestial Resistance:\nYou have resistance to necrotic damage and radiant damage\n\nDarkvision:\nYou have Darkvision with a range of 60 feet\n\nHealing Hands:\nAs a Magic action, you touch a creature and roll a number of d4s equal to your Proficiency Bonus. The creature regains a number of Hit Points equal to the total rolled. Once you use this trait, you can't use it again until you finish a Long Rest\n\nLight Bearer:\nYou know the Light cantrip. Charisma is your spellcasting ability for it\n\nCelestial Revelation:\nWhen you reach character level 3, you can transform as a Bonus Action using one of the options below (choose the option each time you transform). The transformation lasts for 1 minute or until you end it (no action required). Once you transform, you can't do so again until you finish a Long Rest.\n\nOnce on each of your turns before the transformation ends, you can deal extra damage to one target when you deal damage to it with an attack or a spell. The extra damage equals your Proficiency Bonus, and the extra damage's type is either Necrotic for Necrotic Shroud or Radiant for Heavenly Wings and Inner Radiance.\n\nHere are the transformation options:\n\nHeavenly Wings. Two spectral wings sprout from your back temporarily. Until the transformation ends, you have a Fly Speed equal to your Speed.\n\nInner Radiance. Searing light temporarily radiates from your eyes and mouth. For the duration, you shed Bright Light in a 10-foot radius and Dim Light for an additional 10 feet, and at the end of each of your turns, each creature within 10 feet of you takes Radiant damage equal to your Proficiency Bonus.\n\nNecrotic Shroud. Your eyes briefly become pools of darkness, and flightless wings sprout from your back temporarily. Creatures other than your allies within 10 feet of you must succeed on a Charisma saving throw (DC 8 plus your Charisma modifier and Proficiency Bonus) or have the Frightened condition until the end of your next turn", "ed": "both"}, {"n": "Astral Elf", "src": "aag", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Creature Type, Darkvision, Fey Ancestry, Starlight Step, Astral Trance", "desc": "Creature Type:\nYou are a Humanoid. You are also considered an elf for any prerequisite or effect that requires you to be an elf\n\nDarkvision:\nYou can see in dim light within 60 feet of yourself as if it were bright light, and in darkness as if it were dim light. You discern colors in that darkness only as shades of gray\n\nFey Ancestry:\nYou have advantage on saving throws you make to avoid or end the charmed condition on yourself\n\nStarlight Step:\nAs a bonus action, you can magically teleport up to 30 feet to an unoccupied space you can see. You can use this trait a number of times equal to your proficiency bonus, and you regain all expended uses when you finish a long rest\n\nAstral Trance:\nYou don't need to sleep, and magic can't put you to sleep. You can finish a long rest in 4 hours if you spend those hours in a trancelike meditation, during which you remain conscious.\n\nWhenever you finish this trance, you gain proficiency in one skill of your choice and with one weapon or tool of your choice. You mystically acquire these proficiencies by drawing them from shared elven memory and the experiences of entities on the Astral Plane, and you retain them until you finish your next long rest", "ed": "both"}, {"n": "Autognome", "src": "aag", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Construct, Built for Success, Healing Machine, Mechanical Nature, Sentry's Rest", "desc": "Construct:\nYou're a Construct\n\nBuilt for Success:\nYou can add a d4 to one attack roll, ability check, or saving throw you make, and you can do so after seeing the d20 roll but before the effects of the roll are resolved. You can use this trait a number of times equal to your proficiency bonus, and you regain all expended uses when you finish a long rest\n\nHealing Machine:\nIf the mending spell is cast on you, you can spend a Hit Die, roll it, and regain a number of hit points equal to the roll plus your Constitution modifier (minimum of 1 hit point).\n\nIn addition, your creator designed you to benefit from several spells that preserve life but that normally don't affect Constructs: cure wounds, healing word, mass cure wounds, mass healing word, and spare the dying\n\nMechanical Nature:\nYou have resistance to poison damage and immunity to disease, and you have advantage on saving throws against being paralyzed or poisoned. You don't need to eat, drink, or breathe\n\nSentry's Rest:\nWhen you take a long rest, you spend at least 6 hours in an inactive, motionless state, instead of sleeping. In this state, you appear inert, but you remain conscious", "ed": "both"}, {"n": "Bugbear", "src": "mom", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Darkvision, Fey Ancestry, Long-Limbed, Powerful Build, Sneaky, Surprise Attack", "desc": "Darkvision:\nYou can see in dim light within 60 feet of you as if it were bright light and in darkness as if it were dim light. You discern colors in that darkness only as shades of gray\n\nFey Ancestry:\nYou have advantage on saving throws you make to avoid or end the charmed condition on yourself\n\nLong-Limbed:\nWhen you make a melee attack on your turn, your reach for it is 5 feet greater than normal\n\nPowerful Build:\nYou count as one size larger when determining your carrying capacity and the weight you can push, drag, or lift\n\nSneaky:\nYou are proficient in the Stealth skill. In addition, without squeezing, you can move through and stop in a space large enough for a Small creature\n\nSurprise Attack:\nIf you hit a creature with an attack roll, the creature takes an extra 2d6 damage if it hasn't taken a turn yet in the current combat", "ed": "both"}, {"n": "Catfolk", "src": "homebrew", "sz": "—", "sp": "30 ft, climb 20 ft", "asi": "—", "traits": "Low-Light Vision, Cat's Claws, Catlike Reflexes, Feline Empathy", "desc": "Low-Light Vision:\nAs a nocturnal race, you have superior vision in dim conditions. You can see in dim light within 60 feet of you as if it were bright light\n\nCat's Claws:\nBecause of your claws, you have a climbing speed of 20 ft. Additionally, your claws are natural weapons, which you can use to make unarmed strikes. The damage die for your unarmed strike is a d4, and it deals slashing damage instead of bludgeoning damage\n\nCatlike Reflexes:\nYou may add half your proficiency bonus, rounded down, to your initiative rolls\n\nFeline Empathy:\nYou can communicate simple ideas with feline creatures, such as cats, lions, and tigers", "ed": "5e"}, {"n": "Centaur", "src": "mom", "sz": "—", "sp": "40 ft", "asi": "—", "traits": "Charge, Equine Build, Natural Affinity", "desc": "Charge:\nIf you move at least 30 feet straight toward a target and then hit it with a melee weapon attack on the same turn, you can immediately follow that attack with a bonus action, making one attack against the target with your hooves\n\nEquine Build:\nYou count as one size larger when determining your carrying capacity and the weight you can push or drag.\n\nIn addition, any climb that requires hands and feet is especially difficult for you because of your equine legs. When you make such a climb, each foot of movement costs you 4 extra feet instead of the normal 1 extra foot\n\nNatural Affinity:\nYou have proficiency in one of the following skills of your choice: Animal Handling, Medicine, Nature, or Survival", "ed": "both"}, {"n": "Changeling", "src": "mom", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Changeling Instincts, Shapechanger", "desc": "Changeling Instincts:\nYou gain proficiency with two of the following skills of your choice: Deception, Insight, Intimidation, Performance, or Persuasion\n\nShapechanger:\nAs an action, you change your appearance and your voice. You determine the specifics of the changes, including your coloration, hair length, and sex. You can also adjust your height between Medium and Small. You can make yourself appear as a member of another race, though none of your game statistics change. You can't duplicate the appearance of an individual you've never seen, and you must adopt a form that has the same basic arrangement of limbs that you have. Your clothing and equipment aren't changed by this trait.\n\nYou stay in the new form until you use an action to revert to your true form or until you die", "ed": "both"}, {"n": "Chromatic Dragonborn", "src": "ftd", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Chromatic Breath Weapon, Chromatic Resistance, Chromatic Warding", "desc": "Chromatic Breath Weapon:\nWhen you take the Attack action, you can replace one of your attacks with an exhalation of a magical energy in a 30-foot line that is 5 feet wide. Each creature in the area must make a Dexterity saving throw against a DC equal to 8 + your Constitution modifier + your proficiency bonus. A creature takes 1d10 damage of the type associated with your Chromatic Ancestry on a failed save, and half as much damage on a successful one.\n\nYou can use this trait a number of times equal to your proficiency bonus, and you regain all expended uses when you finish a long rest\n\nChromatic Resistance:\nYou have resistance to the damage type associated with your Chromatic Ancestry\n\nChromatic Warding:\nAs an action, you can channel your draconic energies to protect yourself. For 10 minutes, you become immune to the damage type associated with your Chromatic Ancestry. Once you use this trait, you can’t do so again until you finish a long rest", "ed": "both"}, {"n": "Deep Gnome", "src": "mom", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Darkvision, Gift of the Svirfneblin, Gnomish Magic Resistance, Svirfneblin Camouflage", "desc": "Darkvision:\nYou can see in dim light within 120 feet of you as if it were bright light and in darkness as if it were dim light. You discern colors in that darkness only as shades of gray\n\nGift of the Svirfneblin:\nYou can cast the disguise self spell with this trait. Once you cast this spell with this trait, you can't do so again until you finish a long rest. You can also cast it using spell slots you have of the appropriate level.\n\nIntelligence, Wisdom, or Charisma is your spellcasting ability for these spells when you cast them with this trait (choose when you select this race)\n\nGnomish Magic Resistance:\nYou have advantage on Intelligence, Wisdom, and Charisma saving throws against spells\n\nSvirfneblin Camouflage:\nWhen you make a Dexterity (Stealth) check, you can make the check with advantage. You can use this trait a number of times equal to your proficiency bonus, and you regain all expended uses when you finish a long rest", "ed": "both"}, {"n": "Dhampir", "src": "vrgr", "sz": "—", "sp": "35 ft, climb 35 ft", "asi": "—", "traits": "Ancestral Legacy, Darkvision, Deathless Nature, Vampiric Bite", "desc": "Ancestral Legacy:\nIf you replace a race with this lineage, you can keep the following elements of that race: any skill proficiencies you gained from it and any climbing, flying, or swimming speed you gained from it.\n\nIf you don't keep any of those elements or you choose this lineage at character creation, you gain proficiency in two skills of your choice\n\nDarkvision:\nYou can see in dim light within 60 feet of you as if it were bright light and in darkness as if it were dim light. You discern colors in that darkness as shades of gray\n\nDeathless Nature:\nYou don't need to breathe\n\nVampiric Bite:\nYour fanged bite is a natural weapon, which counts as a simple melee weapon with which you are proficient. You add your Constitution modifier, instead of your Strength modifier, to the attack and damage rolls when you attack with this bite. It deals 1d4 piercing damage on a hit. While you are missing half or more of your hit points, you have advantage on attack rolls you make with this bite.\n\nWhen you attack with this bite and hit a creature that isn't a Construct or an Undead, you can empower yourself in one of the following ways of your choice:\n\n- You regain hit points equal to the piercing damage dealt by the bite.\n\n- You gain a bonus to the next ability check or attack roll you make; the bonus equals the piercing damage dealt by the bite\n\nYou can empower yourself with this bite a number of times equal to your proficiency bonus, and you regain all expended uses when you finish a long rest", "ed": "5e"}, {"n": "Dragonborn", "src": "phb", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Breath Weapon, Damage Resistance, Darkvision, Draconic Flight", "desc": "Breath Weapon:\nWhen you take the Attack action on your turn, you can replace one of your attacks with an exhalation of magical energy in either a 15-foot Cone or a 30-foot Line that is 5 feet wide (choose the shape each time). Each creature in that area must make a Dexterity saving throw (DC 8 plus your Constitution modifier and Proficiency Bonus). On a failed save, a creature takes 1d10 damage of the type determined by your Draconic Ancestry trait. On a successful save, a creature takes half as much damage.\n\nYou can use this Breath Weapon a number of times equal to your Proficiency Bonus, and you regain all expended uses when you finish a Long Rest\n\nDamage Resistance:\nYou have Resistance to the damage type determined by your Draconic Ancestry trait\n\nDarkvision:\nYou have Darkvision with a range of 60 feet\n\nDraconic Flight:\nWhen you reach character level 5, you can channel draconic magic to give yourself temporary flight. As a Bonus Action, you sprout spectral wings on your back that last for 10 minutes or until you retract the wings (no action required) or have the Incapacitated condition. During that time, you have a Fly Speed equal to your Speed. Your wings appear to be made of the same energy as your Breath Weapon. Once you use this trait, you can't use it again until you finish a Long Rest", "ed": "both"}, {"n": "Dragonborn (Draconblood)", "src": "egw", "sz": "—", "sp": "30 ft", "asi": "+2 Intelligence", "traits": "Forceful Presence, Darkvision", "desc": "Forceful Presence:\nYou can use your understanding of creative diplomacy or intimidation to guide a conversation in your favor. When you make a Charisma (Intimidation or Persuasion) check, you can do so with advantage. Once you use this trait, you can't do so again until you finish a short or long rest\n\nDarkvision:\nYou can see in dim light within 60 feet of you as if it were bright light, and in darkness as if it were dim light. You can't discern color in darkness, only shades of gray", "ed": "5e"}, {"n": "Dragonborn (Ravenite)", "src": "egw", "sz": "—", "sp": "30 ft", "asi": "+2 Strength", "traits": "Vengeful Assault, Darkvision", "desc": "Vengeful Assault:\nWhen you take damage from a creature in range of a weapon you are wielding, you can use your reaction to make an attack with the weapon against that creature. Once you use this trait, you can't do so again until you finish a short or long rest\n\nDarkvision:\nYou can see in dim light within 60 feet of you as if it were bright light, and in darkness as if it were dim light. You can't discern color in darkness, only shades of gray", "ed": "5e"}, {"n": "Duergar", "src": "mom", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Darkvision, Duergar Magic, Dwarven Resilience, Psionic Fortitude", "desc": "Darkvision:\nYou can see in dim light within 120 feet of you as if it were bright light and in darkness as if it were dim light. You discern colors in that darkness only as shades of gray\n\nDuergar Magic:\nYou can cast the enlarge/reduce spell on yourself with this trait, without requiring a material component. Once you cast it with this trait, you can't do so again until you finish a long rest. You can also cast this spell using spell slots you have of the appropriate level.\n\nIntelligence, Wisdom, or Charisma is your spellcasting ability for these spells when you cast them with this trait (choose when you select this race)\n\nDwarven Resilience:\nYou have advantage on saving throws you make to avoid or end the poisoned condition on yourself. You also have resistance to poison damage\n\nPsionic Fortitude:\nYou have advantage on saving throws you make to avoid or end the charmed or stunned condition on yourself", "ed": "both"}, {"n": "Dwarf", "src": "phb", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Darkvision, Dwarven Resilience, Dwarven Toughness, Stonecunning", "desc": "Darkvision:\nYou have Darkvision with a range of 120 feet\n\nDwarven Resilience:\nYou have Resistance to Poison damage. You also have Advantage on saving throws you make to avoid or end the Poisoned condition\n\nDwarven Toughness:\nYour Hit Point maximum increases by 1, and it increases by 1 again whenever you gain a level (this needs to be added manually)\n\nStonecunning:\nAs a Bonus Action, you gain Tremorsense with a range of 60 feet for 10 minutes. You must be on a stone surface or touching a stone surface to use this Tremorsense. The stone can be natural or worked.\n\nYou can use this Bonus Action a number of times equal to your Proficiency Bonus, and you regain all expended uses when you finish a Long Rest", "ed": "both"}, {"n": "Eladrin", "src": "mom", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Seasonal, Darkvision, Fey Ancestry, Fey Step, Trance", "desc": "Seasonal:\nChoose your eladrin's season: autumn, winter, spring, or summer. When finishing a long rest, you can change your season\n\nDarkvision:\nYou can see in dim light within 60 feet of you as if it were bright light and in darkness as if it were dim light. You discern colors in that darkness only as shades of gray\n\nFey Ancestry:\nYou have advantage on saving throws you make to avoid or end the charmed condition on yourself\n\nFey Step:\nAs a bonus action, you can magically teleport up to 30 feet to an unoccupied space you can see. You can use this trait a number of times equal to your proficiency bonus, and you regain all expended uses when you finish a long rest\n\nTrance:\nYou don't need to sleep, and magic can't put you to sleep. You can finish a long rest in 4 hours if you spend those hours in a trancelike meditation, during which you retain consciousness.\n\nWhenever you finish this trance, you can change your season, and you can gain two proficiencies that you don't have, each one with a weapon or a tool of your choice. You mystically acquire these proficiencies by drawing them from shared elven memory, and you retain them until you finish your next long rest", "ed": "both"}, {"n": "Elf", "src": "phb", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Fey Ancestry, Trance, Elven Lineage", "desc": "Fey Ancestry:\nYou have Advantage on saving throws you make to avoid or end the Charmed condition\n\nTrance:\nYou don't need to sleep, and magic can't put you to sleep. You can finish a Long Rest in 4 hours if you spend those hours in a trancelike meditation, during which you retain consciousness\n\nElven Lineage:\nYou are part of a lineage that grants you supernatural abilities. Choose a lineage. You gain the level 1 benefit of that lineage.\n\nWhen you reach character levels 3 and 5, you learn a higher-level spell, as shown on the table. You always have that spell prepared. You can cast it once without a spell slot, and you regain the ability to cast it in that way when you finish a Long Rest. You can also cast the spell using any spell slots you have of the appropriate level.\n\nIntelligence, Wisdom, or Charisma is your spellcasting ability for the spells you cast with this trait (choose the ability when you select the lineage)", "ed": "both"}, {"n": "Fairy", "src": "wbtw", "sz": "—", "sp": "30 ft, fly 30 ft", "asi": "—", "traits": "Creature Type, Flight, Fairy Magic", "desc": "Creature Type:\nYou are a Fey\n\nFlight:\nBecause of your wings, you have a flying speed equal to your walking speed. You can't use this flying speed if you're wearing medium or heavy armor\n\nFairy Magic:\nYou know the druidcraft cantrip.\n\nIntelligence, Wisdom, or Charisma is your spellcasting ability for these spells when you cast them with this trait (choose when you select this race)", "ed": "both"}, {"n": "Firbolg", "src": "mom", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Firbolg Magic, Hidden Step, Powerful Build, Speech of Beast and Leaf", "desc": "Firbolg Magic:\nYou can cast detect magic and disguise self spells with this trait. When you use this version of disguise self, you can seem up to 3 feet shorter or taller. Once you cast either of these spells with this trait, you can't cast that spell with it again until you finish a long rest. You can also cast these spells using any spell slots you have.\n\nIntelligence, Wisdom, or Charisma is your spellcasting ability for these spells when you cast them with this trait (choose when you select this race)\n\nHidden Step:\nAs a bonus action, you can magically turn invisible until the start of your next turn or until you attack, make a damage roll, or force someone to make a saving throw. You can use this trait a number of times equal to your proficiency bonus, and you regain all expended uses when you finish a long rest\n\nPowerful Build:\nYou count as one size larger when determining your carrying capacity and the weight you can push, drag, or lift\n\nSpeech of Beast and Leaf:\nYou have the ability to communicate in a limited manner with Beasts, Plants, and vegetation. They can understand the meaning of your words, though you have no special ability to understand them in return. You have advantage on all Charisma checks you make to influence them", "ed": "both"}, {"n": "Gem Dragonborn", "src": "ua", "sz": "—", "sp": "30 ft", "asi": "+3 Strength/Dexterity/Constitution/Intelligence/Wisdom/Charisma", "traits": "Gem Breath Weapon, Gem Resistance, Gem Psionic Mind, Gem Flight, Ability Score Increase", "desc": "Gem Breath Weapon:\nWhen you take the Attack action, you can replace one of your attacks with an exhalation of a magical energy in a 15-foot cone. Each creature in the area must make a Dexterity saving throw against a DC equal to 8 + your Constitution modifier + your proficiency bonus. A creature takes 2d8 damage of the type associated with your Gem Ancestry on a failed save, and half as much damage on a successful one.\n\nYou can use this trait a number of times equal to your proficiency bonus, and you regain all expended uses when you finish a long rest\n\nGem Resistance:\nYou have resistance to the damage type associated with your Gem Ancestry\n\nGem Psionic Mind:\nYou can telepathically speak to any creature you can see within 30 feet of you. You don’t need to share a language with the creature, but the creature must be able to understand at least one language. Your communication doesn’t give the creature the ability to respond to you telepathically\n\nGem Flight:\nYou can use your bonus action to temporarily summon an array of spectral gems that match your Gem Ancestry in the shape of wings that last for 1 minute. For the duration, you gain a flying speed equal to your walking speed and can hover. Once you use this trait, you can’t do so again until you finish a long rest\n\nAbility Score Increase:\nChoose 3 (ALL)", "ed": "5e"}, {"n": "Genasi", "src": "mom", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Darkvision", "desc": "Darkvision:\nYou can see in dim light within 60 feet of you as if it were bright light and in darkness as if it were dim light. You discern colors in that darkness only as shades of gray", "ed": "both"}, {"n": "Giff", "src": "aag", "sz": "—", "sp": "30 ft, swim 30 ft", "asi": "—", "traits": "Astral Spark, Firearms Mastery, Hippo Build", "desc": "Astral Spark:\nWhen you hit a target with a simple or martial weapon, you can cause the target to take extra force damage equal to your proficiency bonus.\nYou can use this trait a number of times equal to your proficiency bonus, but you can use it no more than once per turn. You regain all expended uses when you finish a long rest\n\nFirearms Mastery:\nYou have proficiency with all firearms and ignore the loading property of any firearm. In addition, attacking at long range with a firearm doesn't impose disadvantage on your attack roll\n\nHippo Build:\nYou have advantage on Strength-based ability checks and Strength saving throws. In addition, you count as one size larger when determining your carrying capacity and the weight you can push, drag, or lift", "ed": "both"}, {"n": "Gith", "src": "mtf", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "—", "desc": "", "ed": "5e"}, {"n": "Githyanki", "src": "mom", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Astral Knowledge, Githyanki Psionics, Psychic Resilience", "desc": "Astral Knowledge:\nYou can mystically access a reservoir of experiences of entities connected to the Astral Plane. Whenever you finish a long rest, you gain proficiency in one skill of your choice and with one weapon or tool of your choice as you momentarily project your consciousness into the Astral Plane. These proficiencies last until the end of your next long rest\n\nGithyanki Psionics:\nYou know the mage hand cantrip, and the hand is invisible when you cast the cantrip with this trait.\n\nIntelligence, Wisdom, or Charisma is your spellcasting ability for these spells when you cast them with this trait (choose when you select this race). None of these spells require spell components when you cast them with this trait\n\nPsychic Resilience:\nYou have resistance to psychic damage", "ed": "both"}, {"n": "Githzerai", "src": "mom", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Githzerai Psionics, Mental Discipline, Psychic Resilience", "desc": "Githzerai Psionics:\nYou know the mage hand cantrip, and the hand is invisible when you cast the cantrip with this trait.\n\nIntelligence, Wisdom, or Charisma is your spellcasting ability for these spells when you cast them with this trait (choose when you select this race). None of these spells require spell components when you cast them with this trait\n\nMental Discipline:\nYour innate psychic defenses grant you advantage on saving throws you make to avoid or end the charmed and frightened conditions on yourself\n\nPsychic Resilience:\nYou have resistance to psychic damage", "ed": "both"}, {"n": "Gnome", "src": "phb", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Darkvision, Gnomish Cunning, Gnomish Lineage", "desc": "Darkvision:\nYou have Darkvision with a range of 60 feet\n\nGnomish Cunning:\nYou have Advantage on Intelligence, Wisdom, and Charisma saving throws\n\nGnomish Lineage:\nYou are part of a lineage that grants you supernatural abilities. Choose one of the following options; whichever one you choose, Intelligence, Wisdom, or Charisma is your spellcasting ability for the spells you cast with this trait (choose the ability when you select the lineage)", "ed": "both"}, {"n": "Goblin", "src": "mom", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Darkvision, Fey Ancestry, Fury of the Small, Nimble Escape", "desc": "Darkvision:\nYou can see in dim light within 60 feet of you as if it were bright light and in darkness as if it were in dim light. You discern colors in that darkness only as shades of gray\n\nFey Ancestry:\nYou have advantage on saving throws you make to avoid or end the charmed condition on yourself\n\nFury of the Small:\nWhen you damage a creature with an attack or a spell and the creature's size is larger than yours, you can cause the attack or spell to deal extra damage to the creature. The extra damage equals your proficiency bonus.\n\nYou can use this trait a number of times equal to your proficiency bonus, regaining all expended uses when you finish a long rest, and you can use it no more than once per turn\n\nNimble Escape:\nYou can take the Disengage or Hide action as a bonus action on each of your turns", "ed": "both"}, {"n": "Goliath", "src": "phb", "sz": "—", "sp": "35 ft", "asi": "—", "traits": "Large Form, Powerful Build", "desc": "Large Form:\nStarting at character level 5, you can change your size to Large as a Bonus Action if you're in a big enough space. This transformation lasts for 10 minutes or until you end it (no action required). For that duration, you have Advantage on Strength checks, and your Speed increases by 10 feet. Once you use this trait, you can't use it again until you finish a Long Rest\n\nPowerful Build:\nYou have Advantage on any ability check you make to end the Grappled condition. You also count as one size larger when determining your carrying capacity", "ed": "both"}, {"n": "Hadozee", "src": "aag", "sz": "—", "sp": "30 ft, climb 30 ft", "asi": "—", "traits": "Size, Dexterous Feet, Glide, Hadozee Resilience", "desc": "Size:\nYou are Medium or Small. You choose the size when you select this race\n\nDexterous Feet:\nAs a bonus action, you can use your feet to manipulate an object, open or close a door or container, or pick up or set down a Tiny object\n\nGlide:\nWhen you fall at least 10 feet above the ground, you can use your reaction to extend your skin membranes to glide horizontally a number of feet equal to your walking speed, and you take 0 damage from the fall. You determine the direction of the glide\n\nHadozee Resilience:\nWhen you take damage, you can use your reaction to roll a d6. Add your proficiency bonus to the number rolled, and reduce the damage you take by an amount equal to that total (minimum of 0 damage).\n\nYou can use this trait a number of times equal to your proficiency bonus. You regain all expended uses when you finish a long rest", "ed": "both"}, {"n": "Half-Elf", "src": "phb", "sz": "—", "sp": "30 ft", "asi": "+2 Charisma", "traits": "Darkvision (60 ft.), Fey Ancestry, Skill Versatility", "desc": "Darkvision (60 ft.):\nThanks to your elf blood, you have Superior vision in dark and dim conditions. You can see in dim light between 60 ft. of you as if it were bright light, and in darkness as if it were dim light. You can't discern color in darkness, only shades of grey\n\nFey Ancestry:\nYou have advantage on saving throws against being charmed, and magic can't put you to sleep\n\nSkill Versatility:\nYou gain proficiency in two skills of your choice", "ed": "5e"}, {"n": "Half-hag", "src": "homebrew", "sz": "—", "sp": "30 ft", "asi": "+2 Charisma", "traits": "Darkvision (60 ft.), Illusionary Appearance", "desc": "Darkvision (60 ft.):\nYou can see in dim light within 60 feet of you as if it were bright light, and in darkness as if it were dim light. You can't discern color in darkness, only shades of gray\n\nIllusionary Appearance:\nAt the end of a long rest you may change your appearance as per the disguise self spell. This effect ends if you lose any hit points, stand under the light of a full moon or if you choose to end it as a bonus action", "ed": "5e"}, {"n": "Half-Orc", "src": "phb", "sz": "—", "sp": "30 ft", "asi": "+2 Strength", "traits": "Darkvision, Menacing, Relentless Endurance, Savage Attacks", "desc": "Darkvision:\nThanks to your orc blood, you have Superior vision in dark and dim conditions. You can see in dim light within 60 feet of us if it were a bright light, and in darkness as if it were dim light. You can't discern color in darkness, only shades of grey.\n\nMenacing:\nYou gain proficiency in the Intimidation skill\n\nRelentless Endurance:\nWhen you are reduced to 0 hit points but not killed outright, you can drop to 1 hit point instead. You can't use this feature again until you finish a long rest.\n\nSavage Attacks:\nWhen you score a critical hit with a melee weapon,you can roll one of the weapon's damage dice one additional time and that it to the extra damage of the critical hit.", "ed": "5e"}, {"n": "Halfling", "src": "phb", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Brave, Halfling Nimbleness, Luck, Naturally Stealthy", "desc": "Brave:\nYou have Advantage on saving throws you make to avoid or end the Frightened condition\n\nHalfling Nimbleness:\nYou can move through the space of any creature that is a size larger than you, but you can't stop in the same space\n\nLuck:\nWhen you roll a 1 on the d20 of a D20 Test, you can reroll the die, and you must use the new roll\n\nNaturally Stealthy:\nYou can take the Hide action even when you are obscured only by a creature that is at least one size larger than you", "ed": "both"}, {"n": "Harengon", "src": "wbtw", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Hare-Trigger, Leporine Senses, Lucky Footwork, Rabbit Hop", "desc": "Hare-Trigger:\nYou can add your proficiency bonus to your initiative rolls\n\nLeporine Senses:\nYou have proficiency in the Perception skill\n\nLucky Footwork:\nWhen you fail a Dexterity saving throw, you can use your reaction to roll a d4 and add it to the save, potentially turning the failure into a success. You can't use this reaction if you're prone or your speed is 0\n\nRabbit Hop:\nAs a bonus action, you can jump a number of feet equal to five times your proficiency bonus, without provoking opportunity attacks. You can use this trait only if your speed is greater than 0. You can use it a number of times equal to your proficiency bonus, and you regain all expended uses when you finish a long rest", "ed": "both"}, {"n": "Hexblood", "src": "vrgr", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Creature Type, Ancestral Legacy, Darkvision, Eerie Token, Hex Magic", "desc": "Creature Type:\nYou are a fey\n\nAncestral Legacy:\nIf you replace a race with this lineage, you can keep the following elements of that race: any skill proficiencies you gained from it and any climbing, flying, or swimming speed you gained from it.\n\nIf you don't keep any of those elements or you choose this lineage at character creation, you gain proficiency in two skills of your choice\n\nDarkvision:\nYou can see in dim light within 60 feet of you as if it were bright light and in darkness as if it were dim light. You discern colors in that darkness as shades of gray\n\nEerie Token:\nAs a bonus action, you can harmlessly remove a lock of your hair, one of your nails, or one of your teeth. This token is imbued with magic until you finish a long rest. While the token is imbued in this way, you can take these actions:\n\n-Telepathic Message: As an action, you can send a telepathic message to the creature holding or carrying the token, as long as you are within 10 miles of it. The message can contain up to twenty-five words.\n\n- Remote Viewing: If you are within 10 miles of the token, you can enter a trance as an action. The trance lasts for 1 minute, but it ends early if you dismiss it (no action required) or are incapacitated. During this trance, you can see and hear from the token as if you were located where it is. While you are using your senses at the token's location, you are blinded and deafened in regard to your own surroundings. When the trance ends, the token is harmlessly destroyed.\n\nOnce you create a token using this feature, you can't do so again until you finish a long rest, at which point your missing part regrows\n\nHex Magic:\nYou can cast the disguise self and hex spells with this trait. Once you cast either of these spells with this trait, you can't cast that spell with it again until you finish a long rest. You can also cast these spells using any spell slots you have.\n\nIntelligence, Wisdom, or Charisma is your spellcasting ability for these spells (choose the ability when you gain this lineage)", "ed": "5e"}, {"n": "Hobgoblin", "src": "ua", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "—", "desc": "", "ed": "5e"}, {"n": "Human", "src": "phb", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Resourceful, Versatile", "desc": "Resourceful:\nYou gain Heroic Inspiration whenever you finish a Long Rest\n\nVersatile:\nYou gain an Origin feat of your choice", "ed": "both"}, {"n": "Human Revenant", "src": "ua", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Relentless Nature", "desc": "Relentless Nature:\nYour DM assigns a goal to you—typically, one related to your character’s death. The goal must be a specific task you can complete, such as slaying an enemy or liberating an area and its people. Until you fulfill that goal, you gain the following benefits:\n\n- If you are below half your hit point maximum at the start of your turn, you regain 1 hit point.\n\n- If you die, you return to life 24 hours after death. If your body is destroyed, you reform within 1 mile of the place of your death at a spot determined by the DM. If your equipment was also destroyed, you do not regain it.\n\n- You know the distance and direction between you and any creature involved in your goal, such as a person you seek vengeance against or someone you pledged to defend. This awareness fails if the creature is on another plane of existence. When your goal is complete, you finally find rest. You die and cannot be restored to life", "ed": "5e"}, {"n": "Kalashtar", "src": "eb", "sz": "—", "sp": "30 ft", "asi": "+2 Wisdom", "traits": "Dual Mind, Mental Discipline, Mind Link, Severed from Dreams", "desc": "Dual Mind:\nYou have advantage on all Wisdom saving throws\n\nMental Discipline:\nYou have resistance to psychic damage\n\nMind Link:\nYou can speak telepathically to any creature you can see, provided the creature is within a number of feet of you equal to 10 times your level You don't need to share a language with the creature for it to understand your telepathic utterances, but the creature must be able to understand at least one language.\n\nWhen you're using this trait to speak telepathically to a creature, you can use your action to give that creature the ability to speak telepathically with you for 1 hour or until you end this effect as an action. To use this ability, the creature must be able to see you and must be within this trait's range. You can give this ability to only one creature at a time; giving it to a creature takes it away from another creature who has it.\n\nSevered from Dreams:\nKalashtar sleep, but they don't connect to the plane of dreams as other creatures do. Instead, their minds draw from the memories of their otherworldly spirit while they sleep. As such, you are immune to spells and other magical effects that require you to dream, like dream, but not to spells and other magical effects that put you to sleep, like sleep", "ed": "5e"}, {"n": "Kender", "src": "dsdq", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Fearless, Kender Curiosity, Taunt", "desc": "Fearless:\nYou have advantage on saving throws you make to avoid or end the frightened condition on yourself. When you fail a saving throw to avoid or end the frightened condition on yourself, you can choose to succeed instead. Once you succeed on a saving throw in this way, you can't do so again until you finish a long rest\n\nKender Curiosity:\nThanks to the mystical origin of your people, you gain proficiency with one of the following skills of your choice: Insight, Investigation, Sleight of Hand, Stealth, or Survival\n\nTaunt:\nYou have an extraordinary ability to fluster creatures. As a bonus action, you can unleash a string of provoking words at a creature within 60 feet of yourself that can hear and understand you. The target must succeed on a Wisdom saving throw, or it has disadvantage on attack rolls against targets other than you until the start of your next turn. The DC equals 8 + your proficiency bonus + your Intelligence, Wisdom, or Charisma modifier (choose when you select this race).\n\nYou can use this bonus action a number of times equal to your proficiency bonus, and you regain all expended uses when you finish a long rest", "ed": "both"}, {"n": "Kenku", "src": "mom", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Expert Duplication, Kenku Recall, Mimicry", "desc": "Expert Duplication:\nWhen you copy writing or craftwork produced by yourself or someone else, you have advantage on any ability checks you make to produce an exact duplicate\n\nKenku Recall:\nYou have proficiency in two skills of your choice.\nMoreover, when you make an ability check using any skill in which you have proficiency, you can give yourself advantage on the check before rolling the d20. You can give yourself advantage in this way a number of times equal to your proficiency bonus, and you regain all expended uses when you finish a long rest\n\nMimicry:\nYou can accurately mimic sounds you have heard, including voices. A creature that hears the sounds you make can tell they are imitations only with a successful Wisdom (Insight) check against a DC of 8 + your proficiency bonus + your Charisma modifier", "ed": "both"}, {"n": "Kobold", "src": "mom", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Darkvision, Draconic Cry, Kobold Legacy", "desc": "Darkvision:\nYou can see in dim light within 60 feet of you as if it were bright light, and in darkness as if it were in dim light. You discern colors in that darkness only as shades of gray\n\nDraconic Cry:\nAs a bonus action, you let out a cry at your enemies within 10 feet of you. Until the start of your next turn, you and your allies have advantage on attack rolls against any of those enemies who could hear you. You can use this trait a number of times equal to your proficiency bonus, and you regain all expended uses when you finish a long rest\n\nKobold Legacy:\nKobold's connections to dragons can manifest in unpredictable ways in an individual kobold. Choose one of the following legacy options for your kobold.\n\n- Craftiness: You have proficiency in one of the following skills of your choice: Arcana, Investigation, Medicine, Sleight of Hand, or Survival.\n\n- Defiance: You have advantage on saving throws to avoid or end the frightened condition on yourself.\n\n- Draconic Sorcery: You know one cantrip of your choice from the sorcerer spell list. Intelligence, Wisdom, or Charisma is your spellcasting ability for that cantrip (choose when you select this race)", "ed": "both"}, {"n": "Leonin", "src": "mot", "sz": "—", "sp": "35 ft", "asi": "+2 Constitution", "traits": "Darkvision, Hunter's Instincts, Daunting Roar", "desc": "Darkvision:\nYou can see in dim light within 60 feet of you as if it were bright light and in darkness as if it were dim light. You can't discern color in darkness, only shades of gray\n\nHunter's Instincts:\nYou have proficiency in one of the following skills of your choice: Athletics, Intimidation, Perception, or Survival\n\nDaunting Roar:\nAs a bonus action, you can let out an especially menacing roar. Creatures of your choice within 10 feet of you that can hear you must succeed on a Wisdom saving throw or become frightened of you until the end of your next turn.\n\nThe DC of the save equals 8 + your proficiency bonus + your Constitution modifier. Once you use this trait, you can't use it again until you finish a short or long rest", "ed": "5e"}, {"n": "Lizardfolk", "src": "mom", "sz": "—", "sp": "30 ft, swim 30 ft", "asi": "—", "traits": "Hold Breath, Hungry Jaws, Nature's Intuition", "desc": "Hold Breath:\nYou can hold your breath for up to 15 minutes at a time\n\nHungry Jaws:\nYou can throw yourself into a feeding frenzy. As a bonus action, you can make a special attack with your Bite. If the attack hits, it deals its normal damage, and you gain temporary hit points equal to your proficiency bonus. You can use this trait a number of times equal to your proficiency bonus, and you regain all expended uses when you finish a long rest\n\nNature's Intuition:\nYou gain proficiency with two of the following skills of your choice: Animal Handling, Medicine, Nature, Perception, Stealth, or Survival", "ed": "both"}, {"n": "Loxodon", "src": "ggr", "sz": "—", "sp": "30 ft", "asi": "+2 Constitution", "traits": "Powerful Build, Loxodon Serenity, Natural Armor, Trunk, Keen Smell", "desc": "Powerful Build:\nYou count as one size larger when determining your carrying capacity and the weight you can push, drag, or lift\n\nLoxodon Serenity:\nYou have advantage on saving throws against being charmed or frightened\n\nNatural Armor:\nYou have thick, leathery skin. When you aren't wearing armor, your AC is 12 + your Constitution modifier. You can use your natural armor to determine your AC if the armor you wear would leave you with a lower AC. A shield's benefits apply as normal while you use your natural armor\n\nTrunk:\nYou can grasp things with your trunk, and you can use it as a snorkel. It has a reach of 5 feet, and it can lift a number of pounds equal to five times your Strength score. You can use it to do the following simple tasks: lift, drop, hold, push, or pull an object or a creature; open or close a door or a container; grapple someone; or make an unarmed strike. Your DM might allow other simple tasks to be added to that list of options.\n\nYour trunk can't wield weapons or shields or do anything that requires manual precision, such as using tools or magic items or performing the somatic components of a spell\n\nKeen Smell:\nThanks to your sensitive trunk, you have advantage on Wisdom (Perception), Wisdom (Survival), and Intelligence (Investigation) checks that involve smell", "ed": "5e"}, {"n": "Mark of Detection Half-Elf", "src": "erlw", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Deductive Intuition, Sense Threats", "desc": "Deductive Intuition:\nWhen you make an Intelligence (Investigation) or Wisdom (Insight) check, you can roll one intuition die, a d4, and add the number rolled to the ability check.\n\nSense Threats:\nYou can cast that detect magic and detect poison and disease spells, but only as rituals. Intelligence is your spellcasting ability for these spells.", "ed": "5e"}, {"n": "Mark of Finding Half-Orc", "src": "erlw", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Hunter's Intuition, Imprint Prey, Nature's Voice", "desc": "Hunter's Intuition:\nYour mark sharpens your senses and helps you find your prey. When you make a Wisdom (Perception) or Wisdom (Survival) check, you can roll one intuition die, a d4, and then add the number rolled to the ability check.\n\nImprint Prey:\nAs a bonus action, choose one creature you can see within 30 feet of you. The target is imprinted in your mind until it dies or you use this trait again. Alternatively, you can imprint a creature as your quarry whenever you succeed on a Wisdom (Survival) check to track it.\n\nWhen you are tracking your quarry, double the result of your Intuition die. When your quarry is within 60 feet of you, you have a general sense of its location. Your attacks against it ignore half cover. If you can’t see the target when you attack it, your inability to see it doesn’t impose disadvantage on the attack roll. Likewise, your quarry doesn’t doesn’t gain advantage on attack rolls against you due to being hidden or invisible. Once you use this trait, you cannot use it again until you finish a short or long rest.\n\nNature's Voice:\nWhen you reach third level you gain the ability to cast Locate Animals or Plants, but only as a ritual.", "ed": "5e"}, {"n": "Mark of Handling Human", "src": "erlw", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Wild Intuition, Expert Handling, Primal Connection, The Bigger They Are", "desc": "Wild Intuition:\nWhen you make a Wisdom (Animal Handling) or Intelligence (Nature) check, you can roll one Intuition die, a d4, and add the number rolled to the ability check\n\nExpert Handling:\nYou can use the help action to aid an ally animal companion or mount within 30 feet of you, rather than 5 feet of you\n\nPrimal Connection:\nYou can cast animal friendship once with this trait and regain the ability to do so when you finish a short or long rest. Wisdom is your spellcasting ability for this spell\n\nThe Bigger They Are:\nWhen you cast a spell that affects only beasts, it also affects monstrosities with an Intelligence score of 3 or lower", "ed": "5e"}, {"n": "Mark of Making Human", "src": "erlw", "sz": "—", "sp": "30 ft", "asi": "+2 Dexterity", "traits": "Artisan's Intuition, Maker's Gift, Magecraft, Spellsmith", "desc": "Artisan's Intuition:\nWhen you make an ability check with artisan’s tools, roll 1d4 and add it to the result\n\nMaker's Gift:\nYou know the cantrip mending and gain proficiency with one type of artisan’s tools\n\nMagecraft:\nYou can create a temporary magic item out of common materials. Choose a cantrip from the wizard spell list. Describe the item connected to it. As long as you possess the item, you know that cantrip. At the end of a long rest, you can replace it with a new item and select a new cantrip from the wizard spell list. Intelligence is your spellcasting ability for these cantrips\n\nSpellsmith:\nYou can spend one minute to weave a temporary enchantment into a nonmagical suit of armor or weapon. For the next hour the object becomes a magic item, gaining a +1 bonus to AC if it is armor or a +1 bonus to hit and damage if it is a weapon. Once you use this trait, you can’t use it again until you finish a long rest", "ed": "5e"}, {"n": "Mark of Passage Human", "src": "erlw", "sz": "—", "sp": "40 ft", "asi": "+2 Dexterity", "traits": "Courier's Speed, Intuitive Motion, Orien's Grace, Shared Passage", "desc": "Courier's Speed:\nYour base walking speed increases to 40 ft.\n\nIntuitive Motion:\nWhen you make a Strength (Athletics) check or any ability check to operate or maintain a land vehicle, you can roll one Intuition die, a d4, and add the number rolled to the ability check\n\nOrien's Grace:\nWhen you use the Dash action, difficult terrain doesn’t cost you extra movement on that turn\n\nShared Passage:\nAs a bonus action you can teleport a distance up to your walking speed, ending in an unoccupied space that you can see. You can bring one willing creature of your size or smaller who is carrying gear up to its carrying capacity. The creature must be within 5 feet of you when you use this trait. Once you use this trait, you can’t use it again until you finish a long rest", "ed": "5e"}, {"n": "Mark of Sentinel Human", "src": "erlw", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Sentinel's Intuiton, Sentinel's Shield, Vigilant Guardian", "desc": "Sentinel's Intuiton:\nWhen you roll for Initiative or make a Wisdom (Perception) check to notice a threat, you can roll one Intuition die, a d4, and add it to the ability check\n\nSentinel's Shield:\nYou know the cantrip blade ward. You can cast shield once with this trait and regain the ability to do so after you finish a short or long rest\n\nVigilant Guardian:\nAs an action, you can designate an ally you can see as your ward. You have advantage on Wisdom (Insight) and Wisdom (Perception) checks made to spot threats to your ward. In addition, when you are within 5 feet of your ward, and that creature is the target of an attack that you can see, you can use your reaction to swap places with your ward. When you do, you become the target of the attack", "ed": "5e"}, {"n": "Mark of Storm Half-Elf", "src": "erlw", "sz": "—", "sp": "30 ft, swim 30 ft", "asi": "—", "traits": "Sea Monkey, Windwright's Intuition, Storm's Blessing, Headwinds", "desc": "Sea Monkey:\nYour base walking speed is 30 feet, and you have a swim speed of 30 feet.\n\nWindwright's Intuition:\nWhen you make a Dexterity (Acrobatics) check or any ability check involving operating or maintaining a water or air vehicle, you can roll one Intuition die, a d4, and add the number rolled to the ability check.\n\nStorm's Blessing:\nYou have resistance to lightning damage\n\nHeadwinds:\nYou know the Gust cantrip", "ed": "5e"}, {"n": "Metallic Dragonborn", "src": "ftd", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Metallic Breath Weapon, Metallic Resistance, Metallic Breath Weapon, Ability Score Increase", "desc": "Metallic Breath Weapon:\nWhen you take the Attack action, you can replace one of your attacks with an exhalation of a magical energy in a 15-foot cone. Each creature in the area must make a Dexterity saving throw against a DC equal to 8 + your Constitution modifier + your proficiency bonus. A creature takes 1d10 damage of the type associated with your Metallic Ancestry on a failed save, and half as much damage on a successful one.\n\nYou can use this trait a number of times equal to your proficiency bonus, and you regain all expended uses when you finish a long rest\n\nMetallic Resistance:\nYou have resistance to the damage type associated with your Metallic Ancestry\n\nMetallic Breath Weapon:\nYou gain a second breath weapon. When you take the Attack action, you can replace one of your attacks with an exhalation of a magical gas in a 15-foot cone. The save DC for this breath is 8 + your Constitution modifier + your proficiency bonus. When you use this ability, choose one:\n\n- Each creature in the area must succeed on a Strength saving throw or be pushed 20 feet away from you and be knocked prone.\n\n- Each creature in the area must succeed on a Constitution saving throw or become incapacitated until the start of your next turn.\n\nOnce you use your Metallic Breath Weapon, you can’t do so again until you finish a long rest\n\nAbility Score Increase:\nChoose 3 (ALL)", "ed": "both"}, {"n": "Mind Flayer", "src": "homebrew", "sz": "—", "sp": "30 ft", "asi": "+2 Intelligence", "traits": "Darkvision, Extract Brain, Innate Spellcasting, Mind Blast, Telepathy", "desc": "Darkvision:\nYou can see in dim light within 60 feet of you as if it were bright light, and in darkness as if it were dim light. You can’t discern color in darkness, only shades of gray.\n\nExtract Brain:\nOn a successful hit with your tentacles, if the damage would reduce the creature to 0 hit points, you may choose to kill the target by extracting and devouring its brain.\n\nInnate Spellcasting:\nOnce you reach 3rd level, you can cast the levitate spell once per day. Intelligence is your spellcasting ability for this spell.\n\nMind Blast:\nAs an action, you can magically emit psychic energy in a 15-foot cone. Each creature in that line must make an Intelligence saving throw. The DC for this saving throw equals 8 + your Intelligence modifier + your proficiency bonus. A creature takes 2d6 psychic damage on a failed save and half as much damage on a successful one. After you use this ability, you can't use it again until you complete a short or long rest\n\nTelepathy:\nYou can communicate telepathically with any creature that knows a language within 30 ft.", "ed": "5e"}, {"n": "Minotaur", "src": "mom", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Goring Rush, Hammering Horns, Labyrinthine Recall", "desc": "Goring Rush:\nImmediately after you take the Dash action on your turn and move at least 20 feet, you can make one melee attack with your Horns as a bonus action\n\nHammering Horns:\nImmediately after you hit a creature with a melee attack as part of the Attack action on your turn, you can use a bonus action to attempt to push that target with your horns. The target must be within 5 feet of you and no more than one size larger than you. Unless it succeeds on a Strength saving throw against a DC equal to 8 + your proficiency bonus + your Strength modifier, you can push it up to 10 feet away from you\n\nLabyrinthine Recall:\nYou always know which direction is north, and you have advantage on any Wisdom (Survival) check you make to navigate or track", "ed": "both"}, {"n": "Orc", "src": "phb", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Adrenaline Rush, Darkvision, Relentless Endurance", "desc": "Adrenaline Rush:\nYou can take the Dash action as a Bonus Action. When you do so, you gain a number of Temporary Hit Points equal to your Proficiency Bonus.\n\nYou can use this trait a number of times equal to your Proficiency Bonus, and you regain all expended uses when you finish a Short or Long Rest\n\nDarkvision:\nYou have Darkvision with a range of 120 feet\n\nRelentless Endurance:\nWhen you are reduced to 0 Hit Points but not killed outright, you can drop to 1 Hit Point instead. Once you use this trait, you can't do so again until you finish a Long Rest", "ed": "both"}, {"n": "Owlfolk", "src": "ua", "sz": "—", "sp": "30 ft, fly 30 ft", "asi": "—", "traits": "Darkvision, Magic Sight, Nimble Flight", "desc": "Darkvision:\nYou can see in dim light within 90 feet of you as if it were bright light and in darkness as if it were dim light. You discern colors in that darkness only as shades of gray\n\nMagic Sight:\nYour keen senses can focus to see the presence of magic. You gain the ability to cast the detect magic spell, but only as a ritual. Your spellcasting ability for this spell is your choice of Intelligence, Wisdom, or Charisma. You can also cast this spell normally with any spell slots you have\n\nNimble Flight:\nThanks to your wings, you have a flying speed equal to your walking speed. When you fall, you can use your reaction to make a Dexterity saving throw (DC 10) to stop falling and fly in place until the start of your next turn", "ed": "5e"}, {"n": "Owlin", "src": "scc", "sz": "—", "sp": "30 ft, fly 30 ft", "asi": "—", "traits": "Darkvision, Flight", "desc": "Darkvision:\nYou can see in dim light within 120 feet of yourself as if it were bright light and in darkness as if it were dim light. You discern colors in that darkness only as shades of gray\n\nFlight:\nYou have a flying speed equal to your walking speed. You can't use this flying speed if you're wearing medium or heavy armor", "ed": "both"}, {"n": "Plasmoid", "src": "aag", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Ooze, Size, Amorphous, Darkvision, Hold Breath, Natural Resilience, Shape Self", "desc": "Ooze:\nYou are an Ooze\n\nSize:\nYou are Medium or Small. You choose the size when you select this race\n\nAmorphous:\nYou can squeeze through a space as narrow as 1 inch wide, provided you are wearing and carrying nothing. You have advantage on ability checks you make to initiate or escape a grapple\n\nDarkvision:\nYou can see in dim light within 60 feet of yourself as if it were bright light, and in darkness as if it were dim light. You discern colors in that darkness only as shades of gray\n\nHold Breath:\nYou can hold your breath for 1 hour\n\nNatural Resilience:\nYou have resistance to acid and poison damage, and you have advantage on saving throws against being poisoned\n\nShape Self:\nAs an action, you can reshape your body to give yourself a head, one or two arms, one or two legs, and makeshift hands and feet, or you can revert to a limbless blob. While you have a humanlike shape, you can wear clothing and armor made for a Humanoid of your size.\n\nAs a bonus action, you can extrude a pseudopod that is up to 6 inches wide and 10 feet long or reabsorb it into your body. As part of the same bonus action, you can use this pseudopod to manipulate an object, open or close a door or container, or pick up or set down a Tiny object. The pseudopod contains no sensory organs and can't attack, activate magic items, or lift more than 10 pounds", "ed": "both"}, {"n": "Rabbitfolk", "src": "ua", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Hare-Trigger, Lucky Footwork, Rabbit Hop", "desc": "Hare-Trigger:\nYou add your proficiency bonus to your initiative rolls\n\nLucky Footwork:\nWhen you fail a Dexterity saving throw, you can use your reaction to roll a d4 and add it to the result, potentially turning the failure into a successa\n\nRabbit Hop:\nOnce during each of your turns when you walk at least 5 feet, you can hop, rolling a d12 and moving that many feet in a direction of your choice. This extra distance doesn’t cost movement, but you can hop only if your speed isn’t 0", "ed": "5e"}, {"n": "Reborn", "src": "vrgr", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Ancestral Legacy, Deathless Nature, Knowledge from a Past Life", "desc": "Ancestral Legacy:\nIf you replace a race with this lineage, you can keep the following elements of that race: any skill proficiencies you gained from it and any climbing, flying, or swimming speed you gained from it.\n\nIf you don't keep any of those elements or you choose this lineage at character creation, you gain proficiency in two skills of your choice\n\nDeathless Nature:\nYou have escaped death, a fact represented by the following benefits:\n\n- You have advantage on saving throws against disease and being poisoned, and you have resistance to poison damage.\n\n- You have advantage on death saving throws.\n\n- You don't need to eat, drink, or breathe.\n\n- You don't need to sleep, and magic can't put you to sleep. You can finish a long rest in 4 hours if you spend those hours in an inactive, motionless state, during which you retain consciousness\n\nKnowledge from a Past Life:\nYou temporarily remember glimpses of the past, perhaps faded memories from ages ago or a previous life. When you make an ability check that uses a skill, you can roll a d6 immediately after seeing the number on the d20 and add the number on the d6 to the check. You can use this feature a number of times equal to your proficiency bonus, and you regain all expended uses when you finish a long rest", "ed": "5e"}, {"n": "Satyr", "src": "mom", "sz": "—", "sp": "35 ft", "asi": "—", "traits": "Creature Type, Magic Resistance, Mirthful Leaps", "desc": "Creature Type:\nYou're a Fey\n\nMagic Resistance:\nYou have advantage on saving throws against spells\n\nMirthful Leaps:\nWhenever you make a long jump or a high jump, you can roll a d8 and add the number rolled to the number of feet you cover, even when making a standing jump. This extra distance costs movement as usual", "ed": "both"}, {"n": "Sea Elf", "src": "mom", "sz": "—", "sp": "30 ft, swim 30 ft", "asi": "—", "traits": "Swim, Child of the Sea, Darkvision, Fey Ancestry, Friend of the Sea, Trance", "desc": "Swim:\nYou have a swimming speed equal to your walking speed\n\nChild of the Sea:\nYou can breathe air and water, and you have a resistance to cold damage\n\nDarkvision:\nYou can see in dim light within 60 feet of you as if it were bright light and in darkness as if it were dim light. You discern colors in that darkness only as shades of gray\n\nFey Ancestry:\nYou have advantage on saving throws you make to avoid or end the charmed condition on yourself\n\nFriend of the Sea:\nAquatic animals have an extraordinary affinity with your people. You can communicate simple ideas to any Beast that has a swimming speed. It can understand your words, though you have no special ability to understand it in return\n\nTrance:\nYou don't need to sleep, and magic can't put you to sleep. You can finish a long rest in 4 hours if you spend those hours in a trancelike meditation, during which you retain consciousness.\n\nWhenever you finish this trance, you can gain two proficiencies that you don't have, each one with a weapon or a tool of your choice. You mystically acquire these proficiencies by drawing them from shared elven memory, and you retain them until you finish your next long rest", "ed": "both"}, {"n": "Shadar-Kai", "src": "mom", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Blessing of the Raven Queen, Darkvision, Fey Ancestry, Necrotic Resistance, Trance", "desc": "Blessing of the Raven Queen:\nAs a bonus action, you can magically teleport up to 30 feet to an unoccupied space you can see. You can use this trait a number of times equal to your proficiency bonus, and you regain all expended uses when you finish a long rest\n\nDarkvision:\nYou can see in dim light within 60 feet of you as if it were bright light and in darkness as if it were dim light. You discern colors in that darkness only as shades of gray\n\nFey Ancestry:\nYou have advantage on saving throws you make to avoid or end the charmed condition on yourself\n\nNecrotic Resistance:\nYou have resistance to necrotic damage\n\nTrance:\nYou don't need to sleep, and magic can't put you to sleep. You can finish a long rest in 4 hours if you spend those hours in a trancelike meditation, during which you retain consciousness.\n\nWhenever you finish this trance, you can gain two proficiencies that you don't have, each one with a weapon or a tool of your choice. You mystically acquire these proficiencies by drawing them from shared elven memory, and you retain them until you finish your next long rest", "ed": "both"}, {"n": "Shifter", "src": "mom", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Bestial Instincts, Darkvision, Shifting", "desc": "Bestial Instincts:\nYou have proficiency in one of the following skills of your choice: Acrobatics, Athletics, Intimidation, or Survival\n\nDarkvision:\nYou can see in dim light within 60 feet of you as if it were bright light, and in darkness as if it were in dim light. You discern colors in that darkness only as shades of gray\n\nShifting:\nAs a bonus action, you can assume a more bestial appearance. This transformation lasts for 1 minute, until you die, or until you revert to your normal appearance as a bonus action. When you shift, you gain temporary hit points equal to 2 × your proficiency bonus. You can shift a number of times equal to your proficiency bonus, and you regain all expended uses when you finish a long rest", "ed": "both"}, {"n": "Simic Hybrid", "src": "ggr", "sz": "—", "sp": "30 ft", "asi": "+2 Constitution", "traits": "Darkvision, Animal Enhancement", "desc": "Darkvision:\nYou can see in dim light within 60 feet of you as if it were bright light, and in darkness as if it were dim light. You can't discern color in darkness, only shades of gray.\n\nAnimal Enhancement:\nYour body has been altered to incorporate certain animal characteristics. You choose one animal enhancement now and a second enhancement at 5th level. When choosing one at 5th level, you can pick from one of the 5th level enhancements, or one from the list of 1st level enhancements.\n\n1st level enhancement options:\n\n- Manta Glide: You have ray-like fins that you can use as wings to slow your fall or allow you to glide. When you fall and aren't incapacitated, you can subtract up to 100 feet from the fall when calculating falling damage, and you can move up to 2 feet horizontally for every 1 foot you descend.\n- Nimble Climber: You have a climbing speed equal to your walking speed.\n- Underwater Adaptation: You can breathe air and water, and you have a swimming speed equal to your walking speed.", "ed": "5e"}, {"n": "Tabaxi", "src": "mom", "sz": "—", "sp": "30 ft, climb 30 ft", "asi": "—", "traits": "Climber, Darkvision, Feline Agility", "desc": "Climber:\nYou have a climbing speed equal to your walking speed\n\nDarkvision:\nYou can see in dim light within 60 feet of you as if it were bright light and in darkness as if it were dim light. You discern colors in that darkness only as shades of gray\n\nFeline Agility:\nWhen you move on your turn in combat, you can double your speed until the end of the turn. Once you use this trait, you can't use it again until you move 0 feet on one of your turns", "ed": "both"}, {"n": "Thri-kreen", "src": "aag", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Monstrosity, Size, Chameleon Carapace, Darkvision, Secondary Arms, Sleepless, Thri-kreen Telepathy", "desc": "Monstrosity:\nYou are a Monstrosity\n\nSize:\nYou are Medium or Small. You choose the size when you select this race\n\nChameleon Carapace:\nWhile you aren't wearing armor, your carapace gives you a base Armor Class of 13 + your Dexterity modifier.\n\nAs an action, you can change the color of your carapace to match the color and texture of your surroundings, giving you advantage on Dexterity (Stealth) checks made to hide in those surroundings\n\nDarkvision:\nYou can see in dim light within 60 feet of yourself as if it were bright light, and in darkness as if it were dim light. You discern colors in that darkness only as shades of gray\n\nSecondary Arms:\nYou have two slightly smaller secondary arms below your primary pair of arms. The secondary arms can manipulate an object, open or close a door or container, pick up or set down a Tiny object, or wield a weapon that has the light property\n\nSleepless:\nYou do not require sleep and can remain conscious during a long rest, though you must still refrain from strenuous activity to gain the benefit of the rest\n\nThri-kreen Telepathy:\nWithout the assistance of magic, you can't speak the non-thri-kreen languages you know. Instead you use telepathy to convey your thoughts. You have the magical ability to transmit your thoughts mentally to willing creatures you can see within 120 feet of yourself. A contacted creature doesn't need to share a language with you to understand your thoughts, but it must be able to understand at least one language. Your telepathic link to a creature is broken if you and the creature move more than 120 feet apart, if either of you is incapacitated, or if either of you mentally breaks the contact (no action required)", "ed": "both"}, {"n": "Tiefling", "src": "phb", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Darkvision, Fiendish Legacy, Otherworldly Presence", "desc": "Darkvision:\nYou have Darkvision with a range of 60 feet\n\nFiendish Legacy:\nYou are the recipient of a legacy that grants you supernatural abilities. Choose a legacy. You gain the level 1 benefit of the chosen legacy.\n\nWhen you reach character levels 3 and 5, you learn a higher-level spell, as shown on the table. You always have that spell prepared. You can cast it once without a spell slot, and you regain the ability to cast it in that way when you finish a Long Rest. You can also cast the spell using any spell slots you have of the appropriate level. Intelligence, Wisdom, or Charisma is your spellcasting ability for the spells you cast with this trait (choose the ability when you select the legacy)\n\nOtherworldly Presence:\nYou know the Thaumaturgy cantrip. When you cast it with this trait, the spell uses the same spellcasting ability you use for your Fiendish Legacy Trait", "ed": "both"}, {"n": "Tortle", "src": "mom", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Hold Breath, Nature's Intuition, Shell Defense", "desc": "Hold Breath:\nYou can hold your breath for up to 1 hour\n\nNature's Intuition:\nYou gain proficiency with one of the following skills of your choice: Animal Handling, Medicine, Nature, Perception, Stealth, or Survival\n\nShell Defense:\nYou can withdraw into your shell as an action. Until you emerge, you gain a +4 bonus to your AC, and you have advantage on Strength and Constitution saving throws. While in your shell, you are prone, your speed is 0 and can't increase, you have disadvantage on Dexterity saving throws, you can't take reactions, and the only action you can take is a bonus action to emerge from your shell", "ed": "both"}, {"n": "Triton", "src": "mom", "sz": "—", "sp": "30 ft, swim 30 ft", "asi": "—", "traits": "Amphibious, Control Air and Water, Darkvision, Emissary of the Sea, Guardian of the Depths", "desc": "Amphibious:\nYou can breathe air and water, and you have a swimming speed equal to your walking speed\n\nControl Air and Water:\nYou can cast fog cloud with this trait.\n\nIntelligence, Wisdom, or Charisma is your spellcasting ability for these spells when you cast them with this trait (choose when you select this race)\n\nDarkvision:\nYou can see in dim light within 60 feet of you as if it were bright light and in darkness as if it were dim light. You discern colors in that darkness only as shades of gray\n\nEmissary of the Sea:\nYou can communicate simple ideas to any Beast, Elemental, or Monstrosity that has a swimming speed. It can understand your words, though you have no special ability to understand it in return\n\nGuardian of the Depths:\nAdapted to the frigid ocean depths, you have resistance to cold damage", "ed": "both"}, {"n": "Vampire", "src": "psix", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Darkvision (60 ft.), Vampiric Resistance, Blood Thirst", "desc": "Darkvision (60 ft.):\nThanks to your heritage, you have superior vision in dark and dim conditions. You can see in dim light within 60 feet of you as if it were bright light, and in darkness as if it were dim light. You can’t discern color in darkness, only shades of gray\n\nVampiric Resistance:\nYou have resistance to necrotic damage\n\nBlood Thirst:\nYou can drain blood and life energy from a willing creature, or one that is grappled by you, incapacitated, or restrained. Make a melee attack against the target. If you hit, you deal 1 piercing damage and 1d6 necrotic damage. The target’s hit point maximum is reduced by an amount equal to the necrotic damage taken, and you regain hit points equal to that amount. The reduction lasts until the target finishes a long rest. The target dies if this effect reduces its hit point maximum to 0", "ed": "5e"}, {"n": "Variant Human", "src": "phb", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Skills, Feat", "desc": "Skills:\nYou gain proficiency in one skill of your choice\n\nFeat:\nYou gain one feat of your choice", "ed": "5e"}, {"n": "Vedalken", "src": "ggr", "sz": "—", "sp": "30 ft", "asi": "+2 Intelligence", "traits": "—", "desc": "", "ed": "5e"}, {"n": "Verdan", "src": "ai", "sz": "—", "sp": "30 ft", "asi": "+2 Charisma", "traits": "Black Blood Healing, Limited Telepathy, Telepathic Insight", "desc": "Black Blood Healing:\nThe black blood that is a sign of your people's connection to That-Which-Endures boosts your natural healing. When you roll a 1 or 2 on any Hit Die you spend at the end of a short rest, you can reroll the die and must use the new roll\n\nLimited Telepathy:\nYou can telepathically speak to any creature you can see within 30 feet of you. You don't need to share a language with the creature for it to understand your telepathy, but it must be able to understand at least one language. This process of communication is slow and limited, allowing you to transmit and receive only simple ideas and straightforward concepts\n\nTelepathic Insight:\nYour mind's connection to the world around you strengthens your will. You have advantage on all Wisdom and Charisma saving throws", "ed": "5e"}, {"n": "Viashino", "src": "ua", "sz": "—", "sp": "30 ft", "asi": "+2 Dexterity", "traits": "Bite, Lashing Tail, Wiry Frame", "desc": "Bite:\nYour fanged maw is a natural weapon, which you can use to make unarmed strikes. If you hit with it, you deal piercing damage equal to 1d4 + your Strength modifier, instead of the bludgeoning damage normal for an unarmed strike\n\nLashing Tail:\nImmediately after a creature within 5 feet of you deals damage to you with a melee attack, you can use your reaction to make an unarmed strike against that creature with your tail. If you hit, you deal slashing damage equal to 1d4 + your Strength modifier, instead of the bludgeoning damage normal for an unarmed strike\n\nWiry Frame:\nYou gain proficiency in Acrobatics or Stealth", "ed": "5e"}, {"n": "Warforged", "src": "eb", "sz": "—", "sp": "30 ft", "asi": "+2 Constitution", "traits": "Constructed Resilience, Sentry's Rest, Integrated Protection, Specialized Design", "desc": "Constructed Resilience:\nYou were created to have remarkable fortitude, represented by the following benefits:\n- You have advantage on saving throws against being poisoned, and you have resistance to poison damage.\n- You don't need to eat, drink, or breathe.\n- You are immune to disease.\n- You don't need to sleep, and magic can't put you to sleep.\n\nSentry's Rest:\nWhen you take a long rest, you must spend at least six hours in an inactive, motionless state, rather than sleeping. In this state, you appear inert, but it doesn't render you unconscious, and you can see and hear as normal\n\nIntegrated Protection:\nYour body has built-in defensive layers, which can be enhanced with armor:\n\n- You gain a +1 bonus to Armor Class.\n- You can don only armor with which you have proficiency. To don armor, you must incorporate it into your body over the course of 1 hour, during which you remain in contact with the armor. To doff armor, you must spend 1 hour removing it. You can rest while donning and doffing armor in this way.\n- While you live, your armor can't be removed from your body against your will.\n\nSpecialized Design:\nYou gain one skill proficiency and one tool proficiency of your choice.", "ed": "5e"}, {"n": "Wolfborn", "src": "homebrew", "sz": "—", "sp": "30 ft", "asi": "+2 Strength/Dexterity/Constitution", "traits": "Darkvision (60 ft.), Claws, Cold Endurance, Keen Senses, Lupine Magic, Pack Tactics, Frightful Howl, Breath Weapon", "desc": "Darkvision (60 ft.):\nYou have a wolf's keen senses especially in the dark. You can see in dim light within 60 feet of you as if it were bright light, and in darkness as if it were dim light. You can’t discern color in darkness only shades of gray\n\nClaws:\nYou get claws that deal 1d6 slashing damage on an unarmed strike\n\nCold Endurance:\nTheir fur allows wolfborn to withstand the cold. You have resistance to cold damage. You automatically pass Survival checks made to withstand extreme cold\n\nKeen Senses:\nDue to their lupine traits, Wolfborn have advantage on Perception skill checks when hearing or smelling\n\nLupine Magic:\nYou know the ray of frost cantrip as a breath weapon. Intelligence is your spellcasting ability for this spell\n\nPack Tactics:\nThe wolfborn has advantage on an Attack roll against a creature if at least one of the wolfborn's allies is within 5 ft. of the creature and the ally isn't Incapacitated\n\nFrightful Howl:\nAs a bonus action, once per short rest, a wolfborn can emit a howl in a 60-foot-radius spread that affects opponents who fail their Wis save. The affected creature must make a successful Wis save (DC 15) or become frightened. While frightened by this trait, a creature must take the Dash action and move away from you by the safest available route on each of its turns, unless there is nowhere to move. If the creature ends its turn in a location where it doesn’t have line of sight to you, the creature can make a Wisdom saving throw. On a successful save, the affect ends for that creature. Success indicates that the target is immune to that wolfborn’s frightful howl for one day\n\nBreath Weapon:\nYou can use your action to exhale destructive energy in a 15 ft cone. When you use your breath weapon, each creature in the area of the exhalation must make a Dexterity saving throw. The DC for this saving throw equals 8 + your Constitution modifier + your proficiency bonus. A creature takes 2d6 damage on a failed save, and half as much damage on a successful one. The damage increases to 3d6 at 6th level, 4d6 at 11th level, and 5d6 at 16th level. After you use your breath weapon, you can’t use it again until you complete a short or long rest", "ed": "5e"}, {"n": "Yuan-Ti", "src": "mom", "sz": "—", "sp": "30 ft", "asi": "—", "traits": "Darkvision, Magic Resistance, Poison Resilience, Serpentine Spellcasting", "desc": "Darkvision:\nYou can see in dim light within 60 feet of you as if it were bright light and in darkness as if it were dim light. You discern colors in that darkness only as shades of gray\n\nMagic Resistance:\nYou have advantage on saving throws against spells\n\nPoison Resilience:\nYou have advantage on saving throws you make to avoid or end the poisoned condition on yourself. You also have resistance to poison damage\n\nSerpentine Spellcasting:\nYou know the poison spray cantrip. You can cast animal friendship an unlimited number of times with this trait, but you can target only snakes with it.\n\nIntelligence, Wisdom, or Charisma is your spellcasting ability for these spells when you cast them with this trait (choose when you select this race)", "ed": "both"}, {"n": "Yuan-Ti Pureblood", "src": "vgm", "sz": "—", "sp": "30 ft", "asi": "+2 Charisma", "traits": "Darkvision (60 ft.), Innate Spellcasting, Magic Resistance, Poison Immunity", "desc": "Darkvision (60 ft.):\nYou can see in dim light within 60 feet of you as if it were bright light, and in darkness as if it were dim light. You can't discern color in darkness, only shades of gray\n\nInnate Spellcasting:\nYou know the poison spray cantrip. You can cast animal friendship an unlimited number of times with this trait, but you can target only snakes with it. Charisma is your spellcasting ability for these spells\n\nMagic Resistance:\nYou have advantage on saving throws against spells and other magical effects\n\nPoison Immunity:\nYou are immune to poison damage and the poisoned condition", "ed": "5e"}];
let F=DATA.slice(),open=-1;
const SK=[r=>r.n,r=>r.src,r=>r.sz,r=>r.sp,r=>r.asi,r=>r.traits,r=>r.ed];

let sC=-1,sA=true;
function srt(c){
  if(sC===c)sA=!sA;else{sC=c;sA=true;}
  F.sort((a,b)=>{
    let va=SK[c](a),vb=SK[c](b);
    if(typeof va==='number'&&typeof vb==='number')return sA?(va-vb):(vb-va);
    va=String(va);vb=String(vb);
    return sA?va.localeCompare(vb,void 0,{numeric:true}):vb.localeCompare(va,void 0,{numeric:true});
  });
  document.querySelectorAll('thead th').forEach((th,i)=>th.className=i===sC?(sA?'asc':'desc'):'');
  open=-1;render();
}

function render(){
  const h=[];
  F.forEach((r,i)=>{
    h.push(`<tr onclick="tog(${i})"${open===i?' class="active"':''}>`+
      `<td>${esc(r.n)}</td><td>${esc(r.src).toUpperCase()}</td>`+
      `<td>${esc(r.sz)}</td><td>${esc(r.sp)}</td>`+
      `<td style="font-size:12px">${esc(r.asi)}</td>`+
      `<td style="font-size:12px">${esc(r.traits)}</td>`+
      `<td>${edBadge(r.ed)}</td></tr>`);
    h.push(`<tr class="desc-row" style="display:${open===i?'':'none'}"><td colspan="7">`+
      `<div class="desc-content">${esc(r.desc||r.traits)}</div></td></tr>`);
  });
  document.getElementById('tb').innerHTML=h.join('');
  document.getElementById('cnt').textContent=F.length+'/'+DATA.length;
}
function tog(i){open=open===i?-1:i;render();}
function fil(){
  const q=document.getElementById('qs').value.toLowerCase();
  const fs=document.getElementById('fsr').value;
  const fe=document.getElementById('fEd').value;
  F=DATA.filter(r=>
    (!q||(r.n+' '+r.traits+' '+r.asi).toLowerCase().includes(q))&&
    (!fs||r.src===fs)&&(!fe||r.ed===fe));
  open=-1;render();
}
render();</script></body></html>
